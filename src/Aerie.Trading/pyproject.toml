# The trading silo's whole toolchain, in one file (docs/plans/trading.md Phase 0b).
#
# This project is deliberately not part of src/Aerie.slnx, has no .csproj, and
# is not referenced by one. The plan's extraction seam is that
# src/Aerie.Trading/ plus deploy/cluster/apps/trading/ plus the SPA can leave
# for their own repository without a rewrite, and a build file that reaches
# across the line is the first thing that would make that untrue. Phase 1 adds
# a CI check that asserts it rather than trusting it.

[project]
name = "aerie-trading"
version = "0.1.0"
description = "Aerie's trading silo - a strategy laboratory that rides Aerie as a platform."
readme = "README.md"

# 3.12 is the floor rather than the target: .python-version pins what uv
# resolves and runs against, and this says what the package claims to support.
# Nothing here needs 3.13, and naming a floor the CI lane does not itself
# exercise would be a claim nothing checks.
requires-python = ">=3.12"

# Deliberately short. Every entry here is something a phase that is built
# cannot be without; the option-pricing libraries that motivated Python in the
# first place (QuantLib, py_vollib) arrive with the phase that prices an
# option, not now.
#
# Lower bounds rather than pins, with uv.lock carrying the exact versions -
# that is the split `uv sync --frozen` exists for. A pin here would be a
# second, hand-maintained lockfile that can disagree with the real one.
dependencies = [
    # The migration tool. It runs from the same image the service does, in an
    # init container (deploy/cluster/trading/app/deployment.yaml), so it is a
    # runtime dependency rather than a dev one.
    "alembic>=1.19.1",
    # The market calendar (Phase 2), and one of the three libraries this silo
    # is in Python for. A wrong market calendar does not throw - it silently
    # corrupts every backtest that crosses a holiday - and this one knows every
    # NYSE half-day forward and back.
    #
    # It is the heaviest thing here by a wide margin: it brings pandas and
    # numpy, which is 142 MB of image. Contained rather than avoided -
    # `aerie_trading/providers/calendar.py` is the only module that imports it,
    # and `providers/synthetic/__init__.py` re-exports nothing so that the
    # migration init container, which runs under a 256 Mi limit, never pays for
    # it.
    "exchange-calendars>=4.13.2",
    "fastapi>=0.141.1",
    # The /metrics endpoint. The client library, not an exporter framework -
    # kube-prometheus-stack is already deployed and does the scraping.
    "prometheus-client>=0.26.0",
    # psycopg 3, and `binary` for the wheel: the alternative builds libpq from
    # source in the image, which needs a compiler in a runtime layer that has
    # no other reason to carry one.
    "psycopg[binary]>=3.3.5",
    # Configuration as a typed model rather than os.environ.get() calls
    # scattered across modules - the same reason the .NET side binds options
    # classes instead of reading IConfiguration inline.
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    # `standard` pulls uvloop and httptools. Both are C, both are what makes
    # the "per-op speed is irrelevant because the hot paths are not Python"
    # claim in docs/plans/trading.md true of the web layer too.
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
# uv installs these by default and `uv sync --no-dev` omits them, which is what
# Phase 1's Dockerfile uses to keep the linters out of the runtime image.
dev = [
    # Starlette's TestClient is an HTTP client transport, so the test suite
    # cannot call the app without one. httpx2 rather than httpx: at the
    # Starlette version pinned in uv.lock, httpx is deprecated for this use and
    # its types resolve as Unknown, which is 40 pyright errors in the test
    # suite for a dependency choice. Dev-only - nothing in the service makes an
    # outbound HTTP call yet.
    "httpx2>=2.12.0",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A flat package rather than a src/ layout: this directory is already
# src/Aerie.Trading/, and src/Aerie.Trading/src/aerie_trading/ buys nothing for
# a second 'src' in the path. Named here because the distribution is
# 'aerie-trading' and the import name is not a mechanical translation of it.
packages = ["aerie_trading"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Beyond ruff's default (E4/E7/E9/F): imports sorted (I), bugbear (B),
# comprehensions (C4), pyupgrade (UP), and the pytest-style rules (PT). Chosen
# for the ones that catch a bug rather than the ones that catch a preference -
# formatting is `ruff format`'s job and is not argued about here.
select = ["E", "F", "I", "B", "C4", "UP", "PT", "SIM", "RUF"]

[tool.pyright]
# Strict, per the plan: the owner does not write Python, and a type checker that
# reads like C#'s compiler is the whole mitigation for that. Loosening this is a
# decision to make in the open, not a line to quietly edit.
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["aerie_trading", "tests"]
# Without this, pyright resolves imports against whatever interpreter it finds
# on PATH instead of the environment `uv sync` just built - which reads as
# hundreds of missing-import errors locally and as a green lane in CI, or the
# reverse. The path is uv's default venv location for this project.
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail the run on an unregistered mark or an unraisable warning rather than
# printing it. A test suite this small has no noise to hide a real one in yet,
# and the moment it does is the moment this stops being addable cheaply.
addopts = "-ra --strict-markers --strict-config"
