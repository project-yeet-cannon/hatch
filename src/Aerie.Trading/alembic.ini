# Alembic's configuration, kept to the two things it actually needs.
#
# No `sqlalchemy.url` here, deliberately, and its absence is load-bearing: the
# database is addressed with libpq's own environment variables (PGHOST,
# PGUSER, ...) and assembled by aerie_trading/settings.py, which is what
# ./aerie_trading/migrations/env.py reads. A URL in this file would be a second
# place a connection string comes from - and the one an operator would find
# first while the service was using the other.
#
# No logging configuration either. Alembic's template ships a `[loggers]`
# section that calls fileConfig() and replaces the process's handlers; in the
# init container this migration runs in, that would swap the JSON formatter
# (aerie_trading/logging.py) for plain text on exactly the lines an operator
# reads when a deploy stalls. env.py configures logging the same way the
# service does instead.
[alembic]
script_location = aerie_trading/migrations

# Migration filenames sort by their revision date, so `ls versions/` reads in
# the order they apply rather than by whatever hex Alembic generated.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Alembic emits a warning without this and defaults to UTC anyway; stating it
# is the same reason every timestamp column in the schema is timestamptz.
timezone = UTC
