<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/apps/dashboard/favicon.svg" />
    <!--
      user-scalable=no / maximum-scale=1 is a kiosk decision, not a general
      accessibility one: nothing can reset a pinch-zoom from JS (Gecko exposes
      no API for the visual viewport's scale), so on a wall tablet an accidental
      zoom would otherwise persist until the next reload. The idle reset in
      hooks/useKioskLifecycle.ts puts scroll and card state back; this is what
      keeps zoom from being the one thing it can't.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Aerie Dashboard</title>
    <!--
      Fires before the module script below is even fetched, so a failure to
      load/parse/execute main.tsx (bad deploy, MIME mismatch, syntax error)
      still leaves a trace in the logs instead of just a blank kiosk screen.
      Kept as plain inline JS (no build step touches this file's script tags).
    -->
    <script>
      (function () {
        try {
          window.__uiLogSessionId = crypto.randomUUID();
          var body = JSON.stringify([{
            app: 'dashboard',
            level: 'info',
            message: 'kiosk index.html parse started',
            timestamp: new Date().toISOString(),
            sessionId: window.__uiLogSessionId,
            url: location.href,
            metadata: { userAgent: navigator.userAgent },
          }]);
          fetch('/api/ui-logs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body,
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/apps/dashboard/assets/index-MkCiWW2y.js"></script>
    <link rel="stylesheet" crossorigin href="/apps/dashboard/assets/index-CrHwA-iu.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
