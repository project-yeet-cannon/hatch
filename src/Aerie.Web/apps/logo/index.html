     stylesheet it references by URL.

     for dark. The bar pins the root to light so it matches its host and
     renders no theme control - a toggle here would recolor 48px and leave the
     page behind it. See packages/ui/src/standalone/topbar.ts.

     These three lines are hand-added and are the one part of this file that is
     not Claude Design's output. A re-export overwrites index.html wholesale -
     put them back. -->

      6: [[0, 2]], 7: [[3, 2]], 8: [[2, 3]], 9: [[2, 0]], 10: [[0, 1], [2, 3]],

    for (let i = 0; i < N; i++) {
      const p0 = pts[(i - 1 + N) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N];
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += 'C' + f(c1x) + ' ' + f(c1y) + ' ' + f(c2x) + ' ' + f(c2y) + ' ' + f(p2[0]) + ' ' + f(p2[1]);
    }
    return d + 'Z';
  }

  buildBird(v) {
    const R = 34, cx = 104, cy = 116;
    const lean = -24 * Math.PI / 180;
    const ux = Math.cos(lean), uy = Math.sin(lean);
    const px0 = -uy, py0 = ux;
    const rx = R * 1.14, ry = R * 0.88 * v.plump;
    const tilt = v.tilt * Math.PI / 180;
    const hx = cx + Math.sin(tilt) * v.neck * R + ux * R * 0.22;
    const hy = cy - Math.cos(tilt) * v.neck * R + uy * R * 0.22;
    const hr = R * v.headSize;

    const bd = (v.beakAngle + v.tilt * 0.3) * Math.PI / 180;
    const bdx = Math.cos(bd), bdy = Math.sin(bd);
    const b0x = hx + bdx * hr * 0.5, b0y = hy + bdy * hr * 0.5;
    const b1x = hx + bdx * (hr + v.beakLen), b1y = hy + bdy * (hr + v.beakLen);

    const nkx = cx + ux * rx * 0.30, nky = cy + uy * rx * 0.30;
    const rmx = cx - ux * rx * 0.52, rmy = cy - uy * rx * 0.52;
    const td = (180 + v.tailLift) * Math.PI / 180;
    const t1x = rmx + Math.cos(td) * (R * 0.45 + v.tailLen);
    const t1y = rmy + Math.sin(td) * (R * 0.45 + v.tailLen);

    const k = 2 + v.blend * 16;
    const field = (qx, qy) => {
      const dx = qx - cx, dy = qy - cy;
      const lx = dx * ux + dy * uy, ly = dx * px0 + dy * py0;
      let d = (Math.hypot(lx / rx, ly / ry) - 1) * Math.min(rx, ry);
      d = this.smin(d, this.sdCone(qx, qy, nkx, nky, hx, hy, R * 0.40, hr * 0.84), k);
      d = this.smin(d, Math.hypot(qx - hx, qy - hy) - hr, k * 0.6);
      d = this.smin(d, this.sdCone(qx, qy, b0x, b0y, b1x, b1y, hr * 0.30, 0.8), k * 0.12);
      d = this.smin(d, this.sdCone(qx, qy, rmx, rmy, t1x, t1y, R * 0.34, R * 0.07), k * 0.5);
      return d;
    };
    const loop = this.contour(field, 132);
    const pts = loop.length > 8 ? this.resample(loop, 76) : [];
    if (!pts.length) return { outline: '', wing: '', perch: '', ex: cx, ey: cy, er: 0 };

    const f = (q) => this.n(q);
    let wing = '';
    if (v.wingSize > 0.06) {
      const s = v.wingSize;
      const ax = cx + ux * rx * 0.30 + px0 * ry * 0.04;
      const ay = cy + uy * rx * 0.30 + py0 * ry * 0.04;
      const bx = ax - ux * rx * 0.88 * s + px0 * ry * 0.26 * s;
      const by = ay - uy * rx * 0.88 * s + py0 * ry * 0.26 * s;
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      const wl = Math.hypot(bx - ax, by - ay);
      const wnx = -(by - ay) / wl, wny = (bx - ax) / wl;
      const w1 = R * 0.26 * s, w2 = R * 0.05 * s;
      wing = 'M' + f(ax) + ' ' + f(ay) +
        'Q' + f(mx + wnx * w1) + ' ' + f(my + wny * w1) + ' ' + f(bx) + ' ' + f(by) +
        'Q' + f(mx - wnx * w2) + ' ' + f(my - wny * w2) + ' ' + f(ax) + ' ' + f(ay);
    }

    let perch = '';
    if (v.perch) {
      const by = cy + ry * 0.86, fy2 = cy + ry + 18;
      perch = 'M' + f(cx - 6) + ' ' + f(by) + 'L' + f(cx - 6) + ' ' + f(fy2) +
        'M' + f(cx + 9) + ' ' + f(by) + 'L' + f(cx + 9) + ' ' + f(fy2) +
        'M' + f(cx - 46) + ' ' + f(fy2) + 'L' + f(cx + 46) + ' ' + f(fy2);
    }

    return {
      outline: this.loopPath(pts),
      wing: wing,
      perch: perch,
      ex: this.n(hx + Math.cos(bd - 0.5) * hr * 0.44),
      ey: this.n(hy + Math.sin(bd - 0.5) * hr * 0.44),
      er: this.n(v.eyeSize)
    };
  }

  state = { ov: {} };

  static SPEC = [
    ['Head', [
      ['headSize', 'head size', 0.38, 0.85, 0.01, 0.58, 2],
      ['neck', 'neck length', 0.9, 1.8, 0.01, 1.3, 2],
      ['tilt', 'head tilt', -15, 45, 1, 12, 0, '\u00B0'],
      ['beakLen', 'beak length', 4, 36, 1, 18, 0],
      ['beakAngle', 'beak angle', -30, 18, 1, -6, 0, '\u00B0'],
      ['eyeSize', 'eye size', 0, 6, 0.1, 3.2, 1]
    ]],
    ['Body', [
      ['plump', 'plumpness', 0.7, 1.25, 0.01, 1.0, 2],
      ['tailLen', 'tail length', 0, 60, 1, 30, 0],
      ['tailLift', 'tail lift', -10, 60, 1, 26, 0, '\u00B0'],
      ['wingSize', 'wing', 0, 1, 0.01, 0.62, 2],
      ['blend', 'blend', 0, 1, 0.01, 0.22, 2]
    ]],
    ['Weight', [
      ['stroke', 'stroke', 2, 14, 0.5, 7, 1]
    ]]
  ];

  get(key, def) {
    const o = this.state.ov;
    return key in o ? o[key] : (this.props[key] ?? def);
  }
  put(key, value) {
    this.setState((s) => ({ ov: Object.assign({}, s.ov, { [key]: value }) }));
  }

  base() {
    return {
      headSize: this.get('headSize', 0.58),
      neck: this.get('neck', 1.3),
      tilt: this.get('tilt', 12),
      beakLen: this.get('beakLen', 18),
      beakAngle: this.get('beakAngle', -6),
      tailLen: this.get('tailLen', 30),
      tailLift: this.get('tailLift', 26),
      plump: this.get('plump', 1.0),
      blend: this.get('blend', 0.22),
      wingSize: this.get('wingSize', 0.62),
      eyeSize: this.get('eyeSize', 3.2),
      perch: this.get('perch', false)
    };
  }

  controls() {
    return Component.SPEC.map(([label, rows]) => ({
      label: label,
      items: rows.map(([key, name, min, max, step, def, dp, unit]) => {
        const value = this.get(key, def);
        return {
          key: key, label: name, min: min, max: max, step: step, value: value,
          display: Number(value).toFixed(dp) + (unit || ''),
          on: (e) => this.put(key, parseFloat(e.target.value))
        };
      })
    }));
  }

  downloadSvg() {
    const b = this.base();
    const h = this.buildBird(b);
    const ink = this.get('ink', '#1B1A16');
    const sw = this.get('stroke', 7);
    const parts = [
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">',
      '<path d="' + h.outline + '" fill="none" stroke="' + ink + '" stroke-width="' + sw + '" stroke-linejoin="round" stroke-linecap="round"/>'
    ];
    if (h.wing) parts.push('<path d="' + h.wing + '" fill="none" stroke="' + ink + '" stroke-width="' + (sw * 0.85) + '" stroke-linejoin="round" stroke-linecap="round"/>');
    if (h.perch) parts.push('<path d="' + h.perch + '" fill="none" stroke="' + ink + '" stroke-width="' + (sw * 0.85) + '" stroke-linejoin="round" stroke-linecap="round"/>');
    if (h.er > 0) parts.push('<circle cx="' + h.ex + '" cy="' + h.ey + '" r="' + h.er + '" fill="' + ink + '"/>');
    parts.push('</svg>');
    const blob = new Blob([parts.join('')], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (this.get('wordmark', 'Wren') || 'mark').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-mark.svg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  renderVals() {
    const b = this.base();
    const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
    const mix = (d) => {
      const o = Object.assign({}, b);
      for (const key in d) o[key] = o[key] + d[key];
      o.headSize = clamp(o.headSize, 0.38, 0.85);
      o.neck = clamp(o.neck, 0.9, 1.8);
      o.plump = clamp(o.plump, 0.7, 1.25);
      o.blend = clamp(o.blend, 0, 1);
      o.wingSize = clamp(o.wingSize, 0, 1);
      o.tailLen = clamp(o.tailLen, 0, 60);
      o.tailLift = clamp(o.tailLift, -10, 60);
      o.beakLen = clamp(o.beakLen, 4, 36);
      o.tilt = clamp(o.tilt, -15, 45);
      return o;
    };
    const defs = [
      ['Wren', { headSize: 0.06, beakLen: -5, tailLen: -12, plump: 0.1 }],
      ['Heron', { neck: 0.4, headSize: -0.12, beakLen: 10, tilt: 8, tailLen: -10 }],
      ['Finch', { headSize: 0.03, tailLift: 22, beakLen: -4 }],
      ['Swift', { plump: -0.2, neck: -0.12, tailLen: 18, tailLift: -24, tilt: 14 }],
      ['Owlet', { headSize: 0.2, neck: -0.3, tilt: -14, beakLen: -8, tailLen: -18 }],
      ['Magpie', { tailLen: 26, tailLift: -6, plump: -0.08, beakLen: 3 }]
    ];
    const variants = defs.map(([label, d]) => {
      const bird = this.buildBird(mix(d));
      bird.label = label;
      return bird;
    });
    const spec = 'head ' + b.headSize.toFixed(2) + '  neck ' + b.neck.toFixed(2) + '  tilt ' + Math.round(b.tilt) + '\u00B0\n' +
      'beak ' + Math.round(b.beakLen) + '  tail ' + Math.round(b.tailLen) + '/' + Math.round(b.tailLift) + '\u00B0  plump ' + b.plump.toFixed(2);
    const ink = this.get('ink', '#1B1A16');
    const stroke = this.get('stroke', 7);
    const inks = ['#1B1A16', '#1D3A5F', '#7A2E1E', '#2F5B3A'].map((c) => ({
      value: c,
      border: c === ink ? '2px solid #1B1A16' : '1px solid rgba(27,26,22,0.18)',
      on: () => this.put('ink', c)
    }));
    const toggles = [
      { key: 'perch', label: 'perch', value: !!this.get('perch', false) },
      { key: 'showVariations', label: 'show family', value: !!this.get('showVariations', true) }
    ].map((t) => Object.assign(t, { on: (e) => this.put(t.key, e.target.checked) }));
    return {
      hero: this.buildBird(b),
      variants: variants,
      spec: spec,
      ink: ink,
      sw: stroke,
      swi: stroke * 0.85,
      wordmark: this.get('wordmark', 'Wren'),
      showVariations: !!this.get('showVariations', true),
      groups: this.controls(),
      inks: inks,
      toggles: toggles,
      setWordmark: (e) => this.put('wordmark', e.target.value),
      reset: () => this.setState({ ov: {} }),
      download: () => this.downloadSvg()
    };
  }
}
</script>
</body>
</html>
