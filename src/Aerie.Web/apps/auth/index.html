<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Sign in to Aerie</title>
    <!--
      Fires before the module script below is even fetched, so a failure to
      load/parse/execute main.tsx (bad deploy, MIME mismatch, syntax error)
      still leaves a trace in the logs instead of just a blank screen. That
      matters more here than in the other shells: this is the page a person
      lands on when they cannot get in, so "it was blank" is the whole of the
      report we would otherwise get.
      Kept as plain inline JS (no build step touches this file's script tags).

      The URL is redacted before it is logged. A scanned QR resolves to
      /apps/auth/r/<invite code>, and shipping that to the log pipeline would
      write a live credential into OpenSearch - see src/lib/redactUrl.ts, which
      is this same rule for the bundle.
    -->
    <script>
      (function () {
        try {
          var redact = function (value) {
            return String(value || '').replace(/(\/apps\/auth\/r\/)[^/?#]+/, '$1<redacted>');
          };
          window.__uiLogSessionId = crypto.randomUUID();
          var body = JSON.stringify([{
            app: 'auth',
            level: 'info',
            message: 'auth index.html parse started',
            timestamp: new Date().toISOString(),
            sessionId: window.__uiLogSessionId,
            url: redact(location.href),
            metadata: { userAgent: navigator.userAgent },
          }]);
          fetch('/api/ui-logs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body,
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
