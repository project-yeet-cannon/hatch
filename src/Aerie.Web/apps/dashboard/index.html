<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      user-scalable=no / maximum-scale=1 is a kiosk decision, not a general
      accessibility one: nothing can reset a pinch-zoom from JS (Gecko exposes
      no API for the visual viewport's scale), so on a wall tablet an accidental
      zoom would otherwise persist until the next reload. The idle reset in
      hooks/useKioskLifecycle.ts puts scroll and card state back; this is what
      keeps zoom from being the one thing it can't.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aerie Dashboard</title>
    <!--
      The fallback screen's styling, inline and self-contained. It has to render
      with zero stylesheets loaded and zero modules evaluated, because the case
      it exists for is "none of that arrived" - so no tokens, no custom
      properties, no theme.css. The colors are a hand-picked stand-in for the
      deep-night palette rather than the palette itself: circadianTheme.ts is in
      the bundle that, by hypothesis, is not running.

      It fades in after 600ms. A healthy load mounts well inside that, so the
      normal path never shows this at all and the wall does not gain a dark
      flash on every boot - the fade is what makes a fallback affordable on the
      happy path.
    -->
    <style>
      #aerie-fallback {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        background: #121620;
        color: #d5d8e0;
        font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        opacity: 0;
        animation: aerie-fallback-in 0.4s ease 0.6s forwards;
      }
      @keyframes aerie-fallback-in {
        to { opacity: 1; }
      }
      #aerie-fallback-clock {
        font-size: 76px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      #aerie-fallback-ampm {
        font-size: 26px;
        font-weight: 700;
        margin-left: 6px;
      }
      #aerie-fallback-date {
        font-size: 22px;
        font-weight: 600;
        color: #8b90a0;
      }
      #aerie-fallback-message {
        margin-top: 22px;
        max-width: 22em;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.4;
        color: #8b90a0;
      }
      #aerie-fallback-reload {
        margin-top: 20px;
        padding: 14px 30px;
        border: 1px solid #333a4a;
        border-radius: 26px;
        background: #1b1f2b;
        color: #d5d8e0;
        font: inherit;
        font-size: 17px;
        font-weight: 600;
      }
      #aerie-fallback-version {
        position: fixed;
        bottom: 14px;
        font-size: 11px;
        font-weight: 500;
        color: #4d5464;
      }
    </style>
  </head>
  <body>
    <!--
      #root is not empty, deliberately. Eight sessions over nine days logged
      `kiosk index.html parse started` and were never heard from again (Phase 0
      of docs/plans/kiosk-graceful-deg.md): the document arrived, the bundle did
      not run, and an empty #root is a white rectangle on a wall with nobody
      standing at it. The ErrorBoundary cannot help - it only catches throws
      from a tree that mounted.

      So the document ships a screen of its own. It needs no stylesheet, no
      module and no network, which is the entire point: the time of day is the
      one thing the wall can always be right about, and a clock with a sentence
      under it is a tablet still doing part of its job.

      main.tsx dismisses this the moment React mounts.
    -->
    <div id="root">
      <div id="aerie-fallback" role="status">
        <div>
          <span id="aerie-fallback-clock">--:--</span><span id="aerie-fallback-ampm"></span>
        </div>
        <div id="aerie-fallback-date"></div>
        <div id="aerie-fallback-message">Loading the dashboard&hellip;</div>
        <button id="aerie-fallback-reload" type="button">Reload</button>
        <div id="aerie-fallback-version"></div>
      </div>
    </div>
    <!--
      Everything below runs before the module script is even fetched, so a
      failure to load/parse/execute main.tsx (bad deploy, MIME mismatch, syntax
      error) still leaves a trace in the logs and a clock on the wall instead of
      a blank kiosk screen. Kept as plain inline JS - no build step touches this
      file's script tags, which is also why it is written without any syntax the
      tablets' Gecko might not have.
    -->
    <script>
      (function () {
        var MOUNT_WATCHDOG_MS = 10000;

        function post(level, message, metadata) {
          try {
            fetch('/api/ui-logs', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify([{
                app: 'dashboard',
                level: level,
                message: message,
                timestamp: new Date().toISOString(),
                sessionId: window.__uiLogSessionId,
                url: location.href,
                metadata: metadata || {},
              }]),
              keepalive: true,
            }).catch(function () {});
          } catch (e) {}
        }

        try {
          window.__uiLogSessionId = crypto.randomUUID();
        } catch (e) {}

        // The device's own zone, because that is the only source that survives
        // every failure this screen exists for - the site timezone lives in a
        // snapshot that by hypothesis never arrived. Eastern to match
        // config.ts's DEFAULT_TIME_ZONE when the device won't say.
        var timeZone;
        try {
          timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        } catch (e) {}
        if (!timeZone) timeZone = 'America/New_York';

        var clockEl = document.getElementById('aerie-fallback-clock');
        var ampmEl = document.getElementById('aerie-fallback-ampm');
        var dateEl = document.getElementById('aerie-fallback-date');
        var messageEl = document.getElementById('aerie-fallback-message');
        var reloadEl = document.getElementById('aerie-fallback-reload');
        var versionEl = document.getElementById('aerie-fallback-version');
        var tick = null;
        var watchdog = null;

        function paintClock() {
          try {
            var now = new Date();
            var parts = new Intl.DateTimeFormat('en-US', {
              timeZone: timeZone, hour: 'numeric', minute: '2-digit', hour12: true,
            }).formatToParts(now);
            var time = '';
            var period = '';
            for (var i = 0; i < parts.length; i++) {
              if (parts[i].type === 'dayPeriod') period = parts[i].value;
              else time += parts[i].value;
            }
            clockEl.textContent = time.trim();
            ampmEl.textContent = period;
            dateEl.textContent = new Intl.DateTimeFormat('en-US', {
              timeZone: timeZone, weekday: 'long', month: 'long', day: 'numeric',
            }).format(now);
          } catch (e) {
            // Intl is the one thing here that could throw on an odd runtime.
            // A dead clock is still better than an empty screen.
          }
        }

        // 15s rather than 1s: this shows hours and minutes, and a wall tablet
        // should not wake its CPU every second to repaint a minute that has not
        // changed. Matches the App's own clock interval.
        paintClock();
        tick = setInterval(paintClock, 15000);

        reloadEl.addEventListener('click', function () {
          // Preserve ?source= - a mock/test session that hits this screen should
          // reload into the same source, not silently onto the live API. The `r`
          // param is a cache-buster: index.html is served no-cache so a reload
          // revalidates anyway, but this screen exists precisely for the case
          // where something upstream is not behaving as documented.
          try {
            var params = new URLSearchParams(location.search);
            params.set('r', String(Date.now()));
            location.replace(location.pathname + '?' + params.toString());
          } catch (e) {
            location.reload();
          }
        });

        // The durable version of "the bundle never ran". main.tsx sets the flag
        // as its first statement; if it is still unset here, the document
        // arrived and the module did not, and this log line is the only witness.
        watchdog = setTimeout(function () {
          if (window.__aerieMounted) return;
          messageEl.textContent = 'The dashboard didn’t finish loading. It will keep trying on its own.';
          versionEl.textContent = 'aerie · mount timed out after ' + (MOUNT_WATCHDOG_MS / 1000) + 's';
          post('error', 'kiosk mount watchdog fired', {
            waitedMs: MOUNT_WATCHDOG_MS,
            userAgent: navigator.userAgent,
            timeZone: timeZone,
          });
        }, MOUNT_WATCHDOG_MS);

        // main.tsx calls this rather than letting createRoot() clear the
        // container implicitly: the interval and the watchdog have to be torn
        // down too, and a timer still firing behind a mounted app is exactly the
        // kind of thing that survives for months without anyone noticing.
        window.__aerieDismissFallback = function () {
          window.__aerieMounted = true;
          if (tick !== null) clearInterval(tick);
          if (watchdog !== null) clearTimeout(watchdog);
          var el = document.getElementById('aerie-fallback');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        };

        post('info', 'kiosk index.html parse started', { userAgent: navigator.userAgent });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
