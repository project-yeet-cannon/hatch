<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Three swatches from the categorical ramp, overlapping: the gallery is
       where the palette is looked at. Colors are literal because a favicon is
       fetched by the browser outside any document, so no custom property is in
       scope - they are --series-1/-5/-4's light values, kept in step by hand. -->
  <rect x="2" y="9" width="15" height="15" rx="3" fill="#2a78d6"/>
  <rect x="9" y="4" width="15" height="15" rx="3" fill="#1baf7a" fill-opacity="0.9"/>
  <rect x="15" y="12" width="15" height="15" rx="3" fill="#eda100" fill-opacity="0.9"/>
</svg>
