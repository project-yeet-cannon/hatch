# Runs alongside compose.prod.yml / compose.observability.yml / compose.metrics.yml
# (all four combined via -f in cd.yml) so this container can reach every
# service it backs up by name on their existing networks.
x-logging: &container-log-tag
  options:
    labels: "com.docker.compose.service"

services:
  backup:
    image: ghcr.io/eouw0o83hf/aerie-backup:latest
    restart: always
    networks:
      - local
      - observability
      - metrics
    volumes:
      # Local restic repo, on E: — a physically separate disk from pgdata.
      - E:/restic-repo:/mnt/restic-local
      # Read-only sqlite sources — .backup takes its own consistent snapshot,
      # so a live, read-only mount of the source file is safe.
      - grafana_data:/mnt/grafana:ro
      - uptime_kuma_data:/mnt/kuma:ro
      # OpenSearch's snapshot API writes here (see compose.observability.yml's
      # path.repo); read-write so backup.sh can clear it after restic has the
      # data durably, since OpenSearch never prunes its own snapshots.
      - opensearch_snapshots:/mnt/opensearch-snapshots
      # Prometheus's admin API writes TSDB snapshots inside its own data dir;
      # read-write for the same staging-cleanup reason as opensearch above.
      - prometheus_data:/mnt/prometheus
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - RESTIC_REPOSITORY_LOCAL=/mnt/restic-local
      - RESTIC_REPOSITORY_S3=${RESTIC_S3_REPOSITORY}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - AWS_ACCESS_KEY_ID=${RESTIC_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${RESTIC_AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${RESTIC_AWS_REGION}
      - TZ=${TZ}
    logging: *container-log-tag

networks:
  local:
    driver: bridge
  observability:
    driver: bridge
  metrics:
    driver: bridge

volumes:
  grafana_data:
  uptime_kuma_data:
  opensearch_snapshots:
  prometheus_data:
