# Runs alongside compose.prod.yml (and, incidentally, compose.observability.yml
# / compose.metrics.yml / compose.share.yml, since cd.yml always combines all
# of them via -f) so this container can reach db by name on its network.
# OpenSearch and Prometheus are intentionally not backed up here — both
# rebootstrap cleanly from their own config, so there's nothing in them worth
# restic's storage/complexity budget.
x-logging: &container-log-tag
  options:
    labels: "com.docker.compose.service"

services:
  backup:
    image: ghcr.io/eouw0o83hf/aerie-backup:latest
    restart: always
    networks:
      - local
    volumes:
      # Local restic repo, on E: — a physically separate disk from pgdata.
      - E:/restic-repo:/mnt/restic-local
      # Read-only sqlite source — .backup takes its own consistent snapshot,
      # so a live, read-only mount of the source file is safe. Grafana isn't
      # backed up: nothing there is customized, and it's expected to be
      # rebootstrapped by automation rather than restored.
      - uptime_kuma_data:/mnt/kuma:ro
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - RESTIC_REPOSITORY_LOCAL=/mnt/restic-local
      - RESTIC_REPOSITORY_S3=${RESTIC_S3_REPOSITORY}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - AWS_ACCESS_KEY_ID=${RESTIC_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${RESTIC_AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${RESTIC_AWS_REGION}
      - TZ=${TZ}
    logging: *container-log-tag

networks:
  local:
    driver: bridge

volumes:
  uptime_kuma_data:
