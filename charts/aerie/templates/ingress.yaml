# The cluster plan Phase 5b.9 - the four public hostnames, replacing Caddy's
# reverse-proxy blocks. ingressClassName: traefik is k3s's own bundled
# IngressClass (3b.9's HelmChartConfig only patches the Traefik it installs,
# it doesn't add a competing one), and every host below carries no `tls:`
# block on purpose: TLS is terminated at the entrypoint
# (traefik-helmchartconfig.yaml's ports.websecure.http.tls.enabled), and the
# certificate served to any router naming no Secret of its own is 3b.10d's
# wildcard TLSStore default - that default is the entire argument for having
# bought a wildcard cert in the first place.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: home
  {{- if eq .Values.auth.mode "full" }}
  annotations:
    # The wall in front of the house (docs/auth-architecture.md). This host
    # is every app the family uses, so the annotation goes on / rather than on any
    # prefix - what stays reachable through it is AuthGate's allow-list, in one
    # place, shared with the in-process middleware, rather than a second list
    # of unannotated paths here that could disagree with it.
    #
    # The <namespace>-<name>@kubernetescrd form is required and unforgiving,
    # same as the `kiosk` annotation below warns: a bare name is silently not
    # found and the route serves unauthenticated, which looks exactly like
    # success from outside. Only a 302 from an un-enrolled client proves this.
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-aerie-auth@kubernetescrd"
  {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: "home.{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kiosk
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: kiosk
  annotations:
    # <namespace>-<name>@kubernetescrd is required and unforgiving - a bare
    # name is silently not found and the route serves unrewritten, which
    # presents as the kiosk showing the API landing page rather than an
    # error anywhere. .Release.Namespace rather than a hardcoded "aerie" for
    # the same reason share-volumes.yaml's nodeStageSecretRef does it that
    # way - this is the one place the middleware's own namespace matters.
    #
    # At auth.mode full the wall joins this route (docs/auth-architecture.md).
    # Traefik takes a comma-separated list and applies it in order, so auth is
    # named first: the rewrite is what turns / into the dashboard bundle, and
    # rewriting a request that is about to be refused wastes the work and puts
    # the rewritten path, not the one the tablet asked for, into the return-to
    # the sign-in shell sends it back to.
    #
    # Composed as one line rather than an if/else pair of whole annotations so
    # the rewrite - which every mode needs - is written exactly once and cannot
    # drift between the two branches.
    traefik.ingress.kubernetes.io/router.middlewares: "{{ if eq .Values.auth.mode "full" }}{{ .Release.Namespace }}-aerie-auth@kubernetescrd,{{ end }}{{ .Release.Namespace }}-kiosk-root-rewrite@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: "kiosk.{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hatch
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: hatch
  annotations:
    # Composed exactly like the kiosk annotation above, and every word of that
    # warning applies here: the <namespace>-<name>@kubernetescrd form is
    # required and unforgiving, a bare name is silently not found, and a route
    # that lost its auth middleware serves unauthenticated while looking
    # perfectly healthy from outside. `prune` is live, so a missing annotation
    # is not a diff anyone sees - a 302 from an un-enrolled browser is the only
    # proof this is attached.
    #
    # Auth first, rewrite second: rewriting a request that is about to be
    # refused wastes the work and puts the rewritten path into the return-to
    # the sign-in shell sends the browser back with.
    #
    # The wall is only half of Hatch's gate. Behind it, AdminAppMiddleware
    # 404s the bundle for anyone who is not an administrator and every endpoint
    # carries [RequireAdmin] - so an enrolled family member reaching this host
    # gets a page that does not exist rather than the operator's board.
    traefik.ingress.kubernetes.io/router.middlewares: "{{ if eq .Values.auth.mode "full" }}{{ .Release.Namespace }}-aerie-auth@kubernetescrd,{{ end }}{{ .Release.Namespace }}-hatch-root-rewrite@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: "hatch.{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: files
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: files
spec:
  ingressClassName: traefik
  rules:
    - host: "files.{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: files
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: share
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: share
spec:
  ingressClassName: traefik
  rules:
    - host: "share.{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: share
                port:
                  # dufs's default listen port, matching share-service.yaml.
                  number: 5000
{{- if eq .Values.auth.mode "canary" }}
---
# The canary (docs/auth-architecture.md) - the wall in front of one app whose
# failure costs nothing, which is how it first went up in front of the house
# and how the next change to the gate should be rehearsed. Same host and
# same backend as `home` above; the only difference is the annotation, and the
# only reason it is a separate Ingress is that an annotation applies to every
# path an Ingress carries.
#
# Two things decide whether this works at all, and neither is visible in a
# `helm diff`:
#
#   Router priority. `home` already claims / on this host. Traefik ranks
#   routers by rule length, so PathPrefix(`/apps/docs`) outranks
#   PathPrefix(`/`) and the annotated route wins. If that ever goes the other
#   way the request is served *unauthenticated* - a failure that looks exactly
#   like success. Only an actual 302 from an un-enrolled client proves it.
#
#   The <namespace>-<name>@kubernetescrd naming rule, same as the `kiosk`
#   annotation above warns: a bare name is silently not found and, again, the
#   route serves unauthenticated.
#
# Both prefixes are self-contained. apps/docs sets base: '/apps/docs/' in its
# vite.config.ts, so every asset the bundle requests is under the gated prefix
# and none of it leaks out to the ungated / route; /api/docs is the only API
# the app calls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs-canary
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: docs-canary
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-aerie-auth@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: "home.{{ .Values.domain }}"
      http:
        paths:
          - path: /apps/docs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /api/docs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
{{- end }}
