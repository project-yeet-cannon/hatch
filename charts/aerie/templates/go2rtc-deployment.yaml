# docs/camera-devices-architecture.md - go2rtc, the one thing in this system that
# speaks to a camera. It pulls each camera's RTSP sub-stream and re-serves it as
# fragmented MP4 over a WebSocket, which is what a browser <video> can actually
# play; Aerie.Api's CameraController relays that socket so the kiosk holds one
# connection to one origin and never learns a camera's address or password.
#
# Everything asserted below about how this image behaves was verified by running
# alexxit/go2rtc:1.9.14 under Docker - the transport on 2026-08-23, the runtime
# stream API and the config-write behaviour on 2026-08-24 - not inferred from
# its docs. The one link that needs a camera on the LAN is whether pod-network
# egress reaches its RTSP port at all; scripts/k3s/Test-Cameras.ps1 is what asks
# that.
#
# This pod holds no camera configuration at rest. Aerie registers each stream
# over go2rtc's API just before someone watches it, which is what made the
# earlier `go2rtc-streams` Secret - and the GitHub secret behind it - go away.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go2rtc
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: go2rtc
spec:
  # One replica, and Recreate rather than the default rolling update. Both come
  # from the same fact: a go2rtc process is an RTSP *client*, so every replica
  # opens its own connection to every camera it serves. Reolink cameras cap
  # concurrent sub-stream clients in the single digits, and a rolling update
  # would briefly run two full sets of connections at once - the failure mode
  # being a camera refusing the new pod's connections until the old one exits,
  # which reads as a broken deploy rather than as a connection limit.
  #
  # There is no state to lose in exchange: go2rtc holds nothing across a
  # restart, and a kiosk's CameraController socket ends when the pod does, which
  # the dashboard's reconnect already handles.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aerie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: go2rtc
  template:
    metadata:
      labels:
        {{- include "aerie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: go2rtc
      annotations:
        # go2rtc reads its config once at startup and never watches the files.
        # Without this, editing the ConfigMap would leave the running pod on the
        # old config with every object reporting Ready - the same class of
        # silent no-op that helmrelease.yaml's reconcileStrategy: Revision
        # exists to prevent. Nothing else needs covering here: the only other
        # thing go2rtc holds is the stream table Aerie writes over the API,
        # which is rebuilt on demand and has no manifest to drift from.
        checksum/config: {{ include (print $.Template.BasePath "/go2rtc-configmap.yaml") . | sha256sum }}
    spec:
      # No imagePullSecrets: this is a public Docker Hub image, and the chart's
      # pullSecret is a ghcr.io credential that would not apply to it. Docker
      # Hub's anonymous pull limit is per source IP and is measured in hundreds
      # per six hours - far above what one pinned tag on one replica costs.
      securityContext:
        # 65532 (nonroot) rather than the image's default of root. Verified: the
        # process needs nothing it owns on disk, so it starts and serves
        # normally as an arbitrary uid.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: go2rtc
          image: "{{ .Values.go2rtc.image.repository }}:{{ .Values.go2rtc.image.tag }}"
          # args only, with command left alone on purpose: the image's
          # entrypoint is `/sbin/tini --`, and tini is what reaps the ffmpeg
          # children a transcoding stream spawns. Overriding command would drop
          # it and leave zombies behind every restarted stream.
          #
          # The ORDER of these two -config paths is load-bearing, and it is
          # the opposite of what reads naturally
          # (docs/camera-devices-architecture.md).
          # go2rtc persists a runtime `PUT /api/streams` back to its *first*
          # -config path, and answers 400 when that path is read-only - while
          # still registering the stream, so the call looks failed and worked.
          # Aerie registers every camera's stream that way, so the first path
          # has to be the writable emptyDir and the ConfigMap has to come
          # second. Verified against 1.9.14: in this order PUT answers 200, the
          # ConfigMap's api/rtsp/webrtc blocks still apply, and the streams land
          # in the emptyDir.
          #
          # That the emptyDir dies with the pod is the intended lifetime, not a
          # limitation. Aerie is the source of truth for which cameras exist,
          # and it re-registers a stream immediately before anyone watches it -
          # so a restarted go2rtc that has forgotten everything is correct
          # rather than broken, and there is no stale copy of a camera password
          # to invalidate when one changes.
          args:
            - go2rtc
            - -config
            - /runtime/go2rtc.yaml
            - -config
            - /config/go2rtc.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 1984
          resources:
            {{- toYaml .Values.go2rtc.resources | nindent 12 }}
          readinessProbe:
            # /api/streams answers 200 with `{}` when no streams are configured,
            # so this is a liveness signal about go2rtc rather than an assertion
            # that any camera is reachable - which is what we want, since a
            # camera being down must not take the endpoint down with it.
            httpGet:
              path: /api/streams
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            # Writable, and the only writable mount here: this is where
            # go2rtc persists what Aerie has registered. See the args above for
            # why it is first rather than second.
            - name: runtime
              mountPath: /runtime
            # ffmpeg (the transcode path) writes scratch files here, and
            # readOnlyRootFilesystem makes the image's own /tmp unwritable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: go2rtc-config
        - name: runtime
          # An emptyDir rather than a Secret, and rather than anything durable.
          # A camera's address and credential live in Aerie's database now, set
          # from the devices admin UI; what is here is go2rtc's working copy of
          # them, rebuilt on demand. Nothing is lost when the pod moves, and a
          # node holding a stale camera password is not a state this can reach.
          emptyDir: {}
        - name: tmp
          emptyDir: {}
