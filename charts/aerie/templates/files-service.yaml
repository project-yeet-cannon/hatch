# The cluster plan Phase 5b.8. Named "files" rather than a chart-derived
# name, for the same reason api-service.yaml is named "api" - 5b.9's Ingress
# backend keys off this literally, and it's the other half of the coincidence
# 5b.2 turned into a convention: Program.cs's KioskFiles:BaseAddress default
# (http://files/) resolves because this Service, in the pod's own namespace,
# is also named files.
apiVersion: v1
kind: Service
metadata:
  name: files
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: files
spec:
  type: ClusterIP
  selector:
    {{- include "aerie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: files
  ports:
    - name: http
      port: 80
      targetPort: http
