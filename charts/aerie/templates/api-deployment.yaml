# The cluster plan Phase 5b.5 - the api Deployment, replacing compose.prod.yml
# and compose.share.yml's `api` service. Run a second way by the migrate hook
# Job (5b.6, migrate-job.yaml), which shares ./_helpers.tpl's postgresEnv
# rather than duplicating it. resources is 5b.11's, sized from a real reading
# (5a.6); topologySpreadConstraints (below) is also 5b.11's.
#
# aerie-share-ro (5b.8) is mounted unconditionally, not gated behind
# mediaLibrarySubpath the way the MediaLibrary__RootPath env var already is
# (5b.5's own env block, above): SHARE_HOST/SHARE_NAME are `required: true`
# in cluster-config.json (5b.4), so the share itself is not optional the way
# compose.share.yml's whole layer was - only which subdirectory of it gets
# served is. An unmounted-but-configured RootPath would be a worse failure
# mode (ENOENT on every request) than a mounted-but-unused volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aerie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "aerie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # 5b.1's dockerconfigjson Secret - without this every pod here is
      # ImagePullBackOff, since ghcr.io/eouw0o83hf/aerie-api is private.
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      # ScheduleAnyway, not DoNotSchedule: 3 replicas over the two-node build
      # window cannot satisfy an even 1-1-1 spread, and DoNotSchedule would
      # leave the third pod Pending forever. Revisit at Phase 7, when a third
      # node makes DoNotSchedule free.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "aerie.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/aerie-api:{{ .Values.image.api.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: DOTNET_ENVIRONMENT
              value: Docker
            # ASP.NET Core defaults to Server GC, one heap per visible core -
            # four on these nodes, and nothing above sets a CPU limit to
            # narrow that. 5a.6 measured this workload at 0.20% of one core:
            # throughput was never the constraint, memory is, so workstation
            # GC is what actually uses the requests/limits above instead of
            # growing four server heaps toward the limit before collecting.
            - name: DOTNET_gcServer
              value: "0"
            {{- include "aerie.postgresEnv" . | nindent 12 }}
            - name: DOMAIN
              value: {{ .Values.domain | quote }}
            # What the family shell prints into a QR label (AppsOptions) -
            # has to be the canonical host, not the origin a request arrived
            # on, because the label outlives the browser tab that printed it.
            - name: Apps__PublicBaseUrl
              value: "https://home.{{ .Values.domain }}"
            - name: TZ
              value: {{ .Values.tz | quote }}
            # Gates VmConsoleLogsController - see
            # scripts/hyperv/lib/Send-VmConsoleLog.ps1. Phase 3 synced this
            # Secret as proof the store worked; this is it finally consumed.
            - name: VM_LOG_SHIPPER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vm-log-shipper
                  key: token
            # Home Assistant long-lived access token, same Phase 3 proof.
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: home-assistant
                  key: token
            # HA_HOST/HA_PORT: optional, read only by the one-time
            # SiteSettings import on a fresh install (see Program.cs and
            # Common/Secrets.cs) - after a restore the values are already in
            # the database. Rendered only when set, so an unset value is
            # genuinely absent from the environment rather than an empty
            # string a fresh install would try to import.
            {{- if .Values.haHost }}
            - name: HA_HOST
              value: {{ .Values.haHost | quote }}
            {{- end }}
            {{- if .Values.haPort }}
            - name: HA_PORT
              value: {{ .Values.haPort | quote }}
            {{- end }}
            # MediaLibrary__RootPath: same "rendered only when non-empty"
            # rule, for the same reason - compose.share.yml's own note, that
            # an unset subpath must leave RootPath empty rather than collapse
            # to the share root, since the path is served unauthenticated.
            # /share-ro is 5b.8's mount; this env var is inert until then and
            # Program.cs's own guard just logs a warning and serves nothing
            # in the meantime.
            {{- if .Values.mediaLibrarySubpath }}
            - name: MediaLibrary__RootPath
              value: "/share-ro/{{ .Values.mediaLibrarySubpath }}"
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: share-ro
              mountPath: /share-ro
              readOnly: true
          # readinessProbe on /health/ready (DbContext included) is also the
          # startup probe: a slow first boot - EF taking the migration lock
          # behind a hook Job that's still finishing - is then a startup
          # probe still trying, not a crash loop. livenessProbe on
          # /health/live never checks the database, so a database blip fails
          # readiness (pod leaves the Service) without restarting every
          # replica at once.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
      volumes:
        # readOnlyRootFilesystem above leaves nowhere for .NET's own
        # Path.GetTempPath() writes to land; an emptyDir is cheap enough that
        # this doesn't need to wait on someone hitting the one write that
        # needs it to find out.
        - name: tmp
          emptyDir: {}
        # aerie-share-ro, 5b.7's read-only PVC - see the top-of-file note on
        # why this is mounted unconditionally rather than gated behind
        # mediaLibrarySubpath.
        - name: share-ro
          persistentVolumeClaim:
            claimName: aerie-share-ro
