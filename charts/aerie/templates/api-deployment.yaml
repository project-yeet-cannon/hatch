# The cluster plan Phase 5b.5 - the api Deployment, replacing compose.prod.yml
# and compose.share.yml's `api` service. Run a second way by the migrate hook
# Job (5b.6, migrate-job.yaml), which shares ./_helpers.tpl's postgresEnv
# rather than duplicating it. No resources block yet - 5b.11 sizes it from a
# real reading (5a.6) rather than this step guessing; no volumeMount for the
# SMB share either - that arrives with 5b.8's files/share workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aerie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "aerie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # 5b.1's dockerconfigjson Secret - without this every pod here is
      # ImagePullBackOff, since ghcr.io/eouw0o83hf/aerie-api is private.
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/aerie-api:{{ .Values.image.api.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOTNET_ENVIRONMENT
              value: Docker
            {{- include "aerie.postgresEnv" . | nindent 12 }}
            - name: DOMAIN
              value: {{ .Values.domain | quote }}
            # What the family shell prints into a QR label (AppsOptions) -
            # has to be the canonical host, not the origin a request arrived
            # on, because the label outlives the browser tab that printed it.
            - name: Apps__PublicBaseUrl
              value: "https://home.{{ .Values.domain }}"
            - name: TZ
              value: {{ .Values.tz | quote }}
            # Gates VmConsoleLogsController - see
            # scripts/hyperv/lib/Send-VmConsoleLog.ps1. Phase 3 synced this
            # Secret as proof the store worked; this is it finally consumed.
            - name: VM_LOG_SHIPPER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vm-log-shipper
                  key: token
            # Home Assistant long-lived access token, same Phase 3 proof.
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: home-assistant
                  key: token
            # HA_HOST/HA_PORT: optional, read only by the one-time
            # SiteSettings import on a fresh install (see Program.cs and
            # Common/Secrets.cs) - after a restore the values are already in
            # the database. Rendered only when set, so an unset value is
            # genuinely absent from the environment rather than an empty
            # string a fresh install would try to import.
            {{- if .Values.haHost }}
            - name: HA_HOST
              value: {{ .Values.haHost | quote }}
            {{- end }}
            {{- if .Values.haPort }}
            - name: HA_PORT
              value: {{ .Values.haPort | quote }}
            {{- end }}
            # MediaLibrary__RootPath: same "rendered only when non-empty"
            # rule, for the same reason - compose.share.yml's own note, that
            # an unset subpath must leave RootPath empty rather than collapse
            # to the share root, since the path is served unauthenticated.
            # /share-ro is 5b.8's mount; this env var is inert until then and
            # Program.cs's own guard just logs a warning and serves nothing
            # in the meantime.
            {{- if .Values.mediaLibrarySubpath }}
            - name: MediaLibrary__RootPath
              value: "/share-ro/{{ .Values.mediaLibrarySubpath }}"
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # readinessProbe on /health/ready (DbContext included) is also the
          # startup probe: a slow first boot - EF taking the migration lock
          # behind a hook Job that's still finishing - is then a startup
          # probe still trying, not a crash loop. livenessProbe on
          # /health/live never checks the database, so a database blip fails
          # readiness (pod leaves the Service) without restarting every
          # replica at once.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
      volumes:
        # readOnlyRootFilesystem above leaves nowhere for .NET's own
        # Path.GetTempPath() writes to land; an emptyDir is cheap enough that
        # this doesn't need to wait on someone hitting the one write that
        # needs it to find out.
        - name: tmp
          emptyDir: {}
