# The cluster plan Phase 5b.6 - the migration hook Job. Finding 1's actual
# answer: the migration runs the same image, in AERIE_MIGRATE=1 mode
# (5b.2's Program.cs), against the same connection strings
# (./_helpers.tpl's aerie.postgresEnv, shared verbatim with
# api-deployment.yaml, 5b.5) as the pods it precedes - never a second image
# that could drift from them.
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # before-hook-creation, not hook-succeeded: the latter deletes the Job
    # the moment it works, taking its logs with it, and the question you
    # actually ask a migration Job is "what did the one that ran last
    # Tuesday do". Deleting only at the *start* of the next hook keeps
    # exactly one Job around at all times. Also not pruned by Flux's
    # prune: true - Helm owns this object, Flux doesn't, so deleting the
    # HelmRelease leaves it behind (5b.14 asserts on the Job object
    # directly, since a hook Job's own success is invisible to Flux's
    # health reporting - it's folded into the HelmRelease's Ready condition
    # rather than reported separately).
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "aerie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # 5b.1's dockerconfigjson Secret - same reason as api-deployment.yaml.
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Same image and tag as the api Deployment - one Helm value
          # feeding both, so an image bump can never migrate with one
          # version and serve with another.
          image: "{{ .Values.image.registry }}/aerie-api:{{ .Values.image.api.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DOTNET_ENVIRONMENT
              value: Docker
            {{- include "aerie.postgresEnv" . | nindent 12 }}
            # The migrate-mode switch, 5b.2's Program.cs: runs
            # MigrateAsync/SeedAsync against the connection strings above
            # and exits before app.Run(), instead of serving traffic.
            - name: AERIE_MIGRATE
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem above leaves nowhere for .NET's own
        # Path.GetTempPath() writes to land - same reasoning as
        # api-deployment.yaml.
        - name: tmp
          emptyDir: {}
