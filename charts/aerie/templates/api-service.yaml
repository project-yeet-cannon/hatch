# The cluster plan Phase 5b.5. Named "api" rather than a chart-derived name -
# 5b.9's Ingress backends key off this literally, and it is what keeps
# Program.cs's KioskFiles:BaseAddress default (http://files/) true by the
# same coincidence-turned-convention on the `files` side (5b.8).
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "aerie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
