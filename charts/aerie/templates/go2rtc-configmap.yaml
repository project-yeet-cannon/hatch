# Camera video (docs/camera-devices-architecture.md) - go2rtc's non-secret
# configuration, and the only configuration it has in git. The `streams:` block
# is deliberately NOT here: a camera stream source is an RTSP URL with the
# camera's username and password embedded in it, and this file is in git.
#
# An earlier design kept the streams in a Secret alongside this file. That is
# gone too: a camera's address and credential live in Aerie's database, set from
# the devices admin UI, and Aerie registers each stream over go2rtc's API just
# before someone watches it. What this pod holds at rest is the blocks below and
# nothing about any camera.
#
# Verified against go2rtc 1.9.14: repeated `-config` arguments merge rather than
# the last one winning, and a `-config` path that does not exist is skipped
# silently - which is what lets the writable runtime file start out empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: go2rtc-config
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: go2rtc
data:
  go2rtc.yaml: |
    # The only listener anything outside this pod uses. Aerie.Api's
    # CameraController relays its /api/ws endpoint; nothing else, including the
    # kiosk, talks to go2rtc directly.
    api:
      listen: ":1984"

    # Bound to loopback rather than disabled. go2rtc's own `ffmpeg:` sources -
    # any transcode, which is what a Reolink 4K main stream (H.265, unplayable
    # in a browser) would need - work by having ffmpeg push back into go2rtc
    # over RTSP on localhost. Verified 2026-08-23 against 1.9.14: with
    # `rtsp: listen: ""` every ffmpeg source fails with
    # "streams: exec: rtsp module disabled". Loopback keeps that working while
    # exposing nothing outside the pod, since a Service is the only way in and
    # there is no Service on 8554.
    rtsp:
      listen: "127.0.0.1:8554"

    # Off. WebRTC is the one transport that would need the *viewer* to reach
    # go2rtc directly, and the whole point of the CameraController relay is that
    # it doesn't - a kiosk holds one connection, to the API, on one origin.
    # Leaving this on would also have go2rtc advertise pod IPs no kiosk can
    # route to.
    webrtc:
      listen: ""

    log:
      level: {{ .Values.go2rtc.logLevel }}
