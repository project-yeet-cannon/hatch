# The cluster plan Phase 5b.8. Named "share" for the same reason api and
# files are named after themselves - 5b.9's Ingress backend
# (share.${DOMAIN}) keys off this literally. Port 5000 is dufs's own default
# listen port, not a choice made here.
apiVersion: v1
kind: Service
metadata:
  name: share
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
    app.kubernetes.io/component: share
spec:
  type: ClusterIP
  selector:
    {{- include "aerie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: share
  ports:
    - name: http
      port: 5000
      targetPort: http
