# Defaults only. Every value with an empty/placeholder default below is set
# for real by deploy/cluster/apps/helmrelease.yaml (5b.10), which fills them
# in with ${...} tokens that Flux's postBuild resolves before helm-controller
# ever sees this file - so nothing here is read at the cluster. It exists so
# `helm template`/`helm lint` (this step's exit criterion) has something to
# render against, and so a local `helm install` finds sane shapes even where
# the values are wrong.
#
# resources below are 5b.11's, sized from 5a.6's real reading rather than a
# guess this step would have to redo. No CPU limit anywhere - see 5a.6's
# second bullet and 5b.11's own note for why the measurement cannot supply
# one: a CPU limit throttles at the quota period and shows up as latency
# nobody can explain, while the request is what the scheduler actually
# places on. Memory limit is 2x the request everywhere it appears, because
# .NET (api, the migrate hook) sets its GC hard limit to 75% of the cgroup
# limit rather than growing forever, and nginx/dufs cost nothing to give the
# same headroom.

replicaCount: 3

# 5a.6: api never reached a steady state over three samples (222 -> 267 ->
# 308 MiB, monotonic), so 384Mi is above the last reading rather than equal
# to it. requests.cpu is sized for startup - JIT, EF model build, Quartz
# wiring, once per replica - and for the cpu.shares weighting that buys
# under contention, not for the 0.20% idle figure 5a.6 measured; a request
# derived from idle would let three replicas pack onto one node and starve
# each other through a rolling upgrade.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

image:
  # Host plus namespace, no image name, no tag - ${IMAGE_REGISTRY}. The
  # template appends /aerie-api and image.api.tag.
  registry: ""
  # ghcr-pull, 5b.1's dockerconfigjson Secret.
  pullSecret: ghcr-pull
  api:
    tag: latest
  # ${KIOSK_FILES_IMAGE_TAG} - files-deployment.yaml (5b.8) appends
  # /aerie-kiosk-files to image.registry the same way api does.
  kioskFiles:
    tag: latest

files:
  # 2, not a value api's replicaCount is missing a counterpart for by
  # accident: design.md lists kiosk `files` as HA-required, same as api - a
  # tablet that can't reach it can't self-update.
  replicaCount: 2
  # 5a.6: nginx serving a static APK and two small JSON files - the
  # measurement floor, not a rounded-up guess.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# ${DOMAIN}. Ingress hosts (5b.9) and Apps__PublicBaseUrl both key off this.
domain: ""

# ${TZ}, an IANA zone id.
tz: ""

# The wall (docs/auth-architecture.md). One value is the whole rollback, and
# "canary" is a rung on that ladder rather than a branch off it:
#
#   mode      Auth__Enabled  Auth__EnforceInProcess  Middleware  Annotated
#   none      false          -                       no          nothing
#   canary    true           false                   yes         the docs Ingress only
#   full      true           true                    yes         home + kiosk
#
# ${AUTH_MODE}, defaulting to none so an install that never sets it behaves
# exactly as it did before auth existed.
#
# The vocabulary is "none | canary | full" and NOT "off | canary | on", and
# that is the fix for a real outage rather than a matter of taste. This value
# reaches Helm as ${AUTH_MODE} in ../../deploy/cluster/apps/helmrelease.yaml,
# which Flux substitutes *after* `kustomize build` has re-serialized the
# manifest - and kustomize normalizes every quoting style to a plain scalar,
# double quotes, single quotes and an explicit !!str tag alike. So the quotes
# an author writes around the token are erased before the value is ever
# substituted, and `off` and `on` are both YAML 1.1 booleans by the time
# anything reads them back. Found live, 2026-08-21: AUTH_MODE=on rendered as
# `mode: on`, parsed as boolean true, and failed the guard in
# templates/middleware-auth.yaml on every reconcile.
#
# Quoting cannot fix that, so the words do: none of these three is a YAML
# scalar of any other type. Keep it that way when adding a rung - avoid the
# YAML 1.1 boolean set (y/yes/n/no/true/false/on/off, in any casing), and
# anything that reads as a number or a null.
auth:
  mode: none

# ${HA_HOST} / ${HA_PORT}, both optional - only read by the api container's
# one-time SiteSettings import on a fresh install. Empty means unset, not "".
haHost: ""
haPort: ""

# ${MEDIA_LIBRARY_SUBPATH}, optional. Empty turns media serving off entirely
# (compose.share.yml's own reasoning, carried across unchanged) rather than
# collapsing to the share root - see api-deployment.yaml's MediaLibrary block.
# The /share-ro mount this path is served from is 5b.8's, not this step's.
mediaLibrarySubpath: ""

share:
  # ${SHARE_HOST} / ${SHARE_NAME} - split in cluster-config.json because
  # share-volumes.yaml's volumeAttributes.source wants "//host/name" while
  # nothing else needs the host on its own; kept as two values here rather
  # than pre-joined so the template is the one place that assembles it.
  host: ""
  name: ""
  # dufs's --auth rule (share-deployment.yaml), "user:pass@path:permission" -
  # gates *write* access to the actual share, everything else compose.share.yml
  # already said about this pair still applies verbatim: a dummy credential,
  # in source on purpose, for a LAN-only stack with no real secrets behind it.
  # Moving it into ESO (5b.1's machinery) is a good idea and it is not this
  # phase's - this is the note beside the value, not a TODO to act on here.
  auth:
    username: admin
    password: password
  # 5a.6: an estimate, not a measurement - dufs was not running on the old
  # host when 5a.6 sampled. One replica, so being wrong costs one pod.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# go2rtc, the camera stream source (docs/plans/cameras.md Phase 7). Unlike
# every placeholder above, these are real defaults - go2rtc's address and image
# are the same for every installation, and the one installation-specific part
# (which cameras exist, at which RTSP URLs, with which passwords) never appears
# in Helm values at all. It arrives as the `go2rtc-streams` Secret, so a camera
# credential lives in the parameter store and nowhere in git.
go2rtc:
  image:
    # docker.io, not the chart's own registry - go2rtc is third-party. Pinned to
    # an exact version rather than a moving tag: the pod is a single replica
    # with Recreate strategy, so an unattended upstream change would take the
    # only stream source down with no second replica still serving the old one.
    repository: alexxit/go2rtc
    tag: "1.9.14"
  # info. debug logs every network interface at startup and every frame decision
  # after it, which is useful during bring-up and noise in OpenSearch afterwards.
  logLevel: info
  # Mounted optional (go2rtc-deployment.yaml), so this naming a Secret that does
  # not exist yet is the normal state until the first camera is configured.
  streamsSecretName: go2rtc-streams
  # Measured, not estimated (cameras plan Phase 9, 2026-08-23): go2rtc 1.9.14
  # relaying one Reolink 640x480/10fps H.264 sub-stream, run with this chart's
  # own securityContext and args. Idle 11.7 MiB / 0% CPU; one viewer 12 MiB /
  # 0.9% of a core; five concurrent viewers 21.4 MiB / 1.6%. So the shape is a
  # ~12 MiB floor plus roughly 2 MiB and 1.5m CPU per viewer, and the relay is
  # confirmed to be a copy rather than a decode - five viewers cost less than a
  # tenth of a core. The request is deliberately well above the measurement:
  # it has to cover every camera's producer, not just this one, and memory a
  # pod does not use costs only schedulable headroom. The limit stays at 4x the
  # request for the same reason it was chosen - a transcode (an H.265 main
  # stream) would blow past it, which is the signal to notice rather than a
  # cost to absorb, and is why the kiosk is on the sub-stream.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# The migrate hook Job (migrate-job.yaml, 5b.6). Matches api on memory - same
# image, same EF model - and asks for more CPU than api's idle-weighted
# request because Helm blocks the whole release on this Job finishing; it
# exits on its own, so an overstated request costs nothing after it does.
migrate:
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 768Mi

postgres:
  # <cluster-name>-rw, CNPG's own naming for the primary Service -
  # deploy/cluster/data/cluster/cluster.yaml names the Cluster aerie-pg.
  host: aerie-pg-rw
  port: 5432
  # aerie-pg-app, the Secret CNPG publishes for the aerie owner role
  # (cluster.yaml's bootstrap.initdb) - username and password keys.
  secretName: aerie-pg-app
