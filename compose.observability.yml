# Attaches each container's Compose service name to its own log lines (via
# the json-file driver's `attrs`), so fluent-bit can derive a `service`
# field per line for OpenSearch. See containers/fluent-bit/service_tag.lua.
x-logging: &container-log-tag
  options:
    labels: "com.docker.compose.service"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0-slim
    restart: always
    networks:
      - local
      - edge
    environment:
      # Skips the first-run /setup-database screen: Kuma writes db-config.json
      # itself when this is set. Without it, the setup-database HTTP server
      # (which runs standalone, before the Socket.IO API kuma-provision talks
      # to even starts) blocks until a human picks a DB type in the browser.
      - UPTIME_KUMA_DB_TYPE=sqlite
    volumes:
      - uptime_kuma_data:/app/data
    labels:
      caddy: status.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3001}}"
    logging: *container-log-tag

  # Declarative monitors, synced continuously from ./containers/autokuma/static-monitors/.
  # Dummy admin credentials below are intentional: Kuma requires *some* login
  # (no supported way to disable it) but this stack has no real secrets behind
  # it, matching the "LAN-only, trusted network" reasoning in
  # docs/monitoring-alerting-architecture.md.
  autokuma:
    image: ghcr.io/bigboot/autokuma:latest
    restart: unless-stopped
    networks:
      - local
    environment:
      - AUTOKUMA__KUMA__URL=http://uptime-kuma:3001
      - AUTOKUMA__KUMA__USERNAME=admin
      - AUTOKUMA__KUMA__PASSWORD=aerie-kuma-admin!23
      - AUTOKUMA__STATIC_MONITORS=/static-monitors
    volumes:
      - ./containers/autokuma/static-monitors:/static-monitors:ro
    depends_on:
      - uptime-kuma
    logging: *container-log-tag

  # One-shot: first-run account setup, the Home Assistant notification
  # provider, and attaching it to every monitor. Re-runs (and re-converges)
  # on every `up -d`, so it never needs manual first-run clicks.
  kuma-provision:
    image: python:3.12-slim
    networks:
      - local
    working_dir: /app
    volumes:
      - ./containers/kuma-provision:/app:ro
    environment:
      - KUMA_URL=http://uptime-kuma:3001
      - KUMA_USERNAME=admin
      - KUMA_PASSWORD=aerie-kuma-admin!23
      - HA_HOST=${HA_HOST}
      - HA_PORT=${HA_PORT}
      - HA_TOKEN=${HA_TOKEN}
    command: sh -c "pip install --quiet --no-cache-dir -r requirements.txt && python provision.py"
    depends_on:
      - uptime-kuma
    logging: *container-log-tag

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    restart: always
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200" # loopback-only, for setup/debug curl access
    networks:
      - observability
    logging: *container-log-tag

  fluent-bit:
    image: fluent/fluent-bit:4.2.7
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./containers/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./containers/fluent-bit/custom_parsers.conf:/fluent-bit/etc/custom_parsers.conf:ro
      - ./containers/fluent-bit/service_tag.lua:/fluent-bit/etc/service_tag.lua:ro
    networks:
      - observability
    depends_on:
      - opensearch
    logging: *container-log-tag

  # One-shot: applies the aerie-log-retention ISM policy (30-day index
  # autodelete), the aerie-logs index template (explicit `service` mapping),
  # and creates the aerie-logs-* Dashboards index pattern. All three scripts
  # are idempotent (check-then-create / overwrite=true), so it's safe to
  # re-run on every `up -d`.
  opensearch-provision:
    image: curlimages/curl:8.11.0
    networks:
      - observability
    volumes:
      - ./containers/opensearch-provision/apply-ism-policy.sh:/apply-ism-policy.sh:ro
      - ./containers/opensearch-provision/apply-index-template.sh:/apply-index-template.sh:ro
      - ./containers/opensearch-provision/create-index-pattern.sh:/create-index-pattern.sh:ro
    entrypoint: ["/bin/sh", "-c", "/apply-ism-policy.sh && /apply-index-template.sh && /create-index-pattern.sh"]
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - DASHBOARDS_URL=http://opensearch-dashboards:5601
    depends_on:
      - opensearch
      - opensearch-dashboards
    logging: *container-log-tag

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    restart: always
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - observability
      - edge
    depends_on:
      - opensearch
    labels:
      caddy: logs.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 5601}}"
    logging: *container-log-tag

networks:
  edge:
    external: true
  observability:
    driver: bridge

volumes:
  uptime_kuma_data:
  opensearch_data:
