# The cluster plan Phase 6b.7 - every dashboard the 6b.5 sidecar loads, each
# as its own labelled ConfigMap. ../kustomization.yaml's sidecar.dashboards
# (grafana_dashboard: "1", searchNamespace: ALL) is what turns a ConfigMap
# carrying that label into a dashboard Grafana shows, with no volume and no
# restart - the generators below exist only to attach that label
# consistently, not to transform the JSON.
#
# disableNameSuffixHash: true, matching ../../../data/schema/kustomization.yaml's
# own configMapGenerator use - a hashed name is the kustomize default so that
# a ConfigMap edit forces every consumer to roll, which matters for a Job's
# immutable pod template but buys nothing here: the sidecar polls and reloads
# on an unchanged name, so a hash suffix would only mean the previous
# revision's ConfigMap is orphaned in the cluster on every edit instead of
# updated in place.
#
# Of the two dashboards containers/grafana/provisioning/dashboards/ has
# carried since the compose era, only one is here. windows-exporter.json
# moves across unchanged - same exporter, same metric names, same three
# machines, already pinned to the fixed datasource uid `prometheus` that
# ../../controllers/kube-prometheus-stack.yaml's sidecar.datasources
# provisions under that exact uid. docker-cadvisor.json does not: it groups
# by compose container name against a standalone cadvisor container that has
# no equivalent under containerd, where the kubelet has exposed
# /metrics/cadvisor all along and kube-prometheus-stack already scrapes it.
# Both compose files stay where they are, untouched, for the same reason
# 6a.4's admin-secrets note gives for compose.observability.yml itself: the
# old host keeps using them until Phase 7 deletes the compose files, and nothing
# here has any bearing on what that host's own Grafana loads.
#
# longhorn.json, cloudnative-pg.json and flux.json are what the old host could
# never show - pinned by copying the upstream JSON into the repo rather than
# by Grafana's gnetId fetch-at-runtime mechanism, which would make every
# Grafana pod start an outbound dependency on grafana.com or GitHub. Each
# already carries its own `datasource`/`DS_PROMETHEUS` template variable of
# type "datasource" (Grafana's own dashboard-import convention, not this
# repo's), which is a live query against installed datasources evaluated on
# every render - unlike ../../controllers/kube-prometheus-stack.yaml's fixed
# uid: prometheus, it resolves correctly with no rewrite because this cluster
# only ever registers the one Prometheus datasource the sidecar provisions.
# Sourced from:
#   - longhorn.json: grafana.com/grafana/dashboards/16888 (Longhorn Monitoring
#     & Backups) - volume health/robustness, backup coverage, per-node and
#     per-disk capacity; the community dashboard the Longhorn project itself
#     points operators at, by a wide margin over the alternatives.
#   - cloudnative-pg.json: github.com/cloudnative-pg/grafana-dashboards,
#     charts/cluster/grafana-dashboard.json - the project's own maintained
#     dashboard, replication lag and instance count among its panels.
#   - delivery.json: not upstream's - written for this repository
#     (docs/plans/deploy-observability.md 1.2) and the only dashboard here
#     that is not a copy of somebody else's. Four rows answering one question:
#     the commit on main, the tag the ImagePolicy selected, the tag the pods
#     are running, the CI runs behind them, the Flux objects in between, and
#     the rollout at the end. It is also the only dashboard here that reads a
#     second datasource (uid `github`, provisioned by
#     ../../controllers/kube-prometheus-stack.yaml's additionalDataSources)
#     and the only one that deliberately *wants* postBuild substitution:
#     ${AERIE_REPO_OWNER:=unset} and ${AERIE_REPO_NAME:=unset} reach its two
#     textbox variables, which is how the GitHub half stays per-installation
#     without a per-installation commit. Both carry a `:=` default on
#     purpose - that is the operator spelling of an optional key, and it is
#     also what keeps the strict substitution described below from failing on
#     an installation that never sets them. Everything else in that file
#     addresses Grafana variables as bare $owner/$repo/$__rate_interval,
#     which Flux never touches: its substitution only fires when `$` is
#     immediately followed by `{`.
#   - part-time-node.json: not upstream's either - written for this repository
#     (docs/plans/part-time-node.md 5.3), and the second of the two here that
#     is nobody else's copy. One question, on a screen instead of in someone's
#     head: can the cluster afford to hand that machine back right now. The
#     gauge is every pod's memory *request* over the memory allocatable on the
#     nodes that are not part-time - requests rather than usage, because the
#     scheduler places on requests and the question is whether the evicted
#     pods have somewhere to land. Everything on it keys off the node's own
#     `aerie.family/availability` and `aerie.family/personal-mode` labels
#     rather than off a node name, which is the same rule that plan's 1.5
#     applies to placement, and it depends on
#     ../../controllers/kube-prometheus-stack.yaml's
#     kube-state-metrics.metricLabelsAllowlist naming both: without that,
#     every panel here is empty and so is the alert exclusion in
#     ../alerts/cluster.yaml. It holds no ${...} tokens and no Grafana macros
#     at all - see the strict-substitution warning below.
#   - flux.json: github.com/fluxcd/flux2-monitoring-example,
#     monitoring/configs/dashboards/control-plane.json ("Flux Control Plane")
#     - the project's own example, already cited by ../scrape/flux.yaml for
#     the PodMonitor these panels read. Not that repo's cluster.json ("Flux
#     Cluster Stats"), despite its "Failing Reconcilers"/"Suspended Objects"
#     panels reading as the closer match to 6b.8's FluxReconciliationFailing
#     alert: verified live against the pinned flux v2.9.4
#     (scripts/versions.json) that cluster.json's panels all key off
#     gotk_resource_info, a metric this Flux version's controllers do not
#     expose - every panel on it would have rendered empty. control-plane.json
#     keys off controller_runtime_reconcile_total, go_info,
#     rest_client_requests_total and friends, all confirmed present with data
#     via observability/flux-system's own scrape (../scrape/flux.yaml) before
#     this file was written. logs.json needs Loki, which this phase does not
#     run.
#
# **Every upstream dashboard's own template-variable/macro tokens collide
# textually with ../../../observability.yaml's postBuild.substituteFrom, and this repo
# runs with the StrictPostBuildSubstitutions feature gate on** - found live,
# 2026-08-19, as observability-config failing to reconcile with "variable
# substitution failed: variable not set (strict mode)" on
# dashboard-windows-exporter (its legacy Table-panel \${__cell_4}/\${__cell_5}
# drill-down macros), then again with "missing closing brace" on
# dashboard-longhorn (its \${__field.labels.*} display-name macros, whose
# dotted contents aren't a bare identifier). Every \${TOKEN} in the four
# upstream JSON files here - datasource variables and Grafana macros alike - is escaped to
# \$\${TOKEN}, which Flux renders as the literal \${TOKEN} Grafana expects
# instead of trying to resolve TOKEN against aerie-cluster-config. **If you
# update or replace one of these dashboards, grep the new JSON for \${ and
# escape every hit before committing** - kubectl kustomize does not catch
# this, since kustomize itself never touches postBuild tokens; only Flux's
# own reconcile does, on the live cluster. delivery.json is the exception
# that proves the rule rather than a counter-example: it holds exactly two
# distinct ${...} tokens, both deliberate, both carrying a `:=` default, and
# no Grafana macros at all - `grep -o '\${[^}]*}' delivery.json` printing
# anything other than AERIE_REPO_OWNER and AERIE_REPO_NAME is the bug.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: dashboard-windows-exporter
    namespace: observability
    files:
      - windows-exporter.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-longhorn
    namespace: observability
    files:
      - longhorn.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-cloudnative-pg
    namespace: observability
    files:
      - cloudnative-pg.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-flux
    namespace: observability
    files:
      - flux.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-delivery
    namespace: observability
    files:
      - delivery.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-part-time-node
    namespace: observability
    files:
      - part-time-node.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
