# The trading plan (docs/plans/trading.md) Phase 1 - the trading control
# plane's own /metrics endpoint.
#
# The first *first-party application* scrape target in this directory: the five
# that preceded it are a Windows exporter, Flux, CNPG, Longhorn and Traefik,
# all of them things that export metrics because they were installed rather
# than because somebody wrote an endpoint. That difference is why this object
# exists at all - kube-prometheus-stack wires up the platform's own targets and
# nothing else, so an app that serves /metrics and never says so is an app
# nobody is watching.
#
# It lives here rather than in ../../../trading/app/ for this directory's own
# rule: every instance of a monitoring.coreos.com CRD in this repository sits
# in the observability-config layer, because that layer is the one guaranteed
# to reconcile after the CRDs are registered. The trading layer depends on
# infra-config and site-config, not on observability-controllers, so a
# ServiceMonitor there would be an object applied before its type exists on a
# cold rebuild - the exact failure this directory's kustomization.yaml is
# written to prevent, and the kind a disaster-recovery rehearsal finds and
# nothing else does.
#
# It is also the whole of what the silo's extraction seam costs the
# observability layer: this file, and one namespace added to the selector in
# ./cloudnative-pg.yaml.
#
# The endpoint is selected by *port name*, which is what makes
# ../../../trading/app/service.yaml's `name: http` load-bearing rather than
# tidy - renaming it there stops this scrape with nothing reporting a fault.
# The wall is not in the way: Prometheus reaches the pod through the Service,
# in-cluster, never through Traefik.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trading
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - trading
  selector:
    matchLabels:
      app.kubernetes.io/name: trading
      app.kubernetes.io/component: control
  endpoints:
    - port: http
      path: /metrics
