# The cluster plan Phase 6b.6, target 2 of 5 - Flux's own controllers.
#
# Nothing installs this on its own. scripts/flux/Bootstrap-Flux.ps1 runs
# `flux install`, which is the fluxcd/flux2 kustomize base for each
# controller - source-controller, kustomize-controller, helm-controller,
# notification-controller - and that base does not include a PodMonitor.
# Flux's own bundled monitoring manifests were removed upstream at v2.2
# (2023-12-13) in favor of exactly this: a hand-written PodMonitor, per
# https://github.com/fluxcd/flux2-monitoring-example.
#
# Verified against the pinned scripts/versions.json flux.version (v2.9.4)
# rather than assumed: every controller's Deployment carries
# `app.kubernetes.io/part-of: flux` on its pod template (each controller's
# manifests/bases/<name>/labels.yaml LabelTransformer writes it to
# spec/template/metadata/labels, not only to the Deployment's own metadata),
# and every controller's manager container exposes containerPort 8080 named
# `http-prom` - both confirmed against the v1.9.4 source-controller release
# manifest flux v2.9.4 pins, which is representative of the other three.
#
# One PodMonitor covering all four controllers by the shared label, rather
# than one per controller: they already carry a common selector and nothing
# here needs to distinguish which controller a series came from - that's
# gotk_reconcile_condition's own `kind` label, not a job-level split.
#
# Without this, 6b.8's FluxReconciliationFailing alert - the durable half of
# 3b.14 and arguably the single most valuable thing in this phase - has no
# metric to evaluate. gotk_reconcile_condition comes from every controller
# that reconciles a typed object, not only kustomize-controller, which is why
# the selector below is not narrowed to one.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    - port: http-prom
