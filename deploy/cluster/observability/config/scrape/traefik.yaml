# The cluster plan Phase 6b.6, target 5 of 5 - Traefik, and the half of it
# that belongs in this layer.
#
# Two halves, per the re-scope preamble in
# docs/plans/swarm/phase-6-observability.md: turning the metrics endpoint on
# is ../../../infrastructure/config/traefik-helmchartconfig.yaml's
# metrics.prometheus.service.enabled: true, in layer 2 of the *infrastructure*
# split (infra-config) - allowed there under this directory's own
# kustomization.yaml rule because it renders a plain v1 Service
# (templates/service-metrics.yaml at the pinned traefik-40.1.4+up40.1.0 /
# upstream v40.1.0), not a monitoring.coreos.com object. This ServiceMonitor
# is the other half, and it is the one that has to live here: it is the
# object that names the CRD, so it is subject to the ordering rule itself and
# belongs wherever every other instance of that CRD in this phase does.
#
# The chart's own metrics.prometheus.serviceMonitor sub-key stays at its
# default (false) - confirmed by reading
# traefik/templates/servicemonitor.yaml at the pinned tag: turning it on
# renders the ServiceMonitor from inside the HelmChart k3s's own
# helm-controller reconciles, which runs at cluster bring-up, well before
# this phase's CRDs exist. That is the exact failure this directory's rule
# exists to prevent, just triggered by k3s's bundled helm-controller instead
# of Flux's.
#
# Label selector verified against templates/_service-metrics.tpl at the same
# tag rather than guessed: with metrics.prometheus.service.enabled: true, the
# dedicated metrics Service is stamped with `app.kubernetes.io/name: traefik`
# (the chart name; no nameOverride is set) and
# `app.kubernetes.io/component: metrics` - distinct from the main `traefik`
# Service's own labels, which carry no `component` key at all. Selecting on
# both together is what keeps this object from also matching that Service.
# Check the rendered output against the running chart if this is ever
# re-pinned - the k3s-bundled Traefik chart has moved keys under `metrics`
# before, per traefik-helmchartconfig.yaml's own footnote.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
