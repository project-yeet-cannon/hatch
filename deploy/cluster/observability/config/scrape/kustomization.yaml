# The cluster plan Phase 6b.6 - every scrape target this phase adds, as a
# hand-written object in this layer rather than a layer-1 chart flag.
#
# **The rule, and why it lives here rather than only in the plan document:**
# a chart flag that *renders a monitoring.coreos.com object* is never turned
# on in layer 1 (../../controllers, or ../../../infrastructure/controllers).
# Layer 1 reconciles before this layer - observability-controllers carries
# `wait: true` in ../../../observability.yaml precisely so that
# observability-config is not even attempted until layer 1's CRDs exist - so
# on an empty cluster a layer-1 chart flag that renders one of these objects
# is a failed Helm install: the CRD it names is not registered yet. Under
# `wait: true` that failure holds every other controller in the same
# Kustomization behind it, and infra-config behind that, which is a rebuild
# that never comes up rather than an error anyone sees. A cluster that has
# been running for a month never notices, because the CRD is already there by
# the time anything re-applies - which is exactly why this is the kind of bug
# a disaster recovery rehearsal finds and nothing else does. See the re-scope
# preamble at the top of docs/plans/swarm/phase-6-observability.md for the
# live account of this happening to ../../../infrastructure/controllers/
# cloudnative-pg.yaml's monitoring.podMonitorEnabled.
#
# A chart flag that merely *exposes a metrics port or a Service* is fine, and
# sometimes necessary - ../../../infrastructure/config/
# traefik-helmchartconfig.yaml's metrics.prometheus.service.enabled is that
# case: it renders a plain v1 Service, a type every cluster understands from
# its first boot, and this directory's traefik.yaml is the object that turns
# that Service into a scrape target. The distinction is whether the chart's
# own output references a CRD this phase installs - not whether the flag has
# the word "monitoring" in its name.
#
# Five objects here; a sixth target (Traefik) is split across this directory
# and that HelmChartConfig for the reason above, and a seventh
# (kubelet/cAdvisor/kube-state-metrics/node-exporter) needs nothing here at
# all - kube-prometheus-stack wires those itself. See
# docs/plans/swarm/phase-6-observability.md's 6b.6 for the full account of
# each.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - windows-exporter.yaml
  - flux.yaml
  - cloudnative-pg.yaml
  - longhorn.yaml
  - traefik.yaml
