# The cluster plan Phase 6b.6, target 4 of 5 - Longhorn's manager metrics.
#
# ../../../infrastructure/controllers/longhorn.yaml installs the chart with no
# monitoring flag of its own to turn on or off - unlike CloudNativePG's, this
# chart has never rendered a ServiceMonitor, so there is no layer-1 flag this
# object is answering "no" to. `longhorn-backend`, the Service the manager
# DaemonSet's own pods answer behind
# (http://longhorn-backend.longhorn-system.svc.cluster.local:9500/metrics per
# Longhorn's own monitoring docs), already exists as part of the chart install
# - this is only the scrape object.
#
# `app: longhorn-manager` and the `manager` port name are Longhorn's own
# convention for this Service, unchanged across the project's published
# monitoring guide (https://longhorn.io/docs/1.11.1/monitoring/
# prometheus-and-grafana-setup/) - a ServiceMonitor, not a PodMonitor, because
# scraping through the Service lets kube-state-metrics-style relabeling stay
# out of this object; the Service's own selector already resolves to exactly
# the manager pods.
#
# Volume health, replica counts and rebuild progress live here - 6b.8's
# degraded-volume alert (`longhorn_volume_robustness == 2`) reads this job,
# and 6b.7's Longhorn dashboard is provisioned against it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - longhorn-system
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
