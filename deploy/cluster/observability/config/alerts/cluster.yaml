# The cluster plan Phase 6b.8, half 2 of 2 - the cluster alerts goal 6.4
# (design.md) asks for, beyond kube-prometheus-stack's own default rule
# groups, which already cover node NotReady, pod crash-looping, PVC filling
# and kubelet health - do not re-implement any of that here.
#
# etcd quorum - ../../controllers/kube-prometheus-stack.yaml's kubeEtcd block
# and scripts/k3s/Install-K3sNode.ps1's etcd-expose-metrics (6b.1) are what put
# a target here to alert on. Three servers since Phase 7c.7, and that is where
# the two rules part company - they were both `for: 1m` / critical while a lost
# member on two servers was an instant outage. EtcdNoLeader keeps both: no
# leader is a stopped cluster whatever the member count, and no amount of
# waiting makes it less true. EtcdMemberDown is now a warning at `for: 15m`,
# because one member of three is a survivable degradation and Phase 1's
# staggered Windows Update reboots produce it on a schedule - long enough to
# ride out a reboot, short enough that a member that never comes back is
# reported while there is still a second one to lose. The job label on it was
# the one part of this file that had not been checked against a running
# cluster, with a note here saying so - and it was wrong: it read
# `kube-prometheus-stack-kube-etcd`, the *scrape pool* name, while the label
# prometheus-operator actually attaches is `kube-etcd`, from the jobLabel on
# the Service the chart's kubeEtcd block creates. `up{job="..."}` matched
# nothing, so EtcdMemberDown could not fire for any input - a silently-dead
# rule, exactly as this note warned. Corrected 7c.11, from the live target
# list; re-confirm with `kubectl get --raw
# /api/v1/namespaces/observability/services/prometheus-operated:9090/proxy/api/v1/targets`
# if the chart version ever moves.
#
# Longhorn degraded volumes - ../../scrape/longhorn.yaml (6b.6) is the job.
# `for: 30m`, deliberately long: Phase 1's staggered Windows Update reboots
# produce exactly this state on a healthy cluster, and
# ../../../infrastructure/config/longhorn-storageclasses.yaml's
# staleReplicaTimeout: 30 (minutes) is the number this must not undercut.
# Through the two-node build window this fired continuously and was expected
# to - longhorn-r3 cannot be satisfied on two nodes, which that storage class
# file already says out loud. Phase 7c.8's third node ended that: every
# longhorn-r3 volume rebuilt to three replicas, and this rule now means what
# it says.
#
# CNPG replication lag and instance count - ../../scrape/cloudnative-pg.yaml
# (6b.6) is the job. The instance-count threshold reads ${POSTGRES_INSTANCES}
# rather than a literal 2, which is why Phase 7's raise to 3 was a repository
# variable and not an edit here - the exact caveat the cluster plan's own text
# flags for a hardcoded threshold, sidestepped by templating against the same
# key deploy/cluster/data/cluster/cluster.yaml already uses.
#
# BEFORE ADDING A LATENCY THRESHOLD HERE, read this. Prometheus histograms
# have coarse buckets, and `histogram_quantile` interpolates linearly *inside*
# the bucket the quantile falls in - so a percentile can report a precision the
# metric does not have. etcd_disk_wal_fsync_duration_seconds uses power-of-two
# buckets, and there is **no bucket between 8 ms and 16 ms**: with ~93% of
# fsyncs at or under 8 ms and ~99.8% at or under 16 ms, p99 computes to ~15 ms
# whatever the truth is. Three nodes on destination volumes spanning a 20x
# range in measured latency all reported 14.90/14.94/15.43 ms, which is not a
# coincidence and is not the storage.
#
# The consequence, learned by writing a gate that could not be checked: a
# threshold like "p99 under 10 ms" is **not expressible** against that metric -
# 9 ms and 15 ms are the same reading. State a latency gate at exact bucket
# boundaries instead, as a fraction of samples under a `le` the histogram
# actually has:
#
#   sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket{le="0.008"}[30m])) by (instance)
#     / sum(rate(etcd_disk_wal_fsync_duration_seconds_count[30m])) by (instance)
#
# The same caution applies when reading a percentile someone else recorded.
# kube-prometheus-stack's own etcdHighFsyncDurations fires at 500 ms, two to
# three orders of magnitude above any of this, so it is unaffected either way -
# the trap is only there for a tight threshold written against a loose metric.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-alerts
  namespace: observability
spec:
  groups:
    - name: etcd
      rules:
        - alert: EtcdNoLeader
          expr: etcd_server_has_leader == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: 'etcd member {{ $labels.instance }} reports no leader - quorum is 2 of 3, so this is a stopped cluster'
        - alert: EtcdMemberDown
          expr: up{job="kube-etcd"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'etcd member {{ $labels.instance }} has not answered its metrics port for 15m - quorum is 2 of 3, one member from an outage'
    - name: longhorn
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'Longhorn volume {{ $labels.volume }} in {{ $labels.pvc_namespace }} has been degraded for 30m'
    - name: cloudnative-pg
      rules:
        - alert: CNPGReplicationLagHigh
          # Bytes behind primary, not seconds - cnpg_pg_replication_lag is the
          # WAL-position gap; cnpg_pg_stat_replication_*_lag_seconds are the
          # time-based siblings if this threshold turns out to be the wrong
          # shape once there is real replication traffic to measure against.
          expr: max(cnpg_pg_replication_lag{namespace="aerie"}) > 104857600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'CNPG replica {{ $labels.pod }} is more than 100MiB of WAL behind the primary'
        - alert: CNPGInstancesBelowExpected
          expr: count(cnpg_collector_up{namespace="aerie"} == 1) < ${POSTGRES_INSTANCES}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'aerie-pg has fewer than ${POSTGRES_INSTANCES} instances reporting'
