# Layer 2's third tenant - see ../kustomization.yaml. Three PrometheusRules:
# ./flux.yaml (3b.14's durable half), ./cluster.yaml (etcd quorum, Longhorn
# degraded, CNPG replication lag and instance count - design.md's goal 6.4)
# and ./backup.yaml (the cluster plan Phase 8b.11 - restic, CNPG and Longhorn
# backup staleness, each with an absent() sibling). Selected regardless of
# label, same as ../scrape/'s objects and for the same reason:
# ../../controllers/kube-prometheus-stack.yaml's
# ruleSelectorNilUsesHelmValues: false.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux.yaml
  - cluster.yaml
  - backup.yaml
