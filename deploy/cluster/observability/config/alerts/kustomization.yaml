# Longhorn degraded, CNPG replication lag and instance count - design.md's
# goal 6.4). Selected regardless of label, same as ../scrape/'s objects and
# for the same reason: ../../controllers/kube-prometheus-stack.yaml's
# ruleSelectorNilUsesHelmValues: false.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux.yaml
  - cluster.yaml
