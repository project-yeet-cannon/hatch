# The cluster plan Phase 8b.11 - the fourth PrometheusRule beside ./cluster.yaml
# and ./flux.yaml, selected the same way and for the same reason
# (../../controllers/kube-prometheus-stack.yaml's
# ruleSelectorNilUsesHelmValues: false).
#
# Phase 8's finding 8 is why this file is the whole of the work: every backup
# in this system is a Kubernetes CronJob or a CNPG object, kube-state-metrics
# is already scraping the cluster, and CNPG's and Longhorn's own collectors
# are already scraped by ../../config/scrape/. No exporter, no sidecar, no
# push gateway, no new scrape target.
#
# ---------------------------------------------------------------------------
# What was checked against this cluster before this file was committed, since
# 8b.11 required exactly that and two of the three answers changed the file:
#
# 1. `kube_cronjob_status_last_successful_time` - REAL, and carries
#    `namespace` and `cronjob` labels as written. Present for
#    aerie/aerie-backup, aerie/aerie-backup-verify and
#    longhorn-system/aerie-critical-daily.
# 2. A Longhorn `RecurringJob` IS backed by an ordinary Kubernetes CronJob
#    that kube-state-metrics therefore already sees - the fallback 8b.11
#    pre-authorized is not needed. One correction to 8b.10's note: the
#    generated CronJob is named `aerie-critical-daily`, not
#    `aerie-critical-daily-c`.
# 3. `cnpg_collector_last_available_backup_timestamp` - REAL but permanently
#    **0**, on all three instances, on a cluster backing up nightly. The
#    long-form reason is in ../../controllers/kube-prometheus-stack.yaml
#    beside the CustomResourceState entry that replaces it: under the
#    barman-cloud plugin nothing writes the Cluster status fields that metric
#    renders. `time() - 0` is fifty-six years, so the rule 8b.11 specified
#    would have fired every night forever rather than gone quiet - the
#    failure mode this file is most concerned with, in its loud form.
#    CNPGBackupTooOld reads `aerie_cnpg_backup_stopped_at` instead, which is
#    `status.stoppedAt` off the Backup objects themselves.
#
# ---------------------------------------------------------------------------
# Two deliberate departures from 8b.11's table, both of them things that read
# as a wrong guess unless written down:
#
# - **`kube_job_failed`, not `kube_job_status_failed`.** The latter counts
#   failed *pods* and keeps counting them after the Job as a whole succeeds -
#   a backup that lost one pod to a node reboot, retried inside its
#   backoffLimit and finished would leave the series at 1 for as long as the
#   Job object survives (three days here), so the alert would page for three
#   days about a backup that exists. `kube_job_failed{condition="true"}` is
#   the Job's own Failed condition: it appears only when the Job gave up.
#   The `kube_job_created` clause beside it bounds the alert to failures from
#   the last day, because the Job objects outlive that (three days for the
#   daily, three weeks for the verify) and a fortnight of repeat_interval
#   pages about one bad Sunday is how a receiver gets muted. The durable half
#   of that signal is the staleness rule above it, which is what stays firing
#   until a backup actually succeeds.
#
# - **A sixth rule, LonghornVolumeBackupStale.** 8b.10 found that Longhorn
#   skips a *detached* volume with a warn log and a successful job -
#   `allow-recurring-job-while-volume-detached` is off - and assigned the gap
#   here explicitly. LonghornBackupTooOld cannot see it: the CronJob succeeds.
#   This rule reads each volume's own `longhorn_volume_last_backup_at`,
#   selected by joining on the PVCs whose storageClass is `longhorn-r3` -
#   which is finding 2's definition of the wanted set, and a better selector
#   than 8a.3's label for exactly the trap 8a.3 names: a volume restored
#   without the recurring-job label keeps its class, so it stays in this
#   rule's set and goes stale loudly instead of dropping out of it silently.
#
# Every staleness rule below has an `absent()` sibling, which is the part that
# is easy to skip and expensive to have skipped: `time() - <series that does
# not exist>` produces no samples, so a wrong metric name, a renamed CronJob
# or a deleted CronJob is not a firing alert - it is silence, and silence is
# what a working backup looks like. The job-failure rule has no sibling on
# purpose: `kube_job_failed` has no series when nothing has failed, so its
# absence is the healthy state, and the CronJob-deleted case is already
# covered by the sibling of the staleness rule beside it.
#
# 36 hours, not 25: a daily backup that misses one night is a backup that
# missed one night, and paging for it at 03:11 trains someone to ignore the
# rule that matters. Ten days for the weekly verify, same reasoning one
# cadence up.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-alerts
  namespace: observability
spec:
  groups:
    - name: backup-restic
      rules:
        - alert: ResticBackupTooOld
          expr: time() - kube_cronjob_status_last_successful_time{namespace="aerie", cronjob="aerie-backup"} > 36 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: 'No successful aerie-backup run for {{ $value | humanizeDuration }} - the nightly pg_dump and parameter export have stopped reaching either restic repository'
        - alert: ResticBackupMetricAbsent
          expr: absent(kube_cronjob_status_last_successful_time{namespace="aerie", cronjob="aerie-backup"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: 'kube_cronjob_status_last_successful_time is missing for aerie/aerie-backup - the CronJob was deleted or renamed, and ResticBackupTooOld can no longer fire for any input'
        - alert: ResticBackupJobFailed
          # The regex matches only the Jobs the two CronJobs create
          # (name plus a scheduling epoch), so a hand-run
          # `aerie-backup-manual-N` experiment does not page anyone.
          expr: |
            kube_job_failed{namespace="aerie", job_name=~"aerie-backup(-verify)?-[0-9]+", condition="true"} == 1
              and on (job_name) (time() - kube_job_created{namespace="aerie"} < 86400)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Backup Job {{ $labels.job_name }} failed - `kubectl -n aerie logs job/{{ $labels.job_name }}` while it is still inside its ttlSecondsAfterFinished'
        - alert: ResticVerifyStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="aerie", cronjob="aerie-backup-verify"} > 10 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'No successful aerie-backup-verify run for {{ $value | humanizeDuration }} - nothing has restored a snapshot and read it back since then'
        - alert: ResticVerifyMetricAbsent
          expr: absent(kube_cronjob_status_last_successful_time{namespace="aerie", cronjob="aerie-backup-verify"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: 'kube_cronjob_status_last_successful_time is missing for aerie/aerie-backup-verify - the weekly verify CronJob was deleted or renamed, and ResticVerifyStale can no longer fire for any input'
    - name: backup-postgres
      rules:
        - alert: CNPGBackupTooOld
          # aerie_cnpg_backup_stopped_at, not
          # cnpg_collector_last_available_backup_timestamp - see this file's
          # header, check 3. phase="completed" is load-bearing: a failed
          # Backup object also has a stoppedAt.
          expr: time() - max(aerie_cnpg_backup_stopped_at{phase="completed"}) > 36 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: 'Newest completed CNPG base backup is {{ $value | humanizeDuration }} old - PITR still needs WAL, and WAL is only useful back to the oldest base backup'
        - alert: CNPGBackupMetricAbsent
          expr: absent(aerie_cnpg_backup_stopped_at{phase="completed"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: 'No completed CNPG Backup object is visible to kube-state-metrics - either every Backup has been deleted, or the CustomResourceState entry in kube-prometheus-stack.yaml has stopped matching (an RBAC change or a CRD version bump would do it)'
    - name: backup-longhorn
      rules:
        - alert: LonghornBackupTooOld
          expr: time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="aerie-critical-daily"} > 36 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'Longhorn recurring job aerie-critical-daily has not completed for {{ $value | humanizeDuration }} - Grafana, Uptime Kuma and Alertmanager volumes are not reaching the backup target'
        - alert: LonghornBackupMetricAbsent
          expr: absent(kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="aerie-critical-daily"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: 'kube_cronjob_status_last_successful_time is missing for longhorn-system/aerie-critical-daily - the RecurringJob was deleted, and with it the CronJob LonghornBackupTooOld reads'
        - alert: LonghornVolumeBackupStale
          # 8b.10's detached-volume gap, which the CronJob rule above cannot
          # see. A volume that has never been backed up reports 0 here, so it
          # fires rather than being silently excluded - which is the intended
          # reading of a longhorn-r3 volume with no backup behind it.
          expr: |
            time() - max by (volume, persistentvolumeclaim) (
              longhorn_volume_last_backup_at
                * on (volume) group_left(persistentvolumeclaim)
              label_replace(kube_persistentvolumeclaim_info{storageclass="longhorn-r3"}, "volume", "$1", "volumename", "(.+)")
            ) > 36 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'Longhorn volume {{ $labels.volume }} ({{ $labels.persistentvolumeclaim }}) has no backup newer than {{ $value | humanizeDuration }} - a detached volume is skipped by the recurring job with a warn log and a successful run'
        - alert: LonghornVolumeBackupMetricAbsent
          expr: absent(longhorn_volume_last_backup_at) or absent(kube_persistentvolumeclaim_info{storageclass="longhorn-r3"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: 'One half of the LonghornVolumeBackupStale join has no series - either longhorn-manager has stopped exporting volume metrics or no PVC uses the longhorn-r3 class, and either way the per-volume backup check is dead rather than quiet'
