# Layer 2 of the split described in ../../observability.yaml: instances of
# the CRDs ../controllers registers - ScrapeConfigs, ServiceMonitors,
# PodMonitors, PrometheusRules - plus the Ingresses, Grafana dashboards and
# provisioning CronJobs.
#
# Empty from 6b.4 to 6b.5: nothing here yet, because nothing in ../controllers
# had registered a CRD to be an instance of. scrape/ (6b.6) is the first
# tenant, now that ../controllers/kube-prometheus-stack.yaml (6b.5) has
# registered ScrapeConfig, ServiceMonitor and PodMonitor. dashboards/ (6b.7)
# needs no CRD - its ConfigMaps are plain v1 objects, found by the 6b.5
# sidecar's label selector rather than by anything this layer's `wait: true`
# boundary is about - but it lives here rather than in ../controllers because
# the dashboards themselves are content, not plumbing, the same distinction
# that puts ../controllers/admin-secrets.yaml's two Secrets there instead of
# here for the opposite reason (a HelmRelease mounts them). alerts/ (6b.8) is
# the third tenant, needing the same PrometheusRule CRD ../controllers/
# kube-prometheus-stack.yaml (6b.5) registered. ingress-logs.yaml (6b.9) needs
# no CRD either - a plain Ingress, the same reason dashboards/ lives here
# rather than in ../controllers - and is a single file rather than a
# directory because it is one object, the same shape 5b.9's own Ingresses
# take. static-monitors-configmap.yaml and ingress-status.yaml are 6b.12's,
# same reasoning. provisioning/ (6b.11) needs no CRD either, and holds two
# plain objects - a ConfigMap and a CronJob - for the same reason
# dashboards/ lives here rather than in ../controllers: they are content
# this layer applies once ../controllers has registered what it needs to,
# not plumbing a HelmRelease mounts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - scrape/
  - dashboards/
  - alerts/
  - provisioning/
  - ingress-logs.yaml
  - static-monitors-configmap.yaml
  - ingress-status.yaml
