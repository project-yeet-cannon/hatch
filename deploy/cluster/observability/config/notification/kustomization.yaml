# Layer 2's sixth tenant - see ../kustomization.yaml. One file, holding the
# Provider/Alert pair that turns a Flux reconcile into a Grafana annotation
# (docs/plans/deploy-observability.md 1.3).
#
# Its objects are flux-system objects, not observability ones, and that is not
# an accident of where the file sits: an Alert has to live beside the Provider
# it names, and the Provider has to live beside the Secret it reads. What
# makes this directory the right home anyway is what the pair is *for* - it
# exists to write to Grafana, and it is reviewed alongside the dashboards that
# render what it writes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana-annotations.yaml
