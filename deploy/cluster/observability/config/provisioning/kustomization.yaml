# The cluster plan Phase 6b.11 - the three OpenSearch provisioning scripts as
# a ConfigMap, and the CronJob that mounts it. ./kuma-provision.yaml (6b.13,
# still to come) is this directory's second tenant, the same shape one layer
# over Uptime Kuma instead of OpenSearch.
#
# The three .sh files here are real copies of
# ../../../../../containers/opensearch-provision/*.sh (which stay in place,
# unedited, for compose.observability.yml until Phase 7 deletes it) rather
# than strings embedded in ./opensearch-provision.yaml - the same call
# ../../controllers/fluent-bit.yaml makes for its own Lua script, and for the
# same reason: a copy pasted into YAML is the kind of thing that drifts from
# the file everyone actually greps for. They are not identical to the
# compose originals - ./apply-index-template.sh and ./apply-ism-policy.sh
# each carry one edit of their own, documented in their own header comments.
#
# disableNameSuffixHash: true, the same reason ../dashboards/kustomization.yaml
# gives for its own generators: ./opensearch-provision.yaml's
# volumes.configMap names this ConfigMap statically, so a hashed suffix would
# only orphan the previous revision on every script edit instead of updating
# it in place.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - opensearch-provision.yaml
configMapGenerator:
  - name: opensearch-provision-scripts
    namespace: observability
    files:
      - apply-ism-policy.sh
      - apply-index-template.sh
      - create-index-pattern.sh
    options:
      disableNameSuffixHash: true
