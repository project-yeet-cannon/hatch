# The cluster plan Phase 6a.4 and 6b.4 - the two admin logins this phase
# ships, and why they are committed in the clear rather than routed through
# ESO.
#
# docs/ethos.md rules out shipping *one installation's* password to every
# other operator: a string that looks bespoke, that nobody is prompted to
# change, and that therefore silently becomes shared - which is what
# compose.observability.yml's committed AUTOKUMA__KUMA__PASSWORD is. The fix
# here is not secrecy: two new admin accounts on systems nobody has logged
# into yet do not justify two more required repository secrets on an account
# nobody has set up. Both ship a **known default** in `stringData` so it is
# readable as written rather than base64 that has to be decoded to be
# reviewed - the router-login model, changed by each operator from the UI
# whenever they get to it, not the shipped-shared-secret shape the ethos rule
# is aimed at.
#
# The two defaults are not the same string, and that is deliberate rather than
# an oversight. Grafana's login takes `password`; Kuma's cannot. Uptime Kuma
# 2.x runs every candidate through check-password-strength and refuses
# anything it rates "Too weak" (`passwordTooWeak`), and "Weak" - the lowest
# grade it accepts - needs 8 characters drawn from 2 of {lowercase,
# uppercase, number, symbol}. `password` is 8 characters of a single class,
# so it fails that gate and the admin account is never created at all. What
# that looked like in practice was not an error about a password: AutoKuma's
# initContainer crash-looped, observability-controllers never went Ready, and
# observability-config - which carries the opensearch-provision CronJob and
# status.${DOMAIN}'s Ingress - was never applied at all. Keep any replacement
# above that bar.
#
# The security implication is accepted knowingly: anyone who can reach
# status.${DOMAIN} or metrics.${DOMAIN} before an operator changes these can
# log in as admin. Both are LAN-only hostnames on the internal VIP; if either
# is ever published beyond the LAN, changing both is a prerequisite of
# publishing, not a follow-up.
#
# The two accounts do not behave the same way after that change, and this is
# the one thing worth knowing before making it:
#
#   - Grafana's is safe to change in the UI and forget. The chart seeds the
#     admin user only when its database is first created, so a password
#     changed later persists across restarts and across Flux re-applying
#     this Secret with the old value still in it - the Secret goes stale and
#     nothing reads it again.
#   - Kuma's is not. AutoKuma (6b.12) and the kuma-provision CronJob (6b.13)
#     both log in with this password on every reconcile, reading it from the
#     Secret below - not from Kuma's own database. Changing it in Kuma's UI
#     alone leaves this file saying the old value, and AutoKuma stops
#     converging monitors while kuma-provision starts exiting non-zero - an
#     authentication failure that presents as monitors quietly not
#     appearing. Changing Kuma's password is therefore two edits: the UI,
#     and `password` below, in the same commit.
#
# compose.observability.yml keeps using its own committed credential
# (aerie-kuma-admin!23) until Phase 7 deletes the compose files - do not
# bring that value across. Rotating a live Kuma's admin password there would
# leave its SQLite database disagreeing with the compose file for a system
# that is being deleted anyway.
apiVersion: v1
kind: Secret
metadata:
  name: kuma-admin
  namespace: observability
type: Opaque
stringData:
  # Read by AutoKuma (6b.12) and the kuma-provision CronJob (6b.13) on every
  # reconcile - see the comment above before rotating this, and keep any
  # replacement past Kuma 2.x's "Too weak" gate.
  password: changeme1
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
type: Opaque
stringData:
  # The pair kube-prometheus-stack's admin.existingSecret expects (6b.5).
  # Safe to change from Grafana's own UI and forget - see the comment above.
  admin-user: admin
  admin-password: password
