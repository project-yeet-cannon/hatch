# The cluster plan Phase 6b.12 - Uptime Kuma as a plain Deployment, Service
# and PVC, not a community chart. Kuma is one container, one volume and one
# Service; a third-party chart for that is dependency surface bought for
# nothing, in a tree whose stated rule (re-scope preamble) is that deploy/
# holds objects directly.
#
# strategy: Recreate, not the default RollingUpdate. Kuma's state is SQLite
# on one RWO Longhorn volume below - a rolling update starts the new pod
# before the old one releases the volume, so the new pod hangs on attach
# until the rollout times out, presenting as an upgrade that never finishes
# rather than as the storage conflict it actually is.
#
# UPTIME_KUMA_DB_TYPE=sqlite carries across from
# compose.observability.yml:16-19's own comment: without it the first-run
# setup HTTP server blocks until a human picks a database in a browser, and
# the Socket.IO API ../config/provisioning/kuma-provision.yaml (6b.13) and
# this file's own autokuma.yaml talk to never starts.
#
# Image pinned to 2.4.0-slim, the exact tag compose.observability.yml already
# runs. No securityContext beyond seccompProfile/capabilities: the upstream
# Dockerfile (docker/dockerfile in louislam/uptime-kuma) only adds `USER
# node` on its "-rootless" build targets, not the plain release this tag
# comes from - forcing runAsNonRoot on an image built to run as root is a
# CreateContainerConfigError risk this file is not prepared to verify, unlike
# charts/aerie's own images where that was rendered and confirmed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: observability
  labels:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/instance: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
      app.kubernetes.io/instance: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
        app.kubernetes.io/instance: uptime-kuma
    spec:
      # 6b.14's PriorityClass.
      priorityClassName: aerie-observability
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.4.0-slim
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: UPTIME_KUMA_DB_TYPE
              value: sqlite
          ports:
            - name: http
              containerPort: 3001
          # 5a.6-shaped: requests from the observed 151MiB, limits at 2x -
          # the phase-6 sizing table's uptime-kuma row.
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              memory: 384Mi
          # Kuma's SPA root answers plain HTTP over the same port its
          # Socket.IO API uses - cheap enough to probe directly rather than
          # relying only on the container's own Docker HEALTHCHECK, which
          # kubelet never reads.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
---
# Small and critical rather than bulk - the same reasoning
# ../controllers/kube-prometheus-stack.yaml gives for Alertmanager's volume:
# what this holds is monitor definitions, heartbeat history and the
# Watchdog push token's owning monitor, none of which AutoKuma's
# reconciliation from ../config/static-monitors-configmap.yaml (6b.12)
# can fully rebuild - notification config and history are Kuma-only state.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: observability
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-r3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: observability
  labels:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/instance: uptime-kuma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/instance: uptime-kuma
  ports:
    - name: http
      port: 3001
      targetPort: http
