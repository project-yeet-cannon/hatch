# The cluster plan Phase 6b.5 - Prometheus, its operator and CRDs, Alertmanager,
# Grafana, node-exporter and kube-state-metrics, as one pinned HelmRelease. The
# largest single object in this phase, and most of its length is turning things
# off or pointing them at objects 6b.6-6b.8 add.
#
# No Namespace here, unlike ../../infrastructure/controllers/longhorn.yaml and
# cloudnative-pg.yaml: `observability` already exists, created by
# ../../infrastructure/config/namespaces.yaml in infra-config - see this
# directory's own kustomization.yaml for why it has to live there rather than
# here. This chart does not create one of its own either; it installs into
# whatever `.Release.Namespace` is, which the HelmRelease below sets.
#
# Several things read from ../../infrastructure/config/aerie-cluster-config,
# all already required by the time this file lands: WINDOWS_EXPORTER_TARGETS
# is 6b.6's, not this file's; kubeEtcd.endpoints below (K3S_SERVER_ADDRESSES)
# is this release's own substitution; HA_HOST, HA_PORT and
# HA_ALERT_WEBHOOK_ID (6b.8, below) are the Alertmanager receiver's. See
# scripts/k3s/cluster-config.json's K3S_SERVER_ADDRESSES entry for why that
# value is a bare IP list with no port, unlike WINDOWS_EXPORTER_TARGETS'
# host:port pairs; HA_HOST and HA_PORT are separate scalar keys, combined into
# one URL only in the webhook_configs.url below.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: observability
spec:
  # As everywhere else in this tree: the poll only discovers new versions, and
  # the release below names one exactly, so nothing moves until a commit does.
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      # 88.3.0, appVersion v0.93.0 (the prometheus-operator release, which is
      # what actually matters for CRD compatibility). Not the newest chart at
      # the time this was pinned - 88.5.0 was one day old and 88.4.0 a few
      # hours older than that - which is the same call
      # ../../infrastructure/controllers/longhorn.yaml's own comment makes
      # about a 1.12.1 that was a day old when its table was written: a chart
      # this size (Prometheus, Alertmanager, Grafana, three subcharts and
      # eleven CRDs in one release) is not where this repo spends its first
      # week of soak on a line. kubeVersion is '>=1.25.0-0', comfortably under
      # the v1.35.7+k3s1 pin in scripts/versions.json.
      version: 88.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  # Heavier than ../../infrastructure/controllers/cloudnative-pg.yaml's 4m -
  # this pulls images for the operator, Prometheus, Alertmanager, Grafana, the
  # config-reloader sidecar, kube-state-metrics and node-exporter, on top of
  # eleven CRDs' worth of OpenAPI schema - but well short of
  # ../../infrastructure/controllers/longhorn.yaml's 8m/12m, since nothing here
  # is a privileged DaemonSet with instance-manager's image weight. 10m leaves
  # 5m of margin inside observability-controllers' own 15m timeout.
  timeout: 10m
  install:
    # 1, not ../../infrastructure/controllers/longhorn.yaml's 0. The CRDs live
    # under this chart's crds/ subchart directory (charts/crds/crds/*.yaml),
    # which is Helm's native CRD mechanism - installed once on `helm install`
    # and never touched by `helm upgrade` or `helm uninstall`, with no
    # resource-policy annotation needed because Helm does not delete from that
    # directory at all. A remediated failed install therefore cannot take the
    # CRDs, or the ServiceMonitors/PodMonitors/PrometheusRules 6b.6 and 6b.8
    # write as instances of them, with it - the same low blast radius
    # ../../infrastructure/controllers/cloudnative-pg.yaml's note 4 describes
    # for its own (differently-delivered) CRDs, which is what makes retries:1
    # the right default here rather than Longhorn's exception.
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    cleanupOnFail: true
  values:
    # -------------------------------------------------------------------
    # CRDs - this step's exit criterion
    # -------------------------------------------------------------------
    crds:
      # Already the chart default, written out for the reason
      # ../../infrastructure/controllers/cloudnative-pg.yaml's crds.create
      # comment gives for its own: a default flipped upstream would take
      # every CRD instance in this phase in a version bump that reads as
      # routine.
      enabled: true

    # -------------------------------------------------------------------
    # Default rules that this installation replaces rather than keeps
    # -------------------------------------------------------------------
    # docs/plans/part-time-node.md 5.1. One host in this installation belongs
    # to a person, and on the evenings they take it back its node is supposed
    # to be gone. These two rules are the ones that would page about it, and
    # neither has any way to be told that an absence was asked for - their
    # expressions are over `kube_node_status_condition` and
    # `kube_node_spec_taint` with no hook for an exclusion.
    #
    # So they are disabled here and re-stated in
    # ../config/alerts/cluster.yaml's `part-time-node` group with one clause
    # added: `unless on(node) kube_node_labels{...personal_mode="true"}`. The
    # re-statement is deliberately otherwise identical, including the 15m
    # hold, so a node that is down *without* the label still produces exactly
    # the alert it produces today. That is the other half of 5.1's exit
    # criterion, and the half worth being careful about: the failure mode of
    # getting this wrong is silence about a node that really did die.
    #
    # Disabling a chart rule rather than editing it is the only mechanism
    # available - the rules come from the chart's own templates, and an edit
    # would be reverted on the next reconciliation.
    #
    # What this does NOT cover, named here rather than discovered on an
    # evening: `TargetDown`. It aggregates `up` by job/namespace/service and
    # carries no node label at all, so with four nodes one absent kubelet is
    # 25% of that job's targets and it fires. It cannot be excluded the same
    # way for want of anything to join on, and it is too useful a rule to
    # disable outright, so it is left alone - a personal-mode evening still
    # produces that one alert until it is dealt with on its own terms.
    defaultRules:
      disabled:
        KubeNodeNotReady: true
        KubeNodeUnreachable: true

    # -------------------------------------------------------------------
    # The k3s control-plane scrapes - 6b.1's other half
    # -------------------------------------------------------------------
    # kube-scheduler, kube-controller-manager and kube-proxy all bind to
    # loopback on k3s (they run inside the single k3s server process, not as
    # separate pods with their own IPs), so the chart's default ServiceMonitors
    # for them can never find a target. Left enabled that is three permanently
    # down targets and their TargetDown alerts on day one - exactly the alarm
    # noise the re-scope preamble (docs/plans/swarm/phase-6-observability.md)
    # names as the thing that trains an operator to ignore real alerts. The
    # node's own Ready condition already reports the one failure mode these
    # three could add on top of etcd - see the preamble for why etcd is the
    # exception rather than a fourth entry here.
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false

    # etcd stays enabled, pointed at the two ports 6b.1's
    # etcd-expose-metrics config.yaml change opened. Verified against this
    # pinned chart version (not copied from a blog post, per the cluster
    # plan's own instruction): kubeEtcd.endpoints still renders a literal
    # `Endpoints` object from a bare IP list
    # (templates/exporters/kube-etcd/endpoints.yaml), and there is no
    # label-selector alternative to fall back to - k3s's embedded etcd is not
    # a pod, so there is nothing with a label to select. That is what
    # K3S_SERVER_ADDRESSES in scripts/k3s/cluster-config.json exists for.
    # kubeEtcd.service.port (2381, the chart default) supplies the port this
    # Endpoints object and its ServiceMonitor both use - K3S_SERVER_ADDRESSES
    # carries no port of its own.
    kubeEtcd:
      enabled: true
      endpoints: ${K3S_SERVER_ADDRESSES}

    # -------------------------------------------------------------------
    # The five selector settings, which are the ones everybody gets wrong
    # -------------------------------------------------------------------
    # Left at their chart default of true, Prometheus selects only objects
    # carrying this release's own Helm labels - so every hand-written
    # ServiceMonitor/PodMonitor/ScrapeConfig 6b.6 adds and every
    # PrometheusRule 6b.8 adds is silently ignored: no error, no event, no
    # target, just a metric or an alert that never appears. Since this
    # phase's entire scrape and alerting design is hand-written objects (the
    # re-scope preamble's first bullet), these five lines are load-bearing
    # for all of it. Four are the ones the cluster plan names explicitly;
    # ruleSelectorNilUsesHelmValues is a fifth of the identical shape,
    # governing 6b.8's PrometheusRules the same way the other four govern
    # 6b.6's scrape objects, and left off this list only by omission there.
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false

        # -----------------------------------------------------------------
        # Storage - see the sizing section's "prometheus" row and its note
        # -----------------------------------------------------------------
        # A StatefulSet's volumeClaimTemplates is immutable: getting the
        # class or the size wrong here is not an edit, it is deleting the
        # StatefulSet with --cascade=orphan and letting the operator rebuild
        # it. longhorn-r2 (bulk, 2 replicas, loss tolerable) per the storage
        # split - metrics and logs age out by design, unlike Grafana's own
        # dashboards below.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-r2
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        retention: 30d
        # ~80% of the 20Gi volume above. Retention by time alone on a fixed
        # volume means the disk decides, and Prometheus's answer to a full
        # disk is to stop ingesting - retentionSize is what makes 30d the
        # thing that actually governs, rather than a number the disk
        # overrides first.
        retentionSize: 16GiB

        # 6b.14's PriorityClass. Covers the config-reloader sidecar the
        # operator injects into this same pod too - priority is pod-scoped,
        # not per-container, so prometheusConfigReloader.resources below
        # needs no matching priorityClassName of its own.
        priorityClassName: aerie-observability

        # The sizing table's estimate, not this cluster's own measurement -
        # kube-prometheus-stack additionally scrapes kube-state-metrics,
        # kubelet cAdvisor, Longhorn and Flux at several times a compose
        # project's cardinality. Re-measure once it has a week of retention
        # behind it; this is the one workload in this phase whose request
        # the sizing section names as one to revisit rather than set once.
        resources:
          requests:
            cpu: 20m
            memory: 512Mi
          limits:
            memory: 1.5Gi

    # -------------------------------------------------------------------
    # Alertmanager - 6b.8's receiver, route and Watchdog wiring
    # -------------------------------------------------------------------
    #
    # The cluster plan Phase 8b.12 - what this route was proven to do, and the
    # one operating rule that is not expressible as configuration.
    #
    # **Proven 2026-08-24, through the route rather than around it.** A
    # hand-built alert (`AerieAlertPipelineTest`, severity critical) was POSTed
    # to /api/v2/alerts, took the default route below, and reached Home
    # Assistant: the automation behind ${HA_ALERT_WEBHOOK_ID} recorded a
    # trigger 34s later - `group_wait: 30s`, visible - and a second one when
    # the alert aged past its endsAt, which is what makes `send_resolved:
    # true` a fact rather than a setting. 8a.5 had already proved the
    # automation notifies a phone; this is the half between Prometheus and
    # that webhook, which 8a.5 deliberately did not cover.
    #
    # The resolved notification arrived **five minutes** after the firing one,
    # to the second, rather than when the alert expired: a resolution is
    # delivered on the group's next flush, so `group_interval` below is the
    # floor on how long "it cleared" takes to arrive. Worth knowing before
    # someone reads a 4-minute-old RESOLVED as a stuck alert.
    #
    # **severity is not decoration on the receiving end.** The automation
    # renders `CRITICAL: <alertname>` with an iOS `time-sensitive`
    # interruption level when commonLabels.severity is critical, `<SEVERITY>:
    # <alertname>` at normal priority otherwise, and `RESOLVED: <alertname>`
    # when status is resolved - so the split between ../config/alerts/'s
    # criticals and warnings survives the trip. That automation lives in Home
    # Assistant, not in this repository, which is why it is described here:
    # nothing in the tree would otherwise tell a reader that the label has a
    # consumer.
    #
    # **Silence by `alertname`, never by receiver.** This is the discipline
    # Phase 7 handed to 8b.12, and the reason to write it down is that the
    # wrong button is the easier one: silencing `receiver="home-assistant"`
    # for a maintenance window is one matcher and it eats *every* alert,
    # including the backup-age rule that the window is precisely when you
    # would want to keep. A Longhorn upgrade silences
    # `alertname=~"Longhorn.*"`; a database migration silences `alertname=~
    # "CNPG.*"`. Both leave the other paths armed.
    #
    # **A standing failure worth knowing about while reading these
    # counters.** `alertmanager_notifications_failed_total{integration=
    # "webhook", reason="clientError"}` has been climbing every five minutes
    # since the Watchdog route was created: Kuma answers the push URL below
    # with `404 {"ok":false,"msg":"Monitor not found or not active."}`, so the
    # dead-man's switch 6b.12 built has never once completed a cycle. It is
    # not silent - it surfaces as the chart's own
    # `AlertmanagerFailedToSendAlerts`, firing into the route above - but it
    # is a Phase 6 repair rather than a Phase 8 one, and it is in Phase 8's
    # manual list rather than fixed here.
    alertmanager:
      config:
        route:
          receiver: home-assistant
          group_by: ["alertname", "severity"]
          group_wait: 30s
          group_interval: 5m
          # Hours, not minutes: ../config/alerts/'s own `for: 15m`/`for: 30m`
          # holds are already what keeps this from paging on a transient: a
          # short repeat_interval on top of that would just re-page for
          # something already acknowledged.
          repeat_interval: 4h
          routes:
            # The chart's own Watchdog alert (always firing, existing only to
            # prove the pipeline works) is deliberately NOT left on the
            # default route - every repeat_interval would otherwise page a
            # human to say nothing is wrong. Routed instead to
            # ./static-monitors-configmap.yaml's (6b.12) Kuma push
            # monitor: as long as this fires, Kuma stays green; if Prometheus,
            # this rule evaluation or Alertmanager itself dies, the pushes
            # stop and Kuma's own Home Assistant notification takes over -
            # the newer path proving itself over this older one, which is
            # most of the argument the re-scope preamble owed for keeping
            # both.
            #
            # repeat_interval overridden on this route alone - the parent's
            # 4h would make this a dead-man's switch with a 4-hour blind spot,
            # defeating the point. static-monitors-configmap.yaml's
            # watchdog.toml sets Kuma's own interval/retries to tolerate this
            # cadence without false-positiving on ordinary jitter.
            #
            # group_interval is overridden *with* it, and that pairing is the
            # whole point rather than a tidy-up. Alertmanager re-evaluates
            # repeat_interval only on group_interval ticks, and the test in
            # its dedup stage is `entry.Timestamp.Before(now - repeat)` where
            # the nflog entry's timestamp is written a few milliseconds after
            # the flush that sent it. So when repeat_interval equals
            # group_interval, the tick at exactly one interval later fails
            # that comparison by those milliseconds and the notification slips
            # to the following tick: `repeat_interval: 5m` under the parent's
            # `group_interval: 5m` delivered a push every **ten** minutes, not
            # five. Kuma's monitor tolerates 300s + 3 x 60s = 486s, so the
            # Watchdog went red for about two minutes out of every ten from
            # the day this route started working until 2026-08-25 - the
            # dead-man's switch flapping on its own cadence rather than on
            # anything it was watching.
            #
            # 1m/2m rather than a smaller equal pair: the quantization applies
            # to any repeat_interval that is an exact multiple of
            # group_interval, so these are deliberately not one - the push
            # lands on the 3m tick, every 3m, roughly a third of Kuma's
            # tolerance. Keep that ratio if either number is ever retuned; the
            # failure it prevents is invisible in the rendered config, which
            # says 5m either way.
            - receiver: kuma-watchdog
              group_interval: 1m
              repeat_interval: 2m
              matchers:
                - alertname = "Watchdog"

            # `InfoInhibitor` is not an alert about anything. It is the
            # chart's plumbing for suppressing severity=info alerts - it
            # fires whenever an info alert exists in a namespace that has no
            # warning or critical alert, and exists only to be the *source*
            # side of the third inhibit rule below. Its own rule annotation
            # says so: "This alert should be routed to a null receiver and
            # configured to inhibit alerts with severity=info". Its label is
            # `severity: none`, which is why it arrives on a phone as
            # "NONE: InfoInhibitor" - the receiving automation's
            # `<SEVERITY>: <alertname>` branch, described above, doing
            # exactly what it was told.
            #
            # Upstream never needs this route because upstream's default
            # receiver is `null`: the chart ships route.receiver: 'null' and
            # a single no-op receiver, so nothing notifies and this leak is
            # invisible. This installation's default receiver is a phone, so
            # every chart alert not routed elsewhere pages - which is the
            # intent for real alerts and wrong for this one.
            #
            # The chart's *other* backstop, a fourth inhibit rule with no
            # source matchers at all (`target_matchers: [alertname =
            # InfoInhibitor]`, merged in from chart defaults since this file
            # overrides `route` and `receivers` but not `inhibit_rules`), is
            # supposed to make the always-firing Watchdog inhibit this. It
            # does not work on Alertmanager 0.33.1, and the reason is worth
            # writing down so nobody deletes this route believing that rule
            # covers them. 0.33 replaced the source-cache scan in
            # `InhibitRule.hasEqual` with a fingerprint index keyed on the
            # rule's `equal` labels. That rule has no `equal` labels, so the
            # key is a constant and the whole index collapses to one slot
            # holding whichever source alert most recently had the larger
            # EndsAt. Watchdog and InfoInhibitor are both refreshed every
            # evaluation with near-identical EndsAt, so the slot flip-flops
            # between them, and on the ticks where InfoInhibitor holds it the
            # rule's own two-sided-match guard (`excludeTwoSidedMatch &&
            # TargetMatchers.Matches(equal.Labels)`) sees the alert inhibiting
            # itself and returns "not inhibited". That coin flip is what made
            # this arrive *occasionally* rather than every time.
            #
            # A route is not subject to any of that: it is evaluated before
            # inhibition and does not depend on what else is firing.
            - receiver: blackhole
              matchers:
                - alertname = "InfoInhibitor"
        receivers:
          # No configs of any kind: an Alertmanager receiver with no
          # integrations is the documented way to spell "drop this", and is
          # what the chart's own default `null` receiver is. Named
          # `blackhole` rather than `null` because unquoted `null` is a YAML
          # keyword and this file's other receiver names are bare.
          - name: blackhole
          - name: kuma-watchdog
            webhook_configs:
              # The URL Kuma generates for a push monitor is normally only
              # knowable after Kuma creates it - static-monitors-configmap.yaml's
              # watchdog.toml pins the 32-character push_token AutoKuma passes
              # through instead, so this URL is a fact of that file rather
              # than a value someone copies out of Kuma's UI after the fact.
              # Same-namespace bare Service name, like
              # ../controllers/autokuma.yaml's AUTOKUMA__KUMA__URL.
              # send_resolved: false - this alert is not meant to resolve in
              # normal operation, and Kuma's push route ignores the request
              # body regardless (status/msg/ping come from the query string).
              - url: "http://uptime-kuma:3001/api/push/vWtpuKK1o4q60Nrm5s04glSM7umvtI4A?status=up&msg=OK"
                send_resolved: false
          - name: home-assistant
            webhook_configs:
              # 6a.3's Home Assistant automation. HA_HOST/HA_PORT are 6b.3's,
              # made required for exactly this consumer; HA_ALERT_WEBHOOK_ID
              # is the same step's third key. Not authenticated with 6b.2's
              # home-assistant/token Secret: a Home Assistant webhook
              # automation's id is itself the capability grant, and 6a.3 did
              # not also set the automation up to demand a bearer token - that
              # Secret stays 6b.13's alone unless the automation changes to
              # require one.
              - url: "http://${HA_HOST}:${HA_PORT}/api/webhook/${HA_ALERT_WEBHOOK_ID}"
                send_resolved: true
      alertmanagerSpec:
        # 1Gi on longhorn-r3 (critical, 3 replicas) rather than r2's bulk
        # class: what this volume holds is silences, and losing those to a
        # reschedule means every alert someone deliberately quieted re-fires
        # at once.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-r3
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        priorityClassName: aerie-observability

    # -------------------------------------------------------------------
    # Grafana
    # -------------------------------------------------------------------
    grafana:
      # 6b.14's PriorityClass - covers the dashboard sidecar and the
      # datasources sidecar below too, both in this same pod.
      priorityClassName: aerie-observability

      # docs/plans/deploy-observability.md 1.1 - the GitHub datasource the
      # Delivery dashboard's CI row reads from.
      #
      # This is the one thing in this phase that makes a Grafana pod's start
      # depend on the internet: the plugin binary is fetched from grafana.com
      # at startup. That is the dependency
      # ../config/dashboards/kustomization.yaml deliberately avoided for
      # dashboards by committing their JSON instead - a dashboard is data and
      # can be, a datasource backend is a binary and cannot. The failure mode
      # is a Grafana that will not start while grafana.com is unreachable,
      # which is worth knowing before a rebuild during an outage.
      #
      # Verified against this pinned chart (88.3.0, grafana subchart 12.10.4,
      # Grafana 13.1.3) rather than assumed, because the mechanism moved and
      # every older write-up names the one that is gone: `plugins` renders
      # into the `plugins` key of the `kube-prometheus-stack-grafana`
      # ConfigMap, which the grafana container reads as
      # **GF_PLUGINS_PREINSTALL_SYNC** - Grafana's own synchronous preinstall,
      # not the GF_INSTALL_PLUGINS/grafana-cli path it replaced. Anything
      # checking that this took effect has to look at the ConfigMap key, not
      # for an env var holding the list.
      #
      # Changing this list changes that ConfigMap and the pod's config hash, so
      # the pod rolls - which is also what makes the datasource below get read:
      # provisioning files are parsed at startup, and the datasources sidecar's
      # own reload call (REQ_URL .../api/admin/provisioning/datasources/reload)
      # covers the case where only that ConfigMap changed.
      plugins:
        - grafana-github-datasource

      # The PAT the datasource authenticates with, bound as an env var rather
      # than written into the provisioning ConfigMap below - that ConfigMap is
      # rendered by this chart in the clear and would put a credential in
      # `kubectl get cm -o yaml`. Grafana interpolates $__env{NAME} when it
      # reads a provisioning file, which is the supported way in.
      #
      # Not prefixed GF_: an env var of the shape GF_<SECTION>_<KEY> is read by
      # Grafana as a grafana.ini override, and GF_GITHUB_TOKEN would silently
      # invent a [github] section rather than staying an ordinary variable.
      #
      # github-datasource is 3b.6's ExternalSecret (parameters.json,
      # github/read-token). A missing Secret is a Grafana pod stuck in
      # CreateContainerConfigError, not a datasource that quietly 401s.
      envValueFrom:
        GITHUB_DATASOURCE_TOKEN:
          secretKeyRef:
            name: github-datasource
            key: token
      admin:
        # admin/password until changed from Grafana's own UI - 6a.4 and
        # 6b.4's admin-secrets.yaml carry the full reasoning. userKey and
        # passwordKey are left at the chart's own defaults (admin-user,
        # admin-password), which is exactly the pair grafana-admin holds.
        existingSecret: grafana-admin
      persistence:
        enabled: true
        storageClassName: longhorn-r3
        size: 2Gi
      "grafana.ini":
        server:
          # Grafana builds absolute URLs for redirects and share links from
          # this. Wrong, and OAuth-less logins still work while half the UI
          # links to localhost:3000 - the failure is silent enough to not be
          # worth discovering by clicking around metrics.${DOMAIN} after the
          # fact.
          root_url: https://metrics.${DOMAIN}
      ingress:
        # No ingressClassName: k3s's bundled Traefik is the cluster's only
        # IngressClass and is marked default, the same reliance
        # ../../infrastructure/config/traefik-tlsstore.yaml's default
        # certificate depends on. No tls: block, for the same reason 6b.9's
        # ingress-logs.yaml gives in full: the wildcard Certificate's Secret
        # lives in kube-system as Traefik's TLSStore default, and every
        # Ingress in the cluster inherits it without naming it.
        enabled: true
        hosts:
          - metrics.${DOMAIN}
      sidecar:
        dashboards:
          # Already the chart's own default (an override of the raw grafana
          # subchart's enabled: false), written out because 6b.7's ConfigMaps
          # depend on it: searchNamespace: ALL is what lets a dashboard
          # ConfigMap live in the observability namespace and still be found,
          # since the sidecar otherwise only watches its own.
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
        # Shared across every sidecar container the chart enables - today
        # that is only the dashboards watcher above, since the Prometheus
        # datasource below is provisioned a different way (no sidecar).
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
      # No *Prometheus* datasource values here, deliberately:
      # sidecar.datasources.enabled and its uid: prometheus are already the
      # chart's own defaults, and uid: prometheus is exactly the fixed uid
      # 6b.7's windows-exporter dashboard was pinned against - carried across
      # unchanged rather than rewritten. Do not port the compose stack's
      # grafana/provisioning/datasources/prometheus.yml (deleted in 7b.9, in
      # git history), which points at a compose service name and would install
      # a second, broken datasource beside the working one.
      #
      # additionalDataSources is that same mechanism rather than a second one,
      # which is the whole reason the GitHub datasource is declared here and
      # not as a hand-written ConfigMap in ../config: the chart renders this
      # list into the same `grafana_datasource: "1"` ConfigMap the Prometheus
      # entry above lands in, and the sidecar that already watches for it
      # picks both up together. Two provisioning mechanisms for one Grafana is
      # how a datasource ends up defined twice with different uids.
      #
      # uid is pinned, not generated: ../config/dashboards/delivery.json
      # references `github` by uid the same way every other dashboard here
      # references `prometheus`, and a generated uid would make that dashboard
      # unloadable on a rebuild.
      #
      # $__env{} is Grafana's own interpolation, not Flux's, and it survives
      # postBuild untouched because Flux only substitutes ${...} - a bare
      # `$name` is plain text to it (fluxcd/pkg/envsubst's scanner only enters
      # a substitution when `$` is immediately followed by `{`). No escaping,
      # and deliberately none: `$$__env` would reach Grafana as a literal
      # `$__env` only by accident of two mechanisms cancelling out.
      #
      # No `owner`/`repository` here, because the plugin's settings have no
      # such fields - every query carries its own, which is why
      # ../config/dashboards/delivery.json takes them as dashboard variables
      # fed from AERIE_REPO_OWNER/AERIE_REPO_NAME. An Explore query against
      # this datasource has to name them by hand.
      additionalDataSources:
        - name: GitHub
          uid: github
          type: grafana-github-datasource
          # A backend datasource: Grafana proxies every request itself, so
          # there is no `access` or `url` to set and the browser never talks
          # to api.github.com.
          jsonData:
            # Set explicitly even though the plugin infers it from the
            # presence of accessToken - the inference is a compatibility
            # path for datasources created before GitHub App auth existed,
            # and relying on it makes this file's meaning depend on the
            # plugin keeping that path.
            selectedAuthType: personal-access-token
          secureJsonData:
            accessToken: $__env{GITHUB_DATASOURCE_TOKEN}
          # Provisioned, so the UI must not let it be edited into something
          # this file no longer describes.
          editable: false
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 512Mi

    # -------------------------------------------------------------------
    # The rest of the sizing table - the workloads the chart hides
    # -------------------------------------------------------------------
    prometheusOperator:
      priorityClassName: aerie-observability
      # The webhook cert-gen Job the operator's admission webhook wires up
      # (helm.sh/hook: pre-install,pre-upgrade) - a separate pod outside the
      # operator's own Deployment, and priorityClassName is pod-scoped, so
      # it needs this instead of inheriting the line above.
      admissionWebhooks:
        patch:
          priorityClassName: aerie-observability
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi
      # The config-reloader sidecar the operator injects into every
      # Prometheus and Alertmanager pod - one setting, shared by both, and
      # easy to miss because it is not under prometheus.prometheusSpec or
      # alertmanager.alertmanagerSpec where the main containers' requests
      # live. Not in the sizing table (which only names the workloads that
      # existed on the old host or are single objects the table could point
      # at); the chart's own commented-out suggestion is the number used
      # here, flagged the same way the sizing section flags its own
      # estimates - for 6b.14's sweep to check against reality.
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    kube-state-metrics:
      priorityClassName: aerie-observability

      # docs/plans/part-time-node.md 5.1. kube-state-metrics stopped exporting
      # node labels by default in v2 - `kube_node_labels` exists but carries
      # only the identity labels unless a resource is named here - so this one
      # line is what makes "is this node away on purpose" expressible as a
      # PromQL join at all. Without it the exclusion in
      # ../config/alerts/cluster.yaml's `part-time-node` group matches nothing
      # and every rule in it behaves exactly like the chart's own, which is a
      # silent no-op rather than an error.
      #
      # One resource, one label, on purpose. Node labels are unbounded
      # cardinality - kubelet, k3s and Longhorn all write onto the same object
      # - and an allowlist of `nodes=[*]` would put every one of them on a
      # metric that joins against half the node rules in the cluster.
      #
      # `aerie.family/availability` joins it for 5.3's dashboard, which has to
      # be able to say *which* node is the part-time one when nobody is using
      # it - `personal-mode` is absent at exactly the moment that question is
      # being asked. Both are two-valued and written by
      # scripts/k3s/Install-K3sNode.ps1's -NodeLabel or by
      # Set-PersonalMode.ps1, so neither adds cardinality that grows.
      metricLabelsAllowlist:
        - nodes=[aerie.family/personal-mode,aerie.family/availability]

      # docs/plans/deploy-observability.md 1.2 - the one hop of the delivery
      # chain Prometheus could not otherwise see.
      #
      # `kubectl get imagepolicy` shows the tag image-reflector-controller
      # selected; nothing exports it. Flux's own controllers publish
      # gotk_reconcile_condition (Ready/not Ready) and nothing about the
      # *value* an object settled on, so a dashboard can say the ImagePolicy
      # is healthy and still not say which tag it picked - which is exactly
      # the question "has my commit been selected yet" asks. CustomResourceState
      # is kube-state-metrics' supported answer: a dynamic informer over a
      # named GVK, rendering chosen JSON paths as labels.
      #
      # Scoped as tightly as it goes: one GVK, two objects
      # (../../apps/automation/image-policies.yaml), one Info metric each. No
      # ConfigMap entry beside it, though the `aerie-image-tags` hop is the
      # other half of the same question - CustomResourceState has no field or
      # name selector, so watching ConfigMaps means emitting a `tag` label for
      # every ConfigMap in the cluster and dropping all but one in
      # metricRelabelings. docs/plans/deploy-observability.md 3.3's
      # Show-Delivery.ps1 reads that ConfigMap directly, which is the right
      # tool for a hop nobody needs a time series of.
      #
      # No `namespace` label: both ImagePolicies live in flux-system and
      # `name` alone identifies them, which also sidesteps the
      # namespace/exported_namespace collision Finding 6 documents for the
      # Flux PodMonitor. This chart's ServiceMonitor sets honorLabels: true,
      # so a `namespace` label here would have won rather than been renamed -
      # the opposite convention to ../config/scrape/flux.yaml's, and a
      # difference worth not having.
      #
      # Ordering: the image.toolkit.fluxcd.io CRDs are installed by
      # scripts/flux/Bootstrap-Flux.ps1's --components-extra at Provision 3,
      # so they are registered long before this release installs. A CRS entry
      # naming a GVK that does not exist is a kube-state-metrics that logs and
      # keeps running rather than one that crashes, but it is also a panel
      # that is silently empty - so if these metrics are missing, check the
      # CRD before the dashboard.
      rbac:
        extraRules:
          - apiGroups: ["image.toolkit.fluxcd.io"]
            resources: ["imagepolicies"]
            verbs: ["get", "list", "watch"]
          # The second CustomResourceState entry below (8b.11). Same three
          # verbs, and `get` is here only because the informer's error path
          # uses it - list and watch are what a dynamic informer runs.
          - apiGroups: ["postgresql.cnpg.io"]
            resources: ["backups"]
            verbs: ["get", "list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImagePolicy
                # Replaces the kube_customresource_ default, so the series
                # reads as this repository's rather than as a generic one:
                # aerie_flux_image_policy_latest_tag.
                metricNamePrefix: aerie_flux
                labelsFromPath:
                  name: [metadata, name]
                metrics:
                  - name: image_policy_latest_tag
                    help: "Tag this ImagePolicy currently selects, as a label on a constant 1."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          # status.latestRef is the image API v1 shape
                          # (../../apps/automation/image-policies.yaml pins
                          # image.toolkit.fluxcd.io/v1). The v1beta2 spelling
                          # was a single status.latestImage string; if these
                          # labels come back empty after a Flux upgrade, that
                          # field moving is the first thing to check.
                          tag: [status, latestRef, tag]
                          image: [status, latestRef, name]

              # The cluster plan Phase 8b.11's fallback, and the reason it
              # needed one. That step's table names
              # cnpg_collector_last_available_backup_timestamp as the series
              # the CNPGBackupTooOld rule reads, flagged as asserted from
              # documentation rather than off this cluster - and checking it
              # is what found this: the metric exists, is scraped, and reads
              # **0** on all three instances while
              # ../../data/schema/scheduledbackup.yaml has been completing a
              # base backup every night. So does its sibling
              # cnpg_collector_first_recoverability_point.
              #
              # The cause is the plugin split, not a broken backup. Both
              # metrics are rendered from `status.lastSuccessfulBackup` and
              # `status.firstRecoverabilityPoint` on the Cluster object, and
              # under the barman-cloud *plugin* (the only path CNPG 1.28
              # offers, and what ../../data/cluster/objectstore.yaml is)
              # nothing writes those two fields: `kubectl -n aerie get cluster
              # aerie-pg -o jsonpath='{.status.lastSuccessfulBackup}'` is
              # empty on a cluster whose Backup objects all read
              # `phase: completed`. A rule written against a metric that is
              # permanently 0 does not go quiet - `time() - 0` is fifty-six
              # years - so this one would have fired every night forever,
              # which is the other half of 8b.11's own warning about rules
              # that cannot mean what they say.
              #
              # The Backup objects themselves carry the truth
              # (`status.stoppedAt`, RFC3339, set when the plugin reports the
              # backup complete), so this reads them directly - the same
              # mechanism 8b.11 pre-authorized as the fallback for Longhorn,
              # used for CNPG instead because Longhorn's own CronJob metric
              # turned out to be real.
              #
              # One label per object, `name`, which means the series count
              # grows by one per nightly backup rather than staying flat.
              # That is the cost of the only field that distinguishes two
              # Backups from each other; ../config/alerts/backup.yaml takes
              # max() over the set and never names one. If it ever matters,
              # the fix is deleting old Backup objects (CNPG does not - its
              # retention policy governs the object store, not the CRs), not
              # dropping the label, because two objects reduced to the same
              # label set are a duplicate-series error rather than a smaller
              # metric.
              - groupVersionKind:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: Backup
                # aerie_cnpg_backup_stopped_at, matching the prefix rationale
                # above: a name that reads as this repository's rather than
                # as a generic kube_customresource_ series.
                metricNamePrefix: aerie_cnpg
                labelsFromPath:
                  name: [metadata, name]
                  # Both alert and dashboard filter on this. A backup that
                  # failed still has a stoppedAt, and counting it as the
                  # newest backup is exactly the silent gap this phase is
                  # about - so nothing downstream reads this metric without
                  # `phase="completed"` on it.
                  phase: [status, phase]
                metrics:
                  - name: backup_stopped_at
                    help: "Unix time at which this CNPG Backup finished, from status.stoppedAt."
                    each:
                      type: Gauge
                      gauge:
                        # `path` straight at the scalar, and no `valueFrom`
                        # beside it. That pairing is the whole of this
                        # metric's mechanics and it is not the obvious one:
                        # written as `valueFrom: [status, stoppedAt]` with no
                        # path, kube-state-metrics registers the family,
                        # names it in its startup log, and emits **zero
                        # samples** with no error at default verbosity - which
                        # is the same silence a wrong metric name produces.
                        # The reason is that a Gauge whose path lands on a
                        # *map* iterates that map's entries, so an absent path
                        # (the object root) turns into five failed lookups
                        # against apiVersion, kind, metadata, spec and status.
                        # Pointed at a leaf it takes the default branch and
                        # parses the value, and kube-state-metrics converts an
                        # RFC3339 string to unix seconds there - which is what
                        # makes `time() -` arithmetic legal against it.
                        #
                        # A Backup still running has no stoppedAt and is
                        # skipped rather than emitted as 0 (nilIsZero left at
                        # its false default, deliberately - a zero here reads
                        # as 1970 and would fire the staleness rule mid-run).
                        path: [status, stoppedAt]
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi
    prometheus-node-exporter:
      # A DaemonSet, unlike everything else this key touches - but 6b.14's
      # rule is "every workload in this phase", not "every workload that
      # isn't a DaemonSet", and eviction of one node-exporter pod costs
      # nothing an operator would notice the way an evicted Grafana might.
      priorityClassName: aerie-observability
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
