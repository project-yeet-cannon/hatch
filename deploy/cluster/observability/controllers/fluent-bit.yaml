# The cluster plan Phase 6b.10 - the fluent-bit rewrite. Finding 4, and the
# only step in this phase that rewrites a pipeline instead of re-hosting one:
# ../../../../containers/fluent-bit/fluent-bit.conf tailed
# /var/lib/docker/containers, decoded compose's json-file driver, and read a
# compose label for the `service` field. None of that exists under containerd,
# and the replacement is line-by-line below against that file.
#
# A pinned HelmRelease of the `fluent-bit` chart (DaemonSet, plus the
# ClusterRole its default rbac.create renders for the kubernetes filter's
# get/list/watch on pods and namespaces - confirmed by reading
# templates/clusterrole.yaml at the pinned version below) - which is most of
# why this is a chart at all and ../../../infrastructure/controllers/
# kuma-provision (6b.13) is not: a hand-rolled DaemonSet would mean hand-rolling
# that ClusterRole too.
#
# image.repository/image.tag pinned to fluent/fluent-bit:4.2.7 rather than the
# chart's own default (cr.fluentbit.io/fluent/fluent-bit:5.1.1, its
# Chart.AppVersion) - the same call ../opensearch.yaml's header makes for
# 3.7.0 over a newer chart-default: this exact tag is the one
# compose.observability.yml already runs in production, with a real soak
# record on this installation's own log volume, and the chart version pin
# (templates, RBAC, the Lua-script and daemonSetVolumes plumbing) carries no
# dependency on which fluent-bit release the image itself is.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fluent
  namespace: observability
spec:
  interval: 1h
  url: https://fluent.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: fluent-bit
      version: 0.58.1
      sourceRef:
        kind: HelmRepository
        name: fluent
  timeout: 3m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    cleanupOnFail: true
  # The Lua script is a real file - ./fluent-bit/service_tag.lua - rather than
  # a string embedded in this YAML, the same way ../../config/dashboards/'s
  # JSON stays real files: Finding 4 is emphatic about the precedence rules in
  # that script (it is what UiLogsController.cs and VmConsoleLogsController.cs
  # lines are attributed by), and a copy pasted into a HelmRelease value is
  # the kind of thing that drifts from the file everyone greps for. The
  # ConfigMap it comes from is generated by ../kustomization.yaml
  # (disableNameSuffixHash: true, same reason as the dashboards sidecar's own
  # ConfigMaps - a stable name a static reference like this one can point at)
  # and lives in this Kustomization rather than ../../config because a
  # HelmRelease mounts it, the same distinction ../../config/kustomization.yaml's
  # own comment draws for ./admin-secrets.yaml's two Secrets.
  #
  # Not wired in via `valuesFrom`/`targetPath` into the chart's own
  # `luaScripts` value, despite that being the mechanism the chart's README
  # documents - found live, 2026-08-20: Flux pipes a `targetPath` value through
  # Helm's `strvals` parser (the same grammar `helm --set` uses), which treats
  # commas as list separators and chokes on the Lua source's own commas and
  # newlines with a `ValuesError`. `extraVolumes`/`extraVolumeMounts` below
  # sidestep the chart's `luaScripts` mechanism entirely and mount this
  # ConfigMap straight onto the pod at the exact path `luaScripts` would have
  # used (`/fluent-bit/scripts/<name>`, per the chart's own `_pod.tpl`) - the
  # `[FILTER] lua` stanza's `script` line below already names that path.
  values:
    image:
      repository: fluent/fluent-bit
      tag: "4.2.7"

    flush: 5
    logLevel: info

    # config.service is left at the chart's own default: it already
    # parameterizes Flush/Log_Level from the two values above, points
    # Parsers_File at the paths this chart's ConfigMap actually writes them
    # to, and carries the HTTP_Server/Health_Check lines the chart's own
    # readinessProbe (GET /api/v2/health) depends on. Nothing here needs to
    # change it.

    config:
      inputs: |
        [INPUT]
            Name              tail
            Path              /var/log/containers/*.log
            multiline.parser  cri
            Tag               kube.*
            DB                /fluent-bit/state/tail-containers-state.db
            Refresh_Interval  5
            # 10MB against one compose project's containers; this DaemonSet
            # tails every pod on the node. Raised for that, not for the case
            # OpenSearch is briefly unavailable - the honest fix for a longer
            # outage is storage.type filesystem, deferred until 6b.10's own
            # week-one volume measurement (see ../fluent-bit.yaml's sibling
            # note in the cluster plan) shows whether it's needed.
            Mem_Buf_Limit     50MB
            Skip_Long_Lines   On

      # Attaches pod name, namespace, container name and labels under
      # record.kubernetes - the replacement for compose's
      # com.docker.compose.service label, and what ./fluent-bit/service_tag.lua's
      # default branch now reads. Merge_Log Off (the chart's own default is
      # On): the next filter already decodes Aerie.Api's JSON `log` field
      # on purpose, with the specific dotnet_json parser below, and leaving
      # this on would have the kubernetes filter's generic JSON merge race it
      # for the same field on every request - unnecessary and, on the fields
      # where the two disagree, ambiguous about which wins.
      filters: |
        [FILTER]
            Name                kubernetes
            Match               kube.*
            Merge_Log           Off
            K8S-Logging.Parser  On
            K8S-Logging.Exclude On

        [FILTER]
            Name          parser
            Match         kube.*
            Key_Name      log
            Parser        dotnet_json
            Reserve_Data  On

        [FILTER]
            Name    lua
            Match   kube.*
            script  /fluent-bit/scripts/service_tag.lua
            call    set_service

      # Unchanged from ../../../../containers/fluent-bit/custom_parsers.conf -
      # Aerie.Api's JSON console formatter writes one JSON object per line,
      # nothing here depends on being containerd vs. docker.
      customParsers: |
        [PARSER]
            Name    dotnet_json
            Format  json

      # Host is the Service name (../opensearch.yaml's chart-default host,
      # confirmed there against the same chart version); everything else -
      # Logstash_Format, the aerie-logs prefix, Suppress_Type_Name - is
      # unchanged from the compose config.
      outputs: |
        [OUTPUT]
            Name                opensearch
            Match               kube.*
            Host                opensearch-cluster-master
            Port                9200
            Index               aerie-logs
            Logstash_Format     On
            Logstash_Prefix     aerie-logs
            tls                 Off
            Suppress_Type_Name  On

    # Three mount details that each fail silently (the cluster plan's own
    # phrasing) if any one of them is skipped:
    #  - /var/log/containers/*.log are symlinks into /var/log/pods/, so the
    #    whole tree has to be mounted - mounting only .../containers finds
    #    files and reads nothing from them.
    #  - the tail DB goes on a hostPath, not the chart's default emptyDir:
    #    that file holds tail offsets, and an emptyDir re-ships everything
    #    the node has retained on every pod restart - a duplicate-log flood
    #    arriving exactly when something is already wrong. DirectoryOrCreate
    #    so a fresh node needs no provisioning step for it.
    #  - the chart's own default daemonSetVolumes also mount
    #    /var/lib/docker/containers - a docker-era path this cluster's
    #    containerd nodes never populate. Left out rather than left stale.
    daemonSetVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: fluent-bit-state
        hostPath:
          path: /var/lib/fluent-bit
          type: DirectoryOrCreate

    daemonSetVolumeMounts:
      - name: varlog
        mountPath: /var/log
      - name: fluent-bit-state
        mountPath: /fluent-bit/state

    # ./fluent-bit/service_tag.lua's ConfigMap (../kustomization.yaml), mounted
    # at the same path the chart's own `luaScripts` mechanism would use - see
    # this file's earlier comment (above `values:`) for why it's wired in
    # this way instead of `valuesFrom`/`targetPath`.
    extraVolumes:
      - name: fluent-bit-lua
        configMap:
          name: fluent-bit-lua
    extraVolumeMounts:
      - name: fluent-bit-lua
        mountPath: /fluent-bit/scripts/service_tag.lua
        subPath: service_tag.lua
        readOnly: true

    # 7 MiB observed on the old host's one-project DaemonSet (phase-6-observability.md's
    # sizing table); no CPU limit, per that same table's "whole stack peaked at
    # 5% of one core" finding, which every other HelmRelease in this phase
    # leaves uncapped on the same evidence.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
