# The cluster plan Phase 6b.10 - the fluent-bit rewrite. Finding 4, and the
# only step in this phase that rewrites a pipeline instead of re-hosting one:
# the old compose stack's containers/fluent-bit/fluent-bit.conf (deleted in
# 7b.9, in git history) tailed /var/lib/docker/containers, decoded compose's
# json-file driver, and read a compose label for the `service` field. None of
# that exists under containerd, and the replacement is line-by-line below
# against that file.
#
# A pinned HelmRelease of the `fluent-bit` chart (DaemonSet, plus the
# ClusterRole its default rbac.create renders for the kubernetes filter's
# get/list/watch on pods and namespaces - confirmed by reading
# templates/clusterrole.yaml at the pinned version below) - which is most of
# why this is a chart at all and ../../../infrastructure/controllers/
# kuma-provision (6b.13) is not: a hand-rolled DaemonSet would mean hand-rolling
# that ClusterRole too.
#
# image.repository/image.tag pinned to fluent/fluent-bit:4.2.7 rather than the
# chart's own default (cr.fluentbit.io/fluent/fluent-bit:5.1.1, its
# Chart.AppVersion) - the same call ../opensearch.yaml's header makes for
# 3.7.0 over a newer chart-default: this exact tag is the one
# compose.observability.yml already runs in production, with a real soak
# record on this installation's own log volume, and the chart version pin
# (templates, RBAC, the Lua-script and daemonSetVolumes plumbing) carries no
# dependency on which fluent-bit release the image itself is.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fluent
  namespace: observability
spec:
  interval: 1h
  url: https://fluent.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: fluent-bit
      version: 0.58.1
      sourceRef:
        kind: HelmRepository
        name: fluent
  timeout: 3m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    cleanupOnFail: true
  # The Lua script is a real file - ./fluent-bit/service_tag.lua - rather than
  # a string embedded in this YAML, the same way ../../config/dashboards/'s
  # JSON stays real files: Finding 4 is emphatic about the precedence rules in
  # that script (it is what UiLogsController.cs and VmConsoleLogsController.cs
  # lines are attributed by), and a copy pasted into a HelmRelease value is
  # the kind of thing that drifts from the file everyone greps for. The
  # ConfigMap it comes from is generated by ../kustomization.yaml
  # (disableNameSuffixHash: true, same reason as the dashboards sidecar's own
  # ConfigMaps - a stable name a static reference like this one can point at)
  # and lives in this Kustomization rather than ../../config because a
  # HelmRelease mounts it, the same distinction ../../config/kustomization.yaml's
  # own comment draws for ./admin-secrets.yaml's two Secrets.
  #
  # Not wired in via `valuesFrom`/`targetPath` into the chart's own
  # `luaScripts` value, despite that being the mechanism the chart's README
  # documents - found live, 2026-08-20: Flux pipes a `targetPath` value through
  # Helm's `strvals` parser (the same grammar `helm --set` uses), which treats
  # commas as list separators and chokes on the Lua source's own commas and
  # newlines with a `ValuesError`. `extraVolumes`/`extraVolumeMounts` below
  # sidestep the chart's `luaScripts` mechanism entirely and mount this
  # ConfigMap straight onto the pod at the exact path `luaScripts` would have
  # used (`/fluent-bit/scripts/<name>`, per the chart's own `_pod.tpl`) - the
  # `[FILTER] lua` stanza's `script` line below already names that path.
  values:
    image:
      repository: fluent/fluent-bit
      tag: "4.2.7"

    flush: 5
    logLevel: info

    # config.service is left at the chart's own default: it already
    # parameterizes Flush/Log_Level from the two values above, points
    # Parsers_File at the paths this chart's ConfigMap actually writes them
    # to, and carries the HTTP_Server/Health_Check lines the chart's own
    # readinessProbe (GET /api/v2/health) depends on. Nothing here needs to
    # change it.

    config:
      inputs: |
        [INPUT]
            Name              tail
            Path              /var/log/containers/*.log
            # Found live, 2026-08-20: with no exclusion, this DaemonSet tails
            # its own container's log file - at Log_Level debug it logs one
            # line per bulk flush, each of which becomes a new record for it
            # to ship, which is itself a new line to flush. That fed back
            # fast enough to write ~1.8M documents in minutes against two
            # idle-cluster DaemonSet pods. Excluded unconditionally, not just
            # for debug: a self-referential source is never something this
            # index should carry regardless of verbosity.
            Exclude_Path      /var/log/containers/fluent-bit-*_observability_fluent-bit-*.log
            multiline.parser  cri
            Tag               kube.*
            DB                /fluent-bit/state/tail-containers-state.db
            Refresh_Interval  5
            # 10MB against one compose project's containers; this DaemonSet
            # tails every pod on the node. Raised for that, not for the case
            # OpenSearch is briefly unavailable - the honest fix for a longer
            # outage is storage.type filesystem, deferred until 6b.10's own
            # week-one volume measurement (see ../fluent-bit.yaml's sibling
            # note in the cluster plan) shows whether it's needed.
            Mem_Buf_Limit     50MB
            Skip_Long_Lines   On

      # Attaches pod name, namespace, container name and labels under
      # record.kubernetes - the replacement for compose's
      # com.docker.compose.service label, and what ./fluent-bit/service_tag.lua's
      # default branch now reads. Merge_Log Off (the chart's own default is
      # On): the next filter already decodes Aerie.Api's JSON `log` field
      # on purpose, with the specific dotnet_json parser below, and leaving
      # this on would have the kubernetes filter's generic JSON merge race it
      # for the same field on every request - unnecessary and, on the fields
      # where the two disagree, ambiguous about which wins.
      filters: |
        [FILTER]
            Name                kubernetes
            Match               kube.*
            Merge_Log           Off
            K8S-Logging.Parser  On
            K8S-Logging.Exclude On

        [FILTER]
            Name          parser
            Match         kube.*
            Key_Name      log
            Parser        dotnet_json
            Reserve_Data  On

        [FILTER]
            Name    lua
            Match   kube.*
            script  /fluent-bit/scripts/service_tag.lua
            call    set_service

        # A second pass over the same script for `aerie_revision` - the git
        # commit of the Aerie build that emitted the line (docs/plans/version.md).
        # A separate stanza rather than more work inside set_service because
        # fluent-bit binds one `call` per filter, and because the two answer
        # different questions: one names the workload, one names its build.
        #
        # Most of what it does costs nothing at the application layer - the
        # revision is parsed straight out of the tag in
        # kubernetes.container_image, which the kubernetes filter above already
        # attached. The override path is what makes a relayed browser line
        # carry the browser's revision instead of the relay's; see the script.
        [FILTER]
            Name    lua
            Match   kube.*
            script  /fluent-bit/scripts/service_tag.lua
            call    set_aerie_revision

      # Unchanged from the compose stack's custom_parsers.conf (7b.9) -
      # Aerie.Api's JSON console formatter writes one JSON object per line,
      # nothing here depends on being containerd vs. docker.
      customParsers: |
        [PARSER]
            Name    dotnet_json
            Format  json

      # Host is the Service name (../opensearch.yaml's chart-default host,
      # confirmed there against the same chart version); everything else -
      # Logstash_Format, the aerie-logs prefix, Suppress_Type_Name - is
      # unchanged from the compose config.
      #
      # Replace_Dots On - the fix for the 2026-08-29 crashloop (fluent-bit
      # pods at 84 and 86 restarts, all OOMKilled). Off is the plugin
      # default, and it is wrong for any Kubernetes log pipeline. The
      # kubernetes filter above attaches the source pod's labels verbatim
      # under kubernetes.labels, and OpenSearch's dynamic mapper reads a dot
      # inside a *field name* as object nesting. A pod labelled both
      # `app: longhorn-manager` and `app.kubernetes.io/name: longhorn`
      # therefore asks the same index to map kubernetes.labels.app as a
      # concrete string and as an object holding `kubernetes.io/name`. First
      # one to arrive wins the mapping; every document carrying the other
      # shape is rejected for as long as that index exists:
      #
      #   "type": "mapper_parsing_exception", "reason": "object mapping for
      #   [kubernetes.labels.app] tried to parse field [app] as object, but
      #   found a concrete value"
      #
      # 21 of this cluster's 97 pods carry such a pair (cert-manager,
      # flux-system, kube-system, longhorn-system, observability), so this
      # was never a rare edge. Replace_Dots rewrites the dots in the key to
      # underscores before the bulk body is built - app_kubernetes_io/name -
      # so the nesting, and the collision, never form. It is deliberately on
      # the OUTPUT rather than solved with a filter: it covers every dotted
      # key in the record, not only the label subtree. The other half of the
      # fix is at the OpenSearch end, in
      # ../../config/provisioning/apply-index-template.sh - see there for
      # why both halves exist and why neither repairs an index that already
      # guessed the broken mapping.
      #
      # Retry_Limit 10, not False. The 2026-08-20 note this replaces set it
      # to False (unlimited) after a debug capture showed chunks failing
      # with no response logged, read as a client-side timeout, and argued
      # that "Mem_Buf_Limit above already bounds how much can back up in
      # memory, so unlimited retries can't grow without limit". Both halves
      # of that were wrong, and a packet capture on 2026-08-29 is what
      # showed it. The bulk response was never absent - it was HTTP 200 with
      # a per-item 400 inside, which is why the plugin's `errors` counter
      # stayed at 0 and nothing was ever logged above debug. And a rejected
      # item is deterministic, so unlimited retries meant a chunk that can
      # never succeed was retried forever: fluent-bit re-serialises the
      # whole chunk to a JSON bulk body on every attempt, and the pinned
      # chunks plus that churn drove anon memory to 119.5 MB against the
      # 128Mi limit below (measured in the cgroup on aerie-node-0) until the
      # kernel killed it. Mem_Buf_Limit bounds the *chunk* bytes - 47.7 MB
      # at the time - not the process holding them.
      #
      # The failure that mattered was not the OOM but the silence before it:
      # the plugin retries the whole chunk when any single item in it is
      # rejected, so the ~50 good records sharing a chunk with one poisoned
      # one never landed either. aerie-node-0's pod had read 36,959 records
      # in four days and delivered 854 - that node's logs were simply absent
      # from the index, with nothing above [ warn] to say so. A bound is
      # what keeps one undeliverable record from costing a node its
      # observability. 10 attempts with fluent-bit's exponential backoff is
      # a window of hours, so the transient contention the 08-20 note was
      # reacting to is still absorbed; what changes is that a permanently
      # rejected chunk is now dropped instead of held forever.
      outputs: |
        [OUTPUT]
            Name                opensearch
            Match               kube.*
            Host                opensearch-cluster-master
            Port                9200
            Index               aerie-logs
            Logstash_Format     On
            Logstash_Prefix     aerie-logs
            tls                 Off
            Suppress_Type_Name  On
            Replace_Dots        On
            Retry_Limit         10

    # Three mount details that each fail silently (the cluster plan's own
    # phrasing) if any one of them is skipped:
    #  - /var/log/containers/*.log are symlinks into /var/log/pods/, so the
    #    whole tree has to be mounted - mounting only .../containers finds
    #    files and reads nothing from them.
    #  - the tail DB goes on a hostPath, not the chart's default emptyDir:
    #    that file holds tail offsets, and an emptyDir re-ships everything
    #    the node has retained on every pod restart - a duplicate-log flood
    #    arriving exactly when something is already wrong. DirectoryOrCreate
    #    so a fresh node needs no provisioning step for it.
    #  - the chart's own default daemonSetVolumes also mount
    #    /var/lib/docker/containers - a docker-era path this cluster's
    #    containerd nodes never populate. Left out rather than left stale.
    daemonSetVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: fluent-bit-state
        hostPath:
          path: /var/lib/fluent-bit
          type: DirectoryOrCreate

    daemonSetVolumeMounts:
      - name: varlog
        mountPath: /var/log
      - name: fluent-bit-state
        mountPath: /fluent-bit/state

    # ./fluent-bit/service_tag.lua's ConfigMap (../kustomization.yaml), mounted
    # at the same path the chart's own `luaScripts` mechanism would use - see
    # this file's earlier comment (above `values:`) for why it's wired in
    # this way instead of `valuesFrom`/`targetPath`.
    extraVolumes:
      - name: fluent-bit-lua
        configMap:
          name: fluent-bit-lua
    extraVolumeMounts:
      - name: fluent-bit-lua
        mountPath: /fluent-bit/scripts/service_tag.lua
        subPath: service_tag.lua
        readOnly: true

    # The chart sets only httpGet path/port here, leaving timeoutSeconds at
    # Kubernetes' own default of 1s. That is too tight for this probe: `GET /`
    # is served by the same single-threaded event loop that does the flushing,
    # so a busy engine answers late rather than not at all, and three late
    # answers restart a pod that is working. aerie-node-2's pod recorded 13
    # such kills ("Liveness probe failed: context deadline exceeded") on top
    # of its OOMs. 5s still catches a genuinely wedged engine within 15s;
    # what it stops catching is a busy one. failureThreshold and period are
    # left at the chart/Kubernetes defaults (3 and 10s).
    livenessProbe:
      httpGet:
        path: /
        port: http
      timeoutSeconds: 5

    # No CPU limit, per phase-6-observability.md's sizing table's "whole stack
    # peaked at 5% of one core" finding, which every other HelmRelease in this
    # phase leaves uncapped on the same evidence.
    #
    # The memory limit was 128Mi, carried over from the 7 MiB that same table
    # observed on the old host's one-project DaemonSet. That number did not
    # survive the move: this DaemonSet tails a whole node (46 open files on
    # aerie-node-1, against a compose project's handful), and it holds
    # Mem_Buf_Limit's 50MB of chunks in the same process. Measured in the
    # cgroup on aerie-node-0, 2026-08-29: 47.7 MB of buffered chunks came with
    # 119.5 MB of anon memory - roughly 2.5x, because the opensearch plugin
    # re-serialises each chunk into a JSON bulk body to send it, and the
    # kubernetes filter keeps a metadata cache per pod on the node. 128Mi was
    # therefore under the process's own configured buffer, and the pods sat at
    # 96% of the limit in steady state with nothing left for a burst.
    #
    # 256Mi is Mem_Buf_Limit's 50MB at the measured 2.5x, plus headroom. It is
    # sized to the buffer that is already configured above rather than to an
    # observed peak, because the peak that was being observed was a runaway -
    # see the Retry_Limit note above for what was actually filling it.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    # 6b.14's PriorityClass. A DaemonSet, same as
    # ../controllers/kube-prometheus-stack.yaml's prometheus-node-exporter -
    # every workload in this phase, not just the single-replica ones.
    priorityClassName: aerie-observability
