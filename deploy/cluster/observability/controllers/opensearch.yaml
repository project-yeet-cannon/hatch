# The cluster plan Phase 6b.9 - OpenSearch and OpenSearch Dashboards,
# single-node, plus the NetworkPolicy that answers the re-scope preamble's
# fifth bullet.
#
# Single-node is a decision, not a limitation: observability is explicitly
# scoped out of HA (design.md#decisions) and this is the single biggest
# memory consumer in the cluster (see the sizing section's "3.2 GiB on one
# node" figure). `singleNode: true` forces `replicas: 1` and implies
# `discovery.type: single-node` in the rendered opensearch.yml - verified by
# rendering the pinned chart below rather than assumed, since that is exactly
# the kind of detail this phase's own preamble says gets found in a rebuild
# instead of here. The corollary this step does NOT act on -
# `number_of_replicas: 0` on every index template, because a one-node cluster
# can never allocate a replica shard and would otherwise sit permanently
# yellow - is 6b.11's object, not this one; noted here so the decision reads
# as made rather than forgotten between steps.
#
# Both charts are pinned to 3.7.0, the exact version
# compose.observability.yml already ran (opensearchproject/opensearch:3.7.0)
# rather than the 3.8.0 that was two weeks old at pin time - unlike
# ../kube-prometheus-stack.yaml's one-day-old 88.3.0, there is a
# same-shape-newer version available here with a real soak record on this
# installation's own data, and no reason to spend it.
#
# No ServiceMonitor: both charts carry `serviceMonitor.enabled: false` as
# their own default, left there deliberately - turning it on would render a
# monitoring.coreos.com object from a layer-1 chart flag, exactly the
# ../../../infrastructure/controllers/cloudnative-pg.yaml mistake
# ../../config/scrape/kustomization.yaml's rule exists to prevent. Nothing in
# this phase scrapes OpenSearch (see 6b.6's six-item list), so the question
# does not arise a second way either.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: opensearch
  namespace: observability
spec:
  interval: 1h
  url: https://opensearch-project.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: opensearch
      version: 3.7.0
      sourceRef:
        kind: HelmRepository
        name: opensearch
  # One StatefulSet, one image pull, one Longhorn volume to bind - lighter
  # than ../kube-prometheus-stack.yaml's 10m but not as fast as a bare
  # Deployment, since kubelet has to wait on the PVC and the fsgroup-volume
  # chown initContainer ahead of the main container starting.
  timeout: 5m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    cleanupOnFail: true
  values:
    singleNode: true

    # Carried across from compose.observability.yml's OPENSEARCH_JAVA_OPTS.
    opensearchJavaOpts: "-Xms512m -Xmx512m"

    # Carried across from compose.observability.yml's DISABLE_SECURITY_PLUGIN.
    # What that means is bigger here than it was there: on the old host this
    # sat on a private compose network behind one loopback port; in the
    # cluster an unauthenticated OpenSearch is reachable by every pod in
    # every namespace, over data that now includes every system pod's logs.
    # The LAN-trust reasoning in
    # ../../../../docs/monitoring-alerting-architecture.md was written about
    # the humans on this network, not pod-to-pod reachability - the
    # NetworkPolicy below is the mitigation, and this comment is the other
    # half the re-scope preamble asks for: turning the security plugin on
    # instead would buy a certificate lifecycle this phase should not own.
    extraEnvs:
      - name: DISABLE_SECURITY_PLUGIN
        value: "true"

    persistence:
      enabled: true
      accessModes: ["ReadWriteOnce"]
      size: 20Gi
      # Bulk, loss tolerable - logs age out by design, the same reasoning
      # ../../../infrastructure/config/longhorn-storageclasses.yaml's own
      # comment gives for every other r2 volume in this phase.
      storageClass: longhorn-r2
      # The chart's own fsgroup-volume initContainer defaults to
      # `busybox:latest` (values.yaml's persistence.imageTag, undocumented
      # default, confirmed by rendering) - a floating tag scripts/versions.json's
      # own rule exists to rule out ("never point any of them at a 'latest' or
      # 'stable' channel - a moving pin makes a rebuilt node a different
      # node"). Pinned to the newest stable release at the time this was
      # written; bump deliberately, same as every other pin in this tree.
      imageTag: "1.37.0"

    # The compose file's `nofile: {soft: 65536, hard: 65536}` ulimit has no
    # equivalent here - confirmed by rendering the chart and reading its
    # statefulset.yaml template, which sets no rlimit of any kind and exposes
    # no values key for one. Kubernetes' PodSpec has no field for per-container
    # rlimits at all; what a container gets is whatever the node's container
    # runtime defaults to, which is why docker-compose needed an explicit
    # override (Docker's classic daemon default is low) and containerd/runc
    # under k3s does not carry the same low default forward. Nothing to set.

    # No `sysctlInit`/`sysctl` initContainer - already the chart's own
    # default, written out because 6b.1 is where vm.max_map_count actually
    # gets set (a node-level /etc/sysctl.d/ drop-in, applied before any pod
    # using it exists) and the initContainer alternative is a privileged
    # container mutating a kernel parameter on whichever node happens to
    # schedule this pod, the exact thing 6b.1's own text rules out.
    sysctlInit:
      enabled: false
    sysctl:
      enabled: false

    resources:
      requests:
        cpu: 20m
        memory: 1.5Gi
      limits:
        memory: 2Gi

    # 6b.14's sweep caught this one: persistence.enableInitChown defaults to
    # true (unset above, so it's on), which runs a fsgroup-volume
    # initContainer on every start - and that initContainer reads its own
    # initResources key, not the `resources:` block above. Confirmed by
    # rendering the pinned 3.7.0 chart: left unset it renders `resources: {}`,
    # the exact chart-hidden gap the cluster plan's own text warns this step
    # to look for.
    initResources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

    priorityClassName: aerie-observability
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch-dashboards
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: opensearch-dashboards
      version: 3.7.0
      sourceRef:
        kind: HelmRepository
        name: opensearch
  timeout: 3m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    cleanupOnFail: true
  values:
    # The chart's own default host - {clusterName}-{masterService suffix} -
    # already resolves to opensearch-cluster-master with no override above,
    # so only the scheme needs changing: the chart assumes https, and with
    # the security plugin disabled OpenSearch answers on plain http instead.
    opensearchHosts: "http://opensearch-cluster-master:9200"

    # Carried across from compose.observability.yml's
    # DISABLE_SECURITY_DASHBOARDS_PLUGIN.
    extraEnvs:
      - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
        value: "true"

    # No `ingress.enabled: true` here - the re-scope preamble's rule is about
    # monitoring.coreos.com objects specifically, and a plain Ingress carries
    # no such risk, but ../../config/ingress-logs.yaml is where every other
    # hostname in this tree lives (5b.9's own shape) and there is no reason
    # for this one to be the exception, routed through a chart flag instead
    # of an object next to its siblings.

    # rbac.create stays at the chart's own default (true): a dedicated
    # ServiceAccount over the namespace's `default` one, for the usual
    # least-privilege reason. Its RoleBinding names a Role
    # (opensearch-dashboards-dashboards) that no template in this chart ever
    # creates - confirmed by rendering; templates/role.yaml simply does not
    # exist in this chart, only rolebinding.yaml does. A RoleBinding naming a
    # Role that does not exist applies cleanly and grants nothing; it is an
    # upstream chart gap, not a mistake in this file, and not worth working
    # around for an object that is otherwise inert.

    resources:
      requests:
        cpu: 10m
        memory: 384Mi
      limits:
        # cpu explicitly nulled: the chart's own default sets limits.cpu:
        # 100m, which this tree does not do anywhere else - 5a.6 found the
        # whole observability stack peaking at 5% of one core, and every
        # other HelmRelease in this phase leaves CPU unlimited on that
        # evidence. Confirmed by rendering: without this the chart default
        # survives Helm's values merge silently.
        cpu: null
        memory: 768Mi

    priorityClassName: aerie-observability
---
# The re-scope preamble's mitigation for DISABLE_SECURITY_PLUGIN: only
# fluent-bit (6b.10, shipping logs in) and Dashboards (reading them back out)
# may reach OpenSearch's REST port. Everything else in every namespace -
# every pod this phase did not name - is denied by the implicit default-deny
# a NetworkPolicy creates for whatever it selects; nothing before this phase
# has needed one, so this is the first NetworkPolicy in the tree.
#
# No rule for the transport port (9300): `discovery.type: single-node`
# (this file's `singleNode: true` above) bypasses the cluster-formation
# module entirely rather than forming a one-node cluster through it, so
# nothing - not even the pod itself - opens a transport connection in this
# configuration. Nothing scrapes the metrics port (9600) in this phase either
# (this file's own header note), so it is not opened.
#
# fluent-bit does not exist yet - it is 6b.10 - but its DaemonSet will carry
# the fluent-bit chart's own default selector labels
# (app.kubernetes.io/name: fluent-bit), which is what this policy matches
# against rather than a name 6b.10 might change. A podSelector with no
# namespaceSelector matches only pods in this NetworkPolicy's own namespace,
# which is where 6b.10 lands it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-restrict-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/instance: opensearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fluent-bit
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch-dashboards
              app.kubernetes.io/instance: opensearch-dashboards
        # 6b.11's provisioning pods. Missing from this list when it was
        # written, and the omission is easy to make twice: the policy was
        # reasoned about as "who reads and writes logs" - fluent-bit in,
        # Dashboards out - and the thing that *configures* the cluster is
        # neither. What it cost is out of all proportion to a missing
        # selector: apply-ism-policy.sh and apply-index-template.sh could not
        # open a connection, so no ISM policy and no index template were ever
        # created, and because ../../config/provisioning/opensearch-provision.yaml
        # chains the three scripts with `&&`, create-index-pattern.sh never
        # ran either - leaving Discover asking for an index pattern on a
        # cluster that had been ingesting logs the whole time. The label is
        # set on that CronJob's pod template; the two have to stay in sync.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch-provision
      ports:
        - port: 9200
          protocol: TCP
