# The cluster plan Phase 5b.4 - the source half of reaching the private
# per-installation site repo (5a.3). Its counterpart, site-config in
# ../site.yaml, is what actually reconciles what this points at; this object
# only says where that is.
#
# url is a ${...} token because a site repo's clone URL is true of exactly
# one installation - the same reasoning docs/ethos.md gives for every other
# per-installation value, arriving here instead of a manifest. It resolves
# from the aerie-cluster-config ConfigMap (Provision 4), via site-source's
# postBuild.substituteFrom in ../site.yaml - not from this object's own
# Kustomization, which doesn't have one; a GitRepository cannot substitute
# into itself, since substitution happens to the manifest that *defines* it.
#
# ref.branch is not a ${...} token, unlike url. 5a.3 creates the site repo
# with exactly one branch, so its name is structural rather than
# per-installation - every fresh GitHub repository defaults to `main`, and
# nothing in this phase gives an operator a reason to rename it.
#
# secretRef names aerie-site-git, the Secret 5b.1 seeds into flux-system from
# site/git-username and site/git-token - a fine-grained PAT scoped to this one
# repository, contents:write. Basic auth over HTTPS is what a GitRepository
# expects for a token credential; there is no separate "token" field.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: aerie-site
  namespace: flux-system
spec:
  # Matches flux-system's own GitRepository interval (scripts/flux/Bootstrap-Flux.ps1) -
  # image automation's commits should be picked up about as quickly as a
  # commit to this repository is.
  interval: 1m
  url: ${SITE_REPO_URL}
  ref:
    branch: main
  secretRef:
    name: aerie-site-git
