# The two-layer split that orders the whole of Phase 3 (the cluster plan 3b.3).
#
# Layer 1, infra-controllers: the HelmRepositories and HelmReleases that install
# operators and, with them, their CRDs - External Secrets, cert-manager,
# kube-vip, Longhorn, CloudNativePG.
#
# Layer 2, infra-config: the objects those CRDs define - a ClusterSecretStore,
# ExternalSecrets, ClusterIssuers, a Certificate, StorageClasses, Traefik's
# HelmChartConfig and TLSStore. None of these can even be *applied* until layer
# 1 has registered the types they use.
#
# That, and only that, is the ordering constraint. The original plan chained
# HelmReleases to each other with dependsOn on the theory that "cert-manager and
# CNPG need AWS credentials only ESO can supply" - which is wrong twice: neither
# controller needs a credential (the ClusterIssuer does), and a Ready
# HelmRelease never implied a synced Secret anyway. Serializing controller
# installs behind each other buys nothing and hides the real constraint. A layer
# boundary states it exactly: types first, then instances of those types.
#
# `wait: true` on infra-controllers is what makes the boundary real rather than
# decorative. dependsOn waits for the dependency Kustomization to report Ready,
# and without `wait` a Kustomization is Ready as soon as its objects are
# *applied* - which for a HelmRelease means the CR exists, not that the chart
# installed or that a single CRD landed. With `wait`, Flux holds until every
# applied object is healthy, so infra-config starts against a cluster that
# genuinely has the types it needs.
#
# ---------------------------------------------------------------------------
# On the ${...} tokens these two Kustomizations resolve
#
# Both carry postBuild.substituteFrom the aerie-cluster-config ConfigMap that
# Provision 4 plants (scripts/k3s/cluster-config.json is the committed half that
# says which keys exist). That is how a domain, a VIP or a replica count reaches
# a manifest without being committed - docs/ethos.md keeps per-installation
# values out of git, and this is the mechanism that lets it.
#
# `optional` is deliberately left at its default of false. A missing ConfigMap
# fails reconciliation loudly; treating it as optional would substitute empty
# strings into every manifest below and apply the result, which is a cluster
# that comes up subtly wrong rather than one that refuses to come up.
#
# Two things to know before writing manifests under either path, because both
# bite silently:
#
#   1. Substitution is not scoped to tokens we chose. Flux expands every $VAR
#      and ${VAR} in the *built output* of the path, including ones that belong
#      to some upstream chart's values - Prometheus rule bodies with $labels,
#      shell in a ConfigMap, anything with a bare $. Escape those as $$, or
#      annotate the object kustomize.toolkit.fluxcd.io/substitute: disabled.
#   2. An undefined token expands to an empty string, not an error, unless the
#      controller runs with strict substitutions. So ${DOMIAN} is not a failed
#      reconciliation; it is an Ingress with no host. Spell the keys from
#      cluster-config.json, and 3b.13's portability grep over deploy/ is what
#      catches the ones that got away.
# ---------------------------------------------------------------------------
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  # Longer than the root's 10m on purpose: this layer is HelmReleases, and
  # re-applying an unchanged HelmRelease every ten minutes achieves nothing.
  # Drift inside a release is helm-controller's job, on its own interval; a git
  # change is picked up by the source poll regardless of this number.
  interval: 30m
  retryInterval: 2m
  # Generous because `wait` is on and this layer installs Longhorn, whose
  # DaemonSets and engine images take minutes on a cold node. Too short here
  # reports a failure that is only slowness, and then infra-config is blocked
  # behind a lie.
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/cluster/infrastructure/controllers
  # An object deleted from the tree is deleted from the cluster. Without this
  # the repository is an append-only log of things once applied rather than the
  # whole truth about the cluster.
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: aerie-cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  # The boundary. Everything under config/ names a type that something under
  # controllers/ installs.
  dependsOn:
    - name: infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/cluster/infrastructure/config
  prune: true
  # Also true here, and it is the phase gate as much as the ordering: a
  # ClusterSecretStore that never reaches Ready, or a Certificate stuck on a
  # DNS-01 challenge, should surface as a Kustomization that is not Ready
  # rather than as a green reconciliation over a broken object. Expect this to
  # sit NotReady during 3b.10's deliberate stop at the staging issuer - that is
  # the report, not a fault.
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: aerie-cluster-config
