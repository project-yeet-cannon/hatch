# The trading plan (docs/plans/trading.md) Phase 5 asks for a
# PodDisruptionBudget on the workers, and it is worth being precise about what
# this one is protecting, because it is not availability: nothing in the
# household depends on a sweep finishing, and a cluster with zero workers
# running is a cluster whose queue simply waits.
#
# What it protects is the *in-flight* runs. A drain that evicted both workers
# at once would put every run they held onto the lease timeout - correct, and
# recovered from automatically, but fifteen minutes of a sweep looking stalled
# for a reason that has nothing to do with the sweep. Evicting one at a time
# means the other keeps claiming while the first restarts, and the runs the
# first was holding are the only ones that wait.
#
# maxUnavailable: 1 rather than minAvailable, the same choice
# charts/aerie/templates/poddisruptionbudgets.yaml writes out at length: a PDB
# expressed as a floor turns a planned reboot into a stuck `kubectl drain` the
# moment the replica count changes underneath it, and a PDB that blocks
# maintenance is worse than no PDB.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-worker
  namespace: trading
  labels:
    app.kubernetes.io/name: trading
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: aerie
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trading
      app.kubernetes.io/component: worker
