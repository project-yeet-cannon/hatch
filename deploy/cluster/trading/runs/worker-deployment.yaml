# The trading plan (docs/plans/trading.md) Phase 5 - the sweep workers.
#
# ---------------------------------------------------------------------------
# Why this is a Deployment and not a Job per sweep
#
# A Job per sweep is the obvious shape and it is wrong here for the reason the
# phase gates on: *"killing a worker mid-sweep loses no runs and duplicates
# none"*. A Job's parallelism is fixed at creation, its completion count has to
# be known up front, and a pod that dies takes its slot's work with it unless
# something outside re-derives what was left. All three of those are already
# answered by the queue - the run table *is* the work list, a lease is what
# survives a lost pod, and parallelism is `replicas` - so a Job would be a
# second scheduler layered over one that already works.
#
# It also makes the scale knob a number rather than an event: `kubectl scale
# deployment/trading-worker --replicas=4` speeds a sweep up and 0 pauses it,
# with no sweep needing to know either happened.
#
# ---------------------------------------------------------------------------
# The CPU limit, which is the one deliberate break with this repository's
# convention
#
# Every other workload in deploy/ sets memory limits and no CPU limit, because
# CPU is compressible and a limit only ever adds throttling. This one sets a
# CPU limit on purpose, and the plan says why in one sentence: *"a sweep is
# deliberately unbounded compute, and the cluster runs a household. The limit
# is the point."*
#
# The difference is the workload, not a change of mind about limits. Every
# other pod here does work that arrives - a request, a photo, a backup - and
# consumes CPU in proportion to it. A backtest worker consumes exactly as much
# CPU as it is given, for as long as the queue is not empty, by design. Without
# a limit, four replicas of this on a three-node cluster is a household whose
# Home Assistant, whose DNS and whose photo library all get slower for the
# duration of an experiment nobody is watching - and the failure is not an
# outage, which would at least be noticed, but everything being mildly worse
# for an afternoon.
#
# One core each and two replicas: two cores of a cluster that has considerably
# more, which finishes the demo sweep in seconds and a ten-thousand-run search
# overnight. Raising it is a deliberate edit by someone who has decided the
# house can spare more.
#
# ---------------------------------------------------------------------------
# No init container, and that is load-bearing
#
# ../app/deployment.yaml runs `alembic upgrade head` in an init container, with
# `replicas: 1` and `strategy: Recreate`, precisely so that exactly one process
# migrates. A worker that migrated on startup would make every scale-up a race
# between however many replicas were being added, which is the failure that
# init container exists to prevent. Workers therefore assume the schema and
# depend on the control plane having applied it - which the Flux ordering
# already guarantees, since both live under the same `trading` Kustomization
# and its `wait: true` does not report Ready until the control plane's pod is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-worker
  namespace: trading
  labels:
    app.kubernetes.io/name: trading
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: aerie
spec:
  # Two. Enough that the "SKIP LOCKED arbitrates between concurrent claimers"
  # property is exercised by the actual deployment rather than only by a test,
  # and enough that losing one to a node drain halves a sweep's throughput
  # rather than stopping it.
  replicas: 2
  # RollingUpdate, unlike the control plane next door, and for the opposite
  # reason: there is no migration to order and no state to hand over, so a
  # rollout that briefly runs three workers is three workers claiming off one
  # queue. maxUnavailable: 0 keeps the sweep moving during a deploy.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trading
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: aerie
    spec:
      # Nothing here reads Kubernetes. Stated rather than left to the default.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      # A worker handles SIGTERM by finishing the run in flight and then
      # exiting (aerie_trading/runs/worker.py). Ninety seconds is generous
      # against a backtest over the windows this silo collects, and the lease
      # is what covers the case where it is not - so this is an optimisation
      # that saves a redo, not a correctness requirement.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # The same image and tag as the control plane and the collectors -
          # one substitution feeds all three, so a worker can never be reading
          # partitions in a format the collector that wrote them did not
          # produce, or writing a `run` row the control plane cannot read.
          image: "${IMAGE_REGISTRY}/aerie-trading:${TRADING_IMAGE_TAG}"
          command:
            - python
            - -m
            - aerie_trading.runs
            - work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # The lake, mounted read-only below. A value rather than the
            # settings default, which is a relative path chosen so that a pod
            # whose volume failed to mount fails visibly.
            - name: TRADING_LAKE_ROOT
              value: /lake
            # libpq's own names, from the Secret CNPG generated - the same
            # block ../app/deployment.yaml and ../lake/cronjob-bars.yaml carry,
            # duplicated rather than shared because kustomize has no named
            # templates and a YAML anchor would not survive a strategic merge.
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: trading-pg-app
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: trading-pg-app
                  key: port
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: trading-pg-app
                  key: dbname
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: trading-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-pg-app
                  key: password
          # See the header. The CPU limit is the phase's requirement and the
          # memory limit is the usual one: a worker holds one loaded history -
          # a decade of one symbol's minute bars is the large case - plus
          # DuckDB's read buffers, and the limit is where a run that tried to
          # hold more gets stopped rather than taking a node's page cache with
          # it. `history_cache` (TRADING_RUNS__HISTORY_CACHE, default 2) is
          # what bounds how many of those are held at once.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          # No probes, and that is a decision rather than an omission. A worker
          # serves no traffic, so there is nothing for a readiness probe to
          # gate and no endpoint for a liveness probe to call - adding an HTTP
          # server to this process purely to be probed would be a second
          # surface behind no auth wall. What a liveness probe would be for -
          # a worker that wedged holding a run - is already answered by the
          # lease: the run is reclaimed and finished by somebody else, which
          # is the outcome a restart was going to produce anyway.
          volumeMounts:
            - name: lake
              mountPath: /lake
              # Read-only, unlike the collectors that mount the same PVC. A
              # worker has no business writing to the lake, and the mount is
              # where that is enforced rather than a rule the code follows.
              # It also means a worker cannot corrupt a partition a collector
              # is mid-way through replacing.
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: lake
          persistentVolumeClaim:
            claimName: trading-lake
            readOnly: true
        # The image writes no bytecode and the root filesystem is read-only;
        # this is for anything in the dependency tree that assumes a writable
        # temporary directory - DuckDB spills here if a query ever needs to.
        - name: tmp
          emptyDir: {}
