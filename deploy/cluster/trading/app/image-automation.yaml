# The trading plan (docs/plans/trading.md) Phase 1 - how a build of
# src/Aerie.Trading/ reaches the cluster.
#
# The same three-object mechanism the app tier uses (../../apps/automation/),
# minus the third: image-reflector-controller scans the repository, an
# ImagePolicy picks the newest tag of the shape publish.yml emits, and the
# ImageUpdateAutomation that turns that into a commit is **the one in
# ../../apps/automation/image-update-automation.yaml** rather than a second
# object here. That controller writes setters wherever it finds a marker in the
# site repository, so one automation covers every policy; a second would be two
# controllers committing to one branch.
#
# The operator-side step this implies is written down in the plan and in
# src/Aerie.Trading/README.md, because nothing in this repository can do it:
# the site repo's image-tags.yaml needs a `trading:` entry carrying the marker
#
#   trading: <a real tag>  # {"$imagepolicy": "flux-system:trading:tag"}
#
# Until that line exists, ${TRADING_IMAGE_TAG} resolves to nothing and this
# Kustomization fails its build - loudly, and only this one, which is the
# failure mode the layer split in ../../trading.yaml was chosen for.
#
# Namespace flux-system, not trading: these are Flux control objects, the same
# reasoning ../../apps/helmrelease.yaml's header gives for living there.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: trading
  namespace: flux-system
spec:
  image: ${IMAGE_REGISTRY}/aerie-trading
  interval: 5m
  secretRef:
    # The flux-system copy of 5b.1's dockerconfigjson Secret. Scanning a
    # private repository needs the same credential a pod needs to pull from it.
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: trading
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: trading
  # `<14-digit UTC timestamp>-<sha>`, the shape publish.yml emits alongside
  # `latest` and the bare sha. Neither of those two is selectable as "newest" -
  # one is a moving pointer and the other has no order - which is the whole
  # reason the timestamped tag exists. filterTags narrows to that shape and
  # extracts the timestamp; the policy compares it numerically.
  filterTags:
    pattern: '^(?P<ts>\d{14})-[0-9a-f]+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
