# The trading plan (docs/plans/trading.md) Phase 1 - how the ingress and the
# Prometheus scrape reach the pod.
#
# The port is *named*, and that is load-bearing rather than tidy: the
# ServiceMonitor in ../../observability/config/scrape/trading.yaml selects the
# endpoint to scrape by port name, so renaming it here silently stops the
# scrape without anything reporting a fault.
apiVersion: v1
kind: Service
metadata:
  name: trading
  namespace: trading
  labels:
    app.kubernetes.io/name: trading
    app.kubernetes.io/component: control
    app.kubernetes.io/part-of: aerie
spec:
  selector:
    app.kubernetes.io/name: trading
    app.kubernetes.io/component: control
  ports:
    - name: http
      port: 8080
      targetPort: http
