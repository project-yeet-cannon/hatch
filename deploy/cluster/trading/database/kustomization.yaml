# Layer for the trading-database Flux Kustomization (../../trading.yaml): the
# Ledger, and its WAL destination.
#
# Order here is applied order, matching ../../photos/database/kustomization.yaml
# and ../../data/cluster/: the ObjectStore first, so the Cluster's WAL archiver
# never targets a destination that does not exist yet. It is not a correctness
# problem either way - CNPG's archiver retries continuously - but the cost of
# the wrong order is a minute of noisy archive failures in the log of a
# brand-new cluster, which is exactly when someone is watching it.
#
# The Database CR and the ScheduledBackup do assume the Cluster answers, and
# they are in this same Kustomization rather than a second one for the reason
# ../../photos/database/kustomization.yaml gives: both are reconciled by the
# operator, which retries forever. The thing that genuinely cannot tolerate a
# missing primary is the migration in ../app, and that is what the layer split
# in ../../trading.yaml exists for.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - objectstore.yaml
  - cluster.yaml
  - database.yaml
  - scheduledbackup.yaml
