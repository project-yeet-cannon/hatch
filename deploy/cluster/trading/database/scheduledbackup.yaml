# The trading plan (docs/plans/trading.md) Phase 1 - nightly base backups
# through the same barman-cloud plugin ./cluster.yaml's `plugins:` block
# already enables for continuous WAL archiving. Modeled on
# ../../photos/database/scheduledbackup.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: trading-pg-daily
  namespace: trading
spec:
  cluster:
    name: trading-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Six fields, not five - CNPG's schedule carries a leading seconds field. A
  # five-field expression is accepted and silently fires an hour off from what
  # it reads as.
  #
  # 01:30, chosen against what else already runs on these nodes rather than
  # against anything about this database. Taken: 01:00 immich-pg's base backup,
  # 02:00 aerie-pg's, 03:10 the restic backup, 04:00 Sundays the restic verify.
  # 01:30 sits in the gap between the two CNPG backups so the three never
  # compress and upload at once.
  #
  # Nodes run UTC (Linux VMs with no TZ set, and CNPG's scheduler has no
  # timezone field), which is the frame every schedule above is in. It is also
  # comfortably outside US market hours in either direction, which is what
  # matters once Phase 3's collectors are writing during a session.
  schedule: "0 30 1 * * *"
  backupOwnerReference: self
  # Take the first base backup on apply rather than waiting for 01:30 - which
  # is what makes this phase's gate ("a CNPG backup of the trading database has
  # completed once") checkable in the same sitting it is committed in.
  immediate: true
