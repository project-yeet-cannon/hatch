# The trading plan (docs/plans/trading.md) Phase 3 - the local half of the
# restic repository pair, reached from the `trading` namespace.
#
# **The same repository ../../data/backup/local-repo-volume.yaml mounts, not a
# second one.** Read that file for the reasoning behind every field here; only
# what differs is annotated below. Two repositories in one share would be two
# indexes, two retention policies and two chances for a `forget --prune` to
# hold a lock the other is waiting on - and the deduplication that makes a
# nightly full-tree snapshot cheap works within a repository, not across a
# share.
#
# A PersistentVolume is cluster-scoped and a PersistentVolumeClaim is not, and
# a PV can be bound by exactly one claim, so reaching an existing repository
# from a second namespace means a second PV object pointing at the same
# `source`. Two things about that are load-bearing:
#
#   - **A distinct `volumeHandle`.** The neighbouring file's own comment says
#     it: two PVs sharing a handle are one volume to the CSI layer, and the
#     second mount silently inherits the first one's options. Here that would
#     mean this mount inheriting a uid or a read-only flag it did not ask for.
#   - **`claimRef` pins it to this namespace's claim**, so a PVC from anywhere
#     else cannot win the race for it.
#
# `nodeStageSecretRef` names the `smb-share` Secret in the *aerie* namespace,
# and that is not a mistake: the reference is resolved by the CSI driver rather
# than by this namespace, so it does not need a copy of the credential here.
# One fewer ExternalSecret target for a value that has not changed.
#
# Retain, like its neighbour, and it matters for the same reason with more
# force: this tree reconciles with `prune: true`, and the object being pruned
# would be a mount of the only backup repository that is not in AWS.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: trading-restic-local
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    # uid/gid 70, matching containers/backup/Dockerfile's `USER postgres` -
    # the share is a guest CIFS mount, so ownership is presented client-side
    # by these options and the permission check happens client-side against
    # them. This is why ./chains-backup-cronjob.yaml deliberately does not
    # override runAsUser the way every other trading pod does.
    - dir_mode=0770
    - file_mode=0660
    - uid=70
    - gid=70
    - vers=3.0
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: trading-restic-local
    readOnly: false
    volumeAttributes:
      # The identical path to the aerie namespace's PV, because it is the
      # identical repository. ${RESTIC_LOCAL_SUBPATH} resolves through this
      # layer's postBuild.substituteFrom (../../trading.yaml), and
      # kustomize-controller substitutes in strict mode - so a missing key
      # fails the build outright rather than mounting the share root.
      source: "//${SHARE_HOST}/${SHARE_NAME}/${RESTIC_LOCAL_SUBPATH}"
    nodeStageSecretRef:
      name: smb-share
      namespace: aerie
  claimRef:
    namespace: trading
    name: trading-restic-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trading-restic-local
  namespace: trading
  labels:
    app.kubernetes.io/name: trading
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: aerie
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: trading-restic-local
  resources:
    requests:
      storage: 1Ti
