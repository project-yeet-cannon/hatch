apiVersion: batch/v1
kind: CronJob
metadata:
  name: trading-chains-close
  namespace: trading
  labels:
    app.kubernetes.io/name: trading
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: aerie
spec:
  # The closing board, at the session's last minute rather than at its
  # close. 16:00 is outside the session - `contains` is half-open - and
  # 15:59 is the instant the session's last minute bar opens at, so the
  # closing board and the closing bar describe the same minute. The same
  # arithmetic `snapshot_times()` does, expressed in cron.
  schedule: "59 15 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  # Thirteen firings a session against one a day next door, so the histories
