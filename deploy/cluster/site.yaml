# The cluster plan Phase 5b.4 - the two-Kustomization split that reaches the
# private per-installation site repo (5a.3): where the tag bumps 5b.12's image
# automation writes actually live, and where 5b.10's apps layer reads them
# from at reconcile time.
#
# site-source: applies ./deploy/cluster/site from *this* repository, via the
# flux-system GitRepository every other Kustomization here reads from. The
# one object it contains, aerie-site/gitrepository.yaml, is itself a
# GitRepository - naming the site repo's clone URL, which is why this layer
# needs postBuild.substituteFrom the aerie-cluster-config ConfigMap
# (${SITE_REPO_URL}) and site-config does not.
#
# site-config: applies ./ from the *site* repo (sourceRef: aerie-site, the
# object site-source just created), with dependsOn: site-source and no
# substitution at all. Nothing in the site repo is a template - it holds one
# ConfigMap (5a.3's image-tags.yaml) that 5b.12's automation edits directly -
# and a ${...} appearing there later would mean the split between "this repo"
# and "the site repo" had been drawn in the wrong place.
#
# The split itself is not ceremony: the object that defines the site source
# cannot be reconciled *from* the site source, so the two have to be separate
# Kustomizations, and dependsOn is what keeps the ordering between them from
# being a retry loop that merely happens to converge instead of a boundary
# that is actually enforced.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: site-source
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/cluster/site
  prune: true
  # kstatus reads status.conditions for a Ready condition, and GitRepository
  # publishes one - this should work the same way data-cluster's wait on the
  # CNPG Cluster does (../data.yaml). If site-source goes Ready before
  # aerie-site's own clone actually succeeds, fall back to an explicit
  # healthChecks entry naming the GitRepository.
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: aerie-cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: site-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  # The boundary: site-config reads from the GitRepository site-source just
  # applied, so it cannot reconcile before that object exists and has cloned.
  dependsOn:
    - name: site-source
  sourceRef:
    kind: GitRepository
    name: aerie-site
  path: ./
  prune: true
  wait: true
  # Deliberately no postBuild here. Nothing in the site repo is a template -
  # see the top comment.
