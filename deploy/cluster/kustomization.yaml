# The root of the tree Flux reconciles. Provision 3 creates a Kustomization
# pointing here; everything the cluster runs is reached from this file.
#
# It exists as a committed skeleton because Provision 3 runs `flux install`
# rather than `flux bootstrap`, and so - unlike bootstrap - never writes to
# this repository. Nothing creates this path at run time: an empty or missing
# directory is a Kustomization that never goes Ready.
#
# Note what is *not* here and never will be: Flux's own gotk-components.yaml
# and gotk-sync.yaml. The controllers are installed from the pin in
# scripts/versions.json, and the sync configuration is a per-installation fact
# that lives in the cluster. See docs/ethos.md.
#
# What this root contains is deliberately only pointers. It applies no workload
# of its own, because the Kustomization Provision 3 created for it carries no
# postBuild.substituteFrom - that lives on the child Kustomizations in
# infrastructure.yaml and data.yaml, which is the only place a ${...} token
# resolves.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - infrastructure.yaml
  # The cluster plan Phase 4: data-cluster -> data-schema, depending on
  # infra-config the same way infra-config depends on infra-controllers.
  - data.yaml
  # The cluster plan Phase 5b.4: site-source -> site-config, reaching the
  # private per-installation site repo that 5b.10's apps layer and 5b.12's
  # image automation both depend on.
  - site.yaml
  # The cluster plan Phase 5b.10: the app tier itself - the HelmRelease
  # installing charts/aerie, depending on data-schema and site-config above.
  - apps.yaml
