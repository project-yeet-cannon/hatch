# The cluster plan Phase 4b.6 - Aerie's Postgres, the centre of the phase.
# Listed after ./objectstore.yaml (4b.5) in ./kustomization.yaml so archiving
# never starts against a destination that doesn't exist yet - see the ordering
# note at the top of that file for what this guarantees and what it doesn't.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aerie-pg
  namespace: aerie
spec:
  # 2 during the build window, exactly parallel to LONGHORN_REPLICA_COUNT.
  # Phase 7 raises this to 3 by changing the repository variable and
  # re-dispatching Provision 4 - no commit, which is the point of the
  # ConfigMap this substitutes from. The substitution is textual and happens
  # before YAML parsing, so this renders as `instances: 2` and parses as an
  # integer; quoting it would produce the type error the operator's own
  # schema does catch.
  instances: ${POSTGRES_INSTANCES}

  # Pinned to the major Phase 4a.5 recorded (prod runs postgres:18.4) or
  # newer - never left unset. pg_restore only goes forwards across major
  # versions, so an unpinned image is a major-version change that could arrive
  # inside a routine chart bump, with no way back from it.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  storage:
    storageClass: local-path
    # Sized from the current pgdata volume with room to grow. Postgres does
    # not go on Longhorn - see docs/plans/swarm/design.md#storage-split -
    # replicating Postgres's own replication on top of distributed block
    # storage is wasteful and slow.
    size: 20Gi

  # A separate PVC from pgdata, same class. WAL and data sharing one volume
  # means a WAL burst can fill the data disk and stop the primary; keeping
  # them apart also makes the two independently sizable, which matters once
  # archiving is on and a network problem backs WAL up locally.
  walStorage:
    storageClass: local-path
    size: 10Gi

  postgresql:
    # The live synchronous-replication API, replacing the deprecated
    # minSyncReplicas/maxSyncReplicas pair - the two are mutually exclusive
    # and CNPG 1.30 no longer accepts the old one for a new Cluster.
    synchronous:
      method: any
      number: 1
      # preferred, not the required default - the single most consequential
      # line in this file. required gives RPO=0 but pauses every write
      # whenever the synchronous standby is unavailable, and Phase 1's
      # staggered Windows Update reboots make one node unavailable on a
      # schedule - on two instances that is a recurring, self-inflicted write
      # outage that presents as a hung site, with nothing in Postgres's own
      # logs but a wait. preferred degrades to asynchronous replication while
      # the standby is away and re-arms once it returns.
      #
      # Revisit in Phase 7: with three instances and number: 1, a single node
      # reboot no longer costs the quorum, and required becomes affordable.
      dataDurability: preferred

  # required, not the preferred default: preferred will happily co-locate two
  # instances on one node under pressure, which silently converts an HA
  # database into a single point of failure - and the failure being invisible
  # is the argument for required here. Two instances across two nodes is a
  # clean split; the third instance Phase 7 adds still fits, because required
  # anti-affinity is a per-pod constraint, not a per-node cap. What it does
  # cost is that a two-node cluster asked for 3 instances would leave one pod
  # permanently Pending, which is the reason 4b.7's pattern caps
  # POSTGRES_INSTANCES at the node count.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required

  # Goal 2 does not work without requests - the scheduler cannot place or
  # rebalance what it cannot size (design.md#how-goal-2-actually-works). Sized
  # for a database this small; revisit once real usage is observed.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

  bootstrap:
    initdb:
      database: aerie
      owner: aerie
      # CNPG generates the password and publishes it as the aerie-pg-app
      # Secret - what Phase 5's connection strings read, and what finally
      # retires appsettings.Docker.json's hardcoded user/password
      # (design.md Finding 2).

  # The WAL archiver. This one block enables both continuous WAL archiving and
  # ScheduledBackup base backups (../schema/scheduledbackup.yaml, 4b.10)
  # through the same plugin. Archiving starts on the primary as soon as the
  # Cluster does, which is why ./objectstore.yaml has to exist first.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        # Bare name, resolved in this namespace - ./objectstore.yaml.
        barmanObjectName: aerie-pg-wal

  # Let the operator switch over on an image or config change rather than
  # waiting on a human `kubectl cnpg promote`. With dataDurability: preferred
  # and a healthy standby this is a safe default; a supervised strategy here
  # would mostly mean a rollout that silently never finishes.
  primaryUpdateStrategy: unsupervised

  # Left at its default (false). 4b.8's DDL Job and 4b.9's restore Job are
  # both designed to run as the aerie owner role; needing a superuser would be
  # a sign one of them is doing something it should not.
  enableSuperuserAccess: false

  # False until Phase 6 registers the PodMonitor CRD - see
  # ../../infrastructure/controllers/cloudnative-pg.yaml, whose HelmRelease
  # already ships the ~480 lines of exporter queries this will scrape.
  monitoring:
    enablePodMonitor: false
