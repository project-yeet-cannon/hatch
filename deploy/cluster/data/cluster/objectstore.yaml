# The cluster plan Phase 4b.5 - the WAL/base-backup destination. Listed before
# ./cluster.yaml (4b.6) in ./kustomization.yaml, which kustomize-controller
# generally honours as apply order within one pass - but this and cluster.yaml
# both live in the same data-cluster Kustomization (../../data.yaml) with no
# `wait` *between* them, only around the whole layer, so a Cluster created a
# moment before this object exists is possible in principle. It is not a
# correctness problem either way: CNPG's WAL archiver retries continuously
# rather than failing once, so the cost of the wrong order is a few extra
# archive attempts before this object appears, not a stuck Cluster.
#
# Namespace aerie, not cnpg-system - this is an instance the Cluster
# references by bare name (barmanObjectName in 4b.6), which resolves in the
# Cluster's own namespace, and it sits beside the object that uses it the same
# way every Phase 4 data object does (see "Where these files live" at the
# bottom of the phase doc).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: aerie-pg-wal
  namespace: aerie
spec:
  configuration:
    # A dedicated bucket (4a.2), never the restic one: barman-cloud owns its
    # own prefix layout (base/, wals/) and expects to be the only writer.
    destinationPath: s3://${WAL_BUCKET}/
    s3Credentials:
      # The three keys ESO syncs into cnpg-wal-s3 (4b.3) - one Secret, so the
      # pair (and the region alongside it) cannot half-rotate.
      accessKeyId:
        name: cnpg-wal-s3
        key: access-key-id
      secretAccessKey:
        name: cnpg-wal-s3
        key: secret-access-key
      # A SecretKeySelector, not a string - the reason postgres/wal-s3-region
      # exists as a Kubernetes-backed parameter in scripts/secrets/parameters.json
      # rather than as a ${...} substitution, even though a region isn't secret.
      region:
        name: cnpg-wal-s3
        key: region
    wal:
      compression: gzip
    data:
      compression: gzip
  # barman's own pruning, and the only thing that deletes from this bucket -
  # 4a.2's bucket-side lifecycle rule only cleans up noncurrent versions from
  # S3 versioning, never current objects. A bucket policy that also deletes
  # current objects produces a WAL gap that only shows up during a restore.
  # A sibling of `configuration`, not nested inside it - confirmed against
  # the live CRD (`kubectl explain objectstore.spec`) after the plugin's
  # actual API put it there rather than where the phase-4 draft assumed.
  retentionPolicy: "30d"
  # Goal 2 does not work without requests on every workload the scheduler
  # places, and the plugin's sidecar - injected into every instance pod
  # ./cluster.yaml's `plugins:` block names - is one the Cluster spec itself
  # has no field for. This is the other half of ./cluster.yaml's own
  # spec.resources: same instances, same reasoning, sized for the sidecar
  # rather than for Postgres itself.
  #
  # 128Mi was the original guess and it OOMKilled mid-backup (exit 137)
  # against this cluster's own first base backup - WAL archiving's small
  # 16MB segments fit fine, but barman-cloud-backup buffers and multipart-
  # uploads a full base backup, and that needs real headroom. 512Mi observed
  # comfortable on this database's current size; revisit if it grows a lot.
  #
  # The CPU limit is 1 core rather than the 500m it was first given, and the
  # reason is not that the sidecar needs a core - it is that 500m is a CFS
  # quota of 50ms per 100ms period, so a single-threaded gzip is throttled
  # by construction for as long as it runs, no matter how briefly. Measured
  # over 7d before the change: this cluster's sidecars averaged 0.0002-0.25
  # cores over any 5m window (p99 0.0002 on aerie-pg-1) while hitting
  # throttled-period ratios of 0.28 on aerie-pg-3 and 0.94 on aerie-pg-1.
  # That gap between a rounding-error average and near-total throttling is
  # the signature of short bursts biting a quota, not of a workload that
  # wants more CPU, and it is what kept `CPUThrottlingHigh` (severity=info,
  # >25% throttled periods over 5m) pending against these pods - which in
  # turn is what kept the chart's `InfoInhibitor` firing at a phone. See
  # ../../observability/controllers/kube-prometheus-stack.yaml's blackhole
  # route for the other half of that; this is the half that removes the
  # cause rather than the notification.
  #
  # A core gives a single compressor a full period's runtime, which covers
  # WAL archiving - one 16MB segment at a time, the common case. A base
  # backup with parallel workers can still bite; that is a deliberately
  # accepted remainder rather than an oversight, because the alternative is
  # dropping the CPU limit entirely and this cluster keeps limits on
  # everything the scheduler places. Requests stay at 50m: the measured
  # steady-state demand is far below even that, and requests are what the
  # scheduler and CFS shares actually read.
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  # Left empty on purpose. serverName exists only for API compatibility with
  # the deprecated in-tree barmanObjectStore; the live path names the server
  # through the plugin parameters in ./cluster.yaml's `plugins:` block
  # instead (barmanObjectName), and through externalClusters.serverName on the
  # PITR rehearsal in ../schema/scheduledbackup.yaml (4b.10).
