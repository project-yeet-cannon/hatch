# Layer for the data-cluster Flux Kustomization (../../data.yaml): the
# database itself and its WAL destination, nothing that assumes the database
# already answers queries. See ../../data.yaml for why this is a separate
# path from ../schema rather than one directory - a Job applied in the same
# pass as the Cluster would start against a database that isn't up yet and
# burn its backoffLimit before the primary is.
#
# Order here is applied order, per ./objectstore.yaml's top comment: the
# ObjectStore first, so the Cluster's WAL archiver never targets a
# destination that doesn't exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - objectstore.yaml
  - cluster.yaml
