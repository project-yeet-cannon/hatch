# The cluster plan Phase 4b.9 - the restore, as a re-runnable Job. Committed
# suspended so Flux reconciling this file can never itself trigger a data
# load; a real run is always a deliberate human action:
#
#   kubectl -n aerie get job aerie-pg-restore -o json \
#     | jq 'del(.spec.selector, .spec.template.metadata.labels, .status,
#              .metadata.uid, .metadata.resourceVersion, .metadata.generation,
#              .metadata.creationTimestamp, .metadata.managedFields,
#              .metadata.annotations, .metadata.labels)
#           | .metadata.name = "aerie-pg-restore-run"
#           | .spec.suspend = false' \
#     | kubectl -n aerie create -f -
#
# Not `kubectl create job --from=job/aerie-pg-restore`, which is what this
# comment said until a real run tried it: `--from` accepts a CronJob and
# nothing else ("unknown object type *v1.Job"). Nor `kubectl patch ...
# suspend=false` on the committed Job itself - that works exactly once, and
# races Flux, whose next reconcile of this file sets suspend back to true and
# would tear down the pods of a restore already in flight. Copying the spec
# to a new name is the only shape that is both re-runnable and safe to leave
# running. If this gets tiresome, the idiomatic fix is to make this a
# CronJob with a schedule that never fires, which is what makes the original
# `--from=` command legal.
#
# Before that command, two things this Job needs that nothing in Phase 4
# generates automatically:
#
#   1. A `aerie-pg-restore-restic` Secret in this namespace, created by hand -
#      not through ESO/parameters.json. scripts/secrets/parameters.json's
#      backup/* parameters are seeded and required, but Phase 8 owns the
#      namespace and CronJob that would turn them into an ExternalSecret
#      (kubernetesDeferred), and this Job runs before Phase 8 exists. Rather
#      than pre-empt that boundary, this one manually-created Secret carries
#      the same values by hand for as long as Phase 4-7 need this Job:
#        kubectl -n aerie create secret generic aerie-pg-restore-restic \
#          --from-literal=repository='s3:s3.amazonaws.com/<bucket>' \
#          --from-literal=password='<restic repository password>' \
#          --from-literal=aws-access-key-id='<aerie-restic access key id>' \
#          --from-literal=aws-secret-access-key='<aerie-restic secret access key>' \
#          --from-literal=aws-region='<region>'
#      Delete it once Phase 8's own ExternalSecret exists and this Job has
#      been updated to read that instead.
#   2. `aerie-pg` reporting Ready, since this Job runs as the `aerie` role
#      from the aerie-pg-app Secret CNPG generates.
#
# From S3, not the local restic repo: see ./restore.sh for why. What it does,
# in order, is documented there rather than split across command args here -
# restic restore, pg_restore --no-owner --no-privileges into both databases,
# then a sanity query. *That* is not this Job's real exit criterion, though:
# run it against the post-4b.1 snapshot 4a.6 took, then hand-compare recent
# channel history and row counts against the old host. The Job's own exit
# code proves the restore didn't error; the hand comparison proves it's right.
apiVersion: batch/v1
kind: Job
metadata:
  name: aerie-pg-restore
  namespace: aerie
spec:
  suspend: true
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      # ghcr.io/<owner>/aerie-backup is private, the same as every other image
      # this repository publishes, so this pull needs the credential
      # ../../infrastructure/config/external-secrets/aerie-ghcr-pull.yaml
      # lands in this namespace - exactly what charts/aerie's own
      # migrate-job.yaml does through `image.pullSecret`. Missing here until a
      # real run hit it, and the failure gives no hint of the cause: kubelet
      # falls back to an anonymous token and reports a bare
      # `401 Unauthorized` from ghcr.io, which reads like the image is absent
      # rather than like the pod never presented a credential.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: restore
          # Already ships restic and postgres:18.4's psql/pg_restore - see
          # containers/backup/Dockerfile. Its own ENTRYPOINT (supercronic) is
          # overridden below; this container runs the script once and exits.
          #
          # ${IMAGE_REGISTRY} rather than the registry this repository's author
          # happens to push to: it resolves from aerie-cluster-config through
          # data-schema's postBuild.substituteFrom (../../data.yaml), the same
          # way ${POSTGRES_INSTANCES} does next door. A registry host baked in
          # here is one installation's fact in a shared tree - docs/ethos.md -
          # and 3b.13 greps deploy/ for exactly this. Changing it re-applies an
          # immutable pod template, so the same rule ./kustomization.yaml gives
          # for a script edit applies: delete the suspended Job and let Flux
          # recreate it.
          image: ${IMAGE_REGISTRY}/aerie-backup:latest
          command: ["sh", "/scripts/restore.sh"]
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-app
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-app
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-app
                  key: password
            - name: RESTIC_REPOSITORY
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-restore-restic
                  key: repository
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-restore-restic
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-restore-restic
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-restore-restic
                  key: aws-secret-access-key
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-restore-restic
                  key: aws-region
          volumeMounts:
            - name: restore-script
              mountPath: /scripts
              readOnly: true
            - name: restore-data
              mountPath: /restore
      volumes:
        - name: restore-script
          configMap:
            name: aerie-pg-restore-script
            defaultMode: 0o555
        # emptyDir, not a PVC: the restored dumps only need to exist for this
        # one Job run, and its node has room for a Postgres-sized dump
        # (local-path already assumes single-node-sized state for aerie-pg
        # itself). A PVC would outlive the Job and need its own cleanup.
        - name: restore-data
          emptyDir: {}
