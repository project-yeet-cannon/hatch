# The cluster plan Phase 4b.9 - the restore, as a re-runnable Job. Committed
# suspended so Flux reconciling this file can never itself trigger a data
# load; running it is always a deliberate human action:
#
#   kubectl -n aerie get job aerie-pg-restore -o json \
#     | jq 'del(.spec.selector, .spec.template.metadata.labels, .status,
#              .metadata.uid, .metadata.resourceVersion, .metadata.generation,
#              .metadata.creationTimestamp, .metadata.managedFields,
#              .metadata.annotations, .metadata.labels)
#           | .metadata.name = "aerie-pg-restore-run"
#           | .spec.suspend = false' \
#     | kubectl -n aerie create -f -
#
# Not `kubectl create job --from=job/aerie-pg-restore`, which is what this
# comment said until someone ran it: `--from` accepts a CronJob and
# nothing else ("unknown object type *v1.Job"). Nor `kubectl patch ...
# suspend=false` on the committed Job itself - that works exactly once, and
# races Flux, whose next reconcile of this file sets suspend back to true and
# would tear down the pods of a restore already in flight. Copying the spec
# to a new name is the only shape that is both re-runnable and safe to leave
# running. If this gets tiresome, the idiomatic fix is to make this a
# CronJob with a schedule that never fires, which is what makes the original
# `--from=` command legal.
#
# Before that command, one thing this Job needs that nothing here creates:
# `aerie-pg` reporting Ready, since it runs as the `aerie` role from the
# aerie-pg-app Secret CNPG generates.
#
# There used to be a second, and the cluster plan Phase 8b.10 retired it. From
# 4b.9 until then this Job read five values out of an `aerie-pg-restore-restic`
# Secret created by hand, because scripts/secrets/parameters.json's backup/*
# parameters were seeded but `kubernetesDeferred` - Phase 8 owned the workload
# that would turn them into an ExternalSecret, and this Job predated it. 8b.1
# flipped those three deferrals into
# ../../infrastructure/config/external-secrets/aerie-restic.yaml, targeting
# Secret `restic` in *this* namespace precisely so one object could serve both
# the side that writes backups and the side that reads them. So the credential
# below is now the same one ../backup/backup-cronjob.yaml uses, it arrives from
# Parameter Store like everything else, and the hand-made Secret is deleted
# (8b.16 asserts it is gone, because this is the kind of cleanup that gets
# half-done).
#
# What that means for anyone reading this in an emergency: there is nothing to
# create first. If `kubectl -n aerie get secret restic` exists and its
# ExternalSecret reports SecretSynced, this Job has its credential.
#
# That rename was an edit to a pod template, which is immutable once the Job
# exists - so the rule ./kustomization.yaml states for a script change and the
# `image:` note below restates applies to it as well, and applied on the day
# 8b.10 landed: `kubectl -n aerie delete job aerie-pg-restore` and let Flux
# recreate it. Flux does not do this for you. It reports the failed apply and
# leaves a Job still holding a reference to a Secret that no longer exists,
# which is a failure that waits until the next emergency to be discovered.
#
# From S3, not the local restic repo: see ./restore.sh for why. What it does,
# in order, is documented there rather than split across command args here -
# restic restore, pg_restore --no-owner --no-privileges into both databases,
# then a sanity query. *That* is not this Job's real exit criterion, though:
# run it against the post-4b.1 snapshot 4a.6 took, then hand-compare recent
# channel history and row counts against the old host. The Job's own exit
# code proves the restore didn't error; the hand comparison proves it's right.
apiVersion: batch/v1
kind: Job
metadata:
  name: aerie-pg-restore
  namespace: aerie
spec:
  suspend: true
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      # ghcr.io/<owner>/aerie-backup is private, the same as every other image
      # this repository publishes, so this pull needs the credential
      # ../../infrastructure/config/external-secrets/aerie-ghcr-pull.yaml
      # lands in this namespace - exactly what charts/aerie's own
      # migrate-job.yaml does through `image.pullSecret`. Missing here until the
      # first run hit it, and the failure gives no hint of the cause: kubelet
      # falls back to an anonymous token and reports a bare
      # `401 Unauthorized` from ghcr.io, which reads like the image is absent
      # rather than like the pod never presented a credential.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: restore
          # Already ships restic and postgres:18.4's psql/pg_restore - see
          # containers/backup/Dockerfile. That image's ENTRYPOINT is a bare
          # shell (it used to be supercronic against its own crontab, until
          # the cluster plan Phase 8b.3 moved scheduling to CronJobs), and the
          # `command` below replaces it outright; this container runs the
          # script once and exits.
          #
          # ${IMAGE_REGISTRY} rather than the registry this repository's author
          # happens to push to: it resolves from aerie-cluster-config through
          # data-schema's postBuild.substituteFrom (../../data.yaml), the same
          # way ${POSTGRES_INSTANCES} does next door. A registry host baked in
          # here is one installation's fact in a shared tree - docs/ethos.md -
          # and 3b.13 greps deploy/ for exactly this. Changing it re-applies an
          # immutable pod template, so the same rule ./kustomization.yaml gives
          # for a script edit applies: delete the suspended Job and let Flux
          # recreate it.
          image: ${IMAGE_REGISTRY}/aerie-backup:latest
          command: ["sh", "/scripts/restore.sh"]
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-app
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-app
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: aerie-pg-app
                  key: password
            # A substitution rather than a Secret key, and that is the one
            # change here that is not just a rename. A repository path is not a
            # credential - it is the same operator value
            # ../backup/backup-cronjob.yaml reads as ${RESTIC_S3_REPOSITORY},
            # and carrying a second copy of it inside a Secret meant two places
            # to change a bucket name and no way to tell they disagreed.
            # scripts/k3s/cluster-config.json is where its shape is enforced.
            #
            # The region rides inside that string's hostname
            # (s3:s3.<region>.amazonaws.com/<bucket>), which is why the
            # AWS_DEFAULT_REGION this Job used to set is simply gone rather
            # than moved: restic will not take a region separately, ./restore.sh
            # runs no aws-cli that would need one, and one value that cannot
            # disagree with itself beats two that can.
            - name: RESTIC_REPOSITORY
              value: ${RESTIC_S3_REPOSITORY}
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restic
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: restic
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: restic
                  key: secret-access-key
          volumeMounts:
            - name: restore-script
              mountPath: /scripts
              readOnly: true
            - name: restore-data
              mountPath: /restore
      volumes:
        - name: restore-script
          configMap:
            name: aerie-pg-restore-script
            defaultMode: 0o555
        # emptyDir, not a PVC: the restored dumps only need to exist for this
        # one Job run, and its node has room for a Postgres-sized dump
        # (local-path already assumes single-node-sized state for aerie-pg
        # itself). A PVC would outlive the Job and need its own cleanup.
        - name: restore-data
          emptyDir: {}
