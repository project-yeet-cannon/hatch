# The cluster plan Phase 8b.5 - the daily logical backup, as a CronJob. The
# exact inverse of ../schema/restore-job.yaml one directory over: same image,
# same `aerie-pg-app` credential, opposite direction. What it runs is
# ../../../../containers/backup/scripts/cluster-backup.sh, and that script
# rather than this file is where the reasoning about *what* gets dumped lives
# (8b.6's `--keep-tag cutover-final` is on the `forget` in there, beside the
# retention it protects).
#
# A CronJob, not the compose-era supercronic the image used to run: 8b.3
# deleted that crontab because a container that schedules itself inside a
# cluster that schedules containers is two schedulers disagreeing about what
# "daily" means. The image's ENTRYPOINT is now a bare shell and the `command`
# below names the script, the same shape ../schema/restore-job.yaml uses.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aerie-backup
  namespace: aerie
spec:
  # 03:10, the slot Phase 0 used, an hour and ten minutes after
  # ../schema/scheduledbackup.yaml's 02:00 CNPG base backup. That gap is
  # finding 7's stagger - two backup jobs reading the same primary at once -
  # and it only exists if both expressions are read in the same reference
  # frame. There is deliberately no `timeZone: ${TZ}` here: CNPG's
  # ScheduledBackup has no timezone field at all and fires in the operator's
  # time (UTC), so pinning this one to a local zone would slide it by the UTC
  # offset and could land it *before* the CNPG backup rather than after. Both
  # are UTC; the stagger survives. ${TZ} is the app tier's key, not this one's.
  schedule: "10 3 * * *"
  # Finding 7 again, and it matters more here than it does for the
  # provisioning CronJobs this shape came from: two concurrent restic writers
  # against one repository is the failure being prevented, not just a doubled
  # workload. A run still going at the next tick is skipped, not queued.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Three days, chosen against failedJobsHistoryLimit above rather than
      # copied from the observability CronJobs' 3600. The two fields fight:
      # the TTL controller deletes a finished Job on its own timer regardless
      # of how many the history limit wants to keep, so a one-hour TTL on a
      # once-a-day job means the pod logs of a failed run are gone long before
      # anyone reads the morning's alert. Three days of a daily job is exactly
      # the three failures failedJobsHistoryLimit asks for.
      ttlSecondsAfterFinished: 259200
      template:
        spec:
          restartPolicy: Never
          # ghcr.io/<owner>/aerie-backup is private, like every image this
          # repository publishes. Without this the kubelet falls back to an
          # anonymous token and reports a bare `401 Unauthorized`, which reads
          # like a missing image rather than a missing credential -
          # ../schema/restore-job.yaml hit exactly that on its first run. The
          # Secret is ../../infrastructure/config/external-secrets/aerie-ghcr-pull.yaml.
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: backup
              # ${IMAGE_REGISTRY}, not a host baked in here: a registry in this
              # tree is one installation's fact (docs/ethos.md), and it
              # resolves from aerie-cluster-config through data-schema's
              # postBuild.substituteFrom (../../data.yaml) - the same
              # substitution ../schema/restore-job.yaml uses for the same
              # image. One image, both directions, which is what keeps pg_dump
              # here version-matched to the pg_restore over there and to
              # ../cluster/cluster.yaml's postgresql:18.4.
              image: ${IMAGE_REGISTRY}/aerie-backup:latest
              command: ["sh", "/app/scripts/cluster-backup.sh"]
              env:
                # From the Secret CNPG generates, never a hostname written
                # down here: CNPG owns that name and rotates that password.
                # `host` is the -rw Service, so the dumps go to the primary.
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: aerie-pg-app
                      key: host
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: aerie-pg-app
                      key: port
                # The `aerie` role, which owns both databases
                # (../schema/quartz-database.yaml's `owner: aerie`) - finding
                # 6's reason the two per-database dumps carry everything a
                # restore needs and the superuser globals carry nothing it can
                # use.
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: aerie-pg-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aerie-pg-app
                      key: password
                # The `restic` Secret 8b.1 syncs into this namespace from the
                # three backup/* parameters that had been "seeded but consumed
                # by nothing" since Phase 2 -
                # ../../infrastructure/config/external-secrets/aerie-restic.yaml.
                # This is the consumer that makes them true.
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: password
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: secret-access-key
                # Not for restic, which takes its region from the regional
                # endpoint inside RESTIC_REPOSITORY_S3 below (finding 5's
                # reason there is no restic region key) - for the aws-cli in
                # 8b.7's export-parameters.sh, which has no endpoint to read
                # one out of and fails with "You must specify a region" when
                # it is unset. Harmless to restic, required by the export, so
                # it is one env var rather than two.
                - name: AWS_DEFAULT_REGION
                  value: ${AWS_REGION}
                # 8b.7's export, and the one value in this file that is not a
                # substitution and not a mount path. It is /aerie because
                # scripts/secrets/parameters.json's own `prefix` field is,
                # which is also what the generated ExternalSecrets one
                # directory over have baked into every remoteRef - so the two
                # halves of the secret story keep agreeing. Set explicitly
                # rather than left to the script's default so that an
                # installation running Sync-AerieSecrets.ps1 with
                # -ParameterPrefix has one obvious line to change, in the same
                # place its ../../infrastructure/config/external-secrets/
                # regeneration would show up.
                - name: PARAMETER_PREFIX
                  value: /aerie
                # The off-site half. A full repository string rather than a
                # bucket name, because the region lives inside its hostname:
                # scripts/k3s/cluster-config.json rejects a bare
                # s3.amazonaws.com here so this can never quietly resolve to
                # us-east-1 at first use.
                - name: RESTIC_REPOSITORY_S3
                  value: ${RESTIC_S3_REPOSITORY}
                # The half that survives losing the AWS account, and the only
                # one of the two that is a path rather than a URL: it is the
                # mount below, so it is fixed here rather than substituted.
                # ${RESTIC_LOCAL_SUBPATH} is a property of the PV, not of this
                # job - see ./local-repo-volume.yaml.
                - name: RESTIC_REPOSITORY_LOCAL
                  value: /mnt/restic-local
              volumeMounts:
                - name: restic-local
                  mountPath: /mnt/restic-local
              # No CPU limit, per the convention every workload in this tree
              # follows. The memory *limit* is deliberately loose rather than
              # sized to the steady state: restic's `forget --prune` holds the
              # repository index in memory and grows with the repo, and an
              # OOMKill lands mid-prune - which leaves a stale lock for the
              # next run to trip over and throws away the repack it had
              # already done. A backup job that occasionally costs a gigabyte
              # for a few minutes is cheaper than that.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            # 8b.4's statically-provisioned SMB claim. No emptyDir beside it:
            # cluster-backup.sh stages the dumps in /tmp on the container's
            # own writable layer, and they only have to outlive the `restic
            # backup` two lines later - the script's own trap removes them.
            - name: restic-local
              persistentVolumeClaim:
                claimName: aerie-restic-local
