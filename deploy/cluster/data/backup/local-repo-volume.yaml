# The cluster plan Phase 8b.4 - the local half of the restic repository pair,
# as a statically-provisioned SMB volume. 8a.2 moved that repository off the
# old Windows host onto the house share before 7c.3 reformatted the disk it
# used to live on, so this PV does not create a repository: it mounts one that
# is already there, at ${RESTIC_LOCAL_SUBPATH} under the same share
# ../../../../charts/aerie/templates/share-volumes.yaml serves media from.
#
# Two repositories rather than one is the whole design (see 8b.5's CronJob,
# which writes both): S3 is the off-site copy and this is the copy that
# survives losing the AWS account. They are written by the same job in the
# same run so they cannot be a different age.
#
# Shaped after share-volumes.yaml - storageClassName: "" with no StorageClass
# involved, an explicit claimRef/volumeName pairing so a PVC from anywhere
# else cannot win the race for this PV, and Retain because deleting the PVC
# must not delete anything on the actual share. Retain matters more here than
# it does there: this tree reconciles with prune: true, and the object being
# pruned would be the only backup repository that is not in AWS.
#
# capacity.storage is required by the PV/PVC API and means nothing for an SMB
# mount - nothing enforces it - so it carries the same honest-looking figure
# its neighbours do rather than a measurement.
#
# One property to confirm on the first run rather than assume: **restic's
# locking on CIFS.** restic coordinates concurrent access through lock files
# in the repository, and CIFS's handling of them is the least-exercised corner
# of this design - which is also why 8b.8's weekly verify runs against this
# repository rather than against S3. If a `forget --prune` ever reports a
# stale lock that `restic unlock` has to clear, that finding belongs in this
# comment rather than in someone's memory.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: aerie-restic-local
spec:
  capacity:
    storage: 1Ti
  # ReadWriteMany because that is what SMB is, not because two writers are
  # wanted: 8b.5's CronJob is concurrencyPolicy: Forbid and 8b.6's `forget
  # --prune` runs from that job and no other, precisely so this repository
  # never has two restic writers in it.
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # uid/gid 70, not 0, and this is the line that decides whether the backup
  # job can write at all. The share is a guest CIFS mount, so ownership is
  # presented client-side by these options and the permission check happens
  # client-side against them; ../../../../containers/backup/Dockerfile ends
  # with `USER postgres`, which in postgres:18.4-alpine is uid/gid 70. Mounted
  # with uid=0 the way the media PVs are, every path here would present as
  # root-owned and restic would fail its first write with a permission error
  # that says nothing about mount options. 0770/0660 rather than the media
  # share's 0775/0664 for the same reason: only the backup and verify jobs
  # mount this, both as that uid, so nothing needs the `other` bits.
  mountOptions:
    - dir_mode=0770
    - file_mode=0660
    - uid=70
    - gid=70
    - vers=3.0
  csi:
    driver: smb.csi.k8s.io
    # Distinct from aerie-share-rw and aerie-share-ro - share-volumes.yaml's
    # own comment says why, and here the consequence is specific: two PVs
    # sharing a handle are one volume to the CSI layer, and the second mount
    # silently inherits the first one's options. Inheriting aerie-share-ro's
    # would mean a backup repository mounted read-only.
    volumeHandle: aerie-restic-local
    readOnly: false
    volumeAttributes:
      # ${RESTIC_LOCAL_SUBPATH} is required where ${MEDIA_LIBRARY_SUBPATH} is
      # optional (scripts/k3s/cluster-config.json): an unset media subpath
      # serves nothing, while an unset backup subpath would make the entire
      # house share the restic repository.
      #
      # That last sentence used to end "...which reconciles perfectly", on the
      # premise that Flux expands an unknown token to the empty string and
      # leaves this a mount on the share root - the silent failure. It does
      # not, and the correction is worth the lines because the whole comment
      # was written to guard against a thing that cannot happen here.
      # kustomize-controller v1.9.4 applies post-build substitution in strict
      # mode by default, so a token the aerie-cluster-config ConfigMap does not
      # carry fails the build outright:
      #
      #   post build failed for 'PersistentVolume/aerie-restic-local':
      #   envsubst error: variable substitution failed:
      #   variable not set (strict mode): "RESTIC_LOCAL_SUBPATH"
      #
      # Observed 2026-08-23, when this file reached the cluster one Provision 4
      # dispatch ahead of its key. The failure is loud and total rather than
      # silent and partial - no PV is created at all - but it is not free: the
      # whole data-schema Kustomization stops reconciling and everything
      # downstream of it (../../apps.yaml) stops with it. **Land a
      # cluster-config.json key and its Provision 4 dispatch before the
      # manifest that reads it**, the same seed-then-manifest ordering 4b.3
      # established for parameters.json.
      #
      # Read the resolved value back anyway - not for the unset case, which now
      # announces itself, but for a subpath that resolved to the wrong thing:
      #   kubectl -n aerie get pv aerie-restic-local \
      #     -o jsonpath='{.spec.csi.volumeAttributes.source}'
      source: "//${SHARE_HOST}/${SHARE_NAME}/${RESTIC_LOCAL_SUBPATH}"
    # The same `smb-share` Secret ESO already syncs into this namespace for
    # the media PVs - ../../infrastructure/config/external-secrets/aerie-smb-share.yaml.
    nodeStageSecretRef:
      name: smb-share
      namespace: aerie
  claimRef:
    namespace: aerie
    name: aerie-restic-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aerie-restic-local
  namespace: aerie
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: aerie-restic-local
  resources:
    requests:
      storage: 1Ti
