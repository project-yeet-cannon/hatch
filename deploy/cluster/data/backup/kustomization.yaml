# The cluster plan Phase 8 - the third tenant of the data layer, beside
# ../cluster (the database) and ../schema (everything that assumes the
# database answers). It sits here rather than under ../../observability
# because what it backs up is this database: 8b.5's CronJob reads
# `aerie-pg-app` for its credentials and dumps through `aerie-pg-rw`, and
# ../schema/restore-job.yaml - its exact inverse - is one directory over
# sharing the same image and, from 8b.10, the same `restic` Secret.
#
# Not its own Flux Kustomization. ../../data.yaml's data-schema reaches this
# directory as a base (`../backup` in ../schema/kustomization.yaml), which is
# what puts it behind that Kustomization's dependsOn: data-cluster - a
# CronJob whose PGHOST comes from a Secret CNPG has not created yet is the
# same failure the cluster/schema split exists to prevent. It also inherits
# data-schema's postBuild.substituteFrom, which is where ${SHARE_HOST},
# ${SHARE_NAME} and ${RESTIC_LOCAL_SUBPATH} resolve.
#
# This directory still carries its own kustomization.yaml because ci.yml's
# deploy-manifests job discovers build roots by finding them, so everything
# below is built standalone there as well as through ../schema.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - local-repo-volume.yaml
  - backup-cronjob.yaml
