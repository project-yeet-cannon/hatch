# The cluster plan Phase 5b.10 - the Flux Kustomization that reconciles
# ./apps/helmrelease.yaml, the same shape data.yaml and site.yaml already
# established.
#
# dependsOn both data-schema and site-config, for two different reasons:
#
#   - data-schema, not data-cluster: the migrate hook Job needs the `quartz`
#     database and its eleven tables to already exist, not merely a Postgres
#     primary that answers connections. data-schema's own wait: true is what
#     makes that distinction real (see data.yaml).
#   - site-config: Flux expands an undefined ${...} token to the empty
#     string rather than failing, so an apps layer that reconciles before
#     aerie-image-tags exists would deploy `image: ${IMAGE_REGISTRY}/aerie-api:`
#     - a Deployment with no tag, which reads as a registry fault rather than
#       the ordering one it actually is.
#
# postBuild.substituteFrom names two ConfigMaps, and both are load-bearing:
# aerie-cluster-config (Provision 4) for every operator value except the
# image tags, and aerie-image-tags (the site repo, via site-config) for
# AERIE_API_IMAGE_TAG/KIOSK_FILES_IMAGE_TAG. Flux merges tokens across every
# ConfigMap listed here, so ./apps/helmrelease.yaml draws from both without
# caring which one actually holds a given key.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Longer than the HelmRelease's own install/upgrade timeouts (10m each,
  # ./apps/helmrelease.yaml) - Flux's wait covers applying the HelmRelease
  # *and* waiting for helm-controller to finish reconciling it, so this has
  # to outlast whichever of Helm's two timeouts is in play.
  timeout: 15m
  dependsOn:
    - name: data-schema
    - name: site-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/cluster/apps
  prune: true
  # The phase gate as much as the ordering: a HelmRelease stuck on a failed
  # migrate hook, or a Deployment that never goes Ready, should surface as
  # this Kustomization staying NotReady rather than as a green reconciliation
  # over a release that never actually converged.
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: aerie-cluster-config
      - kind: ConfigMap
        name: aerie-image-tags
