# TODO_SWARM.md Phase 3b.8 - kube-vip, the two components the original single
# bullet hid.
#
# Third and fourth components of layer 1 (../../infrastructure.yaml), and the
# reason 3b.9's Traefik Service can get an EXTERNAL-IP at all: Phase 2 installs
# k3s with --disable servicelb, so until this file lands there is no
# LoadBalancer implementation in the cluster whatsoever, and every
# type=LoadBalancer Service sits at <pending> forever.
#
#   - kube-vip-cloud-provider watches Services and assigns them an address out
#     of a pool it reads from a ConfigMap - the Kubernetes-native half of
#     "what IP does this Service get".
#   - kube-vip itself is the DaemonSet that actually answers ARP for that
#     address once assigned, and moves it to a surviving node if the one
#     holding it dies. Neither does the other's job; both are required.
#
# Bundled in one file because splitting them would be the same mistake
# 3b.4/3b.7's shared layer already avoids repeating in the other direction:
# these two have no dependsOn relationship on each other (the cloud provider
# assigns an IP whether or not any node has yet answered ARP for it, and
# kube-vip announces whatever the Service status carries once it exists), so
# there is nothing to gain from separate files and one property to lose - the
# pool ConfigMap below only makes sense read next to the release that consumes
# it.
#
# Neither chart ships a values.schema.json (checked against both charts at the
# pinned versions), unlike 3b.7's cert-manager. Every values: block below is
# therefore exactly as unvalidated as 3b.4's external-secrets extraArgs
# warning describes: a misspelled key is a controller that installs cleanly
# and simply never reads the setting.
#
# Still **not** an apiserver VIP - kube-vip only ever answers ARP for Services
# here (cp_enable stays at its chart default of false). The Phase 2 gap
# (docs/secrets-architecture.md#known-gap-no-vip-in-front-of-the-apiserver) -
# kubectl and Flux still target node 1's IP directly - is unchanged by
# anything in this file and stays open until Phase 7.
#
# Both releases carry ${INGRESS_VIP} and ${NODE_INTERFACE}, so both depend on
# 3b.1's ConfigMap the same way every file in this directory does.
---
# One repository for both charts - kube-vip.github.io/helm-charts serves
# "kube-vip" and "kube-vip-cloud-provider" as siblings, not two hosts. Kept in
# kube-system, which is where both releases install (not their own namespace,
# unlike external-secrets and cert-manager): kube-vip's DaemonSet needs
# hostNetwork and is conventionally cluster-infrastructure rather than an
# app-owned namespace, and it is the namespace 3b.9's Traefik HelmChartConfig
# and the k3s-bundled Traefik Service already live in. Naming it here means
# neither HelmRelease below needs a namespace field on its sourceRef.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  interval: 1h
  url: https://kube-vip.github.io/helm-charts
---
# kube-vip-cloud-provider first, because the ConfigMap after it is meaningless
# without something reading it, and because this is the release that has to
# exist before 3b.9's Traefik Service can be assigned anything at all.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip-cloud-provider
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip-cloud-provider
      # Chosen in TODO_SWARM.md 3a.6: the chart carrying appVersion v0.0.12.
      version: 0.2.10
      sourceRef:
        kind: HelmRepository
        name: kube-vip
  # Against the layer's 10m budget, the same arithmetic 3b.4 and 3b.7 use: one
  # Deployment, no CRDs, no webhook wait, so 3m plus one retry is generous, not
  # tight.
  timeout: 3m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    cleanupOnFail: true
  values:
    # The chart's own configmap.yaml template always names the ConfigMap it
    # auto-creates after the release (kube-vip-cloud-provider), ignoring
    # configMapName entirely - that field only ever changes which name the
    # *Deployment* looks for. Leaving cm.data empty skips that auto-created,
    # wrongly-named object rather than shipping a second ConfigMap nothing
    # reads, and configMapName below points the Deployment at the one this
    # file creates instead.
    cm:
      data: {}
    # "kubevip" and not the chart's own name: this is the name every
    # kube-vip-cloud-provider quickstart outside this Helm chart uses, and
    # matching it is what makes TODO_SWARM.md 3b.8's own wording ("ConfigMap
    # kubevip in kube-system") literally true rather than approximately true.
    configMapName: kubevip
---
# The pool. A plain core/v1 ConfigMap, not a CRD instance - kube-vip-cloud-
# provider defines no CRD at all, it reads this object directly - so unlike
# 3b.5 and 3b.6 it has no ordering dependency on anything under ../config and
# belongs next to the release that consumes it rather than waiting for a
# layer boundary that does not apply to it.
#
# range-global applies to every namespace with no namespace-scoped pool to
# take precedence over it, which is exactly right for a cluster with one
# Service that needs an address. ${INGRESS_VIP}-${INGRESS_VIP} is a range of
# exactly one address, deliberately: 3a.2 chose and verified that address is
# free, and a wider range would let the cloud provider hand a second Service
# an address nothing has reserved on the LAN.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubevip
  namespace: kube-system
data:
  range-global: "${INGRESS_VIP}-${INGRESS_VIP}"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      # Chosen in TODO_SWARM.md 3a.6: the only chart carrying the v1.2 line,
      # where service handling was refactored - the exact path svc_enable
      # below uses.
      version: 0.11.0
      sourceRef:
        kind: HelmRepository
        name: kube-vip
  timeout: 3m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    cleanupOnFail: true
  values:
    image:
      # The chart's appVersion is v1.2.2; v1.2.3 fixes regressions in lease
      # management and route cleanup introduced by the v1.2 refactor, per
      # TODO_SWARM.md 3a.6. Drop this override once a chart ships v1.2.3 or
      # later as the default.
      tag: v1.2.3
    env:
      # Empty by default - the one setting the chart cannot supply, since it
      # is different per installation and 3a.3 exists solely to read it. A
      # wrong value here does not fail the install: kube-vip binds cleanly to
      # the named interface and simply never answers ARP for the VIP, which
      # presents as a networking problem with a Ready HelmRelease sitting
      # right next to it.
      vip_interface: "${NODE_INTERFACE}"
      # Every other env key - vip_arp, svc_enable, cp_enable, svc_election,
      # vip_leaderelection - is left at the chart default. That default is not
      # a placeholder; see the footnote below for what it actually does.
# ---------------------------------------------------------------------------
# One property of the kube-vip release that is not visible from the values
# above, and worth being certain about before trusting a floating IP to it:
# how it decides which single node, out of however many run the DaemonSet,
# is allowed to answer ARP for the VIP.
#
# The chart's defaults are svc_enable: true, svc_election: false,
# vip_leaderelection: false, cp_enable: false. Read in isolation that looks
# like every election mechanism is off - which would mean every node in the
# DaemonSet advertises the same address simultaneously, an actual IP conflict
# on the LAN. It is not: with svc_election false, kube-vip's ARP worker
# (pkg/manager/worker/arp.go, StartServices) falls back to what its own
# comment calls GlobalLeader - a single Kubernetes Lease-based election that
# every kube-vip pod participates in, gating ALL Services on one elected node
# at a time. It is a separate, always-on mechanism from vip_leaderelection
# (which governs cp_enable's control-plane VIP instead, unused here) and from
# svc_election (which would give each Service its own lease, worth having
# with many LoadBalancer Services spread across nodes - moot with the single
# deliberate address this cluster hands out). Confirmed by reading the
# release's source at the pinned chart's appVersion rather than assumed from
# the values file, because a wrong guess here is silent right up until two
# nodes both think they hold the VIP.
#
# That Lease is what 3b.8's exit criterion is actually reading:
# `ip addr show ${NODE_INTERFACE}` shows the VIP only on the node that holds
# it, and it is expected to move there within the Lease's renewal window if
# that node goes down - the same mechanism Phase 7's HA proof exercises
# end-to-end with a hard power-off.
# ---------------------------------------------------------------------------
