# TODO_SWARM.md Phase 3b.4 - the External Secrets Operator.
#
# First component of layer 1 (../../infrastructure.yaml), and the one every
# credential the cluster ever holds arrives through: 3b.5's ClusterSecretStore
# and 3b.6's ExternalSecrets are instances of CRDs this release registers, and
# cannot be applied to a cluster where it has not converged. That is precisely
# the boundary the two Kustomizations exist to enforce.
#
# What is here is a controller and its CRDs, pinned, and nothing else - no
# store, no credential, no secret. All three are objects under ../config. The
# one credential ESO itself needs (aerie-eso-bootstrap, the read-only IAM user
# for the /aerie parameter tree) is not here either: Provision 2 seeds it
# imperatively over SSH, which docs/ethos.md allows exactly once, for exactly
# this - the credential a cluster uses to reach its own secret store cannot
# itself come from that store.
#
# Nothing in this file is per-installation, so it carries no ${...} token. Note
# also what postBuild substitution can and cannot reach here: Flux expands
# tokens in the *kustomize build output*, which is the three objects below.
# The chart's own templates are rendered later, by helm-controller, and are
# never seen by that expansion - so the $-escaping warning in
# ../../infrastructure.yaml applies to values written in this file, not to
# anything upstream ships.
---
# Committed even though Provision 2 already applied it. Applying an existing
# Namespace is a no-op, and a rebuilt cluster should not depend on which of the
# two ran first - Provision 2 can be re-run against a live cluster, and Flux can
# reconcile onto one seeded hours earlier.
#
# The consequence to know, because infra-controllers reconciles with
# prune: true: deleting this file from git deletes the namespace, and with it
# aerie-eso-bootstrap - the one Secret in the cluster that no manifest can
# recreate. Removing external-secrets means re-running Provision 2's
# bootstrap-only stage afterwards.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
# Kept in the component's own namespace rather than in flux-system, so the
# whole component - namespace, source, release - is this one file and reaches
# the cluster or leaves it as a unit. It also means the HelmRelease's sourceRef
# needs no namespace field, and so does not depend on cross-namespace source
# references being permitted; Provision 3's `flux install` leaves them on, but
# nothing here should quietly rely on a flag it does not set.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  # How often source-controller re-fetches index.yaml. Only new *versions* are
  # discovered by it, and the release below names one exact version, so this
  # poll changes nothing until a commit does. An hour is simply cheap.
  interval: 1h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      # Exact, never a range. `2.8.0` here means 2.8.0; `~2.8.0` would mean an
      # unattended patch upgrade the next time upstream published one, which is
      # the moving pin scripts/versions.json exists to argue against. Chosen in
      # TODO_SWARM.md 3a.6 over the same-week 2.9.0 on soak, and because 2.8.0
      # is the release that added the OpenBao provider - the eventual
      # destination of 3b.5's deliberately isolated ClusterSecretStore.
      # Chart 2.8.0 carries appVersion v2.8.0 and declares kubeVersion
      # '>= 1.19.0-0', which the v1.35.7+k3s1 pin satisfies with room to spare.
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  # Both timeout and retries are set against the *layer's* 10m budget, not in
  # isolation. infra-controllers reconciles with wait: true and that timeout is
  # shared by every release in this directory, so a component that remediates
  # in an unbounded loop does not fail alone - it starves everything queued
  # behind it, including Longhorn, which genuinely is slow. One retry inside a
  # four-minute ceiling reports a real failure as a failure, within the window,
  # while still absorbing the transient case this is actually for: an image
  # pull that timed out once.
  #
  # Four minutes is generous for what this installs - three small Deployments -
  # even on a cold node.
  timeout: 4m
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    # A failed upgrade otherwise leaves behind whatever it managed to create
    # before it stopped, and the next attempt then collides with objects Helm
    # does not believe it owns.
    cleanupOnFail: true
  values:
    # The exit criterion for this step - `kubectl get crd
    # externalsecrets.external-secrets.io` - is this line. It is also the chart
    # default, and set explicitly anyway: a default that flips upstream would
    # otherwise take the CRDs, and with them every object under ../config, in a
    # version bump that read as routine.
    #
    # Worth knowing that this chart templates its CRDs (templates/crds/) rather
    # than shipping them in the chart's crds/ directory. That means Helm treats
    # them as ordinary resources, so an upgrade updates them - the usual Helm
    # caveat about CRDs never being upgraded does not apply here - and it is
    # also why spec.install.crds / spec.upgrade.crds are absent above: those
    # policies govern the crds/ directory, which this chart does not use, so
    # setting them would look like configuration while doing nothing.
    installCRDs: true
# ---------------------------------------------------------------------------
# Two properties of this release that later steps depend on, recorded here
# because both are invisible from the manifest.
#
#   1. ESO installs a ValidatingWebhookConfiguration with failurePolicy: Fail,
#      covering SecretStores, ClusterSecretStores and ExternalSecrets. Applying
#      3b.5's ClusterSecretStore against a cluster whose webhook is not yet
#      serving is therefore a rejected apply, not a resource that reconciles
#      late. It works because infra-controllers waits: helm-controller waits on
#      the release's own resources by default, so a Ready HelmRelease means the
#      webhook Deployment is Ready, and only then does infra-config start.
#   2. That webhook's serving certificate comes from ESO's bundled
#      cert-controller, not from cert-manager. Nothing about this release
#      depends on 3b.7, which is why both can sit in the same layer with no
#      ordering between them.
#
# And one for 3b.5 itself: the CRDs register external-secrets.io/v1 as the
# served and stored version. v1beta1 is gated behind crds.unsafeServeV1Beta1,
# left at its default of false, and the webhook rules above only match v1 - so
# a ClusterSecretStore written against the v1beta1 examples still findable in
# older documentation fails as an unknown API version.
# ---------------------------------------------------------------------------
