# The cluster plan Phase 3b.11 - Longhorn, the replicated block storage every
# stateful workload that is not Postgres binds to.
#
# Fifth component of layer 1 (../../infrastructure.yaml), and the only one whose
# correctness depends on something that happened outside this repository:
# Provision 5 (3b.2) has to have formatted the second VHDX and mounted it at
# /var/lib/longhorn on every node *before* this release installs. Longhorn's
# default data path is that same directory on the root filesystem, so installing
# first means Longhorn quietly claims a 32 GB OS disk while a 200 GB data disk
# sits untouched beside it. That ordering is the whole reason 3b.2 is a step
# rather than a footnote, and it is not expressible in this tree - nothing here
# can wait on it, so `findmnt /var/lib/longhorn` on each node is the check, and
# this step's own *Exit* line (the disk's capacity, read back from
# nodes.longhorn.io) is what proves it after the fact.
#
# What this file does NOT contain is the per-volume StorageClasses. Those are
# ../config/longhorn-storageclasses.yaml, for the layering reason every other
# component follows - controller here, instances of what it enables next door -
# and for a second reason specific to this one: the counts in their names are
# fixed and structural, while everything below is the *default* for a volume
# that names no class, which is a per-installation number that changes when the
# third node joins in Phase 7.
#
# This chart ships no values.schema.json (the extracted 1.11.3 artifact holds
# Chart.yaml, values.yaml, questions.yaml, README and templates/ - nothing else),
# so every key below is unvalidated in the sense 3b.8's kube-vip footnote
# describes: a misspelling installs cleanly and is never read. Longhorn adds a
# second layer of the same trap on top - see note 4 at the bottom, because it
# swallows bad *values*, not just bad keys.
---
# Longhorn's own namespace, created here rather than by Helm, for the reason
# ../external-secrets.yaml and ../cert-manager.yaml give: one file is the whole
# component, and it arrives or leaves as a unit.
#
# ⚠ The consequence here is heavier than for either of those, and it is the most
# destructive line in this repository: infra-controllers reconciles with
# prune: true, so deleting this file uninstalls the release, and the chart's
# uninstall is a pre-delete Job running `longhorn-manager uninstall --force` -
# whose own flag help reads "uninstall even if volumes are in use". It deletes
# every Longhorn Volume in the cluster, and the CRDs go with it (crds.yaml
# carries no helm.sh/resource-policy: keep, so Helm removes them too, taking
# every remaining Longhorn object). There is no confirmation and no undo, and
# from Phase 6 onward that is Grafana, Kuma, OpenSearch and Prometheus data. If
# Longhorn ever has to come out, take a backup first and mean it.
#
# The PodSecurity label is not needed today and is set anyway: k3s ships no
# cluster-wide PodSecurity configuration, so an unlabelled namespace is
# unrestricted and Longhorn's privileged DaemonSets schedule fine. It is one
# line that keeps that true the day a cluster-wide default is set, and the
# failure it prevents - privileged pods rejected at admission, on a storage
# layer everything else is already bound to - is a bad one to meet by surprise.
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  # As next door: this poll only discovers new versions, and the release below
  # names one exactly, so nothing moves until a commit does. Note the index at
  # this URL points its download URLs at github.com release assets rather than
  # at charts.longhorn.io itself - source-controller follows them, but it means
  # a GitHub outage blocks a chart pull that looks like it comes from elsewhere.
  interval: 1h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      # Chosen in the cluster plan 3a.6: the stable, widely-adopted line, against a
      # 1.12.1 that was a day old when the table was written. Chart 1.11.3
      # carries appVersion v1.11.3 and declares kubeVersion '>= 1.25.0-0' - the
      # 3a.6 table says "requires Kubernetes >= 1.34", which is what Longhorn's
      # own release notes recommend rather than what the chart enforces; either
      # way the v1.35.7+k3s1 pin in scripts/versions.json sits inside both.
      version: 1.11.3
      sourceRef:
        kind: HelmRepository
        name: longhorn
  # The largest budget in this directory, and still inside the layer's 10m:
  # this installs a DaemonSet of longhorn-manager plus instance-manager, the UI,
  # the CSI plugin and its five sidecars, which on a cold node is a couple of
  # gigabytes of images before anything reports Ready. infra-controllers waits
  # 10m for this whole directory in parallel, so 8m is "report yourself before
  # the layer reports you" with two minutes to spare. Install has no
  # post-upgrade hook to wait on (the name says why), so this default is
  # install's real timeout; upgrade overrides it below.
  timeout: 8m
  install:
    # Zero, and it is the only release in this tree that gets zero. Every other
    # component sets `retries: 1` to absorb a timed-out image pull; here the
    # remediation for a failed *install* is an uninstall, and the HelmRelease v2
    # API offers no other strategy for one (unlike upgrade below, which can
    # roll back). That uninstall runs the destructive pre-delete Job described
    # on the Namespace above, with activeDeadlineSeconds: 900 - one and a half
    # times the entire layer's budget - so a single slow first install would
    # both blow past 10m and report every other component in this directory
    # through Longhorn's failure.
    #
    # The cost is that a genuinely transient failure needs a human:
    # `flux reconcile helmrelease longhorn -n longhorn-system --force` once the
    # cause is understood. For the component that owns the cluster's data, that
    # is the right direction to fail in.
    remediation:
      retries: 0
  upgrade:
    # Override, above the shared 8m: 5b.11's resource-request sweep (the
    # commit immediately before this one) was this DaemonSet's pod template's
    # first change since install, and its real bottleneck isn't the new pods
    # starting - longhorn-manager's own post-upgrade hook
    # (waitManagerUpgradeComplete, github.com/longhorn/longhorn-manager
    # app/post_upgrade.go) compares each pod's *spec* image, which is set the
    # instant a replacement pod is created, so a crashing new pod can't slow
    # it down. What it actually waits on is the *old* pod leaving the list,
    # i.e. graceful termination - exercised for the first time by this
    # rollout. Longhorn's own authors clearly expect this can run long: the
    # hook itself polls for up to 360*5s = 30m. Measured live on
    # 2026-08-19: 8m10s, then 9m32s, then 9m35s across three attempts, so
    # 9m30s failed one of them by two seconds. 12m is real margin over the
    # worst of those, and ../../infrastructure.yaml's infra-controllers
    # Kustomization timeout is raised to 15m alongside it, so the layer
    # actually observes whichever way this resolves instead of timing out
    # first itself.
    timeout: 12m
    remediation:
      retries: 1
      # Already the default, and the single most important default in this file
      # to state out loud, because the alternative value is `uninstall`: a
      # failed Longhorn upgrade remediated by uninstalling is every volume in
      # the cluster deleted by an automated retry. Rollback re-applies the last
      # good release and touches no data.
      strategy: rollback
    cleanupOnFail: true
  # 5b.11's sweep originally set resources here too - a postRenderers patch
  # reaching the driver-deployer Deployment, the UI Deployment, the
  # pre-pull-share-manager-image sidecar in the manager DaemonSet, and the
  # three Helm hook Jobs, none of which the chart exposes a values key for -
  # plus values.longhornManager.resources below for the one container that
  # does have one. Reverted 2026-08-19: the DaemonSet patch and the
  # longhornManager value both change longhorn-manager's pod template, which
  # was that DaemonSet's first template change since install, and rolling it
  # stalled the HelmRelease three times running (measured 8m10s, 9m32s/9m35s,
  # 12m12s/11m41s against timeouts raised twice - see the git history on this
  # file and on ../../infrastructure.yaml's infra-controllers timeout for the
  # investigation) without Postgres or any instance-manager ever being
  # touched. Worth re-attempting deliberately, off-incident, now that it's
  # known this DaemonSet's rollout needs real headroom - not worth chasing
  # further live. The widened timeouts above and on infra-controllers stay:
  # harmless now, and correct groundwork for whenever this or a real chart
  # version bump next rolls these pods.
  values:
    # ---------------------------------------------------------------------
    # Longhorn's own settings - the longhorn-default-setting ConfigMap
    # ---------------------------------------------------------------------
    defaultSettings:
      # Matches the mount point Provision 5 creates, and equal to the chart's
      # own default ("/var/lib/longhorn/") but for the trailing slash. Written
      # out because it is the single line tying this release to 3b.2: read it
      # and the disk it lands on is a question you can answer, rather than a
      # default nobody looked at. A path outside /dev/ is a filesystem-type
      # disk for the v1 data engine, which is what 3b.2 prepared.
      defaultDataPath: /var/lib/longhorn
      # 2 during the two-node build window; Phase 7 raises the variable and
      # re-runs Provision 4, with no commit. See note 1 below for what this
      # does and - more importantly - what it does not do.
      defaultReplicaCount: "${LONGHORN_REPLICA_COUNT}"
      # Longhorn's default is 30, and it is 30 because the default data path is
      # normally the node's root filesystem, where handing all of it to
      # replicas fills the OS disk. 3b.2 gave Longhorn a dedicated disk that
      # holds nothing else, so that reasoning does not apply here and 30% of a
      # whole data disk is simply unusable capacity - and this step's *Exit*
      # criterion, the disk schedulable "at the data disk's capacity", would be
      # visibly and confusingly untrue.
      #
      # Not 0: a Longhorn disk driven to genuinely full fails replica rebuilds
      # and snapshot operations in ways that are much harder to unpick than
      # they are to avoid. 10% is the margin, and the *live* guard is a
      # different setting left at its default -
      # storageMinimalAvailablePercentage (25), which makes a disk
      # unschedulable as it fills rather than reserving space up front.
      #
      # Timing matters more than the number: this is multiplied into a fixed
      # byte count when Longhorn creates a node's default disk
      # (types.CreateDefaultDisk: StorageReserved = size * percentage / 100)
      # and stamped into that node's DiskSpec. Changing it later does not
      # rewrite an existing disk - that is an edit to the Node CR, per node.
      storageReservedPercentageForDefaultDisk: 10
      # Off. It periodically calls Longhorn's upgrade responder and its only
      # output is a banner in a UI recommending a version this repository pins
      # in git; goal 6.5's Renovate ask is the mechanism that is supposed to
      # act on versions here, and it works on scripts/versions.json and on the
      # `version:` field above, not on a notification.
      upgradeChecker: false

    # ---------------------------------------------------------------------
    # The StorageClass the chart ships - see note 2
    # ---------------------------------------------------------------------
    persistence:
      # k3s already ships local-path as the default StorageClass, and the
      # storage split in the cluster plan deliberately puts Postgres on it. Two
      # default classes make any PVC that omits storageClassName undefined -
      # whichever the API server picks first wins, and it is not stable.
      defaultClass: false
      # The line 3b.11's bullets do not mention and the one that actually
      # bites. defaultReplicaCount above is a Longhorn *setting*; the
      # `longhorn` StorageClass this chart creates reads this value instead,
      # its default is 3, and the class is created unconditionally - there is
      # no switch that suppresses it. Setting only the setting therefore leaves
      # a 3-replica class installed on a two-node cluster: exactly the
      # permanently-Degraded volume, and exactly the alarm noise, that
      # LONGHORN_REPLICA_COUNT exists to prevent.
      defaultClassReplicaCount: "${LONGHORN_REPLICA_COUNT}"

    # ---------------------------------------------------------------------
    # Sizing
    # ---------------------------------------------------------------------
    longhornUI:
      # The chart's default is 2. The UI is an operator convenience with no
      # workload behind it and no entry on the cluster plan's HA-required list -
      # the same call ../cert-manager.yaml's note 4 makes for its own single
      # replica - and this cluster is two VMs that Phases 4 and 5 still have to
      # fit Postgres and the app tier into.
      replicas: 1
# ---------------------------------------------------------------------------
# Four properties of this release that later steps depend on, none of them
# visible from the values above.
#
#   1. defaultReplicaCount is narrower than it sounds. Longhorn's own
#      description of the setting is "the default number of replicas when a
#      volume is created from the Longhorn UI. For Kubernetes configuration,
#      update the numberOfReplicas in the StorageClass" - so it governs volumes
#      created outside a StorageClass, and nothing else. Both classes in
#      ../config/longhorn-storageclasses.yaml set numberOfReplicas explicitly
#      and are unaffected by it; the `longhorn` class reads
#      persistence.defaultClassReplicaCount. It is a backstop, deliberately
#      kept in step with the other two rather than left at 3.
#
#      Two mechanical notes on it, both checked against longhorn-manager
#      v1.11.3 rather than assumed. It is a *data-engine-specific* setting in
#      1.11, whose default is the JSON string {"v1":"3","v2":"3"} - and a plain
#      scalar is still accepted, expanded to every engine in that default
#      (types.parseSettingSingleInt), which is what makes the substituted "2"
#      above legal. And changing it later does propagate: the manager compares
#      the ConfigMap's resourceVersion against an annotation on each Setting CR,
#      so a Helm upgrade that rewrites longhorn-default-setting overwrites the
#      live value - including one changed by hand in the UI.
#
#   2. The `longhorn` StorageClass is not a Helm resource. The chart renders it
#      into a ConfigMap (longhorn-storageclass), and a controller inside
#      longhorn-manager reads that ConfigMap and creates the class from it -
#      deleting and recreating it whenever the two differ, which is how it gets
#      around StorageClass parameters being immutable. Two consequences: Flux
#      never sees or prunes that class, and a change to
#      defaultClassReplicaCount does reach it, unlike an edit to a StorageClass
#      committed in this tree (see the note in
#      ../config/longhorn-storageclasses.yaml).
#
#   3. preUpgradeChecker.jobEnabled is left at its default of true, in spite of
#      the chart's own comment saying to disable it "when installing Longhorn
#      using Argo CD or other GitOps solutions". That warning is about tools
#      that render a chart and apply the output, where Helm's hooks are
#      reinterpreted or dropped; helm-controller runs real Helm, so the
#      pre-upgrade Job runs as a pre-upgrade hook and does what it is for -
#      refusing an unsupported version jump before it starts. Keeping it is
#      what makes a chart bump in this file safe to make unattended.
#
#   4. Longhorn swallows a bad setting rather than failing on it. A value in
#      defaultSettings that does not parse, or falls outside a setting's range,
#      is logged at warn level by the manager and skipped -
#      types.GetCustomizedDefaultSettings and
#      datastore.filterCustomizedDefaultSettings both continue past it - so a
#      replica count of "two" is not a failed install, it is Longhorn running
#      on 3. Combined with the missing values.schema.json noted at the top,
#      nothing between this file and a live cluster will tell you a value was
#      wrong. `kubectl -n longhorn-system get settings.longhorn.io
#      default-replica-count -o jsonpath='{.value}'` is the read-back, and
#      3b.13's gate is where it belongs.
#
#      Expect `{"v1":"2","v2":"2"}` rather than `2`. On this chart version the
#      data-engine-specific settings hold one value per engine, and a scalar
#      written here is expanded into both - so the read-back does not compare
#      equal to what was set, and a hand check against "2" concludes the
#      opposite of the truth. Longhorn 1.11 is what this repository pins; a
#      cluster that answers with a bare scalar is an older one.
#
# And one thing deliberately absent: no Ingress. The chart can publish the
# Longhorn UI (ingress.enabled), and the wildcard certificate from 3b.10 would
# serve it happily - but the UI has no authentication of its own, so that is an
# unauthenticated admin console for the cluster's storage, on the LAN, reachable
# by anything that can resolve a name. `kubectl -n longhorn-system port-forward
# svc/longhorn-frontend 8080:80` is the access path until something in front of
# it can ask who is asking.
# ---------------------------------------------------------------------------
