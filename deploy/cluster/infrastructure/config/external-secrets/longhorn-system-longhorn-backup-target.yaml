apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-target
  namespace: longhorn-system
spec:
  # How long a rotated parameter takes to reach the cluster, worst case.
  # Each tick is one SSM read per data entry, so this is also the cost: the
  # whole tree is a handful of calls an hour.
  refreshInterval: 1h
  secretStoreRef:
    # ClusterSecretStore, not SecretStore - one store serves every namespace,
    # and its name carries no provider so swapping Parameter Store for OpenBao
    # stays the one-file change ../cluster-secret-store.yaml describes. That
    # store names the namespace of its own credential explicitly, so nothing
    # here needs a copy of the bootstrap Secret alongside it.
    kind: ClusterSecretStore
    name: aerie-secrets
  target:
    name: longhorn-backup-target
    # Owner: ESO creates the Secret and owns it, so deleting this manifest
    # deletes the Secret with it - which is what makes the git tree the whole
    # truth. Merge would leave orphans behind after a prune.
    creationPolicy: Owner
    # Retain is the default and is set anyway, because the failure it governs
    # is silent and severe: if the parameter disappears upstream, keep the last
    # good value and report SecretSyncError, rather than deleting a live
    # credential out from under a running workload.
    deletionPolicy: Retain
  data:
    # aerie-longhorn IAM user (8a.1), scoped to the Longhorn backup bucket alone - its own identity for the same reason aerie-restic and aerie-eso are separate. Its Secret's keys are SCREAMING_SNAKE_CASE against every other entry in this file and have to be: Longhorn reads backupTargetCredentialSecret by the literal names AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, and reports an unusable backup target rather than an error if they are anything else. env is deliberately not AWS_ACCESS_KEY_ID - the AWS CLI would pick that name up on the seeding runner, the same collision the Route53 and CNPG pairs are renamed around.
    # Consumed by: 8b.9 backupTargetCredentialSecret. The key name is Longhorn's, not this file's convention: it reads the Secret by these literal names and reports an unusable backup target rather than an error if they differ. AWS_ENDPOINTS is the third name Longhorn documents and is deliberately absent - it exists for non-AWS S3, and an empty value is not the same as an omitted one.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /aerie/longhorn/backup-s3-access-key-id
    # Secret half of the aerie-longhorn credential. Minted by hand (8a.1): Set-AerieBackupAws.ps1 creates the user and its policy, but minting an access key means printing one.
    # Consumed by: 8b.9 backupTargetCredentialSecret, secret half
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /aerie/longhorn/backup-s3-secret-access-key
