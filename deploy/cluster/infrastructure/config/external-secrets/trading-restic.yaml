apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic
  namespace: trading
spec:
  # How long a rotated parameter takes to reach the cluster, worst case.
  # Each tick is one SSM read per data entry, so this is also the cost: the
  # whole tree is a handful of calls an hour.
  refreshInterval: 1h
  secretStoreRef:
    # ClusterSecretStore, not SecretStore - one store serves every namespace,
    # and its name carries no provider so swapping Parameter Store for OpenBao
    # stays the one-file change ../cluster-secret-store.yaml describes. That
    # store names the namespace of its own credential explicitly, so nothing
    # here needs a copy of the bootstrap Secret alongside it.
    kind: ClusterSecretStore
    name: aerie-secrets
  target:
    name: restic
    # Owner: ESO creates the Secret and owns it, so deleting this manifest
    # deletes the Secret with it - which is what makes the git tree the whole
    # truth. Merge would leave orphans behind after a prune.
    creationPolicy: Owner
    # Retain is the default and is set anyway, because the failure it governs
    # is silent and severe: if the parameter disappears upstream, keep the last
    # good value and report SecretSyncError, rather than deleting a live
    # credential out from under a running workload.
    deletionPolicy: Retain
  data:
    # restic repository password. Seeded here for the Phase 8 CronJob; the printed offline copy remains the root of trust and this parameter never replaces it.
    # Consumed by: docs/plans/trading.md Phase 3, deploy/cluster/trading/lake/chains-backup-cronjob.yaml, RESTIC_PASSWORD. The same repository pair the aerie namespace's job writes to - an ExternalSecret is namespaced, so the value is re-synced here rather than referenced across namespaces.
    - secretKey: password
      remoteRef:
        key: /aerie/backup/restic-password
    # aerie-restic IAM user, scoped to the backup bucket only.
    # Consumed by: docs/plans/trading.md Phase 3, deploy/cluster/trading/lake/chains-backup-cronjob.yaml, AWS_ACCESS_KEY_ID
    - secretKey: access-key-id
      remoteRef:
        key: /aerie/backup/s3-access-key-id
    # Secret half of the aerie-restic credential.
    # Consumed by: docs/plans/trading.md Phase 3, deploy/cluster/trading/lake/chains-backup-cronjob.yaml, AWS_SECRET_ACCESS_KEY
    - secretKey: secret-access-key
      remoteRef:
        key: /aerie/backup/s3-secret-access-key
