apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go2rtc-streams
  namespace: aerie
spec:
  # How long a rotated parameter takes to reach the cluster, worst case.
  # Each tick is one SSM read per data entry, so this is also the cost: the
  # whole tree is a handful of calls an hour.
  refreshInterval: 1h
  secretStoreRef:
    # ClusterSecretStore, not SecretStore - one store serves every namespace,
    # and its name carries no provider so swapping Parameter Store for OpenBao
    # stays the one-file change ../cluster-secret-store.yaml describes. That
    # store names the namespace of its own credential explicitly, so nothing
    # here needs a copy of the bootstrap Secret alongside it.
    kind: ClusterSecretStore
    name: aerie-secrets
  target:
    name: go2rtc-streams
    # Owner: ESO creates the Secret and owns it, so deleting this manifest
    # deletes the Secret with it - which is what makes the git tree the whole
    # truth. Merge would leave orphans behind after a prune.
    creationPolicy: Owner
    # Retain is the default and is set anyway, because the failure it governs
    # is silent and severe: if the parameter disappears upstream, keep the last
    # good value and report SecretSyncError, rather than deleting a live
    # credential out from under a running workload.
    deletionPolicy: Retain
  data:
    # go2rtc's second config file: the 'streams:' block, held out of git because a stream source is an RTSP URL with the camera's password embedded in it (charts/aerie/templates/go2rtc-configmap.yaml says the same from the other side). A whole YAML document rather than one credential, and the only parameter here shaped that way - it is one value because go2rtc reads it as one file, and because a camera added without its stream is a camera the kiosk cannot show. One line per camera, keyed by the CameraFeed channel's HaEntityId, which is what CameraStreamTarget looks the stream up by:
    #
    #   streams:
    #     camera.<entity>: rtsp://<user>:<pass>@<ip>:554/h264Preview_01_sub
    #
    # The sub-stream path, not the main one - 640x480 H.264 is what a wall tablet should be decoding. Adding a camera is editing the GitHub secret and re-running Provision 2; because go2rtc reads its config once at startup and never watches the files, that has to be followed by 'kubectl rollout restart deploy/go2rtc -n aerie'. The deployment's checksum/config annotation covers the ConfigMap only - Helm cannot see a Secret it does not render.
    # Consumed by: docs/plans/cameras.md Phase 7 - charts/aerie/templates/go2rtc-deployment.yaml mounts this Secret as a DIRECTORY at /streams and passes '-config /streams/streams.yaml', so the key is a filename, not a value name. Rename it and go2rtc starts with zero streams and stays Ready, because a missing -config path is skipped silently.
    - secretKey: streams.yaml
      remoteRef:
        key: /aerie/cameras/go2rtc-streams
