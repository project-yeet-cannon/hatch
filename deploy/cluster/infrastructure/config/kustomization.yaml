# Layer 2 of the split described in ../../infrastructure.yaml: instances of the
# types the controllers in ../controllers install. Nothing here can be applied
# to a cluster that has not converged that layer first, which is what
# infra-config's dependsOn expresses.
#
# This is also where nearly every ${...} substitution in the tree lands - the
# domain, the VIP, the region, the hosted zone id. Read the note in
# ../../infrastructure.yaml about undefined tokens expanding to empty strings
# before adding a file here.
#
# Filled in by the cluster plan 3b.5 (the ClusterSecretStore, alone in its own file
# because it is the single object that changes when Parameter Store is swapped
# for in-cluster OpenBao), 3b.6 (the generated external-secrets/ directory, one
# ExternalSecret per target Secret named in scripts/secrets/parameters.json,
# plus the app Namespace two of them land in), 3b.9 (Traefik's HelmChartConfig),
# 3b.10 (both ClusterIssuers, the wildcard Certificate, and the TLSStore that
# actually serves it), 3b.11 (the longhorn-r2 / longhorn-r3 StorageClasses) and
# 8b.10 (the RecurringJob that backs up three of the volumes those classes
# provisioned).
#
# As in ../controllers, the order of this list is not an ordering: everything
# here is applied together, and what sequencing exists inside the layer is the
# objects' own retry loops - an ExternalSecret reconciled a moment before its
# store is Ready fails once and succeeds on its next attempt. What that retry
# does not survive is infra-config's 5m wait: an object still not Ready when it
# expires is a NotReady Kustomization, which is the intended report.
# One entry here is a directory rather than a file: external-secrets/ is
# generated from scripts/secrets/parameters.json by
# scripts/secrets/New-ExternalSecrets.ps1 and verified by ci.yml, so its own
# kustomization.yaml is generated with it and this list does not name each
# manifest. Adding a secret is an edit to parameters.json and a regeneration -
# nothing in this file moves.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - cluster-secret-store.yaml
  - external-secrets
  - traefik-helmchartconfig.yaml
  # The part-time-node plan's Phase 2.2 - CoreDNS's replica count and PDB - is
  # DISABLED here, not deleted. Its file keeps its reasoning intact; see the
  # header of ./coredns-availability.yaml for what happened.
  #
  # Short version: as a partial server-side apply carrying only spec.replicas,
  # it passes a hand-run `kubectl apply --server-side --dry-run=server` and
  # fails kustomize-controller's own drift-detection dry-run, which validated a
  # merge result with no spec.selector in it:
  #
  #   Deployment/kube-system/coredns dry-run failed (Invalid): [spec.selector:
  #   Required value, ... spec.selector: Invalid value: null: field is immutable]
  #
  # That is a NotReady infra-config, and infra-config is the root of the
  # dependency chain - data-cluster, then data-schema, then apps all wait on
  # it. So one un-appliable manifest in this layer stops every application
  # deploy in the cluster, which is what it did: infra-config sat at the
  # previous revision while the app tier's image tag advanced three times with
  # nothing to apply it.
  #
  # Nothing of it ever reached the cluster - no PDB was created and CoreDNS
  # stayed at one replica - so removing this line prunes nothing and changes no
  # running object. It restores the chain and hands Phase 2.2 back to its plan
  # unstarted.
  # - coredns-availability.yaml
  # 3b.10, in three files rather than one: the issuers are a pair that must stay
  # identical, the Certificate is the object with the human stop in it, and the
  # TLSStore is what serves the result. Splitting them keeps the flip from
  # staging to production a one-word diff in a file that changes nothing else.
  - cluster-issuers.yaml
  - wildcard-certificate.yaml
  - traefik-tlsstore.yaml
  # 3b.11's two classes, in one file: they differ on a single parameter, and the
  # argument for each count is an argument about the other one. The photos
  # plan's Phase 1.5 added a third, longhorn-bulk, to the same file - it does
  # not differ on that parameter and says so at length.
  - longhorn-storageclasses.yaml
  # 8b.10's nightly backup of the three longhorn-r3 volumes. Beside the classes
  # rather than folded into them on purpose: Longhorn selects volumes for it by
  # label on the Volume CR, not by class, which is the finding that file opens
  # with.
  - longhorn-recurringjob.yaml
