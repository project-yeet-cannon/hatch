# TODO_SWARM.md Phase 3b.5 - the ClusterSecretStore.
#
# One object, alone in this file, with nothing beside it. That isolation is the
# only unusual thing here and it is deliberate: this is the single manifest that
# changes when the backend moves from AWS SSM Parameter Store to in-cluster
# OpenBao, which docs/secrets-architecture.md commits to before open-sourcing -
# forcing every home user to open an AWS account to run a home server defeats
# the premise. Everything downstream (3b.6's ExternalSecrets, and every one
# Phases 4-8 add) names this store and nothing about its provider, so that swap
# is one file rewritten and no other edit anywhere in deploy/.
#
# Which is also why the name below is `aerie-secrets` rather than anything
# describing AWS. A store called `aws-parameter-store` would put the provider
# into every ExternalSecret's secretStoreRef, and the one-file swap would become
# a rename across the tree - the isolation would be decorative.
#
# The credential this uses, aerie-eso-bootstrap in the external-secrets
# namespace, is the one secret in the cluster that is not managed by anything in
# git: Provision 2 seeds it imperatively over SSH, because the credential a
# cluster uses to reach its own secret store cannot itself come from that store.
# scripts/secrets/parameters.json is the committed half that names it, and both
# key names below come from there. It is also, per 3b.4's note, destroyed if the
# external-secrets Namespace is pruned - so a store that suddenly cannot
# authenticate is worth checking against `kubectl -n external-secrets get secret
# aerie-eso-bootstrap` before anything is assumed about AWS.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aerie-secrets
spec:
  provider:
    aws:
      service: ParameterStore
      # The only ${...} token in this file, and the only per-installation value
      # the store has. It has to match the region Provision 2 seeded into: the
      # /aerie tree lives in exactly one region and ESO reads it by region, so a
      # wrong-but-valid value here is an empty tree rather than an error.
      #
      # ESO does check this at admission, but less than it looks: validateRegion
      # runs the SSM endpoint resolver, which builds a URL from the string. It
      # proves the region is *shaped* like one, not that it exists - us-east-99
      # resolves happily and then fails much later as a DNS timeout inside the
      # controller. The real guard is upstream, in cluster-config.json's pattern
      # for AWS_REGION, which is checked before the ConfigMap is ever applied.
      region: ${AWS_REGION}
      # `prefix` is deliberately absent, though the provider supports it. It
      # would prepend /aerie to every lookup and let the ExternalSecrets carry
      # bare keys - at the cost of the parameter prefix living in two places,
      # here and in scripts/secrets/parameters.json, which is the file both
      # halves of the design are supposed to read. 3b.6's manifests carry the
      # full path instead, generated from that file, so an installation that
      # chooses a different prefix changes it once and nothing here moves.
      auth:
        # Static credentials from the bootstrap Secret. The alternative - jwt /
        # IRSA - assumes an EKS-style OIDC trust between the cluster and AWS,
        # which a home Hyper-V cluster has no way to establish.
        secretRef:
          # `namespace` is mandatory in spirit and optional in the schema, and
          # that gap is the trap in this file. On a ClusterSecretStore, a
          # secretRef with no namespace is not an error: it means *referent
          # auth* - resolve the Secret in whichever namespace each consuming
          # ExternalSecret lives in. ESO then skips validation entirely
          # (ValidationResultUnknown), and the store controller marks it
          # Ready=True, reason Valid. So the exit criterion for this step -
          # `Ready=True` - is satisfied by a store that has never once looked at
          # a credential, and the failure surfaces later as every ExternalSecret
          # failing to find a Secret that is sitting right there in
          # external-secrets. Both refs name the namespace explicitly.
          accessKeyIDSecretRef:
            name: aerie-eso-bootstrap
            key: access-key-id
            namespace: external-secrets
          secretAccessKeySecretRef:
            name: aerie-eso-bootstrap
            key: secret-access-key
            namespace: external-secrets
# ---------------------------------------------------------------------------
# Two decisions not visible above.
#
#   1. No `conditions`. A ClusterSecretStore can be constrained to a set of
#      namespaces by label selector or regex, and this one is not - Phases 4-8
#      pull credentials into cert-manager, longhorn-system, the app namespace
#      and the observability namespaces, and a list here would have to be
#      edited by every one of them. The property that list would buy is already
#      held elsewhere: nothing reads this store except an ExternalSecret, and
#      every ExternalSecret is a committed manifest under deploy/. Namespace
#      scoping guards against a *tenant* creating one, which is not this
#      cluster's threat model - a single-operator home cluster where the
#      credential to write git is strictly more powerful than the store.
#   2. No `refreshInterval` and no `retrySettings`. Both default from the
#      controller's own configuration, and neither has a per-installation
#      reason to differ. Note that the store's refresh interval is not the one
#      that matters for rotation - that is each ExternalSecret's, in 3b.6.
#
# And what Ready=True on this object does and does not prove, since it is the
# step's exit criterion - and since infra-config's `wait: true` enforces it
# without being told to: this CR sets no Reconciling or Stalled condition and no
# observedGeneration, so kstatus falls through to its last rule, which reads a
# plain `Ready` condition. A store stuck NotReady is therefore a NotReady
# Kustomization at the 5m timeout, not a silent green.
#
# It proves: the region resolves, the bootstrap Secret
# exists, and both keys are present in it - a missing Secret or a renamed key
# fails client construction and reports Ready=False with
# ReasonInvalidProviderConfig. It does not prove AWS accepts the credential:
# with static keys, ESO validates by *retrieving* them locally, which never
# calls AWS. An expired key, a policy missing the bare-path ARN that
# docs/secrets-architecture.md warns about, or a tree seeded into a different
# region all report a perfectly Ready store. 3b.6's first synced ExternalSecret
# is the earliest honest proof that this store works, which is exactly why that
# step creates two secrets nothing consumes until Phase 5.
# ---------------------------------------------------------------------------
