# The cluster plan Phase 3b.11 - the explicit Longhorn StorageClasses. Two of
# them until the photos plan's Phase 1.5 appended a third; the header below
# describes the original pair, and longhorn-bulk carries its own argument at
# the bottom of the file because it is not chosen on the same axis.
#
# The storage split in the cluster plan asks for per-volume replica counts rather
# than one global default: 3 for the tiny critical volumes (Grafana, Kuma) and 2
# for bulk where loss is tolerable (OpenSearch, Prometheus). These are those two
# classes, so Phase 6 chooses per volume by naming one, instead of inheriting
# whatever ../controllers/longhorn.yaml's default happens to be that week.
#
# Both counts are literals, and neither is ${LONGHORN_REPLICA_COUNT}. That is
# the point of the split: the variable is the default for a volume that names no
# class, and it moves - 2 during the two-node build window, 3 after Phase 7
# joins the third node. A class called longhorn-r3 that sometimes means two
# replicas would be worse than no class at all.
#
# Defining longhorn-r3 now, on a cluster that cannot satisfy it, is deliberate
# and not a contradiction of the paragraph above. Nothing binds to it until
# Phase 6, and anything that does will read Degraded until the third node joins -
# expected, self-healing the moment it does (a Degraded volume rebuilds its
# missing replica automatically), and the reason Phase 6's critical volumes are
# the ones worth deferring if that noise costs more than the ordering.
#
# ---------------------------------------------------------------------------
# Why these are two objects rather than one object edited later
#
# A StorageClass is immutable in the fields that matter: Kubernetes rejects
# updates to `provisioner`, `parameters`, `reclaimPolicy` and
# `volumeBindingMode`. So this file cannot be "changed to 3" in Phase 7 - Flux's
# apply would fail on an immutable field, and the fix would be a delete and
# recreate that every already-bound PVC would keep pointing at by name while
# holding the old parameters anyway. A volume's replica count is fixed when the
# volume is created and is a property of the volume from then on, not of the
# class.
#
# Longhorn's own `longhorn` class does get edited, because it is not a
# StorageClass in the API's eyes until longhorn-manager makes it one: the chart
# renders it into a ConfigMap and a controller deletes and recreates the class
# whenever the two disagree. Nothing in this tree can do that, which is why the
# committed classes are named for what they are and left alone.
#
# These are core storage.k8s.io/v1 objects, so - like ../config's Traefik
# HelmChartConfig, and unlike everything else here - they do not actually need
# layer 1 to have registered a CRD. What they need is for driver.longhorn.io to
# exist before a PVC binds, which is a Phase 6 concern, not an apply-time one.
# They sit in this layer because that is where the objects belonging to a
# controller live, and splitting one file out for a technicality costs more
# clarity than it buys.
# ---------------------------------------------------------------------------
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r3
provisioner: driver.longhorn.io
allowVolumeExpansion: true
# Retain, against the `Delete` that Longhorn's own class ships with. Everything
# in this tree reconciles with prune: true, so a PVC can be removed by a
# mistaken commit as easily as by a mistaken kubectl - and with `Delete` that is
# the volume and its data gone in the same instant, before Phase 8's
# cluster-native backups exist to argue with it. `Retain` makes that recoverable:
# the PV survives its PVC as `Released`, holding the data.
#
# The cost is real and worth knowing rather than discovering: deleting a PVC
# leaves behind both a Released PV and the Longhorn Volume under it, and neither
# is reused automatically. Reclaiming the name means deleting the PV and then
# the Longhorn volume by hand.
reclaimPolicy: Retain
# The chart's default, restated. Longhorn volumes attach over iSCSI from any
# node, so there is nothing for WaitForFirstConsumer to optimise here - it would
# only delay binding until a pod is scheduled, which on a two-node cluster with
# dataLocality disabled buys nothing.
volumeBindingMode: Immediate
parameters:
  # The whole reason this class exists: three replicas, one per node, for the
  # small volumes whose loss would actually cost something.
  numberOfReplicas: "3"
  # Minutes Longhorn waits before deleting a replica it has lost contact with
  # and rebuilding it elsewhere. 30 is what Longhorn's own class ships; the
  # engine's default when the parameter is absent is 2880 (48 hours). Keeping 30
  # is a deliberate trade against Phase 1's staggered Windows Update reboots: a
  # host that comes back inside half an hour keeps its replica, and one that
  # does not gets rebuilt from a surviving copy rather than leaving the volume
  # degraded for two days.
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  # v1 - the engine 3b.2 prepared the node for. v2 (SPDK) wants a raw block
  # device and hugepages, neither of which the data disk or the VMs provide.
  dataEngine: "v1"
  # Longhorn's shipped default, restated because it looks alarming and is not:
  # with the revision counter off, a salvage picks the replica to trust from the
  # volume-head file's size and modification time instead of a per-write
  # counter, which is what Longhorn's own class has done for several releases.
  disableRevisionCounter: "true"
  # No attempt to keep a replica on the node running the workload. best-effort
  # would help read latency, at the cost of making the scheduler's placement and
  # a rebuild's behaviour depend on where a pod happens to land - on two nodes,
  # with three replicas asked for, there is nothing left for it to choose.
  dataLocality: "disabled"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r2
provisioner: driver.longhorn.io
allowVolumeExpansion: true
# Identical to longhorn-r3 in every field but the replica count - including
# this one. "Loss is tolerable" in the storage split means the *data* is
# reconstructible (metrics and logs age out; a dashboard's backing store does
# not), not that deleting a PVC should take the volume with it. The two classes
# differ on exactly the axis their names describe, which is the only way a
# Phase 6 author reading `storageClassName: longhorn-r2` can know what they
# chose.
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  # Two, and two forever: this is not the build-window compromise that
  # LONGHORN_REPLICA_COUNT carries, it is the storage split's considered answer
  # for bulk volumes. Phase 7 raises the *default*; this class does not move.
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  dataEngine: "v1"
  disableRevisionCounter: "true"
  dataLocality: "disabled"
---
# The photos plan (docs/plans/immich.md) Phase 1.5 - the third class, and the
# one that does not fit the axis the other two are named on.
#
# longhorn-r3 and longhorn-r2 are replica counts, chosen per volume by how much
# the data's loss would cost. This one is a *placement*: one replica, on one
# tagged disk, on whichever node that disk was physically attached to. "r1"
# would name only the first third of that and would read as "r2 but cheaper",
# which is the wrong thing to conclude from it.
#
# ---------------------------------------------------------------------------
# Why one replica is the right number here and not a compromise
#
# A ~1 TB photo library at two replicas costs 2 TB of raw disk to protect data
# whose actual protection is the offsite copy in Phase 4. Losing a replica of
# Prometheus means losing metrics that nothing can reconstruct; losing this one
# means restoring from S3, which is the recovery path that has to work anyway
# and gets rehearsed. Paying twice for local redundancy on the largest volume in
# the house, on top of an archive copy, is the expensive half of a
# belt-and-braces the braces alone already cover.
#
# The consequence is worth stating rather than discovering: a volume in this
# class is Degraded-to-Faulted, not Degraded-then-rebuilt, if its one replica is
# lost. That is by design, and it is why Phase 4 is not optional.
# ---------------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-bulk
provisioner: driver.longhorn.io
allowVolumeExpansion: true
# Retain, for the same reason its two siblings use it - see longhorn-r3's note
# above. It matters more here than anywhere else in the tree: this is the one
# volume whose contents cannot be re-derived from a running system at all.
reclaimPolicy: Retain
# WaitForFirstConsumer, and **unlike** both siblings, which is the one field in
# this file worth reading the reason for.
#
# Those two are Immediate because a Longhorn volume attaches over iSCSI from any
# node, so binding before a pod exists costs nothing - the volume can follow the
# pod wherever the scheduler puts it. Under dataLocality: strict-local that
# stops being true: the volume's node *is* the pod's node, so binding early is
# binding before the constraint is known. WaitForFirstConsumer makes the
# scheduler pick the node first and the volume follow, which is the only order
# in which the tagged disk's location can be honoured.
volumeBindingMode: WaitForFirstConsumer
parameters:
  # One. See the block comment above.
  numberOfReplicas: "1"
  # The mechanism that keeps a node name out of this repo entirely.
  #
  # strict-local ties the volume to the node holding its replica and forces the
  # consumer pod onto that node *through the volume*, rather than through a
  # nodeSelector or a PHOTOS_NODE variable written by hand. The disk tag below
  # is structural; the tagged disk exists on exactly one node because that is
  # where an operator attached hardware; and Kubernetes derives the placement
  # from those two facts. docs/ethos.md is why that distinction is worth a
  # storage class parameter.
  dataLocality: "strict-local"
  # The other half of the same contract, and the entire safety mechanism for
  # the disk itself. Longhorn schedules replicas onto any disk with capacity,
  # and a class naming no diskSelector matches every *untagged* disk - so
  # without this, a large empty disk is simply general capacity and Prometheus
  # and OpenSearch replicas land on it. The literal has to match the tag
  # scripts/k3s/Add-BulkDisk.ps1 writes into the node's node.longhorn.io CR;
  # those two agreeing is what makes this class reach exactly one disk.
  diskSelector: "bulk"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  dataEngine: "v1"
  disableRevisionCounter: "true"
