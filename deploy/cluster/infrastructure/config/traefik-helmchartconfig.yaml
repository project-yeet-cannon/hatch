# The cluster plan Phase 3b.9 - Traefik's HelmChartConfig.
#
# k3s ships Traefik itself: a HelmChart CR named `traefik` in `kube-system`,
# reconciled by k3s's own bundled helm-controller (a different controller from
# Flux's helm-controller, sharing nothing but the concept). That object is
# regenerated from k3s's packaged manifest on every k3s upgrade, so committing
# a competing `HelmChart` named `traefik` would fight k3s for ownership of one
# object on every node reboot. `HelmChartConfig` is k3s's own answer to that -
# a second, additive CR that k3s's controller layers on *top* of the HelmChart
# it owns, which is what lets this be a Flux-reconciled file without Flux and
# k3s ever touching the same object. It must carry the identical name and
# namespace as the HelmChart it patches - that pairing is how k3s's controller
# finds it, not a convention.
#
# Verified against the exact pin in scripts/versions.json (k3s v1.35.7+k3s1)
# rather than assumed from generic Traefik docs, because both the values below
# and their correctness depend on the chart version underneath, and the
# k3s-bundled Traefik chart is repackaged (Rancher rebuilds the upstream
# artifact under its own registry) and lags upstream:
#   https://raw.githubusercontent.com/k3s-io/k3s/v1.35.7+k3s1/manifests/traefik.yaml
# resolves chart `traefik-40.1.4+up40.1.0` - upstream traefik-helm-chart
# v40.1.0 - and already sets, in the HelmChart's own valuesContent:
#   providers.kubernetesIngress.publishedService.enabled: true
#   service.spec.ipFamilyPolicy: PreferDualStack
#   image.tag / priorityClassName / tolerations / deployment.podAnnotations
# None of that is repeated here except publishedService (see below); this file
# adds only what k3s's own manifest does not set.
#
# ---------------------------------------------------------------------------
# How the merge actually works, read from k3s-io/helm-controller v0.17.7
# (pkg/controllers/chart/chart.go), not assumed:
#
# The install/upgrade Job mounts the HelmChart's own valuesContent and this
# object's valuesContent as two ordered files -
# values-0-000-HelmChart-ValuesContent.yaml then
# values-1-000-HelmChartConfig-ValuesContent.yaml - passed to
# `helm upgrade --install -f <file> -f <file>`. That is plain Helm multi-values
# merge: maps merge key-by-key with the later file winning on overlap, lists
# are replaced wholesale, not appended. This file is always file 1, so it wins
# any conflict with k3s's own values without needing to duplicate them.
#
# HelmChartConfig itself carries no status at all - confirmed against the Go
# type, which (unlike HelmChart, which has `+kubebuilder:subresource:status`
# and a real Status struct with Conditions) declares neither. There is nothing
# for kstatus to poll: the moment kustomize-controller applies this object
# successfully, infra-config's `wait: true` considers it Ready, whether or not
# k3s's helm-controller has even started the Job that consumes it. This step's
# real proof is therefore its own *Exit* line - `kubectl -n kube-system get svc
# traefik` and a curl against the VIP - never the Kustomization's status, the
# same gap 3b.5's footnote calls out for ClusterSecretStore.
#
# One more correction, to infrastructure.yaml's framing rather than to this
# object: that file says nothing under config/ "can even be applied until
# layer 1 has registered the types they use" - true for every other object in
# this directory, not this one. `helmchartconfigs.helm.cattle.io` is a CRD k3s
# installs at cluster bring-up as part of its own bundled helm-controller, not
# something infra-controllers' HelmReleases register. This file has no real
# dependency on layer 1 at all; it sits in infra-config only because that is
# where every other per-installation, ${...}-bearing object in this phase
# lives, and splitting one file out for a technicality would cost more clarity
# than it buys.
# ---------------------------------------------------------------------------
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      # The one setting this whole step exists for: without it,
      # kube-vip-cloud-provider still assigns *an* address to this Service
      # (3b.8's pool holds exactly one), but nothing pins it to the specific
      # VIP 3a.2 chose and verified free - a real risk the day the pool ever
      # grows past one entry for a second LoadBalancer Service.
      #
      # Written as the annotation kube-vip reads directly, and deliberately not
      # as the core `service.spec.loadBalancerIP` field. Both are supported
      # inputs that end at the same place - the deprecated field is picked up by
      # kube-vip-cloud-provider's checkLegacyLoadBalancerIPAnnotation
      # (pkg/provider/loadBalancer.go at the pinned v0.0.12) and copied into
      # kube-vip.io/loadbalancerIPs. What differs is *when*, and that turns out
      # to matter:
      #
      # Helm renders the Service carrying no annotation, and the cloud provider
      # adds it only afterwards. Every helm upgrade therefore re-renders an
      # address-less Service, and in that window kube-vip's own service watcher
      # sees a MODIFIED event with nothing to advertise, builds an instance with
      # `addresses=[] hostnames=[]`, falls through to its hostname path, and
      # fails on `lookup : no such host`. That error aborts the service-add
      # before it patches status.loadBalancer.ingress - and the VIP is already
      # on the interface by that point, so kube-vip goes on answering ARP for an
      # address whose Service is stuck <pending> with an empty status. kube-proxy
      # builds its rules from that status, so nothing ever catches 80/443: the
      # VIP pings, and every TCP connection to it is refused by the node's own
      # stack. Nothing reports a fault - HelmChartConfig, the helm-install Job,
      # the Traefik pod and its EndpointSlice are all healthy and Ready.
      #
      # Observed exactly this way on 2026-08-16, with `iptables-save | grep
      # ${INGRESS_VIP}` on the VIP-holding node returning zero rules while the
      # websecure nodePort had its own. Rendering the annotation as part of the
      # Service closes the window - it is present in every render, so kube-vip
      # never sees the address-less state and never enters the failing path.
      #
      # `service.annotations` is a first-class value in the pinned chart,
      # documented in its values.yaml as "Additional annotations applied to both
      # TCP and UDP services (e.g. for cloud provider specific config)" - which
      # is this case precisely. An earlier revision of this file asserted the
      # chart had no way to set an annotation directly; that was wrong.
      #
      # Unvalidated, and more broadly than this file used to claim: the Rancher
      # repackage of traefik-40.1.4+up40.1.0 ships no values.schema.json at all
      # (verified by extracting the chart k3s actually serves from
      # /var/lib/rancher/k3s/server/static/charts - its root holds only
      # Chart.yaml, values.yaml, templates/ and docs). The `# @schema` comments
      # in values.yaml are inputs to a generator that never ran for this
      # artifact. Nothing here is schema-checked at install time, so a
      # misspelled key installs cleanly and is silently never read - the same
      # trap 3b.7's cert-manager footnote and 3b.8's kube-vip footnote flag for
      # their own values blocks, and it applies to the ports block below too.
      annotations:
        kube-vip.io/loadbalancerIPs: "${INGRESS_VIP}"
    ports:
      # The cluster plan Phase 5b.9 - HTTP to HTTPS, permanent. Caddy did this
      # implicitly (its whole reason for existing); Traefik does not
      # redirect on its own, so every one of 5b.9's four Ingresses would
      # otherwise serve plaintext on 80 side-by-side with 443 rather than
      # bouncing to it. entryPoint.to: websecure names the entrypoint key
      # above, not a Service or a host - this fires before any router match,
      # for every host this cluster answers for.
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        http:
          tls:
            # Already the chart's own default in the pinned version (checked
            # in traefik/values.yaml: `enabled: true` under
            # ports.websecure.http.tls, annotated `@default -- true`) - set
            # explicitly anyway, for the same reason 3b.4 sets
            # `installCRDs: true` and 3b.7 sets `crds.keep: true` over their
            # own chart defaults: a default that flips upstream, silently,
            # in a routine chart bump would otherwise serve plaintext HTTP on
            # 443 and nothing here would report it.
            #
            # The path itself is worth getting right and not guessing at: the
            # older, still-widely-documented `ports.websecure.tls.enabled`
            # (no `http`) is not this chart's shape at the pinned version -
            # v3's chart nests TLS under the entrypoint's `http` block, next
            # to `redirections` and `middlewares`, because `http` and `http3`
            # now carry independent settings. This file previously recorded
            # that the flatter legacy path would be *rejected* here, on the
            # strength of `additionalProperties: false` under
            # `ports.<entrypoint>` in the chart's generated values.schema.json.
            # It would not be: as the service footnote above now records, the
            # repackaged chart k3s serves carries no values.schema.json at all,
            # so `additionalProperties` is never enforced and the legacy path
            # would be accepted and silently ignored - websecure serving
            # plaintext on 443 with every object Ready. Getting the path right
            # is load-bearing on its own; there is no install-time failure
            # underneath it to catch a mistake.
            enabled: true
    metrics:
      prometheus:
        service:
          # The cluster plan Phase 6b.6 - the half of Traefik's metrics scrape
          # that belongs to this layer rather than to
          # ../../observability/config/scrape/traefik.yaml. Prometheus
          # support is already on by default in this chart (values.yaml:
          # "Prometheus is enabled by default. It can be disabled by setting
          # 'prometheus: null'"), so the traefik container is already serving
          # /metrics on its own `metrics` entryPoint (port 9100) with no
          # change here - what is missing is a Service to reach it through,
          # since metrics.prometheus.service.enabled defaults to false.
          #
          # Allowed in this layer under
          # ../../observability/config/scrape/kustomization.yaml's own rule:
          # templates/service-metrics.yaml renders a plain v1 Service, a type
          # every cluster understands from its first boot, not a
          # monitoring.coreos.com object - unlike
          # metrics.prometheus.serviceMonitor.enabled, which stays at the
          # chart's default (false) precisely because it would render a
          # ServiceMonitor from inside k3s's own bundled helm-controller, long
          # before observability-controllers has registered that CRD. The
          # ServiceMonitor that actually scrapes this Service is the
          # hand-written object in ../../observability/config/scrape/
          # traefik.yaml, in the phase 6 layer where every instance of that
          # CRD in this repository lives.
          #
          # Verified against templates/service-metrics.yaml and
          # templates/_service-metrics.tpl at the pinned
          # traefik-40.1.4+up40.1.0 (upstream v40.1.0): the rendered Service
          # is named via the chart's service-name helper, selects the same
          # pods the main `traefik` Service does, and exposes a port literally
          # named `metrics` - the port name traefik.yaml's ServiceMonitor
          # scrapes.
          enabled: true
    providers:
      kubernetesIngress:
        publishedService:
          # Redundant against k3s's own baseline valuesContent, which already
          # sets this - kept anyway, and for once not primarily as insurance
          # against an upstream default (k3s's manifest is not upstream's
          # default, it is a value k3s chose deliberately). It is kept because
          # this file's own values.yaml comment - "usually with the Service
          # provided by this Chart" - is exactly true here, and because
          # leaving 3b.9's own bullet ("sets ... publishedService") represented
          # by nothing in the manifest would make this file harder to audit
          # against the plan than the one line of duplication costs.
          enabled: true
    # -----------------------------------------------------------------------
    # The part-time-node plan's Phase 2.1 - Traefik stops being a single point
    # of failure.
    #
    # Everything below this line is about survivability rather than routing,
    # and it is worth doing on a three-node cluster whether or not a fourth
    # ever appears: with one replica, whichever node holds it takes all
    # ingress down with it on its Patch Tuesday reboot, for as long as
    # rescheduling takes. That is true today. The fourth node the plan adds
    # only makes meeting it a weekly event rather than a monthly one.
    deployment:
      # Two, and the anti-affinity below is what makes it two. `replicas` is a
      # sibling of the `podAnnotations` k3s's own valuesContent sets, and
      # setting it here does not disturb them: as this file's header records,
      # the two values files are merged by Helm key-by-key, so a `deployment`
      # map in file 1 merges into file 0's rather than replacing it. (Lists
      # would replace - which is why the `tolerations` k3s sets are not
      # touched here either.)
      #
      # Not three. Two replicas across three nodes survive any one node
      # leaving, which is the whole ask; a third buys nothing until there is a
      # fourth node to put it on and costs a pod's memory on a cluster whose
      # limits already overcommit.
      #
      # One thing this count is checked against by the chart itself, and it is
      # worth knowing why it does not bite: templates/deployment.yaml *fails*
      # the render if replicas > 1 and any `additionalArguments` entry
      # contains ".acme." - Traefik's own ACME resolver stores certificates in
      # a file that cannot be shared between replicas. This installation does
      # not use it. Certificates come from cert-manager into a Secret, served
      # through 3b.10's TLSStore, which every replica reads equally. Verified
      # against k3s's packaged traefik.yaml at the pinned version: its
      # valuesContent sets no additionalArguments at all.
      replicas: 2
    # Required, not preferred. Two replicas that the scheduler is merely
    # encouraged to separate are, on the day it does not, one replica with
    # extra steps - and the day it does not is exactly the day a node is
    # already unavailable, which is the day this exists for.
    #
    # The cost, stated because it is real: the chart's updateStrategy is
    # maxSurge 1 / maxUnavailable 0, so a rolling update briefly wants a third
    # pod, and hard anti-affinity means it needs a third node with no Traefik
    # pod on it. With three nodes that is satisfied. With one of the three
    # already cordoned, the rollout stalls rather than proceeding - it does not
    # drop traffic, and it resolves itself when the node returns. A stalled
    # upgrade during a drain is the correct trade against two replicas sharing
    # a node during normal operation.
    #
    # `affinity` is run through Helm's `tpl` by _podtemplate.tpl, so the
    # selector below can name the chart's own helpers rather than hardcoding
    # labels this file would have to keep in step. `traefik.instance-name` is
    # the helper `traefik.labelselector` itself uses - upstream's own commented
    # example in values.yaml expands `{{ .Release.Name }}-{{ include
    # "traefik.namespace" . }}` inline instead, which is the same string here
    # but silently wrong if `instanceLabelOverride` is ever set. Both helpers
    # read from templates/_helpers.tpl at the pinned traefik-40.1.4+up40.1.0,
    # and both are what the Deployment's own immutable `selector.matchLabels`
    # is built from, so this selector cannot drift from the pods it means.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: '{{ template "traefik.name" . }}'
                app.kubernetes.io/instance: '{{ template "traefik.instance-name" . }}'
            topologyKey: kubernetes.io/hostname
    # maxUnavailable: 1, for the reason
    # ../../../../charts/aerie/templates/poddisruptionbudgets.yaml already
    # writes out at length for `api` and `files`: a PDB that turns a planned
    # reboot into a stuck `kubectl drain` is worse than no PDB at all, because
    # it fails during the Patch Tuesday window it was meant to survive.
    # minAvailable: 2 against two replicas would be exactly that - zero
    # allowed disruptions, forever, and a drain that never completes.
    #
    # The chart renders this only when the key is truthy (templates/
    # poddisruptionbudget.yaml wraps both bounds in `if`), and it renders
    # policy/v1 on any cluster that has it, which this one does.
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # -----------------------------------------------------------------------
# ---------------------------------------------------------------------------
# What is deliberately absent.
#
# No Namespace object for kube-system. Every other controller/config file in
# this tree that targets a non-default namespace either creates it
# (namespaces.yaml, for `aerie`) or arrives alongside the controller that
# creates it (cert-manager, external-secrets). kube-system is neither - it is
# a builtin namespace that exists before k3s's own manifests run, let alone
# Flux's. Committing a Namespace object for it here would put it under
# infra-config's `prune: true`, and deleting this file would then attempt to
# delete kube-system itself. Nothing in this tree should ever own it.
#
# No `service.type`. Already `LoadBalancer` in the chart's own default
# (traefik/values.yaml: `service.spec.type: LoadBalancer`), which is also the
# only type kube-vip-cloud-provider watches - repeating it here would be
# 3b.4-style insurance for a value with no chart-level alternative for k3s to
# drift toward, so it is left at the default instead of restated.
# ---------------------------------------------------------------------------
