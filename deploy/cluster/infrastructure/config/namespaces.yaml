# The cluster plan Phase 3b.6 - namespaces created here because something in
# this layer has to hold a Secret before the layer that would otherwise own
# the namespace exists yet.
#
# 3b.6 syncs ha/token and logging/vm-log-shipper-token now, ahead of anything
# that reads them, as the first honest proof that the ClusterSecretStore works:
# Ready=True on the store proves the region parses and the bootstrap Secret is
# readable, and nothing more (../cluster-secret-store.yaml explains why). An
# ExternalSecret that reaches SecretSynced is the first thing that has actually
# called AWS. Both of those parameters belong to the app, so the app's namespace
# is where they land - which means it exists from here rather than from Phase 5.
#
# 6b.2/6b.4 hit the identical shape one phase later: ha/token and
# registry/pull-username|token each gained an observability-namespace block,
# and that namespace has to exist in the same Kustomization apply pass or not
# at all. The cluster plan's first attempt at 6b.4 put the Namespace in
# observability-controllers instead, on the theory that landing both in the
# same git commit as 6b.2's ExternalSecrets was enough - it is not.
# observability-controllers itself carries `dependsOn: infra-config`, so that
# arrangement is a deadlock, not a race: infra-config cannot go Ready while an
# ExternalSecret in it targets a namespace nothing has created yet, and
# observability-controllers is never even attempted until infra-config
# reports Ready. Discovered live, 2026-08-19, as
# `ExternalSecret/observability/home-assistant not found: namespaces
# "observability" not found` sitting under infra-config indefinitely. The fix
# is this file, not a dependsOn edge - infra-config is upstream of
# observability-controllers in the layer graph, so a namespace this layer's
# own ExternalSecrets need cannot live downstream of it.
#
# Consequences worth stating, since these are two objects with a long reach:
#
#   - Phase 5's Helm chart targets aerie and must not create it. A HelmRelease
#     with createNamespace, or a chart that templates its own, gives two
#     owners to one object and the second to reconcile fights the first. The
#     same now holds for observability and 6b.5 onward's HelmReleases.
#   - infra-config prunes, so deleting either Namespace from this file deletes
#     it from the cluster, and with it everything Phase 5 (aerie) or Phase 6
#     (observability) put in it. Unlike external-secrets (3b.4) nothing here
#     is irreplaceable - every Secret in either comes back from the store -
#     but the workloads do not. For observability specifically: Longhorn's r2
#     and r3 StorageClasses
#     (./longhorn-storageclasses.yaml) both set reclaimPolicy: Retain, so its
#     PVCs' underlying volumes survive as Released rather than being deleted
#     with the namespace - the data is not gone, but nothing references it
#     until an operator reattaches it by hand.
#   - Order inside the layer is not a concern: kustomize-controller applies
#     Namespaces and CRDs as a first stage and waits for them before applying
#     anything else, so these and the ExternalSecrets in external-secrets/ can
#     sit in one Kustomization without a dependsOn between them.
#
# The other namespace 3b.6 writes into, cert-manager, is deliberately NOT here:
# it arrives with the component that owns it, in ../../controllers, the same way
# external-secrets does. That is also the only ordering that works when it
# works at all - the layer boundary guarantees a controller's namespace exists
# before this layer's objects are applied into it, because infra-controllers
# is upstream of infra-config. It is not a substitute for this file's
# approach; it is the other of the two shapes, chosen per namespace by which
# direction its layer sits. Until 3b.7 lands, expect
# cert-manager-route53-credentials to be the one object in infra-config that
# cannot apply.
apiVersion: v1
kind: Namespace
metadata:
  name: aerie
  labels:
    app.kubernetes.io/part-of: aerie
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
