# The cluster plan Phase 3b.10, part 3 of 3 - what actually serves the wildcard.
#
# Missing from the original plan, and the failure it causes is the quiet kind:
# the Certificate is issued, the Secret exists, everything reports Ready, and
# every browser gets Traefik's built-in self-signed certificate anyway. Traefik
# presents its default certificate to any TLS connection whose route does not
# name one, and out of the box that default is a self-signed cert it generates
# for itself. A TLSStore named `default` is how that default is replaced.
#
# Without this file the alternative is a `tls:` block naming aerie-wildcard-tls
# on every Ingress in Phase 5, in a namespace that is not this one - so each
# would need its own copy of the Secret, or Traefik's cross-namespace reference
# flag turned on. One object here covers all seven hostnames and everything
# added after them, which is the entire argument for having a wildcard.
#
# ---------------------------------------------------------------------------
# Three facts this object depends on, each checked rather than assumed
#
# 1. The name must be `default` and there can be exactly one of them in the
#    cluster. Traefik special-cases the name - a store called `default` is keyed
#    as `default` rather than by namespace/name, which is what makes it the
#    default rather than a store nothing selects (traefik v3.7.1,
#    pkg/provider/kubernetes/crd/kubernetes.go, buildTLSStores). Two of them in
#    different namespaces is worse than one in the wrong place: Traefik deletes
#    the default store entirely and logs an error, so the whole cluster silently
#    reverts to the self-signed certificate. Being under infra-config's
#    `prune: true` is what keeps this the only one - a second copy left behind
#    by hand is invisible from here.
#
# 2. It has to be in the same namespace as the Secret. The default certificate
#    is read with client.GetSecret(store.Namespace, secretName) and there is no
#    cross-namespace path in that call at all - `allowCrossNamespace` governs
#    IngressRoute service references, not this. That is why the Certificate next
#    door is in kube-system too, and Traefik's own ClusterRole already grants
#    get/list/watch on secrets cluster-wide, so no extra RBAC is needed.
#
# 3. Traefik has to be watching CRDs to see it. `providers.kubernetesCRD.enabled`
#    is true by default in the pinned chart and k3s's own valuesContent does not
#    turn it off (checked against traefik-helm-chart v40.1.0's values.yaml and
#    k3s v1.35.7+k3s1's manifests/traefik.yaml) - so nothing has to be added to
#    ./traefik-helmchartconfig.yaml to make this readable.
#
# ---------------------------------------------------------------------------
# Ordering against the Certificate, which does not need managing
#
# This object will be applied long before the Secret it names exists - the
# first issuance is minutes of DNS-01 away, and part 2's deliberate stop makes
# it longer. Traefik logs "Secret kube-system/aerie-wildcard-tls does not exist"
# and carries on serving its self-signed default; the CRD provider watches
# Secrets, so it rebuilds its configuration when cert-manager writes one and
# picks the wildcard up with no restart and no re-apply. A `dependsOn` for this
# would be ordering something that resolves itself.
#
# Note also that this CRD does not come from anything under ../controllers:
# k3s installs `tlsstores.traefik.io` at bring-up through a second bundled
# HelmChart named `traefik-crd`, alongside the `traefik` one that
# ./traefik-helmchartconfig.yaml patches. Same technicality, same reason for
# living here anyway: this is where the objects that make ingress work are.
#
# Like a HelmChartConfig, a TLSStore carries no status, so infra-config's
# `wait: true` calls this Ready the instant it applies. The proof that it worked
# is 3b.10's *Exit* line - an openssl handshake against the VIP - and nothing
# short of that.
# ---------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  # Not a name to choose. See fact 1 above.
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: aerie-wildcard-tls
