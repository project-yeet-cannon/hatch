# The cluster plan Phase 6b.4 - the same controllers/config split
# ./infrastructure.yaml and ./data.yaml already use, applied to observability.
#
# observability-controllers: the two default-login Secrets, and - from 6b.5 on
# - the HelmReleases (kube-prometheus-stack, OpenSearch, fluent-bit, Uptime
# Kuma, AutoKuma) and the CRDs those releases register. The observability
# Namespace is deliberately not here - see
# ./observability/controllers/kustomization.yaml's comment for why living
# downstream of infra-config (which 6b.2's ExternalSecrets need it ahead of)
# is a deadlock, not just a re-ordering.
#
# observability-config: every instance of those CRDs - ScrapeConfigs,
# ServiceMonitors, PodMonitors, PrometheusRules - plus the Ingresses, Grafana
# dashboards and the provisioning CronJobs. None of it can be applied until
# controllers has registered the types it names, which is what `wait: true`
# on controllers makes real rather than hopeful: see ./infrastructure.yaml's
# own note on `wait` for why the re-scope preamble's first bullet
# (docs/plans/swarm/phase-6-observability.md) treats this as load-bearing
# rather than decorative. Every hand-written scrape and alert object in 6b.6
# and 6b.8 depends on that boundary holding.
#
# **No dependsOn between this file and ./apps.yaml, in either direction, and
# that is deliberate** (the re-scope preamble again). A Kuma monitor pointed
# at a Service the app tier hasn't created yet is a red monitor, which is a
# correct report, not a broken one - and the app tier does not need to be
# observed in order to run. An edge here would serialize two independent
# layers and turn a Phase 5 failure into a Phase 6 failure as well.
#
# Both carry postBuild.substituteFrom the aerie-cluster-config ConfigMap, for
# the same reason and with the same two hazards ./infrastructure.yaml documents
# in full: substitution is not scoped to tokens this phase chose, and an
# undefined token expands to an empty string rather than failing. Neither
# Kustomization names aerie-image-tags - nothing in this phase is a
# first-party image under image automation, and 6b.13's provisioner is pinned
# by hand in its own CronJob manifest, for the reason that step gives.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-controllers
  namespace: flux-system
spec:
  # Same shape as infra-controllers: this layer is HelmReleases from 6b.5 on,
  # and re-applying an unchanged one every ten minutes achieves nothing.
  interval: 30m
  retryInterval: 2m
  # 15m, matching infra-controllers - kube-prometheus-stack and OpenSearch are
  # both multi-object chart installs with `wait: true` behind them, the same
  # shape of slow cold start Longhorn's DaemonSet gave that layer its timeout.
  timeout: 15m
  dependsOn:
    - name: infra-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/cluster/observability/controllers
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: aerie-cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  # The boundary. Everything under config/ names a type that something under
  # controllers/ installs.
  dependsOn:
    - name: observability-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/cluster/observability/config
  prune: true
  # Also true here, and it is the phase gate as much as the ordering - see
  # ./infrastructure.yaml's infra-config for the same reasoning applied to
  # ClusterIssuer's staging-issuer stop. A PrometheusRule with an evaluation
  # error or an Ingress that never gets a certificate should surface as this
  # Kustomization being NotReady, not as a green reconciliation over a broken
  # object.
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: aerie-cluster-config
