# The photos plan (docs/plans/immich.md) - the `photos` layer, and the first
# Flux Kustomization in this tree that is not part of the cluster plan's
# numbered phases.
#
# Named for the capability, not the vendor. The namespace is `immich` because
# that is what is actually running in it; everything Aerie owns around it -
# this layer, the scripts, the archive job - is named `photos`, because
# `v+1` sharing and `v+2` the kiosk frame are photo-domain features that
# should not have to be renamed if Immich is ever replaced. See the same
# asymmetry argued at infrastructure/config/namespaces.yaml.
#
# ---------------------------------------------------------------------------
# Why this is its own layer and not a folder inside apps
#
# The whole point of the split is `wait: true` on ./apps.yaml. Immich is a
# four-container upstream product with its own schema, its own migrations and
# a machine-learning model server; when it is broken, it must not be able to
# hold the family's own site tier NotReady. So this depends on infra-config
# and on nothing else - not data-schema, not site-config, not apps - and
# nothing depends on it.
#
# ---------------------------------------------------------------------------
# Two Kustomizations, split the way data.yaml splits its two
#
# photos-database is the data half: the CNPG Cluster, its WAL destination,
# the extensions and the nightly base backup. photos is the application
# half: the library PVC, the chart source, the HelmRelease and the ingress.
# The split is the same one ./data.yaml makes between data-cluster and
# data-schema, for the same reason - a HelmRelease applied in the same pass
# as the database it connects to starts against a primary that is not up -
# and photos-database's own `wait: true` is what makes the boundary real
# rather than decorative.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: photos-database
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # 10m, matching data-cluster: this brings up a Postgres primary from a cold
  # local-path PVC, and on the first reconcile it also pulls a ~450 MB operand
  # image and the extension image beside it.
  timeout: 10m
  dependsOn:
    - name: infra-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/cluster/photos/database
  prune: true
  # What makes the dependsOn boundary Phase 3 will hang off this one real
  # rather than decorative - without it this is Ready as soon as the Cluster
  # object is *applied*, not once CNPG reports it healthy.
  wait: true
  postBuild:
    substituteFrom:
      # ${WAL_BUCKET} and ${IMMICH_POSTGRES_INSTANCES} resolve nowhere else.
      # `optional` stays false: a missing ConfigMap should fail reconciliation
      # loudly rather than substitute empty strings into a database spec.
      - kind: ConfigMap
        name: aerie-cluster-config
---
# The application half. Phase 3 of the photos plan.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: photos
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # 15m, longer than the HelmRelease's own 10m install/upgrade timeout
  # (./photos/app/helmrelease.yaml) for the reason ./apps.yaml gives about
  # its own: Flux's wait covers applying the HelmRelease *and* waiting for
  # helm-controller to finish reconciling it, so it has to outlast whichever
  # of Helm's two timeouts is in play. On a first install that window is
  # three image pulls onto a cold node - immich-server ~798 MB compressed and
  # immich-machine-learning ~452 MB, measured at v3.0.0.
  timeout: 15m
  dependsOn:
    # The database, and nothing else. Not apps, not data-schema, not
    # site-config - see this file's header. photos-database in turn depends
    # only on infra-config, so the whole photo domain hangs off one edge
    # into the platform and none into the family's own site tier.
    - name: photos-database
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/cluster/photos/app
  prune: true
  # The phase gate as much as the ordering: a HelmRelease whose server pod
  # never goes Ready - because the library volume could not be scheduled, say
  # - should surface as this Kustomization staying NotReady, not as a green
  # reconciliation over a release that never converged.
  wait: true
  postBuild:
    substituteFrom:
      # ${DOMAIN} for the ingress host and Immich's externalDomain, ${TZ} for
      # the server container. `optional` stays false: an unset DOMAIN would
      # otherwise substitute an empty string and publish a route at
      # `photos.`, which resolves nowhere and reads as a DNS fault.
      - kind: ConfigMap
        name: aerie-cluster-config
