# Layer for the apps Flux Kustomization (../apps.yaml). The HelmRelease that
# installs charts/aerie, plus 5b.12's image automation objects - all
# structural, and all reconciled together because nothing here needs
# ordering against anything else in this list.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - automation/image-repositories.yaml
  - automation/image-policies.yaml
  - automation/image-update-automation.yaml
