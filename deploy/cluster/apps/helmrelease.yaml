# The cluster plan Phase 5b.10 - the commit that makes 5b.5 through 5b.9 real.
# One HelmRelease, installing charts/aerie into the `aerie` namespace 3b.6
# created, reconciled by the Flux Kustomization in ../apps.yaml.
#
# Lives in flux-system, like every other Flux control object in this repo
# (the Kustomizations in data.yaml/site.yaml/infrastructure.yaml, the
# GitRepositories, and 5b.12's future ImageRepository/ImagePolicy/
# ImageUpdateAutomation) - unlike Phase 3's controller HelmReleases
# (../infrastructure/controllers/*.yaml), which each live in the operator
# namespace they install into because that IS the workload. This HelmRelease
# is the app tier itself, reconciled the same way data-schema or site-config
# is; `targetNamespace: aerie` with no `createNamespace` is what routes the
# rendered objects into a namespace this release does not own, rather than
# giving one Namespace object two owners.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aerie
  namespace: flux-system
spec:
  # Longer than Helm's 5m default - the migrate hook (5b.6) is a
  # pre-install/pre-upgrade Job that gates the rest of the release, and a
  # timeout here rolls the whole release back mid-migration rather than
  # merely being slow. ../apps.yaml's own timeout is set longer still, since
  # Flux waits on this object's health on top of Helm's own wait.
  interval: 10m
  chart:
    spec:
      # This repository, not a HelmRepository - the chart is first-party and
      # lives at charts/aerie, so its source is the same flux-system
      # GitRepository every Kustomization here already reads from.
      chart: ./charts/aerie
      # The default, ChartVersion, ignores a template edit that doesn't bump
      # Chart.yaml's version - an edited template that reconciles to nothing,
      # with every object reporting Ready. Revision tracks the git commit
      # instead, so any change to charts/aerie is picked up regardless of
      # whether version was bumped.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  targetNamespace: aerie
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  # Every value below is a ${...} token that ../apps.yaml's
  # postBuild.substituteFrom resolves before Flux ever applies this manifest -
  # Helm then sees literals. valuesFrom + targetPath would also work and is
  # strictly worse: two substitution mechanisms in one tree instead of one,
  # for values that reach an inline block exactly the way ${...} reaches
  # every other manifest here.
  #
  # Only the values whose chart default is a placeholder are listed - see
  # charts/aerie/values.yaml's own top-of-file note on which ones those are.
  # replicaCount, files.replicaCount, image.pullSecret, share.auth and
  # postgres.* are real defaults, not placeholders, and are left to the chart.
  values:
    image:
      registry: ${IMAGE_REGISTRY}
      # AERIE_API_IMAGE_TAG / KIOSK_FILES_IMAGE_TAG resolve from the
      # aerie-image-tags ConfigMap (5a.3's site repo, 5b.12's automation
      # target) rather than aerie-cluster-config - postBuild.substituteFrom
      # takes both below, and Flux merges tokens across every ConfigMap it
      # names there. No concrete tag is ever committed to this repository.
      api:
        tag: ${AERIE_API_IMAGE_TAG}
      kioskFiles:
        tag: ${KIOSK_FILES_IMAGE_TAG}
    domain: ${DOMAIN}
    tz: ${TZ}
    # The wall (docs/plans/auth.md) - none | canary | full, and the whole
    # rollback. Optional in cluster-config.json with the same `:=` default the
    # chart carries, so an installation that never sets AUTH_MODE behaves
    # exactly as it did before auth existed.
    #
    # Deliberately unquoted, because quoting it here would be theatre. This
    # file is not what Flux substitutes into: `kustomize build` runs first and
    # re-serializes every scalar, normalizing double quotes, single quotes and
    # even an explicit !!str tag down to a plain scalar. Substitution is then
    # textual against that output, and the result is parsed as YAML 1.1 - so
    # the type of the value is decided entirely by the *word*, and an author
    # who "just quotes it" gets no protection at all.
    #
    # That is not theoretical. Found live, 2026-08-21: the vocabulary was
    # "off | canary | on" and this line was written `mode: "${AUTH_MODE:=off}"`
    # exactly as the advice at the time said to. AUTH_MODE=on rendered as
    # `mode: on`, Helm read the boolean true, and the release failed its guard
    # on every reconcile while the cluster went on serving the previous one.
    #
    # The fix is the vocabulary, in charts/aerie/values.yaml: none, canary and
    # full are not YAML scalars of any other type, so this token is type-safe
    # by construction rather than by quoting. Anything added here later has to
    # clear the same bar - see that file's note.
    auth:
      mode: ${AUTH_MODE:=none}
    # Both optional (scripts/k3s/cluster-config.json) - when unset, the key is
    # genuinely absent from the ConfigMap, not present with an empty value.
    # kustomize-controller substitutes in strict mode (confirmed live: an
    # absent key with no default fails the whole Kustomization - "variable
    # not set (strict mode)" - it does not fall back to an empty string the
    # way infrastructure.yaml's own comment assumes for the general case).
    # The `:=` form is Flux's documented escape hatch: substitute the default
    # when the variable is unset. Empty is exactly what
    # charts/aerie/values.yaml's haHost/haPort already default to, so the
    # chart's `{{- if .Values.haHost }}` guards still render nothing.
    haHost: ${HA_HOST:=}
    haPort: ${HA_PORT:=}
    # Also optional, same absent-key-under-strict-mode reasoning -
    # api-deployment.yaml's MediaLibrary__RootPath guard depends on this
    # staying genuinely empty rather than collapsing to the share root.
    mediaLibrarySubpath: ${MEDIA_LIBRARY_SUBPATH:=}
    share:
      host: ${SHARE_HOST}
      name: ${SHARE_NAME}
