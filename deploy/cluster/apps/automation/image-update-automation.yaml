# The cluster plan Phase 5b.12, part 3 - the object that turns the two
# ImagePolicies (./image-policies.yaml) into a commit. sourceRef is the
# **aerie-site** GitRepository (../../site/gitrepository.yaml), not
# flux-system: that one field is the entire difference between this design
# and the one the re-scope preamble rejected - upgrading flux-system's own
# Secret to contents:write, which would hand the cluster a credential over
# the repository that governs it. aerie-site-git (5b.1) is scoped to the
# site repo alone.
#
# update.path is ./ because the site repo holds exactly one file at its root
# (image-tags.yaml, 5a.3), with the $imagepolicy markers 5b.12's step 4 adds.
# strategy: Setters is what makes update.path relevant at all - the
# alternative, ImageUpdateAutomation's now-removed FluxV1 markers, is gone in
# v1beta2.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: aerie
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: aerie-site
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      # .Updated was removed from this API (Stalled the object with
      # "template uses removed '.Updated' field" - confirmed live,
      # 2026-08-19); .Changed.Changes is its replacement, one entry per
      # setter that actually moved, each with the old/new value and which
      # marker fired - so this still names the image that moved without
      # assuming there are exactly two of them.
      messageTemplate: |
        Bump image tag{{ if gt (len .Changed.Changes) 1 }}s{{ end }}

        {{ range .Changed.Changes -}}
        {{ .Setter }}: {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./
    strategy: Setters
