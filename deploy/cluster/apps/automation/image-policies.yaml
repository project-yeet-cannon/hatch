# The cluster plan Phase 5b.12, part 3 - one ImagePolicy per ImageRepository
# (./image-repositories.yaml), each picking the newest of the tags publish.yml
# now emits alongside `latest` and the raw SHA:
# `<UTC timestamp>-<short sha>`. Neither `latest` (a moving pointer) nor a SHA
# (no order) is something a policy can select "newest" from - the re-scope
# preamble at the top of phase-5-app-tier.md is what this pattern answers.
#
# filterTags narrows to that shape and extracts just the timestamp; policy
# treats the extracted value numerically and picks the largest. The name
# matched here (aerie-api / kiosk-files) is also what the site repo's
# image-tags.yaml $imagepolicy markers reference, as `flux-system:<name>:tag`.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: aerie-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: aerie-api
  filterTags:
    pattern: '^(?P<ts>\d{14})-[0-9a-f]+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: kiosk-files
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: kiosk-files
  filterTags:
    pattern: '^(?P<ts>\d{14})-[0-9a-f]+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
