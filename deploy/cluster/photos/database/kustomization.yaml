# Layer for the photos-database Flux Kustomization (../../photos.yaml): the
# Immich database and its WAL destination.
#
# Order here is applied order, matching ../../data/cluster/kustomization.yaml:
# the ObjectStore first, so the Cluster's WAL archiver never targets a
# destination that does not exist yet. It is not a correctness problem either
# way - CNPG's archiver retries continuously rather than failing once - but
# the cost of the wrong order is a minute of noisy archive attempts in the
# logs of a brand-new cluster, which is exactly when someone is watching them.
#
# The Database CR and the ScheduledBackup do assume the Cluster answers, and
# in the data tier that assumption earned a second Kustomization
# (data-cluster -> data-schema). It does not here, and the difference is what
# the objects are: those two are reconciled by the operator, which retries
# forever, where the data tier's split exists for a *Job* that would burn its
# backoffLimit failing to connect before the primary existed. There is no Job
# in this layer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - objectstore.yaml
  - cluster.yaml
  - database.yaml
  - scheduledbackup.yaml
