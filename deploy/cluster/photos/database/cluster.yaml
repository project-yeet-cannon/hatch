# The photos plan (docs/plans/immich.md) Phase 2.2 - the Postgres Immich will
# accept. Modeled on ../../data/cluster/cluster.yaml; that file carries the
# reasoning for the fields the two share, and this one annotates only where
# they differ and why.
#
# Why a second Cluster at all, rather than a second database inside aerie-pg,
# is Finding 3 of the plan: `vchord` has to be in shared_preload_libraries,
# which is a cluster-wide setting, and Immich owns its own schema and runs its
# own migrations on its own release cadence. Neither is something aerie-pg
# should inherit.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: immich
spec:
  # One instance, and unlike POSTGRES_INSTANCES this is not a build-window
  # number that a later phase raises. Immich is not on the HA list: a second
  # instance doubles the local-path footprint on the node OS disks to protect
  # data that already has continuous WAL archiving (./objectstore.yaml) and,
  # from Phase 4, a nightly logical dump carried offsite beside the photos it
  # describes. The recovery story here is the archive, not a standby.
  #
  # A variable rather than a literal so that changing the answer is a
  # repository variable and a Provision 4 re-dispatch, the same shape as
  # POSTGRES_INSTANCES - but with a `:=` default, because an installation that
  # never sets IMMICH_POSTGRES_INSTANCES must still get a working cluster
  # rather than a Kustomization that fails substitution. That is the same
  # treatment AERIE_REPO_OWNER gets, and the reason the key is `required:
  # false` in scripts/k3s/cluster-config.json.
  #
  # Raising it above 1 means revisiting `synchronous:` below, which is absent
  # here precisely because there is no standby to wait on.
  instances: ${IMMICH_POSTGRES_INSTANCES:=1}

  # Two differences from the data tier's `postgresql:18.4`, both required:
  #
  # - `-standard-trixie`, not the default (minimal) flavour. The declarative
  #   extension mechanism below mounts an extension image over a stock operand
  #   and points PostgreSQL's extension_control_path at it; that needs the
  #   operand image built with the system PostgreSQL layout the extension
  #   images are compiled against.
  # - the patch version is pinned for the reason ../../data/cluster/cluster.yaml
  #   already gives at length: pg_restore only goes forwards across major
  #   versions, so an unpinned major is a one-way change that could arrive
  #   inside a routine bump. 18.4 is the same minor aerie-pg runs, which is
  #   not required but is one less version pair to reason about.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie

  storage:
    # Not Longhorn - docs/plans/swarm/design.md#storage-split. Immich's own
    # docs say the same thing louder: it will not support installs whose
    # Postgres data sits on network storage.
    storageClass: local-path
    size: 20Gi

  walStorage:
    storageClass: local-path
    size: 10Gi

  postgresql:
    # Cluster-wide, which is the whole reason this Cluster exists separately -
    # aerie-pg must not get this line. vchord.so has to be preloaded at
    # postmaster start; CREATE EXTENSION alone is not enough for it.
    shared_preload_libraries:
      - vchord.so

    # Finding 3, and the thing that makes a first-party operand image
    # possible. PostgreSQL 18 added the extension_control_path GUC; CNPG 1.27+
    # builds on it by mounting an OCI image as a Kubernetes ImageVolume onto
    # the instance pods and appending its directories to the two search paths
    # below. So the database itself stays an image the CloudNativePG project
    # patches, and the third-party image on the critical path carries nothing
    # but vchord.so and its control files - not a whole Postgres fork.
    #
    # Both prerequisites were verified against this cluster before this file
    # was written (plan step 2.1): CNPG is 1.30.0, k3s is v1.35.7+k3s1, and a
    # throwaway pod mounting the exact image reference below listed
    # vchord.so and vchord.control at these paths.
    #
    # The two paths are directories *inside the image*, not inside the operand
    # - CNPG rewrites them onto its own mount point. They default to /lib and
    # /share, which is not where a Debian-layout image puts them, so both have
    # to be spelled out. extension_control_path names the parent of
    # `extension/`, which is why it ends at the version directory.
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/

  # No `synchronous:` block, deliberately, and this is the one omission worth
  # calling out rather than leaving to be noticed. aerie-pg sets
  # dataDurability: required with number: 1, which is RPO=0 and depends
  # entirely on a standby existing to satisfy it. At instances: 1 the same
  # setting would block every write forever, because nothing can ever
  # acknowledge. If IMMICH_POSTGRES_INSTANCES is ever raised, add the block
  # then - not before.

  # Harmless at one instance and correct the moment there are two, which is
  # exactly when nobody remembers to add it. Same reasoning as the data tier's
  # copy: `preferred` co-locates under pressure and turns HA into a single
  # point of failure without saying so.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required

  # The default, written out. The operator owns the PodDisruptionBudget for a
  # CNPG Cluster and creates it from this flag - a hand-written PDB here would
  # be a second object fighting the controller over the same pods, so plan
  # step 2.2's "and a PodDisruptionBudget" is satisfied by this line rather
  # than by a manifest.
  enablePDB: true

  # Goal 2 of design.md: the scheduler cannot place what it cannot size.
  # Larger limits than aerie-pg's, and the reason is vchord: building and
  # querying vector indexes over a few hundred thousand embeddings is the
  # memory-hungriest thing this database does, and it does it in bursts during
  # an import rather than steadily. The requests stay small because the steady
  # state genuinely is small.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  bootstrap:
    initdb:
      database: immich
      owner: immich
      # CNPG generates this password and publishes it as the immich-pg-app
      # Secret. It never reaches SSM and never reaches this repository -
      # Phase 3's HelmRelease reads it with a secretKeyRef. That distinction
      # matters: scripts/secrets/parameters.json is for values an *operator*
      # supplies, and this is not one of them.

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        # Bare name, resolved in this namespace - ./objectstore.yaml.
        barmanObjectName: immich-pg-wal

  primaryUpdateStrategy: unsupervised

  enableSuperuserAccess: false

  # False, matching ../../data/cluster/cluster.yaml, and for the reason that
  # file's copy gives: the Cluster-level toggle is deprecated upstream in
  # favour of a hand-written PodMonitor, and this cluster's lives in
  # ../../observability/config/scrape/cloudnative-pg.yaml. That object selects
  # `cnpg.io/cluster: aerie-pg` in namespace `aerie` today; widening it to
  # reach this namespace belongs with the rest of Phase 3's monitoring, not
  # here.
  monitoring:
    enablePodMonitor: false
