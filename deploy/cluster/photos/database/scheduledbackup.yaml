# The photos plan (docs/plans/immich.md) Phase 2.6 - nightly base backups
# through the same barman-cloud plugin ./cluster.yaml's `plugins:` block
# already enables for continuous WAL archiving. Modeled on
# ../../data/schema/scheduledbackup.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-pg-daily
  namespace: immich
spec:
  cluster:
    name: immich-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Six fields, not five - CNPG's schedule carries a leading seconds field.
  # A five-field expression is accepted and silently fires an hour off from
  # what it reads as, which is the kind of bug that is only ever found by
  # someone reading the wrong backup's timestamp during an incident.
  #
  # 01:00, and the choice is about what else is already running on these
  # nodes rather than about this job. Taken: 02:00 aerie-pg's base backup,
  # 03:10 the restic backup, 04:00 Sundays the restic verify. 01:00 leaves
  # the whole 04:00-and-later window free for Phase 4's photos-archive run,
  # which has to start after Immich's own nightly database dump and then
  # saturate the house uplink for as long as it takes.
  #
  # Nodes run UTC (they are Linux VMs with no TZ set and CNPG's scheduler has
  # no timezone field), which is the same frame every schedule above is in.
  schedule: "0 0 1 * * *"
  backupOwnerReference: self
  # Take the first base backup on apply rather than waiting for 01:00. That
  # is what makes plan step 2.7's gate - "a base backup exists in the WAL
  # bucket under the new cluster's own server name" - checkable in the same
  # sitting this is committed in, rather than tomorrow.
  immediate: true
