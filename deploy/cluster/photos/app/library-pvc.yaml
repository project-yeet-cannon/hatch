# The photos plan (docs/plans/immich.md) Phase 1.7 - the photo library itself.
# Written in Phase 3 rather than Phase 1 because a WaitForFirstConsumer claim
# with no consumer is an object that does nothing until the workload that
# mounts it exists, and that workload is ../app/helmrelease.yaml next door.
#
# Not created by the Helm chart, and not creatable by it: the upstream chart
# takes an existingClaim and says so in its own values.yaml ("Automatically
# creating the library volume is not supported by this chart"). That is the
# right split anyway - this is the one volume in the house whose contents
# cannot be re-derived from a running system, so it should not be owned by an
# object that a `helm uninstall` removes.
#
# ---------------------------------------------------------------------------
# 1Ti against a 1180 GiB disk, on purpose
#
# A Longhorn volume is sparse: the size is a cap, not an allocation, and
# nothing is written to the disk until Immich writes it. What actually binds
# is the ceiling in the plan's Phase 1 section - Longhorn's global
# storage-minimal-available-percentage of 25 makes the disk unschedulable once
# available space falls below a quarter of capacity, so the usable figure is
# ~885 GiB, not 1180. Measured on this cluster 2026-08-25: the bulk disk
# reports storageMaximum 1267109507072 bytes (1180.09 GiB).
#
# 1Ti is under the disk deliberately. Longhorn can expand a volume and cannot
# shrink one, so the direction that stays open is the one that matters, and
# leaving headroom keeps `v+3`'s external library a second PVC on the same
# disk rather than an argument with a full volume.
#
# allowVolumeExpansion is on for longhorn-bulk, so growing this is an edit to
# the number below and nothing else.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: library
    app.kubernetes.io/part-of: aerie
spec:
  accessModes:
    - ReadWriteOnce
  # One replica, strict-local, diskSelector: bulk - see
  # ../../infrastructure/config/longhorn-storageclasses.yaml. The replica
  # count is a property of the volume from creation onward, so this choice is
  # made here once and is not editable afterward.
  storageClassName: longhorn-bulk
  resources:
    requests:
      storage: 1Ti
