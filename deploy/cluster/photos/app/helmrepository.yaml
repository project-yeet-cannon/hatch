# The photos plan (docs/plans/immich.md) Phase 3.2 - the chart source.
#
# The first OCI HelmRepository in this tree, and not by preference: the HTTP
# repo at https://immich-app.github.io/immich-charts has been removed and no
# longer receives updates, so `type: oci` is the only source that exists.
# Every other HelmRepository here (../../infrastructure/controllers/*.yaml,
# ../../observability/controllers/*.yaml) is a classic index.yaml repo, and
# the difference is worth knowing when reading them side by side:
#
#   - `url` is an oci:// reference to the *registry path that holds the
#     chart*, not to the chart itself. source-controller appends the chart
#     name from the HelmRelease's chart.spec.chart, so `chart: immich` below
#     resolves to oci://ghcr.io/immich-app/immich-charts/immich.
#   - There is no index to poll. `interval` on an OCI repository governs how
#     often source-controller re-resolves the *tag* it was asked for, which
#     for an exact version pin is a no-op - the same property the HTTP
#     repositories next door rely on, arrived at differently.
#
# ghcr.io is public for this chart, so no secretRef. If that ever changes,
# the fix is a Secret of type kubernetes.io/dockerconfigjson referenced here,
# not credentials in the HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich
  namespace: immich
spec:
  type: oci
  url: oci://ghcr.io/immich-app/immich-charts
  interval: 1h
