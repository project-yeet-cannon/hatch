# Layer for the photos Flux Kustomization (../../photos.yaml): Immich itself,
# behind the photos-database layer that ../database holds.
#
# Applied order is list order, and it matters for the first two the way
# ../database/kustomization.yaml's does - not for correctness, but for what a
# brand-new install's first minute looks like in the logs:
#
#   - library-pvc.yaml first. It is WaitForFirstConsumer, so it does nothing
#     at all until the server Deployment below gives it a consumer; applying
#     it after the release would mean helm-controller creating a pod that
#     names a claim which does not exist yet.
#   - helmrepository.yaml before helmrelease.yaml, so the release never
#     resolves a source that has not been created.
#   - ingress.yaml last, for tidiness only - Traefik reconciles a route to a
#     Service that does not exist yet by serving a 404 and retrying.
#
# What is *not* here: the Namespace. ../../infrastructure/config/
# namespaces.yaml owns it, for that file's own one-owner reason, and the
# HelmRelease must not create it either (there is no createNamespace on it).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - library-pvc.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - ingress.yaml
