# Static scrape targets only (no service discovery) — see TODO.md's
# "Scrape topology" decision. cadvisor is a container on the `metrics`
# network, reached by service name. windows_exporter runs natively on the
# Windows host (not in Docker — see TODO.md Phase 3's "Blocked on
# 2026-07-28" note), reached via the host-gateway address instead.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: windows-exporter
    static_configs:
      - targets: ["host.docker.internal:9182"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
