# File-provisioned datasource, applied on every Grafana start — see
# TODO.md's "provisioned from files, not clicked through" decision.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Both services share the `metrics` bridge network (compose.metrics.yml),
    # so the Compose service name resolves directly — no host-gateway
    # workaround needed here like node-exporter/cadvisor's network_mode: host.
    url: http://prometheus:9090
    isDefault: true
    editable: false
