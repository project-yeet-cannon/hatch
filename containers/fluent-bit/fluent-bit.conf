[SERVICE]
    Flush         5
    Daemon        off
    Log_Level     info
    Parsers_File  parsers.conf
    Parsers_File  custom_parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  5
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# Aerie.Api ships structured JSON console lines outside Development (see
# Program.cs); decode that JSON out of the docker `log` field so its fields
# (State, LogLevel, Category, ...) become real record fields. Lines that
# aren't valid JSON (every other container's plain-text stdout) are left
# untouched on parse failure.
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        dotnet_json
    Reserve_Data  On

# Derives the `service` field every log line is tagged with. See
# service_tag.lua for the precedence rules.
[FILTER]
    Name    lua
    Match   docker.*
    script  service_tag.lua
    call    set_service

[OUTPUT]
    Name            opensearch
    Match           docker.*
    Host            opensearch
    Port            9200
    Index           aerie-logs
    Logstash_Format On
    Logstash_Prefix aerie-logs
    tls             Off
    Suppress_Type_Name On
