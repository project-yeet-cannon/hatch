# The cluster plan Phase 5b's last step: the phase gate, as something that
# exits 0 - the same shape verify-cluster-platform.yml and verify-data-tier.yml
# established for Phases 3b.13 and 4b.11.
#
# 5b.14 is the gate itself, not a re-check of everything 5b.1-5b.13 already
# proved. Not "Provision 6": read-only, the same reason the other two
# verify-*.yml workflows aren't numbered into that sequence either.
#
# Same thin-wrapper rule as every other workflow here: this checks out the
# repo and hands every decision to scripts/k3s/Test-AppTier.ps1, which also
# runs by hand from any Windows box with the OpenSSH client and a LAN route to
# the ingress VIP.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner (which has no route to the node's LAN address, or to the VIP the
# HTTPS checks dial directly, anyway) and never consume Actions minutes.
name: 'Verify: App tier'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it needs SSH to the nodes and a route to the ingress VIP)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      ip_address:
        description: "A k3s server's LAN address. Any server - everything read here over SSH is cluster state"
        required: true
        type: string

# Read-only, so two concurrent runs cannot corrupt anything - but they would
# interleave their output in the same summary and prove nothing twice, so a
# second dispatch waits rather than doubling up.
concurrency:
  group: verify-app-tier
  cancel-in-progress: false

jobs:
  verify:
    name: Phase 5 gate
    runs-on: [self-hosted, '${{ inputs.host }}']

    # One SSH round trip plus four direct HTTPS connections to the VIP.
    # Nothing here waits on a reconciliation, so 10m failing means something
    # is hanging rather than being slow.
    timeout-minutes: 10

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Assert 5b.14's checklist
        shell: powershell
        env:
          IP_ADDRESS: ${{ inputs.ip_address }}

          # Same keypair every provision-*/verify-* workflow uses.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}

          # Optional, and the one credential this gate can use but cannot
          # obtain: a live grant token (docs/auth-architecture.md). Every other check
          # here presents nothing, which proves the wall refuses but says
          # nothing about whether it still serves - a gate that fell closed on
          # everyone would pass all of them. A grant is stored only as a hash
          # and this workflow writes nothing, so the token has to be handed in.
          #
          # Unset, the enrolled-device check reports a warning that names
          # itself and the rest of the gate runs unchanged. Set it by redeeming
          # an invite from the admin app's Sessions page against a session kept
          # for this purpose, labelled so it is obvious in the list; revoking
          # it there is what expires this secret.
          AERIE_TEST_GRANT_TOKEN: ${{ secrets.AERIE_TEST_GRANT_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
          }

          # -GrantToken is passed unconditionally: an unset secret arrives as
          # an empty string, which the script reads as "not supplied" and
          # downgrades that one check to a warning.
          & .\scripts\k3s\Test-AppTier.ps1 `
            -IPAddress $env:IP_ADDRESS `
            -SshPrivateKey $env:NODE_SSH_PRIVATE_KEY `
            -GrantToken $env:AERIE_TEST_GRANT_TOKEN

          # Same reason verify-cluster-platform.yml and verify-data-tier.yml
          # propagate this explicitly: `exit` inside a script invoked with &
          # sets $LASTEXITCODE without ending the caller.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
