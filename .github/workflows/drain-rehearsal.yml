# Cordons and drains one node while measuring whether the house notices, then
# puts it back. docs/plans/part-time-node.md 2.4.
#
# Phase 2's exit criterion is "kubectl drain of any node completes without
# --force, and ingress and DNS survive it with no gap" - a claim about a
# running cluster, so this is the thing that makes it. It is also where three
# guessed numbers get measured: how long the drain takes end to end, how long
# Longhorn takes to drop its per-node instance-manager PDB, and how long CNPG's
# switchover takes. Phase 4's 90-second personal-mode deadline is a guess until
# this has run.
#
# NOT read-only, and the only workflow in this repo that deliberately disturbs
# a healthy cluster. It makes exactly three changes - one cordon, one drain,
# one uncordon - deletes nothing, scales nothing, and never passes --force. The
# node is uncordoned by the remote script's own exit path and again by the
# calling script's finally block, so an interrupted run does not leave a node
# cordoned. Run it against a node whose owner is not waiting to play a game.
#
# Same thin-wrapper rule as every other workflow here: it hands every decision
# to scripts/k3s/Invoke-DrainRehearsal.ps1, which also runs by hand from any
# Windows box with the OpenSSH client.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner (which has no route to the node's LAN address anyway) and never
# consume Actions minutes.
# Named 'Node drain rehearsal' rather than 'Drain rehearsal' so it is not
# mistaken for dr-rehearsal.yml's 'DR rehearsal', which restores a backup and
# shares nothing with this but four letters.
name: 'Node drain rehearsal'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it needs SSH to a server node)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      ip_address:
        description: "A k3s SERVER's LAN address. NOT the node being drained - the probes have to keep working while that one is emptied."
        required: true
        type: string
      node_name:
        description: 'The node to cordon and drain'
        required: true
        type: string
      drain_timeout_seconds:
        description: "kubectl drain --timeout, and the number Phase 4.1's deadline starts at"
        required: true
        default: '90'
        type: string
      settle_seconds:
        description: 'Keep probing this long after the drain - rescheduling is what disturbs ingress, and it follows the eviction'
        required: true
        default: '30'
        type: string
      proceed_with_singletons:
        description: 'Drain even though Traefik or CoreDNS is still a single point of failure. Measures the gap that produces, deliberately.'
        required: false
        default: false
        type: boolean

# One drain at a time, cluster-wide. Two concurrent rehearsals would cordon two
# of three nodes, which is not a rehearsal of anything this plan describes.
# Queue rather than cancel: a cancelled run is the case where a node stays
# cordoned longest.
concurrency:
  group: drain-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    name: Drain ${{ inputs.node_name }}
    runs-on: [self-hosted, '${{ inputs.host }}']

    # The rehearsal itself is about three minutes at the defaults. 30m failing
    # means the drain is blocked on something rather than slow - and the node
    # is uncordoned on the way out either way.
    timeout-minutes: 30

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before anything else PowerShell-shaped. `shell: powershell` is
      # implemented as a dot-source of a temp .ps1, which an execution policy of
      # Restricted - the Windows *client* default - refuses outright, so the
      # `Set-ExecutionPolicy -Scope Process` inside every step below is in the
      # file that will not load. See the action, and scripts/runner/README.md.
      - name: Ensure PowerShell can run repository scripts
        uses: ./.github/actions/ensure-powershell

      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Cordon, drain, measure, uncordon
        shell: powershell
        env:
          IP_ADDRESS: ${{ inputs.ip_address }}
          NODE_NAME: ${{ inputs.node_name }}
          DRAIN_TIMEOUT_SECONDS: ${{ inputs.drain_timeout_seconds }}
          SETTLE_SECONDS: ${{ inputs.settle_seconds }}
          PROCEED_WITH_SINGLETONS: ${{ inputs.proceed_with_singletons }}

          # Same keypair every provision-*/verify-* workflow uses.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
          }

          $params = @{
            IPAddress           = $env:IP_ADDRESS
            NodeName            = $env:NODE_NAME
            DrainTimeoutSeconds = [int]$env:DRAIN_TIMEOUT_SECONDS
            SettleSeconds       = [int]$env:SETTLE_SECONDS
            SshPrivateKey       = $env:NODE_SSH_PRIVATE_KEY
          }
          if ([bool]::Parse($env:PROCEED_WITH_SINGLETONS)) { $params.ProceedWithSingletons = $true }

          & .\scripts\k3s\Invoke-DrainRehearsal.ps1 @params

          # `exit` inside a script invoked with & sets $LASTEXITCODE without
          # ending the caller, so it is propagated explicitly.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
