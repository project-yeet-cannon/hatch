# ============================================================================
# Phase 7b, step 3 — tag the last old-world snapshot so Phase 8 cannot prune it
# (docs/plans/swarm/phase-7-cutover.md).
#
# Nothing is backed up here. The old stack's own 03:10 schedule already took
# the snapshot; this puts the name `cutover-final` on it in both repos so that
# `--keep-daily 7 --keep-weekly 4 --keep-monthly 12` — the retention Phase 8's
# CronJob inherits against the same S3 repo — can never reach it. After 7c.3
# reformats the disk holding the local repo, the S3 copy carrying this tag is
# the only complete copy of the old world.
#
# Dispatch-only, and deliberately so: this runs exactly once, in the middle of
# an evening whose ordering is the whole point. It fires on nothing.
#
# Inline PowerShell rather than a thin wrapper around scripts/, which is the
# rule everywhere else here. This one is compose-coupled — it can only ever run
# against the old Docker host, and it dies with it in 7b.9 — so a script under
# scripts/ would be a second file to delete, and its by-hand form already
# exists as the shell block in 7b.3.
#
# TODO (Phase 7b, step 9): delete this file, alongside cd.yml and the five
# compose files. It is listed there.
# ============================================================================
name: 'Cutover: tag the last old-world snapshot'

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Compose project the old stack's containers belong to (the workspace directory name cd.yml deployed from, lowercased)"
        required: true
        default: aerie
        type: string

# One at a time. Two concurrent runs would race on `start`/`stop` of the same
# container and could leave `backup` running after the second one's stop.
concurrency:
  group: cutover-tag-snapshot
  cancel-in-progress: false

jobs:
  tag:
    name: 7b.3
    # The old Docker host, the same box and the same label cd.yml deployed
    # from. `legacy-deployer` rather than the `hyperv-host-0` label 7a.5 added
    # to the same runner: this step is about the containers on that host, not
    # about the host as a future k3s node, and 7b.9 removes both this file and
    # the last other use of the label in the same commit.
    runs-on: [self-hosted, legacy-deployer]

    # Two `restic tag`s and two `snapshots` listings against a local disk and
    # an S3 bucket. 10m failing means S3 is unreachable, not that it is slow.
    timeout-minutes: 10

    env:
      # Docker Desktop's TCP endpoint on that host — the same one every step of
      # cd.yml used. The daemon is still up; 7b.2 stopped the containers, not
      # Docker.
      DOCKER_HOST: tcp://localhost:2375

    steps:
      # Only the two files that define the `backup` service and the network it
      # attaches to. No credentials are checked out or needed: `exec` runs
      # inside a container that already holds RESTIC_PASSWORD and the restic
      # IAM user's keys, put there by cd.yml when it created the container.
      # That is also why every command below acts on the *existing* container
      # and why nothing here may recreate one — a recreated container would be
      # built by re-interpolating these compose files with an empty environment
      # (7a.6's note on `start`, not `up -d`).
      - name: Check out the compose files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            compose.prod.yml
            compose.backup.yml
          sparse-checkout-cone-mode: false

      # shell: powershell, not bash — the runner service on this host runs as
      # Local System, where `shell: bash` resolves to WSL's bash.exe stub and
      # WSL refuses to run (WSL_E_LOCAL_SYSTEM_NOT_SUPPORTED). cd.yml carries
      # the same note.
      #
      # Every container-side command is a fixed argv of plain ASCII tokens.
      # There is no `sh -c` here, and the shell loop 7b.3 prints for the by-hand
      # path must not be pasted into this file: PowerShell's Win32 command-line
      # quoting fragments a multi-line script on the way into the container
      # (`set: line 0: illegal option -`). `printenv` reads each repository
      # location out of the container instead, and the repo strings come back
      # as single tokens restic takes as `-r` values.
      #
      # $LASTEXITCODE is checked after each native call: a multi-line `run:`
      # under PowerShell only surfaces the *last* command's exit code, so an
      # unchecked failure here would be masked by the `stop` that follows it.
      - name: Tag the newest snapshot in both repos, then verify
        shell: powershell
        env:
          COMPOSE_PROJECT: ${{ inputs.project_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $compose = @(
            '-p', $env:COMPOSE_PROJECT,
            '-f', 'compose.prod.yml',
            '-f', 'compose.backup.yml'
          )

          # Interpolation warnings about unset ${RESTIC_PASSWORD} and friends
          # are expected on every call below and are not a failure: `start`,
          # `stop` and `exec` act on a container that already exists, and
          # nothing re-reads that env block. They would be a failure for any
          # command that creates a container, which is why none is used.

          # The guard that makes the -p above safe. `ps --all --quiet backup`
          # names the container only if this project is the one cd.yml created;
          # a wrong project name yields no output rather than an error, which
          # would otherwise turn into a confusing `start` of nothing.
          $existing = docker compose @compose ps --all --quiet backup
          if ($LASTEXITCODE -ne 0) { throw "docker compose ps failed with exit code $LASTEXITCODE" }
          $existing = @($existing | Where-Object { $_ })
          if ($existing.Count -ne 1) {
            throw "Compose project '$($env:COMPOSE_PROJECT)' has no single existing 'backup' container (found $($existing.Count)). Run ``docker compose ls --all`` on this host, then re-dispatch with that project name. Do NOT ``up`` anything: the container's restic credentials only exist inside the one cd.yml created."
          }

          Write-Host "Starting backup (project '$($env:COMPOSE_PROJECT)', container $($existing[0]))"
          docker compose @compose start backup
          if ($LASTEXITCODE -ne 0) { throw "docker compose start backup failed with exit code $LASTEXITCODE" }

          # Everything between here and the stop is caught rather than thrown:
          # leaving `backup` running would put the one container of a retired
          # stack back on the daily schedule, dumping from a `db` that 7b.2
          # stopped. The stop happens either way; the original failure is
          # re-thrown after it.
          $failure = $null
          $summary = @()
          try {
            foreach ($var in @('RESTIC_REPOSITORY_LOCAL', 'RESTIC_REPOSITORY_S3')) {
              $repo = (docker compose @compose exec -T backup printenv $var)
              if ($LASTEXITCODE -ne 0) { throw "reading $var from the backup container failed with exit code $LASTEXITCODE" }
              $repo = ($repo | Select-Object -First 1).Trim()
              if (-not $repo) { throw "$var is empty inside the backup container. The container was created without it, which means it is not the one cd.yml deployed." }

              Write-Host "Tagging latest in $repo"
              docker compose @compose exec -T backup restic -r $repo tag --add cutover-final latest
              if ($LASTEXITCODE -ne 0) { throw "restic tag against $repo failed with exit code $LASTEXITCODE" }

              # The exit criterion, asserted rather than eyeballed: exactly one
              # snapshot carrying the tag, in each repo. Two would mean a
              # second backup ran between dispatches; zero would mean the tag
              # landed somewhere else. --json is parsed here on the runner
              # because the image has restic and sqlite but no jq.
              $json = docker compose @compose exec -T backup restic -r $repo snapshots --tag cutover-final --json
              if ($LASTEXITCODE -ne 0) { throw "restic snapshots against $repo failed with exit code $LASTEXITCODE" }
              $snapshots = @(($json -join "`n") | ConvertFrom-Json)
              if ($snapshots.Count -ne 1) {
                throw "$repo lists $($snapshots.Count) snapshots tagged cutover-final; 7b.3's exit criterion is exactly one. Inspect with ``restic -r $repo snapshots --tag cutover-final`` before removing anything."
              }

              $snapshot = $snapshots[0]
              $short = $snapshot.short_id
              $when = $snapshot.time
              Write-Host "  $short  $when  [$($snapshot.tags -join ', ')]"
              $summary += "| ``$repo`` | ``$short`` | $when | $($snapshot.tags -join ', ') |"
            }
          } catch {
            $failure = $_
          }

          Write-Host 'Stopping backup'
          docker compose @compose stop backup
          $stopExit = $LASTEXITCODE

          if ($failure) { throw $failure }
          if ($stopExit -ne 0) {
            throw "The tag landed, but ``docker compose stop backup`` failed with exit code $stopExit. Stop it by hand — a running backup container will try the 03:10 dump against a stopped db."
          }

          # The snapshot's date is the point of printing it: it is from the
          # last scheduled run *before* 7b.2's stop, not from tonight.
          $lines = @(
            '### 7b.3 — `cutover-final` tagged',
            '',
            '| Repository | Snapshot | Taken | Tags |',
            '|---|---|---|---|'
          ) + $summary + @(
            '',
            'Dated from the last scheduled run before the stack was stopped, which is the point rather than a defect.',
            'The `backup` container has been stopped again. Phase 8''s `forget` needs `--keep-tag cutover-final`, and 7c.2 re-confirms this tag in S3 immediately before the disk holding the local repo is reformatted.'
          )
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
