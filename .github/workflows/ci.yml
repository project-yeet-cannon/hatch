name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Aerie.slnx

      - name: Build
        run: dotnet build src/Aerie.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Aerie.slnx --no-build --configuration Release

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, dashboard, modeler, docs, family]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Aerie.Web/apps/${{ matrix.app }}/.nvmrc
          cache: npm
          cache-dependency-path: src/Aerie.Web/apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: src/Aerie.Web/apps/${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: src/Aerie.Web/apps/${{ matrix.app }}
        run: npm run lint

      - name: Test
        working-directory: src/Aerie.Web/apps/${{ matrix.app }}
        run: npm run test --if-present

      - name: Build
        working-directory: src/Aerie.Web/apps/${{ matrix.app }}
        run: npm run build

  deploy-manifests:
    # From TODO_SWARM.md Phase 3b.3 onward, everything under deploy/ reaches the
    # cluster by being committed - there is no apply step to fail in front of a
    # human. A kustomization that does not build is otherwise discovered as a
    # Flux Kustomization that silently stopped reconciling, so it gets found
    # here instead.
    #
    # Every directory carrying a kustomization.yaml is built, discovered rather
    # than listed, so the layers added by 3b.4-3b.12 are covered without editing
    # this file. `kubectl kustomize` is the runner image's own, deliberately
    # unpinned: this is a lint whose worst failure is a false red, not
    # provisioning tooling whose version changes what a node becomes - those are
    # pinned in scripts/versions.json.
    #
    # What this does *not* check is the Flux CRD schemas, so a misspelled field
    # in a Kustomization or HelmRelease spec still passes. 3b.13's
    # Test-ClusterPlatform.ps1 is the gate that catches those, against a real
    # cluster.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The ExternalSecrets under config/external-secrets/ are a rendering of
      # scripts/secrets/parameters.json (TODO_SWARM.md 3b.6), and
      # docs/secrets-architecture.md promises both halves of the secret story
      # read that one file. Hand-maintained duplication is how a promise like
      # that stops being true quietly, so the rendering is checked rather than
      # trusted: this fails on an edited manifest, on a parameter that gained a
      # target and never got one, and on a required parameter nothing consumes
      # and nothing explains.
      #
      # Ahead of the build below because it is the more specific failure - a
      # stale manifest still builds perfectly, and a missing one is reported
      # here as "regenerate" rather than as a kustomize resource-not-found.
      # pwsh is preinstalled on the GitHub-hosted Ubuntu image.
      - name: Check the generated ExternalSecrets match parameters.json
        run: pwsh -NoProfile -File scripts/secrets/New-ExternalSecrets.ps1 -Check

      - name: Build every kustomization under deploy/
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r dir; do
            found=$((found + 1))
            echo "==> $dir"
            kubectl kustomize "$dir" > /dev/null
          done < <(find deploy -name kustomization.yaml -exec dirname {} \; | sort)
          if [ "$found" -eq 0 ]; then
            echo "No kustomization.yaml found under deploy/ - the Flux root is missing." >&2
            exit 1
          fi
          echo "$found kustomization(s) built."

  detect-kiosk-changes:
    runs-on: ubuntu-latest
    outputs:
      kiosk-changed: ${{ steps.filter.outputs.kiosk }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for changes under apps/kiosk
        id: filter
        run: |
          if git diff --quiet HEAD~1 HEAD -- apps/kiosk; then
            echo "kiosk=false" >> "$GITHUB_OUTPUT"
          else
            echo "kiosk=true" >> "$GITHUB_OUTPUT"
          fi

  kiosk:
    needs: detect-kiosk-changes
    if: needs.detect-kiosk-changes.outputs.kiosk-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Lint and build
        working-directory: apps/kiosk
        run: ./gradlew lint assembleDebug
