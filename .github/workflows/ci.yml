name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Aerie.slnx

      - name: Build
        run: dotnet build src/Aerie.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Aerie.slnx --no-build --configuration Release

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, dashboard]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: src/Aerie.Web/apps/${{ matrix.app }}/.nvmrc
          cache: npm
          cache-dependency-path: src/Aerie.Web/apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: src/Aerie.Web/apps/${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: src/Aerie.Web/apps/${{ matrix.app }}
        run: npm run lint

      - name: Test
        working-directory: src/Aerie.Web/apps/${{ matrix.app }}
        run: npm run test --if-present

      - name: Build
        working-directory: src/Aerie.Web/apps/${{ matrix.app }}
        run: npm run build

  detect-kiosk-changes:
    runs-on: ubuntu-latest
    outputs:
      kiosk-changed: ${{ steps.filter.outputs.kiosk }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes under apps/kiosk
        id: filter
        run: |
          if git diff --quiet HEAD~1 HEAD -- apps/kiosk; then
            echo "kiosk=false" >> "$GITHUB_OUTPUT"
          else
            echo "kiosk=true" >> "$GITHUB_OUTPUT"
          fi

  kiosk:
    needs: detect-kiosk-changes
    if: needs.detect-kiosk-changes.outputs.kiosk-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Lint and build
        working-directory: apps/kiosk
        run: ./gradlew lint assembleDebug
