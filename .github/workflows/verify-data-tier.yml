# The cluster plan Phase 4b's last step: the phase gate, as something that
# exits 0 - the same shape verify-cluster-platform.yml established for Phase
# 3b.13.
#
# Steps 4b.1-4b.10 each carry an *Exit* line; this dispatches the one script
# that asserts the ones a live cluster can still prove. Not "Provision 7":
# read-only, the same reason verify-cluster-platform.yml isn't numbered into
# that sequence either.
#
# Same thin-wrapper rule as every other workflow here: this checks out the
# repo and hands every decision to scripts/k3s/Test-DataTier.ps1, which also
# runs by hand from any Windows box with the OpenSSH client.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner (which has no route to the node's LAN address anyway) and never
# consume Actions minutes.
name: 'Verify: Data tier'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it needs SSH to the nodes)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      ip_address:
        description: "A k3s server's LAN address. Any server - everything read here is cluster state"
        required: true
        type: string

# Read-only, so two concurrent runs cannot corrupt anything - but they would
# interleave their output in the same summary and prove nothing twice, so a
# second dispatch waits rather than doubling up.
concurrency:
  group: verify-data-tier
  cancel-in-progress: false

jobs:
  verify:
    name: Phase 4 gate
    runs-on: [self-hosted, '${{ inputs.host }}']

    # One SSH round trip, including one local psql exec inside the primary
    # pod. Nothing here waits on a reconciliation, so 10m failing means
    # something is hanging rather than being slow.
    timeout-minutes: 10

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Assert every provable Phase 4b exit criterion
        shell: powershell
        env:
          IP_ADDRESS: ${{ inputs.ip_address }}

          # Same keypair every provision-*/verify-* workflow uses.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
          }

          & .\scripts\k3s\Test-DataTier.ps1 `
            -IPAddress $env:IP_ADDRESS `
            -SshPrivateKey $env:NODE_SSH_PRIVATE_KEY

          # Same reason verify-cluster-platform.yml propagates this
          # explicitly: `exit` inside a script invoked with & sets
          # $LASTEXITCODE without ending the caller.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
