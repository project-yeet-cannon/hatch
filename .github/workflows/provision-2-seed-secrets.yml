# Step 2 of the provisioning pipeline: push this installation's secrets into
# the AWS SSM Parameter Store tree (the cluster plan Phase 2), then plant the one
# bootstrap Secret the cluster needs to read that tree back.
#
# Same thin-wrapper rule as provision-0 and provision-1: this file checks out
# the repo, maps repository secrets onto the environment variable names
# scripts/secrets/parameters.json declares, and hands every decision to
# scripts/secrets/Sync-AerieSecrets.ps1. Logic added here instead of the
# script would exist on only one of the two paths and let them drift.
#
# Why the secrets arrive as `env:` and not as script arguments: arguments are
# visible in the process list to anything else running on the runner. The
# script reads values from the environment for the same reason and never
# echoes one - the job summary lists parameter *names* and statuses only.
#
# Note the name mapping below is not always identity. AWS_ACCESS_KEY_ID would
# be picked up by the AWS CLI itself, so the Route53 credential is handed over
# as ROUTE53_AWS_* and the CLI is pointed explicitly at the seed writer.
#
# Note also which side of `secrets.` / `vars.` each half comes from: an AWS
# access key *id* is an identifier, not credential material, so it lives as a
# repository variable and stays readable in the run log - which identity a run
# used is most of diagnosing an AccessDenied. Only the secret halves are
# masked. parameters.json records the same split per value as `githubKind`.
# Reading a variable through `secrets.` (or the reverse) does not error - it
# resolves to an empty string - so the guards in the run block below check
# every value this workflow cannot proceed without.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a
# GitHub-hosted runner (which has no route to the node's LAN address anyway)
# and never consume Actions minutes.
#
# Previous step: provision-1-install-k3s.yml.
# Next step: provision-3-bootstrap-flux.yml.
name: 'Provision 2: Seed secrets'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it needs the AWS CLI, and SSH to the node)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      ip_address:
        description: 'A k3s server''s LAN address - where the ESO bootstrap Secret is applied (node 1 today). Not needed for stage=parameters-only'
        required: false
        type: string
      stage:
        description: 'both = seed the parameter store and apply the bootstrap Secret; parameters-only = no cluster needed; bootstrap-only = re-plant the Secret without touching the tree'
        required: true
        default: both
        type: choice
        options:
          - both
          - parameters-only
          - bootstrap-only
      parameter_prefix:
        description: 'Override parameters.json''s prefix (default /aerie). Only needed when two installations share one AWS account'
        required: false
        type: string
      preflight_only:
        description: 'Check the map, credentials and reachability, then stop without writing anything'
        required: false
        default: false
        type: boolean

# Keyed on nothing but the workflow: two concurrent runs would race the same
# parameter tree, whichever node each one targets.
concurrency:
  group: provision-2-seed-secrets
  cancel-in-progress: false

jobs:
  seed:
    name: Seed secrets (${{ inputs.stage }})
    runs-on: [self-hosted, '${{ inputs.host }}']

    timeout-minutes: 20

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The AWS CLI is what writes the parameter tree, and ssh.exe is what
      # plants the bootstrap Secret - so this job installs both rather than
      # asking the operator to have prepared the runner. See
      # scripts/runner/README.md, and note the step is what puts a
      # freshly-installed aws.exe on PATH for the step below: the machine PATH
      # entry the MSI writes is invisible to the runner service until it
      # restarts.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency AwsCli, OpenSshClient

      - name: Seed parameter store and bootstrap Secret
        shell: powershell
        env:
          IP_ADDRESS: ${{ inputs.ip_address }}
          STAGE: ${{ inputs.stage }}
          PARAMETER_PREFIX: ${{ inputs.parameter_prefix }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}

          # Region the parameter tree lives in. The Phase 3 ClusterSecretStore
          # has to name this same region.
          AWS_REGION: ${{ vars.AWS_REGION }}

          # The seed writer - ssm:PutParameter on the tree, nothing else.
          # Deliberately a different IAM user from the one below: the
          # credential the cluster holds forever must not be able to write the
          # tree it reads.
          SSM_AWS_ACCESS_KEY_ID: ${{ vars.SSM_AWS_ACCESS_KEY_ID }}
          SSM_AWS_SECRET_ACCESS_KEY: ${{ secrets.SSM_AWS_SECRET_ACCESS_KEY }}

          # The aerie-eso user - read-only on the tree. This pair becomes the
          # in-cluster bootstrap Secret, and is the only secret this design
          # ever injects imperatively (docs/ethos.md).
          ESO_AWS_ACCESS_KEY_ID: ${{ vars.ESO_AWS_ACCESS_KEY_ID }}
          ESO_AWS_SECRET_ACCESS_KEY: ${{ secrets.ESO_AWS_SECRET_ACCESS_KEY }}

          # Values to seed. Names on the left come from parameters.json's
          # `env` field; names on the right are where they live today.
          ROUTE53_AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          ROUTE53_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          VM_LOG_SHIPPER_TOKEN: ${{ secrets.VM_LOG_SHIPPER_TOKEN }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_AWS_ACCESS_KEY_ID: ${{ vars.RESTIC_AWS_ACCESS_KEY_ID }}
          RESTIC_AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTIC_AWS_SECRET_ACCESS_KEY }}
          # The cluster plan Phase 4: the aerie-cnpg IAM user's credentials, plus
          # the region its bucket lives in (needed as a Secret key, not a
          # ${...} substitution - s3Credentials.region is a SecretKeySelector).
          CNPG_AWS_ACCESS_KEY_ID: ${{ vars.CNPG_AWS_ACCESS_KEY_ID }}
          CNPG_AWS_SECRET_ACCESS_KEY: ${{ secrets.CNPG_AWS_SECRET_ACCESS_KEY }}
          CNPG_AWS_REGION: ${{ vars.AWS_REGION }}
          # Optional in parameters.json - unset here until its phase lands.
          KIOSK_WIFI_PASSWORD: ${{ secrets.KIOSK_WIFI_PASSWORD }}
          # Optional in parameters.json, and unlike the value above this one
          # never gains a 'kubernetes' block: the workload it authenticates
          # runs on the Hyper-V hosts, not in the cluster (provision-0-new-node.yml,
          # phase-5-app-tier.md 5b.13). Seeded to SSM anyway for the same
          # reason every parameter is - one durable store, regardless of
          # whether a given value also becomes an ExternalSecret.
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          # Phase 5b.1: the GHCR pull credential (5a.2) and the site repo's
          # git credential (5a.3). Both are 'kubernetesDeferred' in
          # parameters.json until this seeds and is confirmed - see that
          # file and phase-5-app-tier.md 5b.1.
          GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          SITE_GIT_USERNAME: ${{ vars.SITE_GIT_USERNAME }}
          SITE_GIT_TOKEN: ${{ secrets.SITE_GIT_TOKEN }}
          # Phase 5b.3: the SMB share credential (5a.4). 'kubernetesDeferred'
          # in parameters.json until this seeds and is confirmed - same
          # reason as the pair above.
          SMB_USERNAME: ${{ vars.SMB_USERNAME }}
          SMB_PASSWORD: ${{ secrets.SMB_PASSWORD }}

          # Same keypair provision-0/1 used - cloud-init baked the public half
          # into the node's authorized_keys.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          $params = @{}

          # Which tab each name lives on. Naming it in the failure is the whole
          # point: a value stored on the wrong tab reads back as an empty
          # string, so "not set" is indistinguishable from "set, in the wrong
          # place" unless the message says which place is right. Access key
          # ids are variables (identifiers, kept unmasked so a run log shows
          # which identity it used); their secret halves are secrets.
          $tab = @{
            SSM_AWS_ACCESS_KEY_ID     = 'Variables'
            SSM_AWS_SECRET_ACCESS_KEY = 'Secrets'
            ESO_AWS_ACCESS_KEY_ID     = 'Variables'
            ESO_AWS_SECRET_ACCESS_KEY = 'Secrets'
            AWS_REGION                = 'Variables'
          }

          $names = [Collections.Generic.List[string]]::new()
          if ($env:STAGE -ne 'bootstrap-only') {
            $names.AddRange([string[]]@('SSM_AWS_ACCESS_KEY_ID', 'SSM_AWS_SECRET_ACCESS_KEY'))
          }
          $names.AddRange([string[]]@('ESO_AWS_ACCESS_KEY_ID', 'ESO_AWS_SECRET_ACCESS_KEY', 'AWS_REGION'))

          foreach ($required in $names) {
            if (-not (Get-Item "env:$required" -ErrorAction SilentlyContinue).Value) {
              throw "$required is not set. Add it under Settings > Secrets and variables > Actions, on the $($tab[$required]) tab - see scripts/secrets/README.md. If it looks set already, check it isn't on the other tab: this workflow reads it as a repository $(if ($tab[$required] -eq 'Variables') { 'variable' } else { 'secret' }), and the wrong tab resolves to an empty string rather than an error."
            }
          }

          if ($env:STAGE -eq 'parameters-only') {
            $params.SkipBootstrap = $true
          }
          else {
            if (-not $env:IP_ADDRESS) {
              throw "stage=$($env:STAGE) needs ip_address - the k3s server the bootstrap Secret is applied to."
            }
            if (-not $env:NODE_SSH_PRIVATE_KEY) {
              throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
            }
            $params.IPAddress = $env:IP_ADDRESS
            $params.SshPrivateKey = $env:NODE_SSH_PRIVATE_KEY
          }

          if ($env:STAGE -eq 'bootstrap-only') { $params.SkipSeed = $true }
          if ($env:PARAMETER_PREFIX) { $params.ParameterPrefix = $env:PARAMETER_PREFIX }
          if ([bool]::Parse($env:PREFLIGHT_ONLY)) { $params.PreflightOnly = $true }

          & .\scripts\secrets\Sync-AerieSecrets.ps1 @params
