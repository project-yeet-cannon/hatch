# Step 2 of the provisioning pipeline: push this installation's secrets into
# the AWS SSM Parameter Store tree (TODO_SWARM.md Phase 2), then plant the one
# bootstrap Secret the cluster needs to read that tree back.
#
# Same thin-wrapper rule as provision-0 and provision-1: this file checks out
# the repo, maps repository secrets onto the environment variable names
# scripts/secrets/parameters.json declares, and hands every decision to
# scripts/secrets/Sync-AerieSecrets.ps1. Logic added here instead of the
# script would exist on only one of the two paths and let them drift.
#
# Why the secrets arrive as `env:` and not as script arguments: arguments are
# visible in the process list to anything else running on the runner. The
# script reads values from the environment for the same reason and never
# echoes one - the job summary lists parameter *names* and statuses only.
#
# Note the name mapping below is not always identity. AWS_ACCESS_KEY_ID would
# be picked up by the AWS CLI itself, so the Route53 credential is handed over
# as ROUTE53_AWS_* and the CLI is pointed explicitly at the seed writer.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a
# GitHub-hosted runner (which has no route to the node's LAN address anyway)
# and never consume Actions minutes.
#
# Previous step: provision-1-install-k3s.yml.
# Next step: provision-3-bootstrap-flux.yml.
name: 'Provision 2: Seed secrets'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it needs the AWS CLI, and SSH to the node)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      ip_address:
        description: 'A k3s server''s LAN address - where the ESO bootstrap Secret is applied (node 1 today). Not needed for stage=parameters-only'
        required: false
        type: string
      stage:
        description: 'both = seed the parameter store and apply the bootstrap Secret; parameters-only = no cluster needed; bootstrap-only = re-plant the Secret without touching the tree'
        required: true
        default: both
        type: choice
        options:
          - both
          - parameters-only
          - bootstrap-only
      parameter_prefix:
        description: 'Override parameters.json''s prefix (default /aerie). Only needed when two installations share one AWS account'
        required: false
        type: string
      preflight_only:
        description: 'Check the map, credentials and reachability, then stop without writing anything'
        required: false
        default: false
        type: boolean

# Keyed on nothing but the workflow: two concurrent runs would race the same
# parameter tree, whichever node each one targets.
concurrency:
  group: provision-2-seed-secrets
  cancel-in-progress: false

jobs:
  seed:
    name: Seed secrets (${{ inputs.stage }})
    runs-on: [self-hosted, '${{ inputs.host }}']

    timeout-minutes: 20

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Seed parameter store and bootstrap Secret
        shell: powershell
        env:
          IP_ADDRESS: ${{ inputs.ip_address }}
          STAGE: ${{ inputs.stage }}
          PARAMETER_PREFIX: ${{ inputs.parameter_prefix }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}

          # Region the parameter tree lives in. The Phase 3 ClusterSecretStore
          # has to name this same region.
          AWS_REGION: ${{ vars.AWS_REGION }}

          # The seed writer - ssm:PutParameter on the tree, nothing else.
          # Deliberately a different IAM user from the one below: the
          # credential the cluster holds forever must not be able to write the
          # tree it reads.
          SSM_AWS_ACCESS_KEY_ID: ${{ secrets.SSM_AWS_ACCESS_KEY_ID }}
          SSM_AWS_SECRET_ACCESS_KEY: ${{ secrets.SSM_AWS_SECRET_ACCESS_KEY }}

          # The aerie-eso user - read-only on the tree. This pair becomes the
          # in-cluster bootstrap Secret, and is the only secret this design
          # ever injects imperatively (docs/ethos.md).
          ESO_AWS_ACCESS_KEY_ID: ${{ secrets.ESO_AWS_ACCESS_KEY_ID }}
          ESO_AWS_SECRET_ACCESS_KEY: ${{ secrets.ESO_AWS_SECRET_ACCESS_KEY }}

          # Values to seed. Names on the left come from parameters.json's
          # `env` field; names on the right are where they live today.
          ROUTE53_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ROUTE53_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          VM_LOG_SHIPPER_TOKEN: ${{ secrets.VM_LOG_SHIPPER_TOKEN }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_AWS_ACCESS_KEY_ID: ${{ secrets.RESTIC_AWS_ACCESS_KEY_ID }}
          RESTIC_AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTIC_AWS_SECRET_ACCESS_KEY }}
          # Optional in parameters.json - unset here until their phase lands.
          CNPG_AWS_ACCESS_KEY_ID: ${{ secrets.CNPG_AWS_ACCESS_KEY_ID }}
          CNPG_AWS_SECRET_ACCESS_KEY: ${{ secrets.CNPG_AWS_SECRET_ACCESS_KEY }}
          KIOSK_WIFI_PASSWORD: ${{ secrets.KIOSK_WIFI_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

          # Same keypair provision-0/1 used - cloud-init baked the public half
          # into the node's authorized_keys.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          $params = @{}

          if ($env:STAGE -ne 'bootstrap-only') {
            foreach ($required in 'SSM_AWS_ACCESS_KEY_ID', 'SSM_AWS_SECRET_ACCESS_KEY') {
              if (-not (Get-Item "env:$required" -ErrorAction SilentlyContinue).Value) {
                throw "$required is not set. Add it under Settings > Secrets and variables > Actions - it's the seed writer's credential, separate from ESO_AWS_*. See scripts/secrets/README.md."
              }
            }
          }

          foreach ($required in 'ESO_AWS_ACCESS_KEY_ID', 'ESO_AWS_SECRET_ACCESS_KEY', 'AWS_REGION') {
            if (-not (Get-Item "env:$required" -ErrorAction SilentlyContinue).Value) {
              throw "$required is not set. Add it under Settings > Secrets and variables > Actions (AWS_REGION is a repository variable; the ESO_AWS_* pair are secrets)."
            }
          }

          if ($env:STAGE -eq 'parameters-only') {
            $params.SkipBootstrap = $true
          }
          else {
            if (-not $env:IP_ADDRESS) {
              throw "stage=$($env:STAGE) needs ip_address - the k3s server the bootstrap Secret is applied to."
            }
            if (-not $env:NODE_SSH_PRIVATE_KEY) {
              throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
            }
            $params.IPAddress = $env:IP_ADDRESS
            $params.SshPrivateKey = $env:NODE_SSH_PRIVATE_KEY
          }

          if ($env:STAGE -eq 'bootstrap-only') { $params.SkipSeed = $true }
          if ($env:PARAMETER_PREFIX) { $params.ParameterPrefix = $env:PARAMETER_PREFIX }
          if ([bool]::Parse($env:PREFLIGHT_ONLY)) { $params.PreflightOnly = $true }

          & .\scripts\secrets\Sync-AerieSecrets.ps1 @params
