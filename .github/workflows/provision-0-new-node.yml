# Step 0 of the provisioning pipeline: build a Hyper-V node VM
# (the cluster plan Phase 1). Dispatch-only, one host per run.
#
# This is the primary way to run Initialize-AerieNode.ps1 - the workflow is
# deliberately thin, checking out the repo on the target Hyper-V host and
# handing every decision to the script, which also supports being run by hand
# in an elevated PowerShell session on the host. That manual path is a
# fallback (unreachable runner, box not registered yet), not an equally-valid
# alternative: this repo's goal is infrastructure-as-code, so the dispatched
# run - auditable, with a job summary - is what "provisioning a node" means
# here. Any logic added to this file instead of the script would exist on
# only one of the two paths and let them drift.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner and never consume Actions minutes, however long the fixed-disk
# writing takes - both disks are fixed now, so that is the OS disk's 100GB
# on top of the data disk's 200GB.
#
# Runner requirements on each Hyper-V host:
#   - Windows runner service running as a local Administrator (the Hyper-V
#     cmdlets and `#Requires -RunAsAdministrator` both demand it; membership
#     in Hyper-V Administrators alone is not enough)
#   - labelled to match the `host` choice below, plus `self-hosted`
#
# Nothing else has to be prepared by hand: the OpenSSH client (and, in
# Provision 2, the AWS CLI) is installed by the "Ensure runner dependencies"
# step below - scripts/runner/README.md.
#
# Next step: provision-1-install-k3s.yml, once this node answers SSH.
name: 'Provision 0: New node VM'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Hyper-V host to build on (must match a runner label)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      vm_name:
        description: 'VM name, also the guest hostname (e.g. aerie-node-1)'
        required: true
        type: string
      mac_address:
        description: 'MAC for the DHCP reservation, 00-15-5D-<host>-<vm>-<nic>'
        required: true
        type: string
      expected_ip:
        description: 'The LAN address pfSense reserves for that MAC. Register the reservation BEFORE running.'
        required: true
        type: string
      memory_gb:
        description: 'RAM in GB (the cluster plan: 16 / 24 / 24 across the three hosts)'
        required: true
        default: '16'
        type: string
      os_disk_gb:
        description: 'Fixed OS disk in GB. 100 is the plan default; 32 was the old template size and is what filled.'
        required: true
        default: '100'
        type: string
      data_disk_gb:
        description: 'Fixed Longhorn data disk in GB.'
        required: true
        default: '200'
        type: string
      cpu_count:
        description: 'vCPU count'
        required: true
        default: '4'
        type: string
      distro:
        description: 'Guest distro'
        required: true
        default: Debian
        type: choice
        options: [Debian, Ubuntu]
      switch_name:
        description: 'Existing external virtual switch on the host'
        required: true
        default: ExternalSwitch
        type: string
      vm_storage_path:
        description: 'Where the VM and its disks live. The default for both paths below.'
        required: true
        default: 'D:\aerie\VMs'
        type: string
      os_disk_path:
        description: "OS disk + VM config, on the host's FASTEST volume. Blank = vm_storage_path."
        required: false
        default: ''
        type: string
      data_disk_path:
        description: "Longhorn data disk, on the host's LARGEST volume. Blank = vm_storage_path."
        required: false
        default: ''
        type: string
      template_path:
        description: 'Where the golden VHDX lives (built here if absent)'
        required: true
        default: 'D:\aerie\vm-templates'
        type: string
      extra_packages:
        description: 'Extra apt packages, comma-separated (optional)'
        required: false
        default: ''
        type: string
      preflight_only:
        description: 'Check the host is ready and stop without building anything'
        required: false
        default: false
        type: boolean
      recreate_vm:
        description: 'DESTRUCTIVE: if a VM with this name/MAC already exists (e.g. stuck with a stale SSH key from a rotated secret), stop it, remove it, delete its disks, and rebuild fresh instead of resuming it'
        required: false
        default: false
        type: boolean
      skip_wait:
        description: 'Skip post-boot verification (does NOT prove the DHCP reservation works)'
        required: false
        default: false
        type: boolean
      skip_checksum_verification:
        description: 'Skip verifying the downloaded golden image against the vendor checksum (temporary unblock only - re-disable once the vendor issue clears)'
        required: false
        default: false
        type: boolean

# Two builds at once on one host would race for the same golden image file and
# the same storage volume. Queue instead of cancelling: a cancelled run leaves
# a half-created VM behind that the next run then refuses to overwrite.
concurrency:
  group: provision-0-new-node-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  provision:
    name: ${{ inputs.vm_name }} on ${{ inputs.host }}
    runs-on: [self-hosted, '${{ inputs.host }}']

    # Generous on purpose. Both VHDXs are fixed and written out up front
    # (100GB OS + 200GB data at the defaults), the golden image may need
    # building on a first run, and cloud-init does a full package upgrade
    # plus a reboot. Failing at 6h means something hung.
    timeout-minutes: 360

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          # Nothing here talks to git afterwards, and this is a long-lived
          # self-hosted workspace - don't leave a credential in it.
          persist-credentials: false

      # Post-boot verification SSHes into the new VM, so the host needs an SSH
      # client. Installed here rather than listed as a prerequisite somebody
      # has to have read - see scripts/runner/README.md.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      # Host-level metrics run natively on Windows (not in Docker Desktop -
      # see docs/metrics-architecture.md's "Windows Server detour" note: a
      # container's /proc, /sys, and root filesystem under the WSL2 backend
      # are the VM's, not the real host's). Install-if-missing, then converge
      # the service state on every run. Moved here from cd.yml (Phase 5,
      # 5b.13): this is what already owns "make a Windows host ready", and
      # runs against all three Hyper-V hosts rather than just the one cd.yml
      # could reach. The Grafana dashboard's hostname template variables key
      # off windows_os_hostname, which the `os` collector already emits as
      # part of the built-in default set - no extra collectors needed.
      - name: Ensure windows_exporter is installed and running
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.31.8"
          if (-not (Get-Service -Name windows_exporter -ErrorAction SilentlyContinue)) {
            $msiPath = Join-Path $env:TEMP "windows_exporter-$version-amd64.msi"
            $logPath = Join-Path $env:TEMP "windows_exporter-install.log"
            $msiUrl = "https://github.com/prometheus-community/windows_exporter/releases/download/v$version/windows_exporter-$version-amd64.msi"
            Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
            $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /qn /L*V `"$logPath`"" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              Get-Content $logPath -Tail 40 -ErrorAction SilentlyContinue | Write-Output
              throw "windows_exporter install failed with exit code $($proc.ExitCode)"
            }
            Remove-Item $msiPath -ErrorAction SilentlyContinue
            Remove-Item $logPath -ErrorAction SilentlyContinue
          }

          Set-Service -Name windows_exporter -StartupType Automatic
          if ((Get-Service -Name windows_exporter).Status -ne 'Running') {
            Start-Service -Name windows_exporter
          }

      # The MSI does not open the port. windows_exporter's firewall exception
      # is an opt-in installer feature (`ADDLOCAL=FirewallException`, see the
      # project README's installer property table), so the plain /qn install
      # above leaves Windows Defender Firewall silently dropping inbound 9182:
      # a scrape from off-host times out rather than being refused, which reads
      # like a dead host instead of a closed port. It never showed up while
      # Prometheus ran in a container on this same host and scraped
      # host.docker.internal - that path never left the machine. Phase 6
      # scrapes from a pod on another VM, which is a different network path
      # with a different firewall answer.
      #
      # The rule is converged here rather than handed to `ADDLOCAL` because
      # the install above is skipped when the service already exists, so an
      # installer-owned rule would never reach a host provisioned before this
      # step existed - and its scope would be frozen at install time.
      #
      # LocalSubnet, not Any: Phase 1 puts the node VMs on an external switch,
      # so they are on the host's own LAN subnet by design. A topology that
      # separates them needs this widened to that CIDR, not to Any.
      - name: Ensure windows_exporter is reachable off-host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ruleName = "aerie-windows-exporter"
          $params = @{
            Protocol      = "TCP"
            LocalPort     = 9182
            RemoteAddress = "LocalSubnet"
            Profile       = "Any"
            Action        = "Allow"
            Enabled       = "True"
          }
          if (Get-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue) {
            Set-NetFirewallRule -Name $ruleName @params
          } else {
            New-NetFirewallRule -Name $ruleName `
              -DisplayName "windows_exporter (Aerie)" `
              -Description "Prometheus scrapes of windows_exporter from the cluster nodes." `
              -Direction Inbound @params | Out-Null
          }

      # Native Windows install, not a container: Docker Desktop's WSL2 backend
      # gives every container the WSL VM's own network namespace, not the real
      # host's - a containerized Tailscale could join the tailnet but could
      # only ever advertise the VM's private subnet, never the actual LAN.
      # Same underlying constraint as the windows_exporter step above. This
      # makes the host a Tailscale subnet router, so any tailnet device can
      # reach the LAN (and therefore every *.${DOMAIN} host Traefik routes to)
      # once the advertised route is approved in the admin console. Moved
      # here from cd.yml (Phase 5, 5b.13) and, unlike that single-host step,
      # this one runs on all three Hyper-V hosts: a subnet router belongs on
      # a machine with the LAN interface, and all three outlive the cutover
      # (the design decision that keeps this workload off the cluster).
      # Each host advertises the same route under its own Tailscale hostname,
      # for redundancy - Tailscale supports more than one subnet router for
      # a given CIDR.
      - name: Ensure Tailscale is installed and running
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAILSCALE_ADVERTISE_ROUTES: ${{ vars.TAILSCALE_ADVERTISE_ROUTES }}
          TAILSCALE_HOSTNAME: aerie-${{ inputs.host }}
        run: |
          $ErrorActionPreference = "Stop"
          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Get-Service -Name Tailscale -ErrorAction SilentlyContinue)) {
            $version = "1.98.10"
            $msiPath = Join-Path $env:TEMP "tailscale-setup-$version-amd64.msi"
            $logPath = Join-Path $env:TEMP "tailscale-install.log"
            $msiUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-$version-amd64.msi"
            Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
            # TS_UNATTENDEDMODE keeps tailscaled running with nobody logged
            # into the console - this host never has an interactive desktop
            # session. TS_NOLAUNCH skips starting the GUI client post-install,
            # which has nothing to attach to under the runner service account.
            $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" TS_UNATTENDEDMODE=always TS_NOLAUNCH=1 /qn /L*V `"$logPath`"" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              Get-Content $logPath -Tail 40 -ErrorAction SilentlyContinue | Write-Output
              throw "Tailscale install failed with exit code $($proc.ExitCode)"
            }
            Remove-Item $msiPath -ErrorAction SilentlyContinue
            Remove-Item $logPath -ErrorAction SilentlyContinue
          }

          Set-Service -Name Tailscale -StartupType Automatic
          if ((Get-Service -Name Tailscale).Status -ne 'Running') {
            Start-Service -Name Tailscale
          }

          # `tailscale up` flags aren't cumulative - every call must restate
          # the full desired flag set, or an omitted flag resets to default.
          # --unattended must be restated too: TS_UNATTENDEDMODE=always at
          # install time makes it a persistent non-default setting, and
          # `tailscale up` refuses to run if any non-default flag goes
          # unmentioned.
          # --authkey is included only on first auth: re-passing it on every
          # run is tempting for idempotency, but tailscaled unconditionally
          # attempts to register with a supplied key even when a valid
          # authenticated state already exists on disk
          # (tailscale/tailscale#19501) - so a since-expired reusable key
          # would break every run after its expiry, not just the one that
          # actually needed it.
          $status = & $tailscaleExe status --json | ConvertFrom-Json
          if ($status.BackendState -ne "Running") {
            & $tailscaleExe up --authkey=$env:TAILSCALE_AUTH_KEY --advertise-routes=$env:TAILSCALE_ADVERTISE_ROUTES --accept-routes=false --hostname=$env:TAILSCALE_HOSTNAME --unattended
          } else {
            & $tailscaleExe up --advertise-routes=$env:TAILSCALE_ADVERTISE_ROUTES --accept-routes=false --hostname=$env:TAILSCALE_HOSTNAME --unattended
          }
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed with exit code $LASTEXITCODE" }

      - name: Provision node
        shell: powershell
        env:
          # Every input arrives as an environment variable rather than being
          # interpolated into the script body below. `${{ }}` substitution
          # happens before PowerShell parses anything, so an input containing
          # a quote would otherwise break out of its string literal and run as
          # code - on an Administrator shell, on a hypervisor. Dispatch inputs
          # only come from users with write access, but the whole point of
          # this file is that it stays safe to hand to someone else.
          VM_NAME: ${{ inputs.vm_name }}
          MAC_ADDRESS: ${{ inputs.mac_address }}
          EXPECTED_IP: ${{ inputs.expected_ip }}
          DISTRO: ${{ inputs.distro }}
          SWITCH_NAME: ${{ inputs.switch_name }}
          VM_STORAGE_PATH: ${{ inputs.vm_storage_path }}
          OS_DISK_PATH: ${{ inputs.os_disk_path }}
          DATA_DISK_PATH: ${{ inputs.data_disk_path }}
          TEMPLATE_PATH: ${{ inputs.template_path }}
          MEMORY_GB: ${{ inputs.memory_gb }}
          CPU_COUNT: ${{ inputs.cpu_count }}
          OS_DISK_GB: ${{ inputs.os_disk_gb }}
          DATA_DISK_GB: ${{ inputs.data_disk_gb }}
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          RECREATE_VM: ${{ inputs.recreate_vm }}
          SKIP_WAIT: ${{ inputs.skip_wait }}
          SKIP_CHECKSUM_VERIFICATION: ${{ inputs.skip_checksum_verification }}
          # The private half is used only from the host, to verify the node
          # over SSH. It is never written into the VM.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
          # Public key, NTP source and domain aren't secret; they're variables
          # so they stay identical across all three hosts without being
          # retyped per run.
          NODE_SSH_PUBLIC_KEY: ${{ vars.NODE_SSH_PUBLIC_KEY }}
          NTP_SERVER: ${{ vars.NTP_SERVER }}
          DOMAIN: ${{ vars.DOMAIN }}
          # Shared secret the VM's console-log Scheduled Task sends as
          # X-Vm-Log-Token to Aerie.Api's /api/vm-console-logs (see
          # VmConsoleLogsController and cd.yml). Nothing issues it - mint one
          # with scripts/secrets/new-shared-secret.sh.
          #
          # This workflow degrades rather than fails if it's unset (the VM
          # builds, it just ships no console lines) because a node that won't
          # boot is a worse outcome than a node with no console log. That is
          # not a licence to leave it unset: parameters.json marks the same
          # value required, so Provision 2 refuses to seed without it.
          VM_LOG_SHIPPER_TOKEN: ${{ secrets.VM_LOG_SHIPPER_TOKEN }}
          # No QEMU_IMG_SHA256 here on purpose: the qemu-img URL and its hash
          # are committed together in scripts/versions.json, so the golden
          # image is built with the same converter on every host without an
          # operator having to carry a hash around. See Get-GoldenImage.ps1's
          # .NOTES.
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          foreach ($required in 'NODE_SSH_PUBLIC_KEY', 'NTP_SERVER') {
            if (-not (Get-Item "env:$required" -ErrorAction SilentlyContinue).Value) {
              throw "Repository variable $required is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            }
          }

          $params = @{
            VMName            = $env:VM_NAME
            MacAddress        = $env:MAC_ADDRESS
            ExpectedIPAddress = $env:EXPECTED_IP
            NtpServer         = $env:NTP_SERVER
            Distro            = $env:DISTRO
            SwitchName        = $env:SWITCH_NAME
            VMStoragePath     = $env:VM_STORAGE_PATH
            TemplatePath      = $env:TEMPLATE_PATH
            MemoryGB          = [int]$env:MEMORY_GB
            CPUCount          = [int]$env:CPU_COUNT
            OsDiskSizeGB      = [int]$env:OS_DISK_GB
            DataDiskSizeGB    = [int]$env:DATA_DISK_GB
            SshPublicKey      = $env:NODE_SSH_PUBLIC_KEY
          }

          # Only when supplied: the script defaults each to VMStoragePath,
          # and passing an empty string here would override that with ''.
          if ($env:OS_DISK_PATH -and $env:OS_DISK_PATH.Trim()) { $params.OsDiskPath = $env:OS_DISK_PATH.Trim() }
          if ($env:DATA_DISK_PATH -and $env:DATA_DISK_PATH.Trim()) { $params.DataDiskPath = $env:DATA_DISK_PATH.Trim() }

          if ($env:DOMAIN) { $params.Domain = $env:DOMAIN }

          if ($env:DOMAIN -and $env:VM_LOG_SHIPPER_TOKEN) {
            $params.LogIngestUrl = "https://home.$($env:DOMAIN)/api/vm-console-logs"
            $params.LogIngestToken = $env:VM_LOG_SHIPPER_TOKEN
          }

          if ($env:EXTRA_PACKAGES -and $env:EXTRA_PACKAGES.Trim()) {
            $params.ExtraPackages = @($env:EXTRA_PACKAGES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }

          if ([bool]::Parse($env:PREFLIGHT_ONLY)) { $params.PreflightOnly = $true }

          if ([bool]::Parse($env:RECREATE_VM)) { $params.RecreateVM = $true }

          if ([bool]::Parse($env:SKIP_CHECKSUM_VERIFICATION)) { $params.SkipChecksumVerification = $true }

          if ([bool]::Parse($env:SKIP_WAIT)) {
            $params.SkipWaitForReady = $true
          }
          elseif (-not (Get-Item 'env:NODE_SSH_PRIVATE_KEY' -ErrorAction SilentlyContinue).Value) {
            throw "Secret NODE_SSH_PRIVATE_KEY is not set, so the node can't be verified after boot. Add the secret, or re-run with skip_wait."
          }
          else {
            $params.SshPrivateKey = $env:NODE_SSH_PRIVATE_KEY
          }

          & .\scripts\hyperv\Initialize-AerieNode.ps1 @params
