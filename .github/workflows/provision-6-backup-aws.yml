# The cluster plan Phase 8a step 1: the S3 bucket Longhorn backs up into, the
# IAM user scoped to it, and the parameter-tree read 'aerie-restic' grows so
# 8b.7's export can dump /aerie/* into the backup repository.
#
# Numbered, unlike the verify-*.yml family, because it writes cloud resources -
# but it is not the sixth step of the linear build. It is a prerequisite,
# dispatched once before Phase 8b, in the same sense provision-2 is a
# prerequisite for anything that reads a Secret. A cluster built before Phase 8
# never needed it; one built after runs it whenever the backup path is being
# stood up or repaired.
#
# Same thin-wrapper rule as every other workflow here: this checks out the
# repo, maps repository secrets and variables onto environment names, and
# hands every decision to scripts/secrets/Set-AerieBackupAws.ps1, which also
# runs by hand from any machine with the AWS CLI. Logic added here instead of
# the script would exist on only one of the two paths and let them drift.
#
# The credential this runs as is the one new thing Phase 8 asks for, and it is
# worth reading the tradeoff rather than pasting an account root key:
# PROVISION_AWS_* has to create a bucket and attach inline policies, so it is
# strictly more powerful than any other credential this repository stores. Give
# it exactly scripts/secrets/iam/aerie-provisioner.policy.json - IAM scoped to
# 'arn:aws:iam::<account>:user/aerie-*', S3 scoped to this one bucket, and
# iam:SimulatePrincipalPolicy, which is what the exit checks assert with and is
# the one action easy to leave out because nothing provisions with it. Not
# AdministratorAccess. That document is pasted by hand rather than applied by
# Set-AerieSecretsIam.ps1, because the identity that attaches policies cannot
# attach its own. It is also the one
# credential here with no in-cluster consumer, so it can be deleted between
# runs and minted again when the backup path next needs repair, which is the
# recommendation.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner and never consume Actions minutes.
name: 'Provision 6: Backup AWS resources'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it needs the AWS CLI and nothing else)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
          - hyperv-host-3
      longhorn_bucket:
        description: 'The dedicated bucket Longhorn backs up into. Neither the WAL bucket nor the restic one - this is 8b.2''s LONGHORN_BACKUP_BUCKET'
        required: true
        type: string
      stage:
        description: 'both = bucket, policies, then assert; bucket-only / iam-only = one half; verify-only = change nothing and assert the exit criteria'
        required: true
        default: both
        type: choice
        options:
          - both
          - bucket-only
          - iam-only
          - verify-only
      longhorn_user:
        description: 'The IAM user Longhorn holds credentials for. Created if absent'
        required: false
        default: aerie-longhorn
        type: string
      restic_user:
        description: 'The Phase 0 restic user that gains the parameter-tree read. Blank to leave it alone'
        required: false
        default: aerie-restic
        type: string
      parameter_prefix:
        description: 'Override parameters.json''s prefix (default /aerie). Only needed when two installations share one AWS account'
        required: false
        type: string

# Keyed on nothing but the workflow: two concurrent runs would race the same
# bucket configuration and the same inline policies.
concurrency:
  group: provision-6-backup-aws
  cancel-in-progress: false

jobs:
  provision:
    name: Phase 8a.1 (${{ inputs.stage }})
    runs-on: [self-hosted, '${{ inputs.host }}']

    # Every call is one AWS API round trip plus a 10s wait for IAM to settle.
    # 15m failing means something is hanging rather than being slow.
    timeout-minutes: 15

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # See scripts/runner/README.md, and note the step is what puts a
      # freshly-installed aws.exe on PATH for the step below: the machine PATH
      # entry the MSI writes is invisible to the runner service until it
      # restarts.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency AwsCli

      - name: Provision the backup bucket and policies
        shell: powershell
        env:
          LONGHORN_BUCKET: ${{ inputs.longhorn_bucket }}
          LONGHORN_USER: ${{ inputs.longhorn_user }}
          RESTIC_USER: ${{ inputs.restic_user }}
          STAGE: ${{ inputs.stage }}
          PARAMETER_PREFIX: ${{ inputs.parameter_prefix }}

          # The region the bucket is created in, the region the parameter tree
          # lives in, and the region 8b.9's backup target names. One value, so
          # there is one thing to get wrong rather than three.
          AWS_REGION: ${{ vars.AWS_REGION }}

          # The operator identity. Named AWS_* deliberately - unlike every
          # other credential in this repository, this pair IS what the CLI
          # should pick up by default, and the script's other identities are
          # applied per-call around it.
          AWS_ACCESS_KEY_ID: ${{ vars.PROVISION_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROVISION_AWS_SECRET_ACCESS_KEY }}

          # Optional, and only read by the exit checks. The simulator proves
          # the policies without either pair; these prove the identities
          # themselves, which is the literal exit text and the only thing that
          # would also catch an SCP or a bucket policy. RESTIC_AWS_* already
          # exists - provision-2 seeds the same pair into the tree.
          # LONGHORN_AWS_* does not exist until an operator mints the key this
          # run's user needs, so a first run skips that one check and a
          # verify-only re-run after 8b.1 picks it up.
          RESTIC_AWS_ACCESS_KEY_ID: ${{ vars.RESTIC_AWS_ACCESS_KEY_ID }}
          RESTIC_AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTIC_AWS_SECRET_ACCESS_KEY }}
          LONGHORN_AWS_ACCESS_KEY_ID: ${{ vars.LONGHORN_AWS_ACCESS_KEY_ID }}
          LONGHORN_AWS_SECRET_ACCESS_KEY: ${{ secrets.LONGHORN_AWS_SECRET_ACCESS_KEY }}

          # Read only to refuse a run that would point Longhorn at the bucket
          # barman-cloud already owns.
          WAL_BUCKET: ${{ vars.WAL_BUCKET }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          # Which tab each name lives on. Naming it in the failure is the
          # whole point: a value stored on the wrong tab reads back as an
          # empty string, so "not set" is indistinguishable from "set, in the
          # wrong place" unless the message says which place is right.
          $tab = @{
            AWS_REGION            = 'Variables'
            AWS_ACCESS_KEY_ID     = 'Variables (as PROVISION_AWS_ACCESS_KEY_ID)'
            AWS_SECRET_ACCESS_KEY = 'Secrets (as PROVISION_AWS_SECRET_ACCESS_KEY)'
          }
          foreach ($required in $tab.Keys) {
            if (-not (Get-Item "env:$required" -ErrorAction SilentlyContinue).Value) {
              throw "$required is not set. Add it under Settings > Secrets and variables > Actions, on the $($tab[$required]) tab - see scripts/secrets/README.md. If it looks set already, check it isn't on the other tab: the wrong tab resolves to an empty string rather than an error."
            }
          }

          $params = @{
            LonghornBucket = $env:LONGHORN_BUCKET
            Stage          = $env:STAGE
            AwsRegion      = $env:AWS_REGION
          }
          if ($env:LONGHORN_USER) { $params.LonghornUserName = $env:LONGHORN_USER }
          # Empty is meaningful here - it is how an operator says "leave the
          # restic user alone" - so this passes it through rather than
          # falling back to the script's default.
          $params.ResticUserName = [string]$env:RESTIC_USER
          if ($env:PARAMETER_PREFIX) { $params.ParameterPrefix = $env:PARAMETER_PREFIX }

          & .\scripts\secrets\Set-AerieBackupAws.ps1 @params
