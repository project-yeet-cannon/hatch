# The cluster plan Phase 6b's last step: the phase gate, as something that
# exits 0 - the same shape verify-cluster-platform.yml, verify-data-tier.yml
# and verify-app-tier.yml established for Phases 3b.13, 4b.11 and 5b.14.
#
# 6b.15 is the gate itself, not a re-check of everything 6b.1-6b.14 already
# proved. Not "Provision 6": read-only, the same reason the other three
# verify-*.yml workflows aren't numbered into that sequence either.
#
# Same thin-wrapper rule as every other workflow here: this checks out the
# repo and hands every decision to scripts/k3s/Test-Observability.ps1, which
# also runs by hand from any Windows box with the OpenSSH client and a LAN
# route to the nodes and the ingress VIP.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner (which has no route to the nodes' LAN addresses, or to the VIP the
# HTTPS checks dial directly, anyway) and never consume Actions minutes.
name: 'Verify: Observability'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it needs SSH to the nodes and a route to the ingress VIP)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      ip_address:
        description: "A k3s server's LAN address. Any server - everything read here over SSH is cluster state"
        required: true
        type: string

# Read-only, so two concurrent runs cannot corrupt anything - but they would
# interleave their output in the same summary and prove nothing twice, so a
# second dispatch waits rather than doubling up.
concurrency:
  group: verify-observability
  cancel-in-progress: false

jobs:
  verify:
    name: Phase 6 gate
    runs-on: [self-hosted, '${{ inputs.host }}']

    # Four SSH round trips against the primary node (Probe, Series, Delivery
    # and the per-node loop's first connection), one extra connection per node
    # for the vm.max_map_count/etcd checks, plus three direct HTTPS connections
    # to the VIP. Nothing here waits on a reconciliation, so 10m failing means
    # something is hanging rather than being slow.
    timeout-minutes: 10

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before anything else PowerShell-shaped. `shell: powershell` is
      # implemented as a dot-source of a temp .ps1, which an execution policy of
      # Restricted - the Windows *client* default - refuses outright, so the
      # `Set-ExecutionPolicy -Scope Process` inside every step below is in the
      # file that will not load. See the action, and scripts/runner/README.md.
      - name: Ensure PowerShell can run repository scripts
        uses: ./.github/actions/ensure-powershell

      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Assert 6b.15's checklist
        shell: powershell
        env:
          IP_ADDRESS: ${{ inputs.ip_address }}

          # Same keypair every provision-*/verify-* workflow uses.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
          }

          & .\scripts\k3s\Test-Observability.ps1 `
            -IPAddress $env:IP_ADDRESS `
            -SshPrivateKey $env:NODE_SSH_PRIVATE_KEY

          # Same reason verify-cluster-platform.yml, verify-data-tier.yml and
          # verify-app-tier.yml propagate this explicitly: `exit` inside a
          # script invoked with & sets $LASTEXITCODE without ending the caller.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
