# Stagger Windows Update reboots across the k3s hosts (TODO_SWARM.md Phase 1)
#
# The 3-node cluster runs embedded etcd with quorum 3 - it tolerates exactly
# one node down. Left to its own defaults, Windows Update reboots each host
# on its own schedule with no coordination between them; two hosts rebooting
# close together freezes the cluster. This workflow discovers the current
# hyperv-host-* runners, spreads them evenly across the week, and upserts
# each host's Windows Update install/reboot schedule via
# scripts/hyperv/Set-UpdateRebootSchedule.ps1.
#
# Host discovery is dynamic (the GitHub self-hosted runners API), not a
# hardcoded list, so a topology change - a host added, removed, or renamed -
# never requires editing this file. Just rerun it.
#
# Billing: both jobs pin `self-hosted`, so this never lands on a
# GitHub-hosted runner or consumes Actions minutes.
name: Stagger Windows Update reboots

on:
  workflow_dispatch:
    inputs:
      host_label_pattern:
        description: 'Regex a runner label must match to count as a cluster host'
        required: true
        default: '^hyperv-host-\d+$'
        type: string
      reboot_hour:
        description: 'Local hour (0-23) every host installs + reboots at, on its assigned day'
        required: true
        default: '3'
        type: string
      reboot_grace_minutes:
        description: 'Minutes Windows Update waits after notifying before forcing the reboot'
        required: true
        default: '15'
        type: string
      dry_run:
        description: 'Compute and print the schedule without touching any host'
        required: false
        default: false
        type: boolean

# Two runs at once would compute the schedule twice and could interleave
# writes on the same host. Queue instead of cancelling, same reasoning as
# provision-node.yml: a cancelled run could leave a host mid-write.
concurrency:
  group: stagger-update-reboots
  cancel-in-progress: false

jobs:
  plan:
    name: Compute schedule
    # Any always-on host works here - this job only calls the GitHub API and
    # does arithmetic, it never touches a hyperv-host-* box. legacy-deployer
    # is the one runner guaranteed to exist regardless of Phase 1 progress.
    runs-on: [self-hosted, legacy-deployer]
    permissions:
      # List-runners is a read-only Actions endpoint. If this turns out to be
      # insufficient (some GitHub Enterprise configs gate it behind
      # `administration: read` instead), that's a one-line change here, not a
      # redesign.
      actions: read
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      host_count: ${{ steps.compute.outputs.host_count }}
    steps:
      - name: Discover hosts and compute schedule
        id: compute
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HOST_LABEL_PATTERN: ${{ inputs.host_label_pattern }}
          REBOOT_HOUR: ${{ inputs.reboot_hour }}
          REBOOT_GRACE_MINUTES: ${{ inputs.reboot_grace_minutes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $runners = @()
          $page = 1
          do {
            $resp = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPO/actions/runners?per_page=100&page=$page"
            $runners += $resp.runners
            $page++
          } while ($resp.runners.Count -eq 100)

          $matchedHosts = @()
          foreach ($runner in $runners) {
            $match = $runner.labels | Where-Object { $_.name -match $env:HOST_LABEL_PATTERN } | Select-Object -First 1
            if ($match) { $matchedHosts += $match.name }
          }
          # Sorted so the assignment below is stable across reruns regardless
          # of the order the API happens to return runners in.
          $matchedHosts = $matchedHosts | Sort-Object -Unique

          if ($matchedHosts.Count -eq 0) {
            throw "No self-hosted runners found with a label matching '$env:HOST_LABEL_PATTERN'. Check runner labels or the host_label_pattern input."
          }

          # Windows AU ScheduledInstallDay encoding: 1=Sunday .. 7=Saturday.
          # Indexed here Monday..Sunday so index 0 = Monday.
          $auDayByMondayIndex = @(2, 3, 4, 5, 6, 7, 1)
          $dayNames = @('Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday')

          $hour = [int]$env:REBOOT_HOUR
          $n = $matchedHosts.Count
          $schedule = @()
          for ($i = 0; $i -lt $n; $i++) {
            $dayIndex = [math]::Floor($i * 7 / $n)
            $schedule += [pscustomobject]@{
              host     = $matchedHosts[$i]
              dayValue = $auDayByMondayIndex[$dayIndex]
              dayName  = $dayNames[$dayIndex]
              hour     = $hour
            }
          }

          # Built by hand (rather than `$schedule | ConvertTo-Json`) so a
          # single-host schedule still serializes as a one-element JSON
          # array, not a bare object - Windows PowerShell 5.1's ConvertTo-Json
          # collapses single-element arrays otherwise, which would break the
          # apply job's `matrix: include:`.
          $entryJson = $schedule | ForEach-Object { $_ | ConvertTo-Json -Compress }
          $json = '[' + ($entryJson -join ',') + ']'

          "matrix=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "host_count=$n" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $summaryLines = @(
            '## Windows Update reboot schedule'
            ''
            "Grace period: ${env:REBOOT_GRACE_MINUTES}m after notify before forcing the reboot."
            ''
            '| Host | Day | Hour (local) |'
            '|---|---|---|'
          )
          foreach ($entry in $schedule) {
            $summaryLines += "| $($entry.host) | $($entry.dayName) | $($entry.hour):00 |"
          }
          if ($env:DRY_RUN -eq 'true') {
            $summaryLines += ''
            $summaryLines += '_dry_run was set - no host was touched._'
          }
          $summaryLines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "Computed schedule for $n host(s):"
          $schedule | ForEach-Object { Write-Host "  $($_.host) -> $($_.dayName) $($_.hour):00" }

  apply:
    name: ${{ matrix.host }}
    needs: plan
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, '${{ matrix.host }}']
    permissions:
      contents: read
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set Windows Update reboot schedule
        shell: powershell
        env:
          SCHEDULED_INSTALL_DAY: ${{ matrix.dayValue }}
          SCHEDULED_INSTALL_HOUR: ${{ matrix.hour }}
          REBOOT_GRACE_MINUTES: ${{ inputs.reboot_grace_minutes }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\hyperv\Set-UpdateRebootSchedule.ps1 `
            -ScheduledInstallDay ([int]$env:SCHEDULED_INSTALL_DAY) `
            -ScheduledInstallHour ([int]$env:SCHEDULED_INSTALL_HOUR) `
            -RebootGraceMinutes ([int]$env:REBOOT_GRACE_MINUTES)
