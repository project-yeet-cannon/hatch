# Stagger Windows Update reboots across the k3s hosts (the cluster plan Phase 1)
#
# The 3-node cluster runs embedded etcd with quorum 3 - it tolerates exactly
# one node down. Left to its own defaults, Windows Update reboots each host
# on its own schedule with no coordination between them; two hosts rebooting
# close together freezes the cluster. This workflow spreads the given hosts
# evenly across the week and upserts each one's Windows Update install/reboot
# schedule via scripts/hyperv/Set-UpdateRebootSchedule.ps1.
#
# The host list is a plain workflow input (the `hosts` runner-label list
# below), not auto-discovered. Discovering it via the GitHub API would need
# the self-hosted-runners endpoints, which are excluded from the automatic
# GITHUB_TOKEN entirely - the only way in is a fine-grained PAT with
# Administration: Read on this repo. For a job that runs a couple of times a
# year, retyping the host list on a topology change is a smaller ongoing cost
# than minting and rotating that credential. Rerun with an updated `hosts`
# value whenever a host is added, removed, or renamed.
#
# Billing: both jobs pin `self-hosted`, so this never lands on a
# GitHub-hosted runner or consumes Actions minutes.
name: Stagger Windows Update reboots

on:
  workflow_dispatch:
    inputs:
      hosts:
        description: 'Comma-separated runner labels, one per host (edit this when the topology changes)'
        required: true
        # hyperv-host-3 is the part-time host (docs/plans/part-time-node.md).
        # It is in this list on purpose: it takes Windows Updates like any
        # other machine, and the reboot it takes unscheduled - because
        # Set-UpdateRebootSchedule.ps1 sets NoAutoRebootWithLoggedOnUsers = 0
        # deliberately - is exactly the one finding 6 of that plan is about.
        # Its VM's AutomaticStartAction is Nothing and the boot task decides
        # instead, so a reboot here returns the node only if personal mode is
        # off. Leaving it out of the stagger would give it an uncoordinated
        # day of its own, which is the thing this workflow exists to prevent.
        default: 'hyperv-host-0,hyperv-host-1,hyperv-host-2,hyperv-host-3'
        type: string
      reboot_hour:
        description: 'Local hour (0-23) every host installs + reboots at, on its assigned day'
        required: true
        default: '3'
        type: string
      reboot_grace_minutes:
        description: 'Minutes Windows Update waits after notifying before forcing the reboot'
        required: true
        default: '15'
        type: string
      dry_run:
        description: 'Compute and print the schedule without touching any host'
        required: false
        default: false
        type: boolean

# Two runs at once would compute the schedule twice and could interleave
# writes on the same host. Queue instead of cancelling, same reasoning as
# provision-0-new-node.yml: a cancelled run could leave a host mid-write.
concurrency:
  group: stagger-update-reboots
  cancel-in-progress: false

jobs:
  plan:
    name: Compute schedule
    # This job only does string parsing and arithmetic - it reads no host and
    # writes to none - but it stays self-hosted for the billing reason in the
    # header. Any hyperv-host-* label works and none is more correct than
    # another; if the labelled box happens to be down or mid-rebuild, edit this
    # to name a surviving one. (It ran on legacy-deployer until 7b.9 retired
    # that runner along with the compose host it deployed to.)
    runs-on: [self-hosted, hyperv-host-0]
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      host_count: ${{ steps.compute.outputs.host_count }}
    steps:
      # This job needs no repository content of its own - it is string parsing
      # and arithmetic - but the step below is a `shell: powershell` step, and
      # on a Windows client SKU those do not run at all until the execution
      # policy is raised. That fix is a composite action, and a composite
      # action has to be checked out before it can be used. A checkout on a
      # self-hosted runner is a fetch of what has already changed, so the cost
      # is close to nothing.
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure PowerShell can run repository scripts
        uses: ./.github/actions/ensure-powershell

      - name: Compute schedule
        id: compute
        shell: powershell
        env:
          HOSTS: ${{ inputs.hosts }}
          REBOOT_HOUR: ${{ inputs.reboot_hour }}
          REBOOT_GRACE_MINUTES: ${{ inputs.reboot_grace_minutes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'

          $matchedHosts = $env:HOSTS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          # Sorted so the assignment below is stable across reruns regardless
          # of the order hosts were typed in.
          $matchedHosts = $matchedHosts | Sort-Object -Unique

          if ($matchedHosts.Count -eq 0) {
            throw "The 'hosts' input is empty. Pass a comma-separated list of runner labels, e.g. hyperv-host-0,hyperv-host-1,hyperv-host-2."
          }

          # Windows AU ScheduledInstallDay encoding: 1=Sunday .. 7=Saturday.
          # Indexed here Monday..Sunday so index 0 = Monday.
          $auDayByMondayIndex = @(2, 3, 4, 5, 6, 7, 1)
          $dayNames = @('Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday')

          $hour = [int]$env:REBOOT_HOUR
          $n = $matchedHosts.Count
          $schedule = @()
          for ($i = 0; $i -lt $n; $i++) {
            $dayIndex = [math]::Floor($i * 7 / $n)
            $schedule += [pscustomobject]@{
              host     = $matchedHosts[$i]
              dayValue = $auDayByMondayIndex[$dayIndex]
              dayName  = $dayNames[$dayIndex]
              hour     = $hour
            }
          }

          # Built by hand (rather than `$schedule | ConvertTo-Json`) so a
          # single-host schedule still serializes as a one-element JSON
          # array, not a bare object - Windows PowerShell 5.1's ConvertTo-Json
          # collapses single-element arrays otherwise, which would break the
          # apply job's `matrix: include:`.
          $entryJson = $schedule | ForEach-Object { $_ | ConvertTo-Json -Compress }
          $json = '[' + ($entryJson -join ',') + ']'

          "matrix=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "host_count=$n" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $summaryLines = @(
            '## Windows Update reboot schedule'
            ''
            "Grace period: ${env:REBOOT_GRACE_MINUTES}m after notify before forcing the reboot."
            ''
            '| Host | Day | Hour (local) |'
            '|---|---|---|'
          )
          foreach ($entry in $schedule) {
            $summaryLines += "| $($entry.host) | $($entry.dayName) | $($entry.hour):00 |"
          }
          if ($env:DRY_RUN -eq 'true') {
            $summaryLines += ''
            $summaryLines += '_dry_run was set - no host was touched._'
          }
          $summaryLines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "Computed schedule for $n host(s):"
          $schedule | ForEach-Object { Write-Host "  $($_.host) -> $($_.dayName) $($_.hour):00" }

  apply:
    name: ${{ matrix.host }}
    needs: plan
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, '${{ matrix.host }}']
    permissions:
      contents: read
    steps:
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure PowerShell can run repository scripts
        uses: ./.github/actions/ensure-powershell

      - name: Set Windows Update reboot schedule
        shell: powershell
        env:
          SCHEDULED_INSTALL_DAY: ${{ matrix.dayValue }}
          SCHEDULED_INSTALL_HOUR: ${{ matrix.hour }}
          REBOOT_GRACE_MINUTES: ${{ inputs.reboot_grace_minutes }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\hyperv\Set-UpdateRebootSchedule.ps1 `
            -ScheduledInstallDay ([int]$env:SCHEDULED_INSTALL_DAY) `
            -ScheduledInstallHour ([int]$env:SCHEDULED_INSTALL_HOUR) `
            -RebootGraceMinutes ([int]$env:REBOOT_GRACE_MINUTES)
