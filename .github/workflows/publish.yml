name: Build and publish containers

# Triggered directly off the push, in parallel with the "Build and test" CI
# workflow, rather than waiting for CI to finish first. Each job builds its
# image optimistically and only pushes it once CI reports success for the
# same commit (see .github/actions/wait-for-ci). This assumes main usually
# builds cleanly; if CI fails, the already-built image is simply discarded.
#
# Note for any job below that uses sparse-checkout: a local `uses: ./path`
# action is resolved from the workspace on disk, not fetched, so every such
# job must also list the action's directory in its sparse-checkout or it fails
# with "Can't find 'action.yml' ... under .github/actions/<name>".
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./src/Aerie.Api/Dockerfile.api
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-api

  detect-db-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      db-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        # fetch-depth: 0 - the diff is taken against whatever commit produced
        # the currently published image, which can be arbitrarily far back.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/aerie-db
            .github/actions/detect-image-changes

      - name: Check for changes under containers/aerie-db
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-db
          path: containers/aerie-db
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-db-image:
    needs: detect-db-changes
    if: needs.detect-db-changes.outputs.db-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            containers/aerie-db
            .github/actions/wait-for-ci

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-db
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./containers/aerie-db
          file: ./containers/aerie-db/Dockerfile.db
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-db

  detect-backup-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      backup-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/backup
            .github/actions/detect-image-changes

      - name: Check for changes under containers/backup
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-backup
          path: containers/backup
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-backup-image:
    needs: detect-backup-changes
    if: needs.detect-backup-changes.outputs.backup-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            containers/backup
            .github/actions/wait-for-ci

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-backup
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./containers/backup
          file: ./containers/backup/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-backup

  detect-caddy-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      caddy-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/caddy
            .github/actions/detect-image-changes

      - name: Check for changes under containers/caddy
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-caddy
          path: containers/caddy
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-caddy-image:
    needs: detect-caddy-changes
    if: needs.detect-caddy-changes.outputs.caddy-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            containers/caddy
            .github/actions/wait-for-ci

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-caddy
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./containers/caddy
          file: ./containers/caddy/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-caddy

  detect-kiosk-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      kiosk-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            apps/kiosk
            .github/actions/detect-image-changes

      - name: Check for changes under apps/kiosk
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-kiosk-files
          path: apps/kiosk
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-kiosk-image:
    needs: detect-kiosk-changes
    if: needs.detect-kiosk-changes.outputs.kiosk-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write release signing config
        working-directory: apps/kiosk
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KIOSK_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KIOSK_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ vars.KIOSK_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KIOSK_RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/aerie-kiosk-release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=$KEYSTORE_PATH
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

      - name: Compute app version
        id: version
        run: |
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: apps/kiosk
        run: |
          ./gradlew assembleRelease \
            -PkioskVersionCode="${{ steps.version.outputs.code }}" \
            -PkioskVersionName="${{ steps.version.outputs.name }}"

      - name: Compute signing-cert checksum
        env:
          RELEASE_KEY_ALIAS: ${{ vars.KIOSK_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KIOSK_RELEASE_STORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/aerie-kiosk-release.jks"
          keytool -export -alias "$RELEASE_KEY_ALIAS" -keystore "$KEYSTORE_PATH" \
              -storepass "$RELEASE_STORE_PASSWORD" -rfc \
            | openssl x509 -outform DER \
            | openssl dgst -sha256 -binary | openssl base64 | tr '+/' '-_' | tr -d '=' \
            > apps/kiosk/signature-checksum.txt

      - name: Write version.json
        # Polled by UpdateManager (apps/kiosk/app/src/.../UpdateManager.kt) so
        # already-provisioned tablets can discover and silently self-update to
        # this build without ever touching the QR provisioning flow again.
        run: |
          cat > apps/kiosk/version.json <<EOF
          {"versionCode": ${{ steps.version.outputs.code }}, "versionName": "${{ steps.version.outputs.name }}"}
          EOF

      - name: Remove keystore (no longer needed once the APK is signed)
        if: always()
        run: rm -f "$RUNNER_TEMP/aerie-kiosk-release.jks"

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-kiosk-files
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/kiosk
          file: ./apps/kiosk/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-kiosk-files
