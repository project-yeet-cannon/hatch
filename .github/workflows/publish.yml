name: Build and publish containers

# Triggered directly off the push, in parallel with the "Build and test" CI
# workflow, rather than waiting for CI to finish first. Each job builds its
# image optimistically and only pushes it once CI reports success for the
# same commit (see .github/actions/wait-for-ci). This assumes main usually
# builds cleanly; if CI fails, the already-built image is simply discarded.
#
# Note for any job below that uses sparse-checkout: a local `uses: ./path`
# action is resolved from the workspace on disk, not fetched, so every such
# job must also list the action's directory in its sparse-checkout or it fails
# with "Can't find 'action.yml' ... under .github/actions/<name>".
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      # fetch-depth: 0 is load-bearing, not hygiene - the same trap the kiosk
      # job below documents, for the same reason. "Compute revision" derives
      # the sequence from `git rev-list --count HEAD`, and on the default
      # shallow clone that counts exactly one commit. Every build would then
      # ship sequence 1, every "is this client behind the API" comparison would
      # answer "no" forever, and nothing would look broken.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The git identity stamped into the image: the sha into the assembly and
      # into every SPA's index.html, the commit count as the ordering a sha
      # cannot provide on its own. See docs/plans/version.md.
      - name: Compute revision
        id: revision
        run: |
          echo "sequence=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/Aerie.Api/Dockerfile.api
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AERIE_REVISION=${{ github.sha }}
            AERIE_SEQUENCE=${{ steps.revision.outputs.sequence }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-api

  detect-db-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      db-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        # fetch-depth: 0 - the diff is taken against whatever commit produced
        # the currently published image, which can be arbitrarily far back.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/aerie-db
            .github/actions/detect-image-changes

      - name: Check for changes under containers/aerie-db
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-db
          path: containers/aerie-db
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-db-image:
    needs: detect-db-changes
    if: needs.detect-db-changes.outputs.db-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            containers/aerie-db
            .github/actions/wait-for-ci

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-db
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/aerie-db
          file: ./containers/aerie-db/Dockerfile.db
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-db

  detect-backup-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      backup-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/backup
            .github/actions/detect-image-changes

      - name: Check for changes under containers/backup
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-backup
          path: containers/backup
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-backup-image:
    needs: detect-backup-changes
    if: needs.detect-backup-changes.outputs.backup-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            containers/backup
            .github/actions/wait-for-ci

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-backup
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/backup
          file: ./containers/backup/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-backup

  detect-kuma-provision-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      kuma-provision-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/kuma-provision
            .github/actions/detect-image-changes

      - name: Check for changes under containers/kuma-provision
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-kuma-provision
          path: containers/kuma-provision
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-kuma-provision-image:
    needs: detect-kuma-provision-changes
    if: needs.detect-kuma-provision-changes.outputs.kuma-provision-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            containers/kuma-provision
            .github/actions/wait-for-ci

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-kuma-provision
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/kuma-provision
          file: ./containers/kuma-provision/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-kuma-provision

  detect-trading-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      trading-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/Aerie.Trading
            src/Aerie.Web/apps/trading
            .github/actions/detect-image-changes

      # Two paths, because the trading image has two sources: the silo, and
      # the control panel's SPA, which is built in the Aerie.Web workspace and
      # copied into the silo before the image build (docs/plans/trading.md
      # Phase 7). Without the second path an edit to the control panel would
      # never produce a new image - the silo did not change, so nothing would
      # rebuild, and the deployed UI would sit one commit behind forever with
      # nothing failing to say so.
      - name: Check for changes under the trading silo or its SPA
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-trading
          path: src/Aerie.Trading src/Aerie.Web/apps/trading
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The trading silo (docs/plans/trading.md Phase 1). Path-filtered like the db,
  # backup and kiosk images rather than built on every push the way the api
  # image is - the silo changes on its own cadence, and an unchanged one has no
  # reason to produce a new tag for image automation to move the cluster to.
  #
  # A consequence worth knowing rather than discovering: because of that
  # filter, the revision this image reports at /api/trading/version is the last
  # commit that touched src/Aerie.Trading/, not HEAD. That is the honest
  # answer - it is the commit that produced the artifact - and it is the same
  # property every other path-filtered image here has.
  build-and-push-trading-image:
    needs: detect-trading-changes
    if: needs.detect-trading-changes.outputs.trading-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      # fetch-depth: 0 is load-bearing, not hygiene - the same trap the api and
      # kiosk jobs document. "Compute revision" derives the sequence from
      # `git rev-list --count HEAD`, and on the default shallow clone that
      # counts exactly one commit. Every build would ship sequence 1, and the
      # ordering docs/plans/version.md exists to provide would be a constant.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute revision
        id: revision
        run: |
          echo "sequence=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The control panel, built here rather than inside the image, and this is
      # the seam Phase 7 names made concrete. The trading image's build context
      # is src/Aerie.Trading and Docker refuses a COPY that escapes it, so the
      # SPA cannot be built in the Dockerfile from sources that live in the
      # Aerie.Web workspace. It is built onto the runner instead, into
      # src/Aerie.Trading/aerie_trading/control/static/ - which is inside the
      # context, and is gitignored because it is build output.
      #
      # AERIE_REVISION and AERIE_SEQUENCE are read by
      # src/Aerie.Web/vite-plugin-aerie-revision.mts, which stamps them into
      # index.html and makes the page send the revision back on every API call.
      # The same two values go to the image build below, so the page and the
      # service it talks to report one build.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Aerie.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/Aerie.Web/package-lock.json

      - name: Build the control panel
        working-directory: src/Aerie.Web
        env:
          AERIE_REVISION: ${{ github.sha }}
          AERIE_SEQUENCE: ${{ steps.revision.outputs.sequence }}
        run: |
          npm ci
          npm run build -w apps/trading

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-trading
          # The timestamped tag is the one the cluster actually deploys at:
          # deploy/cluster/trading/app/image-automation.yaml's ImagePolicy
          # selects `<14 digits>-<sha>` and can order nothing else. `latest` is
          # what detect-image-changes reads its provenance label from.
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          # This directory, not the repository root - unlike every other image
          # here. It is the extraction seam expressed in the build: nothing
          # outside src/Aerie.Trading/ can reach this image, because Docker
          # refuses a COPY that escapes the context. See
          # src/Aerie.Trading/Dockerfile.trading and ci.yml's trading-boundary
          # job. The step above is what puts the control panel's bundle
          # *inside* the context rather than reaching out of it.
          context: ./src/Aerie.Trading
          file: ./src/Aerie.Trading/Dockerfile.trading
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Written into the package as aerie_trading/build.json rather than
          # exported as an environment variable on the runtime image - a
          # revision the deployment can supply is one the deployment can get
          # wrong. See aerie_trading/revision.py.
          build-args: |
            AERIE_REVISION=${{ github.sha }}
            AERIE_SEQUENCE=${{ steps.revision.outputs.sequence }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-trading

  detect-kiosk-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      kiosk-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            apps/kiosk
            .github/actions/detect-image-changes

      - name: Check for changes under apps/kiosk
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-kiosk-files
          path: apps/kiosk
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-kiosk-image:
    needs: detect-kiosk-changes
    if: needs.detect-kiosk-changes.outputs.kiosk-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      # fetch-depth: 0 is load-bearing, not hygiene: "Compute app version"
      # below derives versionCode from `git rev-list --count HEAD`, and on the
      # default shallow clone that counts exactly one commit. Every publish
      # then ships versionCode 1, UpdateManager's `latest > installed` check is
      # never true, and the tablets silently never self-update.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Write release signing config
        working-directory: apps/kiosk
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KIOSK_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KIOSK_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ vars.KIOSK_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KIOSK_RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/aerie-kiosk-release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=$KEYSTORE_PATH
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

      - name: Compute app version
        id: version
        run: |
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: apps/kiosk
        run: |
          ./gradlew assembleRelease \
            -PkioskVersionCode="${{ steps.version.outputs.code }}" \
            -PkioskVersionName="${{ steps.version.outputs.name }}"

      - name: Compute signing-cert checksum
        env:
          RELEASE_KEY_ALIAS: ${{ vars.KIOSK_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KIOSK_RELEASE_STORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/aerie-kiosk-release.jks"
          keytool -export -alias "$RELEASE_KEY_ALIAS" -keystore "$KEYSTORE_PATH" \
              -storepass "$RELEASE_STORE_PASSWORD" -rfc \
            | openssl x509 -outform DER \
            | openssl dgst -sha256 -binary | openssl base64 | tr '+/' '-_' | tr -d '=' \
            > apps/kiosk/signature-checksum.txt

      - name: Write version.json
        # Polled by UpdateManager (apps/kiosk/app/src/.../UpdateManager.kt) so
        # already-provisioned tablets can discover and silently self-update to
        # this build without ever touching the QR provisioning flow again.
        run: |
          cat > apps/kiosk/version.json <<EOF
          {"versionCode": ${{ steps.version.outputs.code }}, "versionName": "${{ steps.version.outputs.name }}"}
          EOF

      - name: Remove keystore (no longer needed once the APK is signed)
        if: always()
        run: rm -f "$RUNNER_TEMP/aerie-kiosk-release.jks"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-kiosk-files
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/kiosk
          file: ./apps/kiosk/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-kiosk-files

  # The friend's stack (deploy/local/), stood up against the images this same
  # push just pushed. Not path-filtered on purpose: the thing most likely to
  # break "one line brings up Hatch on a laptop" is a change to the API that
  # quietly starts needing configuration a laptop does not have, and that
  # change does not touch deploy/local.
  #
  # `detect-db-changes` is a dependency only so that this waits for the db
  # image decision to resolve; a skipped db build is normal and means `latest`
  # is already correct.
  smoke-test-local-stack:
    needs: [build-and-push-api-image, detect-db-changes, build-and-push-db-image]
    if: >-
      always()
      && needs.build-and-push-api-image.result == 'success'
      && (needs.build-and-push-db-image.result == 'success'
          || needs.build-and-push-db-image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/local

      # First, and before anything is started: the schema check that catches
      # the file being unpublishable. `publish` is stricter than `up` - a
      # shorthand port string holding an unresolved variable passes `up` and
      # fails here - so a file that runs fine locally can still be one nobody
      # can pull. --dry-run touches no registry and needs no login.
      - name: Check the compose file is publishable
        run: |
          docker compose -f deploy/local/compose.yaml \
            publish ghcr.io/eouw0o83hf/hatch-local:ci-check --dry-run -y

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring the stack up
        run: docker compose -f deploy/local/compose.yaml up -d

      - name: Wait for the API to report ready
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null; then
              echo "ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "The API never reported ready on http://localhost:8080/health/ready"
          exit 1

      # The database is not reachable from the host, and this is the guard that
      # keeps it that way: `port` exits non-zero for a service that publishes
      # nothing, so a `ports:` entry appearing on `db` fails here rather than
      # in somebody's living room.
      - name: The database publishes no port
        run: |
          if docker compose -f deploy/local/compose.yaml port db 5432; then
            echo "The db service is publishing 5432 to the host. It must not."
            exit 1
          fi
          echo "db publishes no port, as intended"

      - name: Dump logs
        if: failure()
        run: docker compose -f deploy/local/compose.yaml logs --no-color

      - name: Tear the stack down
        if: always()
        run: docker compose -f deploy/local/compose.yaml down -v

  # The compose file itself, published beside the images it names so that
  # `-f oci://.../hatch-local` needs no checkout. `publish` packages the YAML
  # as authored - it neither pulls nor resolves the images - which is why this
  # job needs only a checkout, and why `--resolve-image-digests` is never
  # passed: pinning the artifact to one image build would break "pull a newer
  # image, keep your data".
  publish-local-compose-stack:
    needs: [smoke-test-local-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        # fetch-depth: 0 so the push range below is resolvable.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            deploy/local
            .github/actions/wait-for-ci

      # Deliberately simpler than detect-image-changes, which anchors on the
      # revision label of the published image so a failed push self-heals on
      # the next commit. A compose artifact carries no such label to read back,
      # and republishing an unchanged file costs a few kilobytes, so the push
      # range is enough. An unresolvable range - the first push to a branch, or
      # a force-push over the previous head - publishes rather than skips.
      - name: Did deploy/local change on this push
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable push range ($BEFORE); publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- deploy/local; then
            echo "deploy/local unchanged on this push; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy/local changed on this push."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI to succeed
        if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the compose stack
        if: steps.changed.outputs.changed == 'true'
        run: |
          docker compose -f deploy/local/compose.yaml \
            publish ghcr.io/eouw0o83hf/hatch-local:latest -y
          docker compose -f deploy/local/compose.yaml \
            publish ghcr.io/eouw0o83hf/hatch-local:${{ github.sha }} -y
