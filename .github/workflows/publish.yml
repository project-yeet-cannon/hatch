name: Build and publish containers

on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-api-image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./src/Aerie.Api/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  detect-db-changes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      db-changed: ${{ steps.filter.outputs.db }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          sparse-checkout: |
            containers/aerie-db

      - name: Check for changes under containers/aerie-db
        id: filter
        run: |
          if git diff --quiet HEAD~1 HEAD -- containers/aerie-db; then
            echo "db=false" >> "$GITHUB_OUTPUT"
          else
            echo "db=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-db-image:
    needs: detect-db-changes
    if: github.event.workflow_run.conclusion == 'success' && needs.detect-db-changes.outputs.db-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            containers/aerie-db

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-db
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./containers/aerie-db
          file: ./containers/aerie-db/Dockerfile.db
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  detect-caddy-changes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      caddy-changed: ${{ steps.filter.outputs.caddy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          sparse-checkout: |
            containers/caddy

      - name: Check for changes under containers/caddy
        id: filter
        run: |
          if git diff --quiet HEAD~1 HEAD -- containers/caddy; then
            echo "caddy=false" >> "$GITHUB_OUTPUT"
          else
            echo "caddy=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-caddy-image:
    needs: detect-caddy-changes
    if: github.event.workflow_run.conclusion == 'success' && needs.detect-caddy-changes.outputs.caddy-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            containers/caddy

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-caddy
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./containers/caddy
          file: ./containers/caddy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
