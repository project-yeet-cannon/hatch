name: Build and publish containers

# Triggered directly off the push, in parallel with the "Build and test" CI
# workflow, rather than waiting for CI to finish first. Each job builds its
# image optimistically and only pushes it once CI reports success for the
# same commit (see .github/actions/wait-for-ci). This assumes main usually
# builds cleanly; if CI fails, the already-built image is simply discarded.
#
# Note for any job below that uses sparse-checkout: a local `uses: ./path`
# action is resolved from the workspace on disk, not fetched, so every such
# job must also list the action's directory in its sparse-checkout or it fails
# with "Can't find 'action.yml' ... under .github/actions/<name>".
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Derived from the repository rather than a literal operator/org name
  # (docs/ethos.md) - GITHUB_TOKEN's registry permission is scoped to packages
  # under this same owner, so a literal here would be wrong the moment this
  # repository is forked or renamed, exactly as it was when Hatch moved out of
  # Aerie's repository and every push here still named the old one.
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push-api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      # fetch-depth: 0 is load-bearing, not hygiene: "Compute revision" derives
      # the sequence from `git rev-list --count HEAD`, and on the default
      # shallow clone that counts exactly one commit. Every build would then
      # ship sequence 1, every "is this client behind the API" comparison would
      # answer "no" forever, and nothing would look broken.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The git identity stamped into the image: the sha into the assembly and
      # into every SPA's index.html, the commit count as the ordering a sha
      # cannot provide on its own. See docs/plans/version.md.
      - name: Compute revision
        id: revision
        run: |
          echo "sequence=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/aerie-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/Aerie.Api/Dockerfile.api
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AERIE_REVISION=${{ github.sha }}
            AERIE_SEQUENCE=${{ steps.revision.outputs.sequence }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ${{ env.IMAGE_NAMESPACE }}/aerie-api

  # The runner in a container, published beside the two images the local stack
  # already names. Unconditional on every push, not path-filtered through
  # detect-image-changes like aerie-db: this image carries src/Aerie.Hatch,
  # which changes on nearly every story in this epic, and a filter watching
  # containers/hatch-runner alone would ship a stale runner every time.
  build-and-push-hatch-runner-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      # No sparse-checkout, unlike the db job below: the build context is the
      # repository root, because the image builds src/Aerie.Hatch from source.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Two architectures, because a friend's laptop is as likely to be an
      # Apple Silicon Mac as an Intel one, and an emulated runner would spend
      # every increment paying for it. The Dockerfile pins its SDK stage to
      # BUILDPLATFORM and cross-publishes, so only the small runtime stage -
      # apt-get and the claude installer - is ever emulated here.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/hatch-runner
          # Two tags, not the api image's three. Its timestamped one exists for
          # the cluster's image automation to order builds by, and nothing
          # deploys this image that way - it is pulled by name from a compose
          # file on somebody's laptop.
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      # Before the build rather than after it, unlike the api job above. That
      # one builds with `load: true` and pushes as a separate step; a
      # multi-platform build cannot be loaded into the local daemon at all, so
      # build and push are one step here and the CI gate has to come first.
      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./containers/hatch-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AERIE_REVISION=${{ github.sha }}

  detect-db-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      db-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        # fetch-depth: 0 - the diff is taken against whatever commit produced
        # the currently published image, which can be arbitrarily far back.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/aerie-db
            .github/actions/detect-image-changes

      - name: Check for changes under containers/aerie-db
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/aerie-db
          path: containers/aerie-db
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-db-image:
    needs: detect-db-changes
    if: needs.detect-db-changes.outputs.db-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            containers/aerie-db
            .github/actions/wait-for-ci

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/aerie-db
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/aerie-db
          file: ./containers/aerie-db/Dockerfile.db
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ${{ env.IMAGE_NAMESPACE }}/aerie-db
