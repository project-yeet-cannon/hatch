name: Build and publish containers

# Triggered directly off the push, alongside the "Build and test" CI workflow.
# No image is pushed unless CI reports success for the same commit, which the
# single `wait-for-ci` job below establishes once for all of them.
#
# It used to be established six times: every build job ran the wait-for-ci
# action itself, building its image optimistically first so the build
# overlapped CI. That was free on GitHub's effectively unlimited runners. On
# three self-hosted ones it is not - a job sitting in that poll is a job
# holding a runner, and with several of them at once they can hold every
# runner in the pool while polling for a CI run that has nowhere left to
# start. They would all sit there until the 30-minute timeout.
#
# So the wait is hoisted into one job that the build jobs depend on. Exactly
# one runner is ever parked on the poll, the rest of the pool stays free for
# the CI it is waiting on, and the guarantee is unchanged. What is lost is the
# build/CI overlap, which on a three-runner pool was contention rather than
# speed.
#
# Note this cannot be done with `concurrency:`. A shared group would cap the
# builds, but GitHub keeps at most one running and one *pending* job per
# group and cancels the older pending one - so of six queued build jobs, four
# would be silently cancelled rather than queued.
#
# Note for any job below that uses sparse-checkout: a local `uses: ./path`
# action is resolved from the workspace on disk, not fetched, so every such
# job must also list the action's directory in its sparse-checkout or it fails
# with "Can't find 'action.yml' ... under .github/actions/<name>".
#
# Runners: the self-hosted `builder` pool, not ubuntu-latest - this repository
# is private, so GitHub-hosted minutes are billed. Three things follow from
# those runners being Windows, and all three are load-bearing:
#
#   - `defaults.run.shell` below. A Windows runner defaults to PowerShell and
#     every `run:` here (and in both composite actions) is bash.
#   - Nothing is preinstalled. docker, jq and gh all came free with GitHub's
#     Ubuntu image; each job now installs what it uses through
#     scripts/runner/Install-RunnerDependencies.ps1. Docker is the exception
#     it will not install - see Get-AerieDockerPath - so that step only
#     verifies the daemon is up and in Linux-container mode.
#   - Any job using sparse-checkout must include `scripts`, or the installer
#     it is about to run isn't on disk. Same class of mistake as the local
#     `uses: ./path` note below.
on:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io

jobs:
  # The CI gate for every build job below. One job, so that exactly one runner
  # is parked on the poll no matter how many images turn out to need building
  # - see the header. Deliberately holds no Docker dependency and builds
  # nothing; all it does is answer "did CI pass for this commit".
  wait-for-ci:
    runs-on: [self-hosted, builder]
    # Comfortably longer than the action's own 120 x 15s ceiling, so a timeout
    # here is reported by the action (which says what it was waiting for)
    # rather than by the runner killing the job.
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/wait-for-ci
            scripts

      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency GitHubCli, Jq

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-api-image:
    needs: wait-for-ci
    runs-on: [self-hosted, builder]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Just Docker: the CI gate this job used to run itself now lives in the
      # wait-for-ci job, so gh and jq are that job's problem, not this one's.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/Aerie.Api/Dockerfile.api
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-api

  detect-db-changes:
    runs-on: [self-hosted, builder]
    permissions:
      contents: read
      packages: read
    outputs:
      db-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        # fetch-depth: 0 - the diff is taken against whatever commit produced
        # the currently published image, which can be arbitrarily far back.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/aerie-db
            .github/actions/detect-image-changes
            scripts

      # The composite action below shells out to docker and jq, both of which came
      # free with GitHub's Ubuntu image. `shell: powershell` overrides the
      # workflow-level bash default - this is the step that installs the toolchain,
      # so it is the one step that cannot assume one.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker, Jq

      - name: Check for changes under containers/aerie-db
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-db
          path: containers/aerie-db
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-db-image:
    needs: [detect-db-changes, wait-for-ci]
    if: needs.detect-db-changes.outputs.db-changed == 'true'
    runs-on: [self-hosted, builder]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            containers/aerie-db
            scripts

      # Just Docker: the CI gate this job used to run itself now lives in the
      # wait-for-ci job, so gh and jq are that job's problem, not this one's.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-db
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/aerie-db
          file: ./containers/aerie-db/Dockerfile.db
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-db

  detect-backup-changes:
    runs-on: [self-hosted, builder]
    permissions:
      contents: read
      packages: read
    outputs:
      backup-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/backup
            .github/actions/detect-image-changes
            scripts

      # The composite action below shells out to docker and jq, both of which came
      # free with GitHub's Ubuntu image. `shell: powershell` overrides the
      # workflow-level bash default - this is the step that installs the toolchain,
      # so it is the one step that cannot assume one.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker, Jq

      - name: Check for changes under containers/backup
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-backup
          path: containers/backup
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-backup-image:
    needs: [detect-backup-changes, wait-for-ci]
    if: needs.detect-backup-changes.outputs.backup-changed == 'true'
    runs-on: [self-hosted, builder]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            containers/backup
            scripts

      # Just Docker: the CI gate this job used to run itself now lives in the
      # wait-for-ci job, so gh and jq are that job's problem, not this one's.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-backup
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/backup
          file: ./containers/backup/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-backup

  detect-kuma-provision-changes:
    runs-on: [self-hosted, builder]
    permissions:
      contents: read
      packages: read
    outputs:
      kuma-provision-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/kuma-provision
            .github/actions/detect-image-changes
            scripts

      # The composite action below shells out to docker and jq, both of which came
      # free with GitHub's Ubuntu image. `shell: powershell` overrides the
      # workflow-level bash default - this is the step that installs the toolchain,
      # so it is the one step that cannot assume one.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker, Jq

      - name: Check for changes under containers/kuma-provision
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-kuma-provision
          path: containers/kuma-provision
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-kuma-provision-image:
    needs: [detect-kuma-provision-changes, wait-for-ci]
    if: needs.detect-kuma-provision-changes.outputs.kuma-provision-changed == 'true'
    runs-on: [self-hosted, builder]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            containers/kuma-provision
            scripts

      # Just Docker: the CI gate this job used to run itself now lives in the
      # wait-for-ci job, so gh and jq are that job's problem, not this one's.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-kuma-provision
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/kuma-provision
          file: ./containers/kuma-provision/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-kuma-provision

  detect-caddy-changes:
    runs-on: [self-hosted, builder]
    permissions:
      contents: read
      packages: read
    outputs:
      caddy-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            containers/caddy
            .github/actions/detect-image-changes
            scripts

      # The composite action below shells out to docker and jq, both of which came
      # free with GitHub's Ubuntu image. `shell: powershell` overrides the
      # workflow-level bash default - this is the step that installs the toolchain,
      # so it is the one step that cannot assume one.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker, Jq

      - name: Check for changes under containers/caddy
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-caddy
          path: containers/caddy
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-caddy-image:
    needs: [detect-caddy-changes, wait-for-ci]
    if: needs.detect-caddy-changes.outputs.caddy-changed == 'true'
    runs-on: [self-hosted, builder]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            containers/caddy
            scripts

      # Just Docker: the CI gate this job used to run itself now lives in the
      # wait-for-ci job, so gh and jq are that job's problem, not this one's.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-caddy
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/caddy
          file: ./containers/caddy/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-caddy

  detect-kiosk-changes:
    runs-on: [self-hosted, builder]
    permissions:
      contents: read
      packages: read
    outputs:
      kiosk-changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            apps/kiosk
            .github/actions/detect-image-changes
            scripts

      # The composite action below shells out to docker and jq, both of which came
      # free with GitHub's Ubuntu image. `shell: powershell` overrides the
      # workflow-level bash default - this is the step that installs the toolchain,
      # so it is the one step that cannot assume one.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker, Jq

      - name: Check for changes under apps/kiosk
        id: filter
        uses: ./.github/actions/detect-image-changes
        with:
          image: ghcr.io/eouw0o83hf/aerie-kiosk-files
          path: apps/kiosk
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-kiosk-image:
    needs: [detect-kiosk-changes, wait-for-ci]
    if: needs.detect-kiosk-changes.outputs.kiosk-changed == 'true'
    runs-on: [self-hosted, builder]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # After setup-java, because sdkmanager is a Java program and this step is what
      # fetches the Android SDK. AndroidSdk is asked for by name - it is ~700MB and
      # deliberately outside the default dependency set - and installs under
      # ProgramData, so it is downloaded once per runner rather than once per job.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency Docker, AndroidSdk

      - name: Write release signing config
        working-directory: apps/kiosk
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KIOSK_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KIOSK_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ vars.KIOSK_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KIOSK_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # $RUNNER_TEMP is a Windows path on these runners (D:\a\_temp), and
          # two *different* rewrites of it are needed - neither of which is the
          # raw value:
          #
          #   - bash wants a POSIX path for its own redirects and rm.
          #   - local.properties is a Java .properties file, where a backslash
          #     is an escape character. Writing D:\a\_temp\aerie-kiosk-release.jks
          #     there does not fail; Gradle reads back D:a_tempaerie-kiosk-release.jks
          #     and the signing config silently points at nothing. The forward-slash
          #     form is what a Java properties value has to carry, and the JVM
          #     accepts it on Windows.
          #
          # Both are exported so the later steps use the same two paths rather
          # than recomputing (and getting it subtly wrong in one place).
          KEYSTORE_UNIX="$(cygpath -u "$RUNNER_TEMP")/aerie-kiosk-release.jks"
          KEYSTORE_JAVA="$(cygpath -m "$RUNNER_TEMP")/aerie-kiosk-release.jks"
          echo "KEYSTORE_UNIX=$KEYSTORE_UNIX" >> "$GITHUB_ENV"
          echo "KEYSTORE_JAVA=$KEYSTORE_JAVA" >> "$GITHUB_ENV"

          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_UNIX"
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=$KEYSTORE_JAVA
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

      - name: Compute app version
        id: version
        run: |
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: apps/kiosk
        run: |
          ./gradlew assembleRelease \
            -PkioskVersionCode="${{ steps.version.outputs.code }}" \
            -PkioskVersionName="${{ steps.version.outputs.name }}"

      - name: Compute signing-cert checksum
        env:
          RELEASE_KEY_ALIAS: ${{ vars.KIOSK_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KIOSK_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # $KEYSTORE_JAVA, not $KEYSTORE_UNIX: keytool is a JVM program, so it
          # needs the Windows-shaped path, not the /d/a/_temp one bash uses.
          keytool -export -alias "$RELEASE_KEY_ALIAS" -keystore "$KEYSTORE_JAVA" \
              -storepass "$RELEASE_STORE_PASSWORD" -rfc \
            | openssl x509 -outform DER \
            | openssl dgst -sha256 -binary | openssl base64 | tr '+/' '-_' | tr -d '=' \
            > apps/kiosk/signature-checksum.txt

      - name: Write version.json
        # Polled by UpdateManager (apps/kiosk/app/src/.../UpdateManager.kt) so
        # already-provisioned tablets can discover and silently self-update to
        # this build without ever touching the QR provisioning flow again.
        run: |
          cat > apps/kiosk/version.json <<EOF
          {"versionCode": ${{ steps.version.outputs.code }}, "versionName": "${{ steps.version.outputs.name }}"}
          EOF

      - name: Remove keystore (no longer needed once the APK is signed)
        if: always()
        # $KEYSTORE_UNIX may be unset if the job failed before the step that
        # exports it, and `set -u` plus `if: always()` would turn that into a
        # confusing red on an already-failing run - hence the :- default.
        # Unlike a GitHub-hosted runner, this machine is reused, so a keystore
        # left behind here stays on disk indefinitely.
        run: rm -f "${KEYSTORE_UNIX:-$RUNNER_TEMP/aerie-kiosk-release.jks}"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eouw0o83hf/aerie-kiosk-files
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/kiosk
          file: ./apps/kiosk/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-kiosk-files
