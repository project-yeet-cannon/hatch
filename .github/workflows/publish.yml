name: Build and publish containers

# Runs when "Build and test" finishes on main, and every job below is gated
# on that run having succeeded - so nothing is ever pushed from a red build.
# workflow_run rather than a polling step in this workflow: GitHub invokes us
# exactly once, already knowing the conclusion, so there is no wait loop to
# maintain here.
on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Derived from the repository rather than a literal operator/org name
  # (docs/ethos.md) - GITHUB_TOKEN's registry permission is scoped to packages
  # under this same owner, so a literal here would be wrong the moment this
  # repository is forked or renamed, exactly as it was when Hatch moved out of
  # Hatch's repository and every push here still named the old one.
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push-api-image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      # ref pins this checkout to the commit "Build and test" actually ran
      # against, not whatever HEAD happens to be when this job starts.
      #
      # fetch-depth: 0 is load-bearing, not hygiene: "Compute revision" derives
      # the sequence from `git rev-list --count HEAD`, and on the default
      # shallow clone that counts exactly one commit. Every build would then
      # ship sequence 1, every "is this client behind the API" comparison would
      # answer "no" forever, and nothing would look broken.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # The git identity stamped into the image: the sha into the assembly and
      # into every SPA's index.html, the commit count as the ordering a sha
      # cannot provide on its own. See docs/plans/version.md.
      - name: Compute revision
        id: revision
        run: |
          echo "sequence=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/hatch-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/Hatch.Api/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HATCH_REVISION=${{ github.event.workflow_run.head_sha }}
            HATCH_SEQUENCE=${{ steps.revision.outputs.sequence }}

  # The runner in a container, published beside the two images the local stack
  # already names.
  build-and-push-hatch-runner-image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Two architectures, because a friend's laptop is as likely to be an
      # Apple Silicon Mac as an Intel one, and an emulated runner would spend
      # every increment paying for it. The Dockerfile pins its SDK stage to
      # BUILDPLATFORM and cross-publishes, so only the small runtime stage -
      # apt-get and the claude installer - is ever emulated here.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/hatch-runner
          # Two tags, not the api image's three. Its timestamped one exists for
          # the cluster's image automation to order builds by, and nothing
          # deploys this image that way - it is pulled by name from a compose
          # file on somebody's laptop.
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./containers/hatch-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HATCH_REVISION=${{ github.event.workflow_run.head_sha }}

  build-and-push-db-image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            containers/hatch-db

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/hatch-db
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/hatch-db
          file: ./containers/hatch-db/Dockerfile.db
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
