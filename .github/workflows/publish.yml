name: Build and publish containers

# Triggered directly off the push, in parallel with the "Build and test" CI
# workflow, rather than waiting for CI to finish first. Each job builds its
# image optimistically and only pushes it once CI reports success for the
# same commit (see .github/actions/wait-for-ci). This assumes main usually
# builds cleanly; if CI fails, the already-built image is simply discarded.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./src/Aerie.Api/Dockerfile.api
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-api

  detect-db-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      db-changed: ${{ steps.filter.outputs.db }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            containers/aerie-db

      - name: Check for changes under containers/aerie-db
        id: filter
        run: |
          if git diff --quiet HEAD~1 HEAD -- containers/aerie-db; then
            echo "db=false" >> "$GITHUB_OUTPUT"
          else
            echo "db=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-db-image:
    needs: detect-db-changes
    if: needs.detect-db-changes.outputs.db-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            containers/aerie-db

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-db
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./containers/aerie-db
          file: ./containers/aerie-db/Dockerfile.db
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-db

  detect-caddy-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      caddy-changed: ${{ steps.filter.outputs.caddy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            containers/caddy

      - name: Check for changes under containers/caddy
        id: filter
        run: |
          if git diff --quiet HEAD~1 HEAD -- containers/caddy; then
            echo "caddy=false" >> "$GITHUB_OUTPUT"
          else
            echo "caddy=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-caddy-image:
    needs: detect-caddy-changes
    if: needs.detect-caddy-changes.outputs.caddy-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            containers/caddy

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/eouw0o83hf/aerie-caddy
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./containers/caddy
          file: ./containers/caddy/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for CI to succeed
        uses: ./.github/actions/wait-for-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/eouw0o83hf/aerie-caddy
