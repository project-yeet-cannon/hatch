# The cluster plan Phase 3b's last step: the phase gate, as something that exits 0.
#
# Steps 3b.1-3b.12 each carry an *Exit* line - a command whose output proves
# that step landed. This dispatches the one script that asserts all of them and
# reports which failed. "Phase 3 is done" stops being something remembered and
# becomes a run with a green tick next to it.
#
# **Not named "Provision 6", on purpose.** Every Provision workflow changes the
# cluster; this one is strictly read-only, and numbering it into that sequence
# would put a verification step in a list whose whole convention is "these
# build the thing". Re-run it whenever - after a node rebuild, after a restore,
# before starting Phase 4 - with no more consequence than a report.
#
# Same thin-wrapper rule as Provision 0-5: this file checks out the repo and
# hands every decision to scripts/k3s/Test-ClusterPlatform.ps1, which also runs
# by hand from any Windows box with the OpenSSH client. Logic added here instead
# of the script would exist on only one of the two paths and let them drift.
#
# It takes no repository variables, deliberately. Everything it compares against
# comes from the cluster's own aerie-cluster-config ConfigMap and from the
# committed maps (scripts/k3s/cluster-config.json,
# scripts/secrets/parameters.json), so there is nothing to remember to pass and
# nothing that can be passed wrongly. The exception is `data_disk_gb`, which is
# a *description* of what Phase 1 attached - the same input Provision 5 takes,
# and it has to match what was given there.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner (which has no route to the node's LAN address anyway) and never consume
# Actions minutes. The runner's vantage point is part of the check: three of the
# criteria - the VIP answers, Traefik answers, the certificate is the production
# wildcard - are evaluated from the runner over the LAN rather than from a node,
# because a node can answer yes about its own loopback while every client on the
# LAN sees nothing.
name: 'Verify: Cluster platform'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it needs SSH to the nodes and a LAN route to the VIP)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      ip_address:
        description: "A k3s server's LAN address. Any server - everything read here is cluster state"
        required: true
        type: string
      data_disk_gb:
        description: 'Size the Longhorn data disk was created at in Phase 1. Used to recognise the mount as the data disk rather than the root filesystem'
        required: false
        default: '200'
        type: string

# Read-only, so two concurrent runs cannot corrupt anything - but they would
# interleave their output in the same summary and prove nothing twice, so a
# second dispatch waits rather than doubling up.
concurrency:
  group: verify-cluster-platform
  cancel-in-progress: false

jobs:
  verify:
    name: Phase 3 gate
    runs-on: [self-hosted, '${{ inputs.host }}']

    # One SSH round trip for the cluster, one per node, and three LAN probes.
    # Nothing here waits on a reconciliation, so 10m failing means something is
    # hanging rather than being slow.
    timeout-minutes: 10

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before anything else PowerShell-shaped. `shell: powershell` is
      # implemented as a dot-source of a temp .ps1, which an execution policy of
      # Restricted - the Windows *client* default - refuses outright, so the
      # `Set-ExecutionPolicy -Scope Process` inside every step below is in the
      # file that will not load. See the action, and scripts/runner/README.md.
      - name: Ensure PowerShell can run repository scripts
        uses: ./.github/actions/ensure-powershell

      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Assert every Phase 3b exit criterion
        shell: powershell
        env:
          # Same quoting hazard as the Provision workflows: every input arrives
          # as an env var rather than being interpolated into the script body,
          # since `${{ }}` substitution happens before PowerShell parses
          # anything.
          IP_ADDRESS: ${{ inputs.ip_address }}
          DATA_DISK_GB: ${{ inputs.data_disk_gb }}

          # Same keypair provision-0/1/2/3/4/5 used. The script SSHes to every
          # node the cluster reports, not just the one named above, because
          # 3b.2's mount is per-node work and is not shared through etcd.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
          }

          & .\scripts\k3s\Test-ClusterPlatform.ps1 `
            -IPAddress $env:IP_ADDRESS `
            -DataDiskSizeGB ([int]$env:DATA_DISK_GB) `
            -SshPrivateKey $env:NODE_SSH_PRIVATE_KEY

          # Propagated explicitly. This is the one script in the repo whose
          # *result* is an exit code rather than an exception - a gate reports
          # twelve findings and then fails, where the Provision scripts throw
          # on the first one - and `exit` inside a script invoked with & sets
          # $LASTEXITCODE without ending the caller. The Actions shell wrapper
          # happens to forward it too; a phase gate that fails silently if that
          # implementation detail ever changes is not a gate.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
