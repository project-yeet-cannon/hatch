# Step 5 of the provisioning pipeline, and the second step of the cluster plan
# Phase 3b: prepare one node for Longhorn. Installs the host packages Longhorn
# needs and, unless the node has no data disk, finds that disk by shape rather
# than by name, formats it ext4, and mounts it at /var/lib/longhorn from
# /etc/fstab by UUID.
#
# **Run it against every node, including ones with no data disk.** The two
# halves of this step belong to opposite sides of a Longhorn volume, and only
# one of them is about a disk. The packages are the *initiator*: they are how a
# volume attaches to whatever node its pod runs on, so every node that may ever
# schedule a stateful pod needs them, replicas or not. `data_disk_gb: 0` is how
# a diskless worker asks for that half alone - see docs/plans/part-time-node.md
# finding 7, which is what a node built without this run looks like: a
# longhorn-manager crashlooping on a missing iscsiadm, no nodes.longhorn.io
# object, and an error message about iSCSI rather than about the disk it is
# really about.
#
# **Once per node**, unlike Provision 2, 3 and 4. This is the last step in the
# pipeline that is: everything it does lives on a single node's own filesystem
# and systemd, so running it against node 1 does nothing for node 2. Anything
# that writes to etcd is shared the moment one server accepts it; a mounted
# disk is not. Dispatch it once for each node before step 3b.11.
#
# **Before Longhorn, unavoidably.** Longhorn's default data path is
# /var/lib/longhorn on the root filesystem, so a cluster that gets Longhorn
# first quietly fills every node's OS disk with replica data while the 200GB
# disk attached for exactly this purpose sits idle. The first symptom is a node
# under disk pressure, not a storage error.
#
# Same thin-wrapper rule as Provision 0-4: this file checks out the repo and
# hands every decision to scripts/k3s/Initialize-NodeStorage.ps1, which also
# runs by hand from any Windows box with the OpenSSH client. That manual path
# is a fallback only. Logic added here instead of the script would exist on
# only one of the two paths and let them drift.
#
# Nothing here is a repository variable. Which disk to use is not an operator
# value - it is discovered from the node, because the alternative is naming a
# device, and /dev/sdb is not stable across reboots under Hyper-V. `data_disk_gb`
# is the one exception and it is a *description* of what Phase 1 attached, used
# to recognise the disk, not to pick it.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner (which has no route to the node's LAN address anyway) and never
# consume Actions minutes.
#
# Previous step: provision-4-cluster-config.yml.
# Next step: the deploy/ tree itself - from here the cluster changes by commit.
name: 'Provision 5: Node storage'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it only needs SSH to the node)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
          - hyperv-host-3
      vm_name:
        description: 'The node VM name, as given to provision-0-new-node.yml (e.g. aerie-node-1). Checked against the node''s own hostname before any disk is touched'
        required: true
        type: string
      ip_address:
        description: 'The node''s LAN address. Once per node - this one, not the cluster'
        required: true
        type: string
      data_disk_gb:
        description: 'Size the data disk was created at in Phase 1 (-DataDiskSizeGB). Used to recognise the disk, not to pick it by name. 0 means the node has no data disk: host packages only, nothing formatted or mounted'
        required: false
        default: '200'
        type: string
      force:
        description: 'DESTRUCTIVE: allow a candidate disk that already holds a partition table or a filesystem to be wiped. Never widens the two hard rules - a disk with anything mounted from it, or the one holding the root filesystem, is refused either way'
        required: false
        default: false
        type: boolean
      preflight_only:
        description: 'Inspect the node, print which disk would be used and what would change, then stop without touching anything'
        required: false
        default: false
        type: boolean

# Keyed on the node, not the runner host: three nodes can be prepared
# concurrently from the same runner with no conflict, but two runs against the
# same node would race the same disk, fstab and apt lock.
concurrency:
  group: provision-5-node-storage-${{ inputs.vm_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Storage on ${{ inputs.vm_name }}
    runs-on: [self-hosted, '${{ inputs.host }}']

    # apt-get update plus three packages is the slow part; mkfs.ext4 on a
    # 200GB disk is seconds, since ext4 does not write the whole device.
    # Failing at 20m means something hung. A `data_disk_gb: 0` run is the slow
    # part alone and finishes in a couple of minutes.
    timeout-minutes: 20

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before anything else PowerShell-shaped. `shell: powershell` is
      # implemented as a dot-source of a temp .ps1, which an execution policy of
      # Restricted - the Windows *client* default - refuses outright, so the
      # `Set-ExecutionPolicy -Scope Process` inside every step below sits in the
      # file that will not load. See the action, and scripts/runner/README.md.
      - name: Ensure PowerShell can run repository scripts
        uses: ./.github/actions/ensure-powershell

      # Everything happens on the node over SSH, so the runner needs an SSH
      # client and nothing else. Installed rather than assumed; see
      # scripts/runner/README.md.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Prepare Longhorn storage
        shell: powershell
        env:
          # Same quoting hazard as provision-0-new-node.yml: every input
          # arrives as an env var rather than being interpolated into the
          # script body, since `${{ }}` substitution happens before PowerShell
          # parses anything.
          VM_NAME: ${{ inputs.vm_name }}
          IP_ADDRESS: ${{ inputs.ip_address }}
          DATA_DISK_GB: ${{ inputs.data_disk_gb }}
          # Refused alongside `data_disk_gb: 0` rather than ignored - a
          # DESTRUCTIVE flag that is silently accepted teaches the reader it
          # did something.
          FORCE: ${{ inputs.force }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}

          # Same keypair provision-0/1/2/3/4 used.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
          }

          $params = @{
            VMName         = $env:VM_NAME
            IPAddress      = $env:IP_ADDRESS
            DataDiskSizeGB = [int]$env:DATA_DISK_GB
            SshPrivateKey  = $env:NODE_SSH_PRIVATE_KEY
          }

          if ([bool]::Parse($env:FORCE)) { $params.Force = $true }
          if ([bool]::Parse($env:PREFLIGHT_ONLY)) { $params.PreflightOnly = $true }

          & .\scripts\k3s\Initialize-NodeStorage.ps1 @params
