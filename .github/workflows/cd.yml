name: Deploy

on:
  workflow_run:
    workflows: ["Build and publish containers"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    # Runs on the self-hosted runner registered on the home server that hosts
    # the stack. `legacy-deployer` pins this to that one box for as long as the
    # stack lives there: bare `self-hosted` would match any runner in the repo,
    # so registering the first hyperv-host-* runner (see provision-node.yml)
    # would make production deploys start landing on a fresh, empty node with
    # no compose state and no Docker daemon on tcp://localhost:2375. Retarget
    # this when the stack itself moves off the old host, not before.
    runs-on: [self-hosted, legacy-deployer]

    # Job-level, not step-level: every `docker compose` invocation here
    # interpolates these into the compose files, and a step that omits them
    # doesn't fail — it silently resolves them to empty strings (visible only
    # as "variable is not set" warnings). Declaring them once for the job means
    # a new compose step can't accidentally run against blank config.
    env:
      DOCKER_HOST: tcp://localhost:2375
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      DOMAIN: ${{ vars.DOMAIN }}
      HA_HOST: ${{ vars.HA_HOST }}
      HA_PORT: ${{ vars.HA_PORT }}
      HA_TOKEN: ${{ secrets.HA_TOKEN }}
      # Shared secret VmConsoleLogsController checks against X-Vm-Log-Token -
      # see scripts/hyperv/lib/Send-VmConsoleLog.ps1, provisioned onto each
      # Hyper-V host by provision-node.yml.
      VM_LOG_SHIPPER_TOKEN: ${{ secrets.VM_LOG_SHIPPER_TOKEN }}
      # //server/share of the music library. compose.media.yml mounts it twice:
      # read-only into the api container (the `media` volume) so it can be
      # served to Sonos speakers, and read-write into the media-gui container
      # (`media_rw`) that serves the browse/upload UI at media.${DOMAIN}. A
      # variable, not a secret: it's a LAN path to a share that already allows
      # public read and guest write. See docs/media-library.md.
      MEDIA_LIBRARY_SHARE: ${{ vars.MEDIA_LIBRARY_SHARE }}
      # Reusable, tagged (not ephemeral) auth key — an ephemeral key would
      # de-register this node the moment the key's session ends, which is
      # wrong for a permanent subnet router. TAILSCALE_ADVERTISE_ROUTES is
      # the LAN CIDR pfSense hands out (e.g. 192.168.1.0/24), not a secret.
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_ADVERTISE_ROUTES: ${{ vars.TAILSCALE_ADVERTISE_ROUTES }}
      # Dedicated to the `backup` service's aerie-restic IAM user — kept
      # separate from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY above (which
      # are Route53 credentials for caddy) so a leak of one doesn't expose
      # the other. See compose.backup.yml, which maps these into the
      # container's own AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      RESTIC_AWS_ACCESS_KEY_ID: ${{ secrets.RESTIC_AWS_ACCESS_KEY_ID }}
      RESTIC_AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTIC_AWS_SECRET_ACCESS_KEY }}
      RESTIC_S3_REPOSITORY: ${{ vars.RESTIC_S3_REPOSITORY }}
      RESTIC_AWS_REGION: ${{ vars.RESTIC_AWS_REGION }}
      TZ: ${{ vars.TZ }}

    steps:
      - name: Checkout compose files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            compose.prod.yml
            compose.media.yml
            compose.observability.yml
            compose.metrics.yml
            compose.backup.yml
            containers/kuma-provision
            containers/autokuma
            containers/fluent-bit
            containers/opensearch-provision
            containers/prometheus
            containers/grafana
          sparse-checkout-cone-mode: false

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Host-level metrics run natively on Windows (not in Docker Desktop —
      # see docs/metrics-architecture.md's "Windows Server detour" note: a container's
      # /proc, /sys, and root filesystem under the WSL2 backend are the VM's,
      # not the real host's). Install-if-missing, then converge the service
      # state on every deploy — same idempotency bar as kuma-provision. The
      # Grafana dashboard's hostname template variables key off
      # windows_os_hostname, which the `os` collector already emits as part
      # of the built-in default set — no extra collectors needed.
      - name: Ensure windows_exporter is installed and running
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.31.8"
          if (-not (Get-Service -Name windows_exporter -ErrorAction SilentlyContinue)) {
            $msiPath = Join-Path $env:TEMP "windows_exporter-$version-amd64.msi"
            $logPath = Join-Path $env:TEMP "windows_exporter-install.log"
            $msiUrl = "https://github.com/prometheus-community/windows_exporter/releases/download/v$version/windows_exporter-$version-amd64.msi"
            Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
            $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /qn /L*V `"$logPath`"" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              Get-Content $logPath -Tail 40 -ErrorAction SilentlyContinue | Write-Output
              throw "windows_exporter install failed with exit code $($proc.ExitCode)"
            }
            Remove-Item $msiPath -ErrorAction SilentlyContinue
            Remove-Item $logPath -ErrorAction SilentlyContinue
          }

          Set-Service -Name windows_exporter -StartupType Automatic
          if ((Get-Service -Name windows_exporter).Status -ne 'Running') {
            Start-Service -Name windows_exporter
          }

      # Native Windows install, not a container: Docker Desktop's WSL2 backend
      # gives every container the WSL VM's own network namespace, not the real
      # host's — a containerized Tailscale could join the tailnet but could
      # only ever advertise the VM's private subnet, never the actual LAN.
      # Same underlying constraint as the windows_exporter step above (see
      # docs/metrics-architecture.md's "Windows Server detour"). This makes
      # the host a Tailscale subnet router, so any tailnet device can reach
      # the LAN (and therefore every *.${DOMAIN} host Caddy routes to) once
      # the advertised route is approved in the admin console.
      - name: Ensure Tailscale is installed and running
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Get-Service -Name Tailscale -ErrorAction SilentlyContinue)) {
            $version = "1.98.10"
            $msiPath = Join-Path $env:TEMP "tailscale-setup-$version-amd64.msi"
            $logPath = Join-Path $env:TEMP "tailscale-install.log"
            $msiUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-$version-amd64.msi"
            Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
            # TS_UNATTENDEDMODE keeps tailscaled running with nobody logged
            # into the console — this host never has an interactive desktop
            # session. TS_NOLAUNCH skips starting the GUI client post-install,
            # which has nothing to attach to under the runner service account.
            $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" TS_UNATTENDEDMODE=always TS_NOLAUNCH=1 /qn /L*V `"$logPath`"" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              Get-Content $logPath -Tail 40 -ErrorAction SilentlyContinue | Write-Output
              throw "Tailscale install failed with exit code $($proc.ExitCode)"
            }
            Remove-Item $msiPath -ErrorAction SilentlyContinue
            Remove-Item $logPath -ErrorAction SilentlyContinue
          }

          Set-Service -Name Tailscale -StartupType Automatic
          if ((Get-Service -Name Tailscale).Status -ne 'Running') {
            Start-Service -Name Tailscale
          }

          # `tailscale up` flags aren't cumulative — every call must restate
          # the full desired flag set, or an omitted flag resets to default.
          # --unattended must be restated too: TS_UNATTENDEDMODE=always at
          # install time makes it a persistent non-default setting, and
          # `tailscale up` refuses to run if any non-default flag goes
          # unmentioned.
          # --authkey is included only on first auth: re-passing it on every
          # deploy is tempting for idempotency, but tailscaled unconditionally
          # attempts to register with a supplied key even when a valid
          # authenticated state already exists on disk
          # (tailscale/tailscale#19501) — so a since-expired reusable key
          # would break every deploy after its expiry, not just the one that
          # actually needed it.
          $status = & $tailscaleExe status --json | ConvertFrom-Json
          if ($status.BackendState -ne "Running") {
            & $tailscaleExe up --authkey=$env:TAILSCALE_AUTH_KEY --advertise-routes=$env:TAILSCALE_ADVERTISE_ROUTES --accept-routes=false --hostname=aerie-prod --unattended
          } else {
            & $tailscaleExe up --advertise-routes=$env:TAILSCALE_ADVERTISE_ROUTES --accept-routes=false --hostname=aerie-prod --unattended
          }
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed with exit code $LASTEXITCODE" }

      # The exit-code checks are load-bearing: this runs under PowerShell, where
      # a multi-line `run:` only surfaces the *last* command's exit code. Without
      # them a failed `pull` (e.g. "Error manifest unknown" for an image whose
      # publish job never pushed) is masked by a successful `up -d`, and the
      # deploy silently proceeds against whatever stale container is already
      # running - the failure only shows up later, in whichever step first tries
      # to use the new image.
      #
      # compose.media.yml (the CIFS mounts for the music library, plus the
      # media-gui browse/upload UI that serves it) is layered in only when
      # MEDIA_LIBRARY_SHARE is set. Those mounts are resolved by the
      # Docker daemon before any container starts, so an unresolvable share
      # (DNS failure, share offline, variable never configured) would otherwise
      # fail `up` for the whole stack, not just media serving - see
      # compose.media.yml and docs/media-library.md.
      - name: Pull and start the stack
        working-directory: .
        run: |
          $mediaArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:MEDIA_LIBRARY_SHARE)) {
            $mediaArgs = @("-f", "compose.media.yml")
          }
          docker compose -f compose.prod.yml -f compose.observability.yml -f compose.metrics.yml -f compose.backup.yml @mediaArgs pull
          if ($LASTEXITCODE -ne 0) { throw "docker compose pull failed with exit code $LASTEXITCODE" }
          docker compose -f compose.prod.yml -f compose.observability.yml -f compose.metrics.yml -f compose.backup.yml @mediaArgs up -d
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed with exit code $LASTEXITCODE" }

      # The init logic itself lives in the image, at scripts/init-repos.sh, and
      # is invoked here by path. Do NOT inline it back into this file: shell
      # source cannot survive the trip from a Windows runner into a Linux
      # container. Passed as an argument, Windows PowerShell's Win32
      # command-line quoting fragments it (`set: line 0: illegal option -`);
      # piped to `sh`'s stdin, PowerShell encodes the stream as UTF-8 *with a
      # BOM* and CRLF line endings, which `sh` reports as `﻿set: not found` and
      # `syntax error: unexpected word (expecting "do")`. A fixed argv of plain
      # ASCII tokens is the only form with no encoding or quoting surface.
      #
      # shell: powershell (not bash) — the runner service on this host runs as
      # Local System, and `shell: bash` resolves to WSL's bash.exe stub in
      # System32, which WSL refuses to run under Local System
      # (WSL_E_LOCAL_SYSTEM_NOT_SUPPORTED).
      #
      # `-T` disables pseudo-TTY allocation, which `exec` would otherwise fail
      # on in a non-interactive runner.
      - name: Ensure restic repositories are initialized
        working-directory: .
        shell: powershell
        run: |
          docker compose -f compose.prod.yml -f compose.observability.yml -f compose.metrics.yml -f compose.backup.yml exec -T backup /app/scripts/init-repos.sh
          if ($LASTEXITCODE -ne 0) { throw "restic init check failed with exit code $LASTEXITCODE" }

      # Compose only recreates a container when its own service definition
      # changes, not when a bind-mounted file's contents change — so a
      # prometheus.yml-only edit needs an explicit reload to take effect.
      # Port 9090 is loopback-only (see compose.metrics.yml), reachable
      # here since this runner lives on the same host as the Docker daemon.
      - name: Reload Prometheus config
        shell: powershell
        run: Invoke-WebRequest -Method Post -Uri http://localhost:9090/-/reload -UseBasicParsing | Out-Null
