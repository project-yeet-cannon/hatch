name: Deploy

on:
  workflow_run:
    workflows: ["Build and publish containers"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    # Runs on a self-hosted runner registered on the home server that hosts
    # the stack. Replace `self-hosted` with a more specific label (e.g.
    # [self-hosted, home-server]) if the runner has one configured.
    runs-on: self-hosted

    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
      - name: Checkout compose files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            compose.prod.yml
            compose.observability.yml
            containers/kuma-provision
            containers/autokuma
            containers/fluent-bit
          sparse-checkout-cone-mode: false

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Pull and start the stack
        working-directory: .
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          DOMAIN: ${{ vars.DOMAIN }}
          HA_HOST: ${{ vars.HA_HOST }}
          HA_PORT: ${{ vars.HA_PORT }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          docker compose -f compose.prod.yml -f compose.observability.yml pull
          docker compose -f compose.prod.yml -f compose.observability.yml up -d
