name: Deploy

on:
  workflow_run:
    workflows: ["Build and publish containers"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    # Runs on a self-hosted runner registered on the home server that hosts
    # the stack. Replace `self-hosted` with a more specific label (e.g.
    # [self-hosted, home-server]) if the runner has one configured.
    runs-on: self-hosted

    steps:
      - name: Checkout compose file
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            compose.prod.yml
          sparse-checkout-cone-mode: false

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Pull and start the stack
        working-directory: .
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d
