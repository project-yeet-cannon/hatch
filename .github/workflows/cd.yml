name: Deploy

on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    # Runs on a self-hosted runner registered on the home server that hosts
    # the stack. Replace `self-hosted` with a more specific label (e.g.
    # [self-hosted, home-server]) if the runner has one configured.
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build and start the stack
        working-directory: .
        run: docker compose -f compose.prod.yml up -d --build
