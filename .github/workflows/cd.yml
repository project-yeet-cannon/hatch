name: Deploy

on:
  workflow_run:
    workflows: ["Build and publish containers"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    # Runs on a self-hosted runner registered on the home server that hosts
    # the stack. Replace `self-hosted` with a more specific label (e.g.
    # [self-hosted, home-server]) if the runner has one configured.
    runs-on: self-hosted

    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
      - name: Checkout compose files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            compose.prod.yml
            compose.observability.yml
            compose.metrics.yml
            containers/kuma-provision
            containers/autokuma
            containers/fluent-bit
            containers/opensearch-provision
            containers/prometheus
            containers/grafana
          sparse-checkout-cone-mode: false

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Host-level metrics run natively on Windows (not in Docker Desktop —
      # see TODO.md Phase 3's "Blocked on 2026-07-28" note: a container's
      # /proc, /sys, and root filesystem under the WSL2 backend are the VM's,
      # not the real host's). Install-if-missing, then converge the service
      # state on every deploy — same idempotency bar as kuma-provision.
      - name: Ensure windows_exporter is installed and running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.31.8"
          if (-not (Get-Service -Name windows_exporter -ErrorAction SilentlyContinue)) {
            $msiPath = Join-Path $env:TEMP "windows_exporter-$version-amd64.msi"
            $msiUrl = "https://github.com/prometheus-community/windows_exporter/releases/download/v$version/windows_exporter-$version-amd64.msi"
            Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
            Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /qn" -Wait
            Remove-Item $msiPath -ErrorAction SilentlyContinue
          }
          Set-Service -Name windows_exporter -StartupType Automatic
          if ((Get-Service -Name windows_exporter).Status -ne 'Running') {
            Start-Service -Name windows_exporter
          }

      - name: Pull and start the stack
        working-directory: .
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          DOMAIN: ${{ vars.DOMAIN }}
          HA_HOST: ${{ vars.HA_HOST }}
          HA_PORT: ${{ vars.HA_PORT }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          docker compose -f compose.prod.yml -f compose.observability.yml -f compose.metrics.yml pull
          docker compose -f compose.prod.yml -f compose.observability.yml -f compose.metrics.yml up -d
