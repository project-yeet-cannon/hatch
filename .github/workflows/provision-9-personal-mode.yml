# Step 9 of the provisioning pipeline: install the personal-mode control on
# the part-time host (docs/plans/part-time-node.md Phase 4).
#
# One machine in this cluster belongs to someone. This installs the two
# Scheduled Tasks that let them take it back and give it back without being an
# administrator, the boot-time task that makes a Windows Update reboot
# harmless in both directions, the daily auto-exit, and the two desktop
# shortcuts that make all of it a click.
#
# Same thin-wrapper rule as every other workflow here: it checks out the repo
# on the target host and hands every decision to
# scripts/hyperv/Register-PersonalModeControl.ps1, which also runs by hand in
# an elevated session on the host. The dispatched run is what "installing the
# control" means - it is auditable, it has a job summary, and it does not
# depend on somebody remembering seven arguments.
#
# `host` is not "any runner": this writes to the local Hyper-V host's
# ProgramData and registers local Scheduled Tasks, so it must run on the
# machine that carries the part-time node.
#
# Re-runnable. It replaces every task, rewrites the config and re-copies the
# scripts - and deliberately never writes state.json, so a re-registration
# while somebody is mid-evening does not take their machine away from them.
#
# Billing: `runs-on` pins `self-hosted`, so runs never consume Actions minutes.
name: 'Provision 9: Personal mode control'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'The part-time Hyper-V host (not any runner - this writes local tasks)'
        required: true
        default: hyperv-host-3
        type: choice
        options:
          - hyperv-host-3
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      desktop_user:
        description: 'Who may enter/leave personal mode unelevated. DOMAIN\user, .\user, or a local account name.'
        required: true
        type: string
      vm_name:
        description: 'The node VM this control stops and starts'
        required: true
        default: aerie-node-3
        type: string
      node_name:
        description: 'Kubernetes node name. Blank = vm_name.'
        required: false
        default: ''
        type: string
      node_address:
        description: "The node's LAN address. Used to ask the guest to power itself off before Hyper-V is asked to do it for them."
        required: false
        default: ''
        type: string
      server_address:
        description: "A permanent k3s SERVER's LAN address. The part-time node is an agent and has no apiserver of its own."
        required: true
        type: string
      auto_exit_hour:
        description: 'Local hour for the daily auto-exit. Forgetting should cost one night, not one month.'
        required: true
        default: '5'
        type: string
      what_if_only:
        description: 'Print what would be installed and stop'
        required: false
        default: false
        type: boolean

# Two registrations at once on one host would race for the same files and the
# same task names. Queue instead of cancelling: a cancelled run could leave
# half the tasks replaced.
concurrency:
  group: provision-9-personal-mode-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  register:
    name: Personal mode on ${{ inputs.host }}
    runs-on: [self-hosted, '${{ inputs.host }}']

    # File copies, four task registrations and two shortcuts. 10m failing
    # means something is hanging rather than being slow.
    timeout-minutes: 10

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before anything else PowerShell-shaped. `shell: powershell` is
      # implemented as a dot-source of a temp .ps1, which an execution policy of
      # Restricted - the Windows *client* default - refuses outright, so the
      # `Set-ExecutionPolicy -Scope Process` inside every step below is in the
      # file that will not load. See the action, and scripts/runner/README.md.
      - name: Ensure PowerShell can run repository scripts
        uses: ./.github/actions/ensure-powershell

      # HyperV only: this workflow registers Scheduled Tasks and writes files,
      # and never opens an SSH session of its own. What it does need is the
      # Hyper-V module, because Register-PersonalModeControl.ps1 reads the VM
      # it is being registered against - and `#Requires -Modules Hyper-V` is
      # evaluated before that script's preflight, so without this the failure
      # is a bare "modules ... are missing" with no next step in it.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency HyperV

      - name: Install the personal-mode control
        shell: powershell
        env:
          DESKTOP_USER: ${{ inputs.desktop_user }}
          VM_NAME: ${{ inputs.vm_name }}
          NODE_NAME: ${{ inputs.node_name }}
          NODE_ADDRESS: ${{ inputs.node_address }}
          SERVER_ADDRESS: ${{ inputs.server_address }}
          AUTO_EXIT_HOUR: ${{ inputs.auto_exit_hour }}
          WHAT_IF_ONLY: ${{ inputs.what_if_only }}

          # The same keypair every provision-*/verify-* workflow uses. It is
          # written to C:\ProgramData\Aerie\personal-mode\node.key with an ACL
          # of SYSTEM and Administrators only - the desktop user never reads
          # it, they trigger a task and SYSTEM does the reading.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires, and the control needs it to reach a k3s server."
          }

          $params = @{
            DesktopUser   = $env:DESKTOP_USER
            VMName        = $env:VM_NAME
            ServerAddress = $env:SERVER_ADDRESS
            AutoExitHour  = [int]$env:AUTO_EXIT_HOUR
            SshPrivateKey = $env:NODE_SSH_PRIVATE_KEY
          }

          # Only when supplied: the script defaults NodeName to VMName, and
          # passing an empty string here would override that with ''.
          if ($env:NODE_NAME -and $env:NODE_NAME.Trim()) { $params.NodeName = $env:NODE_NAME.Trim() }
          if ($env:NODE_ADDRESS -and $env:NODE_ADDRESS.Trim()) { $params.NodeAddress = $env:NODE_ADDRESS.Trim() }

          if ([bool]::Parse($env:WHAT_IF_ONLY)) { $params.WhatIfOnly = $true }

          & .\scripts\hyperv\Register-PersonalModeControl.ps1 @params

      - name: Read the control back
        if: ${{ !inputs.what_if_only }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          # -Status is read-only and changes nothing, which is what makes it
          # safe to run at the end of an install. It is also the one command
          # worth knowing on this host, so the job log is where somebody finds
          # out that it exists.
          & 'C:\ProgramData\Aerie\personal-mode\bin\Set-PersonalMode.ps1' -Status
