# The cluster plan Phase 8b's last step: the phase gate, as something that
# exits 0 - the same shape verify-cluster-platform.yml established for 3b.13
# and verify-cutover.yml continued for 7c.11.
#
# Steps 8a.3 and 8b.1-8b.13 each carry an *Exit* line; this dispatches the one
# script that asserts the ones a live cluster can still prove. Not "Provision
# 7": read-only, the same reason none of the verify-* workflows is numbered
# into that sequence.
#
# One qualification on "read-only", and it is the script's own: two of this
# phase's exit criteria - that `cutover-final` is still in both restic
# repositories, and that the newest snapshot in each holds all three files -
# need `restic` run against those repositories, which no long-lived pod in
# this cluster can do. Test-Backup.ps1 creates one short-lived Job built from
# the live aerie-backup CronJob's own pod template, runs `snapshots`, `ls` and
# `dump` in it, and deletes it. Nothing it runs writes to a repository or
# takes an exclusive lock. Pass -SkipResticProbe to refuse even that, at the
# cost of a gate that reports two of the phase's most important facts as
# unproven.
#
# Same thin-wrapper rule as every other workflow here: this checks out the
# repo and hands every decision to scripts/k3s/Test-Backup.ps1, which also
# runs by hand from any box with an OpenSSH client - including a Mac, which is
# why AerieSsh.ps1 stopped hardcoding ssh.exe.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner (which has no route to the node's LAN address anyway) and never
# consume Actions minutes.
name: 'Verify: Backup'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it needs SSH to the nodes)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      ip_address:
        description: "A k3s server's LAN address. Any server - everything read here is cluster state"
        required: true
        type: string
      skip_restic_probe:
        description: 'Skip the one Job this gate creates, and fail its two checks instead'
        required: false
        default: false
        type: boolean

# The restic probe creates a Job with a fixed name, so two concurrent runs
# would delete each other's. A second dispatch waits rather than doubling up -
# and would prove nothing twice in any case.
concurrency:
  group: verify-backup
  cancel-in-progress: false

jobs:
  verify:
    name: Phase 8 gate
    runs-on: [self-hosted, '${{ inputs.host }}']

    # Longer than the read-only gates', and the restic probe is the whole
    # difference: it restores nothing, but `restic snapshots` and `restic
    # dump` against the S3 repository cross the internet, and the Job's own
    # wait is capped at 240s. 15m failing means something is hanging.
    timeout-minutes: 15

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before anything else PowerShell-shaped. `shell: powershell` is
      # implemented as a dot-source of a temp .ps1, which an execution policy of
      # Restricted - the Windows *client* default - refuses outright, so the
      # `Set-ExecutionPolicy -Scope Process` inside every step below is in the
      # file that will not load. See the action, and scripts/runner/README.md.
      - name: Ensure PowerShell can run repository scripts
        uses: ./.github/actions/ensure-powershell

      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Assert every provable Phase 8b exit criterion
        shell: powershell
        env:
          IP_ADDRESS: ${{ inputs.ip_address }}
          SKIP_RESTIC_PROBE: ${{ inputs.skip_restic_probe }}

          # Same keypair every provision-*/verify-* workflow uses.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
          }

          # A workflow_dispatch boolean arrives as the string 'true' or
          # 'false', never as a boolean - so this compares text rather than
          # relying on PowerShell's truthiness, under which the string
          # 'false' is $true.
          $arguments = @{
            IPAddress     = $env:IP_ADDRESS
            SshPrivateKey = $env:NODE_SSH_PRIVATE_KEY
          }
          if ($env:SKIP_RESTIC_PROBE -eq 'true') { $arguments.SkipResticProbe = $true }

          & .\scripts\k3s\Test-Backup.ps1 @arguments

          # Same reason verify-cluster-platform.yml propagates this
          # explicitly: `exit` inside a script invoked with & sets
          # $LASTEXITCODE without ending the caller.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
