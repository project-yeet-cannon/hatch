# Step 4 of the provisioning pipeline, and the first step of the cluster plan
# Phase 3b: plant this installation's operator values in the cluster as the
# `aerie-cluster-config` ConfigMap, which every Kustomization under deploy/
# then reads through postBuild.substituteFrom.
#
# Why this exists at all: Phases 0-2 passed ${DOMAIN} and friends as vars.* at
# deploy time, and Flux reconciles from git, where docs/ethos.md forbids them.
# Nothing bridged that gap. This is the bridge - the values arrive out of band,
# once, and the manifests stay identical for every installation.
#
# **Run this before the first commit under deploy/.** A Kustomization whose
# substitution source is missing fails to reconcile rather than degrading
# gracefully, so planting the ConfigMap after the manifests means watching the
# whole tree fail on a variable that was never going to be there yet.
#
# Same thin-wrapper rule as Provision 0-3: this file checks out the repo, maps
# repository variables onto the environment variable names
# scripts/k3s/cluster-config.json declares, and hands every decision to
# scripts/k3s/Set-ClusterConfig.ps1. Logic added here instead of the script
# would exist on only one of the two paths and let them drift.
#
# Note which side of `secrets.` / `vars.` these come from, and that it is all
# of them: nothing in this file is credential material. An operator value is
# not a secret, so it stays a variable, unmasked in the run log, and the job
# summary is a readable record of what the cluster was configured with.
# Anything actually sensitive goes through Provision 2 into the parameter
# store instead. Reading a variable through `secrets.` does not error - it
# resolves to an empty string - so the script's preflight names the tab each
# value is expected on when one comes back empty.
#
# Re-runnable, and re-running is the *supported way to change a value*: set
# the repository variable, dispatch again, and the next reconciliation picks
# it up. No commit - which is the entire reason these live in a ConfigMap
# rather than in the manifests, and is what Phase 7 relies on to raise
# LONGHORN_REPLICA_COUNT to 3.
#
# Cluster-scoped, not per node: this writes one object to etcd, which every
# server shares. Run it once, against any k3s server. (Provision 5, node
# storage prep, is the next one that genuinely runs once per node.)
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a
# GitHub-hosted runner (which has no route to the node's LAN address anyway)
# and never consume Actions minutes.
#
# Previous step: provision-3-bootstrap-flux.yml.
# Next step: provision-5-node-storage.yml, then the deploy/ tree itself.
name: 'Provision 4: Cluster configuration'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it only needs SSH to the node)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
      ip_address:
        description: 'A k3s server''s LAN address - where the ConfigMap is applied (node 1 today). Cluster-scoped: once is enough, whichever server it targets'
        required: true
        type: string
      preflight_only:
        description: 'Validate every value, check them against the node, and diff the live ConfigMap - then stop without applying anything'
        required: false
        default: false
        type: boolean

# Keyed on nothing but the workflow: two concurrent runs would race the same
# ConfigMap, whichever node each one targets.
concurrency:
  group: provision-4-cluster-config
  cancel-in-progress: false

jobs:
  configure:
    name: Configure the cluster from ${{ inputs.host }}
    runs-on: [self-hosted, '${{ inputs.host }}']

    # One apply and a handful of read-only checks over SSH. Failing at 10m
    # means the node stopped answering, not that the work is slow.
    timeout-minutes: 10

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Everything happens on the node over SSH, so the runner needs an SSH
      # client and nothing else - no AWS CLI here, unlike Provision 2.
      # Installed rather than assumed; see scripts/runner/README.md.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Apply cluster configuration
        shell: powershell
        env:
          IP_ADDRESS: ${{ inputs.ip_address }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}

          # The operator values, per the cluster plan Phase 3a.5 and Phase 4b.7.
          # Names on the left come from cluster-config.json's `env` field; names
          # on the right are the repository variables that hold them. The script
          # validates each one's shape before anything is applied - a typo'd
          # hosted zone id or an out-of-subnet VIP is otherwise diagnosed
          # several steps later, as an AWS or a networking failure.
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          INGRESS_VIP: ${{ vars.INGRESS_VIP }}
          NODE_INTERFACE: ${{ vars.NODE_INTERFACE }}
          ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
          LONGHORN_REPLICA_COUNT: ${{ vars.LONGHORN_REPLICA_COUNT }}
          # Phase 4b.7. Dispatch this workflow after setting both and before
          # the commit that adds ../../deploy/cluster/data/cluster.yaml and
          # objectstore.yaml reaches the cluster - an undefined token expands
          # to the empty string rather than failing, so the wrong order is
          # `instances:` with no value and `destinationPath: s3:///`, silently.
          POSTGRES_INSTANCES: ${{ vars.POSTGRES_INSTANCES }}
          WAL_BUCKET: ${{ vars.WAL_BUCKET }}

          # Phase 5b.4. Dispatch this workflow, and confirm it lands, before
          # the 5b.10 HelmRelease commit reaches the cluster - Flux expands an
          # undefined token to the empty string, so landing first is not a
          # failed reconciliation, it's a Deployment pulling /aerie-api:...
          # and an Ingress with host home..
          SITE_REPO_URL: ${{ vars.SITE_REPO_URL }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          SHARE_HOST: ${{ vars.SHARE_HOST }}
          SHARE_NAME: ${{ vars.SHARE_NAME }}
          MEDIA_LIBRARY_SUBPATH: ${{ vars.MEDIA_LIBRARY_SUBPATH }}
          TZ: ${{ vars.TZ }}
          # Required from Phase 6 on - 6b.13's kuma-provision CronJob reads
          # both on every reconcile, not just on a fresh install.
          HA_HOST: ${{ vars.HA_HOST }}
          HA_PORT: ${{ vars.HA_PORT }}

          # Phase 6b.2/6b.3. The three Windows hosts' LAN addresses (reserved
          # in 6a.2) and the Home Assistant webhook id (created in 6a.3) - set
          # both and dispatch this workflow before the 6b.6 ScrapeConfig and
          # 6b.8 Alertmanager commits reach the cluster, for the same reason
          # SITE_REPO_URL above has to land first.
          WINDOWS_EXPORTER_TARGETS: ${{ vars.WINDOWS_EXPORTER_TARGETS }}
          HA_ALERT_WEBHOOK_ID: ${{ vars.HA_ALERT_WEBHOOK_ID }}

          # Same keypair provision-0/1/2/3 used.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          # The values above are deliberately *not* checked here: the script
          # reads cluster-config.json, so it knows which are required, which
          # repository variable supplies each, and what a valid one looks
          # like. Duplicating that list in this file is how the two stop
          # agreeing. Only the two inputs the script cannot infer are checked.
          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
          }

          $params = @{
            IPAddress     = $env:IP_ADDRESS
            SshPrivateKey = $env:NODE_SSH_PRIVATE_KEY
          }

          if ([bool]::Parse($env:PREFLIGHT_ONLY)) { $params.PreflightOnly = $true }

          & .\scripts\k3s\Set-ClusterConfig.ps1 @params
