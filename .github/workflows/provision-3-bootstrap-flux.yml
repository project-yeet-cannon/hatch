# Step 3 of the provisioning pipeline: install Flux on the cluster and point
# it at this repository (the cluster plan Phase 2's last item). After this runs,
# changing the cluster means committing to deploy/ - there is no further
# kubectl apply in the design.
#
# The cluster plan originally wrote this step as "run once from an operator
# machine", which would have made it the only provisioning step with no
# repeatable, auditable path. It is scripted instead, same thin-wrapper shape
# as Provision 0-2: this file checks out the repo and hands every decision to
# scripts/flux/Bootstrap-Flux.ps1.
#
# The install itself runs *on the node*, over SSH, using k3s's own kubeconfig
# - so no cluster credential is ever copied onto a runner.
#
# Deliberately not `flux bootstrap github`: bootstrap's convenience is that it
# commits Flux's own manifests back here, and gotk-sync.yaml is one
# installation's owner/repo/branch - exactly what docs/ethos.md keeps out of
# the repo. The script does bootstrap's two halves explicitly instead (`flux
# install`, then a GitRepository + Kustomization), so this run writes nothing
# to git and the sync configuration lives in the cluster.
#
# That also removes the credential problem bootstrap created. No commit means
# no contents:write; no deploy key means no administration:write. A public
# repository needs no token at all, and a private one needs FLUX_GITHUB_TOKEN
# with contents:read and nothing more.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a
# GitHub-hosted runner (which has no route to the node's LAN address anyway)
# and never consume Actions minutes.
#
# Previous step: provision-2-seed-secrets.yml.
# Next: Phase 3 - platform services, entirely as commits under deploy/.
name: 'Provision 3: Bootstrap Flux'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it only needs SSH to the node)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
          - hyperv-host-3
      ip_address:
        description: 'The k3s server to bootstrap from (node 1 today - see the apiserver-VIP gap in docs/secrets-architecture.md)'
        required: true
        type: string
      path:
        description: 'Repository path Flux reconciles from. Must already exist on the branch - nothing here creates it'
        required: true
        default: deploy/cluster
        type: string
      branch:
        description: 'Branch Flux reconciles'
        required: true
        default: main
        type: string
      preflight_only:
        description: 'Check reachability, the repository, the token if any and the version pin, then stop without touching the cluster'
        required: false
        default: false
        type: boolean

# One install at a time: two concurrent runs would race the cluster's
# flux-system namespace.
concurrency:
  group: provision-3-bootstrap-flux
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install Flux on ${{ inputs.ip_address }}
    runs-on: [self-hosted, '${{ inputs.host }}']

    # The flux CLI install, the controller rollout and the first
    # reconciliation all happen inside one run. Failing at 30m means a
    # controller never went Ready.
    timeout-minutes: 30

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before anything else PowerShell-shaped. `shell: powershell` is
      # implemented as a dot-source of a temp .ps1, which an execution policy of
      # Restricted - the Windows *client* default - refuses outright, so the
      # `Set-ExecutionPolicy -Scope Process` inside every step below sits in the
      # file that will not load. See the action, and scripts/runner/README.md.
      - name: Ensure PowerShell can run repository scripts
        uses: ./.github/actions/ensure-powershell

      # The bootstrap runs on the node, over SSH - so the runner needs an SSH
      # client and nothing else. Installed here rather than assumed; see
      # scripts/runner/README.md.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Install Flux
        shell: powershell
        env:
          IP_ADDRESS: ${{ inputs.ip_address }}
          FLUX_PATH: ${{ inputs.path }}
          FLUX_BRANCH: ${{ inputs.branch }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}

          # Taken from the run's own context rather than typed in, so the
          # cluster can only ever be pointed at the repository it was
          # dispatched from.
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

          # No FLUX_VERSION here on purpose: like the k3s pin it is
          # structural, so it lives in scripts/versions.json and is read by
          # the script from the checkout above - which means the Flux version
          # and the manifests it reconciles move in the same commit. Since
          # nothing commits a copy of the controllers, that file is the only
          # place the version exists: bump it and re-dispatch to upgrade.
          #
          # Optional. A public repository is cloned anonymously and needs no
          # credential at all; leave the secret unset. For a private one, a PAT
          # with contents:read - stored in-cluster as the flux-system Secret,
          # read by the script from the environment, never as an argument.
          FLUX_GITHUB_TOKEN: ${{ secrets.FLUX_GITHUB_TOKEN }}

          # Same keypair provision-0/1/2 used.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          # FLUX_GITHUB_TOKEN is deliberately not in this list - see the env
          # comment above. The script's preflight decides whether its absence
          # is a problem, by checking whether the repository is public.
          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. Add it as a repository secret under Settings > Secrets and variables > Actions. See scripts/flux/README.md."
          }

          $params = @{
            IPAddress     = $env:IP_ADDRESS
            GitHubOwner   = $env:GITHUB_OWNER
            Repository    = $env:GITHUB_REPOSITORY_NAME
            Branch        = $env:FLUX_BRANCH
            Path          = $env:FLUX_PATH
            SshPrivateKey = $env:NODE_SSH_PRIVATE_KEY
          }

          if ([bool]::Parse($env:PREFLIGHT_ONLY)) { $params.PreflightOnly = $true }

          & .\scripts\flux\Bootstrap-Flux.ps1 @params
