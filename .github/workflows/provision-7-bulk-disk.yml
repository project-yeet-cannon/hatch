# Step 7 of the provisioning pipeline, and the photos plan
# (docs/plans/immich.md) Phase 1, steps 1.2 and 1.3: prepare the dedicated
# bulk disk the photo library lives on, and register it with Longhorn under
# the `bulk` tag.
#
# **Once, on one node**, unlike Provision 5's once-per-node. The library is a
# single volume with a single replica, so the disk exists on exactly one
# machine - whichever one the operator physically attached it to. Which
# machine that is stays out of this repo entirely: it is an input here, and
# everything downstream derives placement from the disk tag and
# longhorn-bulk's strict-local data locality rather than from a node name.
# See docs/ethos.md.
#
# **After Longhorn, not before**, which is the other way round from Provision
# 5 and the reason this is a separate step rather than a flag on it. The last
# stage patches a node.longhorn.io CR, so it needs a cluster that is already
# up. Provision 5 has to run before Longhorn exists; this one cannot.
#
# Same thin-wrapper rule as Provision 0-6: this file checks out the repo and
# hands every decision to scripts/k3s/Add-BulkDisk.ps1, which also runs by
# hand from any Windows box with the OpenSSH client. That manual path is a
# fallback only. Logic added here instead of the script would exist on only
# one of the two paths and let them drift.
#
# Nothing here is a repository variable. Which disk to use is not an operator
# value - it is discovered from the node, because the alternative is naming a
# device, and /dev/sdb is not stable across reboots under Hyper-V.
# `bulk_disk_gb` is the one exception and it is a *description* of what was
# attached, used to recognise the disk, not to pick it.
#
# Billing: `runs-on` pins `self-hosted`, so runs never land on a GitHub-hosted
# runner (which has no route to the node's LAN address anyway) and never
# consume Actions minutes.
#
# Before this step, by hand on the Hyper-V host that holds the node - the one
# part of Phase 1 that is not automated, because it is the one part that is a
# statement about physical hardware:
#
#   New-VHD -Path D:\Aerie\aerie-node-N-bulk.vhdx -SizeBytes 1288490188800 -Dynamic
#   Add-VMHardDiskDrive -VMName aerie-node-N -Path D:\Aerie\aerie-node-N-bulk.vhdx -ControllerType SCSI
#
# Dynamic, not fixed like the 200GB data disks: it is sized against whatever
# free space the chosen drive had, and a dynamic VHDX bills only what it
# holds. Size it *under* the free space, not at it - a dynamic disk that grows
# to its maximum must not be able to fill the volume it shares with that
# node's Longhorn data disk.
#
# Previous step: provision-6-backup-aws.yml.
name: 'Provision 7: Bulk disk'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Runner to dispatch from (any host works - it only needs SSH to the node)'
        required: true
        type: choice
        options:
          - hyperv-host-0
          - hyperv-host-1
          - hyperv-host-2
          - hyperv-host-3
      vm_name:
        description: 'The node VM the bulk disk is attached to (e.g. aerie-node-N). Checked against the node''s own hostname before any disk is touched'
        required: true
        type: string
      ip_address:
        description: 'That node''s LAN address'
        required: true
        type: string
      bulk_disk_gb:
        description: 'Size the bulk disk was created at, in GiB. Used to recognise the disk, not to pick it by name. In extend mode this describes the NEW disk'
        required: false
        default: '1200'
        type: string
      extend_volume_group:
        description: 'Grow the existing bulk volume onto a second attached disk: vgextend, lvextend, resize2fs, all online. Requires vg_bulk to exist already'
        required: false
        default: false
        type: boolean
      force:
        description: 'DESTRUCTIVE: allow a candidate disk that already holds a partition table or a filesystem to be wiped. Never widens the two hard rules - a disk with anything mounted from it, or the one holding the root filesystem, is refused either way'
        required: false
        default: false
        type: boolean
      preflight_only:
        description: 'Inspect the node, print which disk would be used and what would change, then stop without touching anything'
        required: false
        default: false
        type: boolean

# Keyed on the node. Two runs against the same node would race the same disk,
# the same fstab and the same node.longhorn.io CR.
concurrency:
  group: provision-7-bulk-disk-${{ inputs.vm_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Bulk disk on ${{ inputs.vm_name }}
    runs-on: [self-hosted, '${{ inputs.host }}']

    # mkfs.ext4 does not write the whole device, so even a terabyte is
    # seconds. The slow parts are an apt-get for lvm2 and the 2-minute wait
    # for Longhorn's node controller to report the disk Ready. Failing at 25m
    # means something hung.
    timeout-minutes: 25

    steps:
      - name: Check out provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Everything happens on the node over SSH, so the runner needs an SSH
      # client and nothing else. Installed rather than assumed; see
      # scripts/runner/README.md.
      - name: Ensure runner dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & .\scripts\runner\Install-RunnerDependencies.ps1 -Dependency OpenSshClient

      - name: Prepare the bulk disk
        shell: powershell
        env:
          # Same quoting hazard as provision-0-new-node.yml: every input
          # arrives as an env var rather than being interpolated into the
          # script body, since `${{ }}` substitution happens before PowerShell
          # parses anything.
          VM_NAME: ${{ inputs.vm_name }}
          IP_ADDRESS: ${{ inputs.ip_address }}
          BULK_DISK_GB: ${{ inputs.bulk_disk_gb }}
          EXTEND_VOLUME_GROUP: ${{ inputs.extend_volume_group }}
          FORCE: ${{ inputs.force }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}

          # Same keypair provision-0/1/2/3/4/5 used.
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          if (-not $env:NODE_SSH_PRIVATE_KEY) {
            throw "NODE_SSH_PRIVATE_KEY is not set. It's the same repository secret provision-0-new-node.yml already requires."
          }

          $params = @{
            VMName         = $env:VM_NAME
            IPAddress      = $env:IP_ADDRESS
            BulkDiskSizeGB = [int]$env:BULK_DISK_GB
            SshPrivateKey  = $env:NODE_SSH_PRIVATE_KEY
          }

          if ([bool]::Parse($env:EXTEND_VOLUME_GROUP)) { $params.ExtendVolumeGroup = $true }
          if ([bool]::Parse($env:FORCE)) { $params.Force = $true }
          if ([bool]::Parse($env:PREFLIGHT_ONLY)) { $params.PreflightOnly = $true }

          & .\scripts\k3s\Add-BulkDisk.ps1 @params
