# Attaches each container's Compose service name to its own log lines (via
# the json-file driver's `attrs`), so fluent-bit can derive a `service`
# field per line for OpenSearch. See containers/fluent-bit/service_tag.lua.
x-logging: &container-log-tag
  options:
    labels: "com.docker.compose.service"

services:
  # Host-level metrics come from windows_exporter running natively on the
  # Windows host (installed by .github/workflows/cd.yml), not a container —
  # under Docker Desktop's WSL2 backend, a container's /proc, /sys, and root
  # filesystem are the VM's, not the real Windows host's, so node_exporter
  # here could never report genuine host CPU/RAM/disk. See TODO.md Phase 3's
  # "Blocked on 2026-07-28" note.

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.0
    # This image's own entrypoint.sh is `#!/bin/bash`, but the image is built
    # on Alpine and ships no /bin/bash (only busybox ash as /bin/sh) — the
    # container crash-loops on the stock entrypoint. entrypoint.sh itself has
    # no bashisms, so running it via sh explicitly works around the broken
    # shebang without needing a custom image.
    entrypoint: ["/bin/sh", "/usr/bin/entrypoint.sh"]
    restart: always
    networks:
      - metrics
    # Only per-container stats are needed here — host-level CPU/RAM/disk/
    # network comes from windows_exporter instead — so this skips the
    # classic /rootfs and full /sys bind mounts and only grants the three
    # paths cAdvisor needs for container-level cgroup/storage stats. Plain
    # bridge networking (not network_mode: host): under Docker Desktop,
    # host-mode containers sit in the WSL2 VM's own network namespace, which
    # Prometheus can't reach via host.docker.internal — service-name
    # resolution on the `metrics` network works regardless of host OS.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
    logging: *container-log-tag

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: always
    networks:
      - metrics
    # windows_exporter runs natively on the Windows host, not in a
    # container — this maps host.docker.internal to the host's real IP as
    # seen from the bridge network (see prometheus.yml's scrape targets).
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # --web.enable-lifecycle exposes POST /-/reload, which cd.yml calls
    # after every deploy. Compose recreates a service only when the service
    # definition itself changes, not when a bind-mounted file's contents
    # change — a prometheus.yml-only edit would otherwise leave this
    # container running its old, already-loaded config indefinitely.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090" # loopback-only, for setup/debug curl access
    logging: *container-log-tag

  grafana:
    image: grafana/grafana:13.1.1
    restart: always
    networks:
      - metrics
      - edge
    volumes:
      - grafana_data:/var/lib/grafana
      - ./containers/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    labels:
      caddy: metrics.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
    logging: *container-log-tag

networks:
  metrics:
    driver: bridge
  edge:
    external: true

volumes:
  prometheus_data:
  grafana_data:
