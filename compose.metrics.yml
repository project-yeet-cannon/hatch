# Attaches each container's Compose service name to its own log lines (via
# the json-file driver's `attrs`), so fluent-bit can derive a `service`
# field per line for OpenSearch. See containers/fluent-bit/service_tag.lua.
x-logging: &container-log-tag
  options:
    labels: "com.docker.compose.service"

services:
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: always
    # Host-level metrics require reading the host's own /proc, /sys, and
    # root filesystem — mounted read-only and pointed at via --path.* flags
    # rather than running with --pid host/--net host.
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    logging: *container-log-tag

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.0
    # This image's own entrypoint.sh is `#!/bin/bash`, but the image is built
    # on Alpine and ships no /bin/bash (only busybox ash as /bin/sh) — the
    # container crash-loops on the stock entrypoint. entrypoint.sh itself has
    # no bashisms, so running it via sh explicitly works around the broken
    # shebang without needing a custom image.
    entrypoint: ["/bin/sh", "/usr/bin/entrypoint.sh"]
    restart: always
    network_mode: host
    # Only per-container stats are needed here — node-exporter above already
    # covers host-level CPU/RAM/disk/network — so this skips the classic
    # /rootfs and full /sys bind mounts and only grants the three paths
    # cAdvisor needs for container-level cgroup/storage stats.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
    logging: *container-log-tag

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: always
    networks:
      - metrics
    # node-exporter/cadvisor above use network_mode: host, so they're not
    # reachable by container/network alias — this maps host.docker.internal
    # to the host's real IP as seen from the bridge network (see
    # prometheus.yml's scrape targets).
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090" # loopback-only, for setup/debug curl access
    logging: *container-log-tag

  grafana:
    image: grafana/grafana:13.1.1
    restart: always
    networks:
      - metrics
      - edge
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    labels:
      caddy: metrics.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
    logging: *container-log-tag

networks:
  metrics:
    driver: bridge
  edge:
    external: true

volumes:
  prometheus_data:
  grafana_data:
