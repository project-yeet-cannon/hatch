# Attaches each container's Compose service name to its own log lines (via
# the json-file driver's `attrs`), so fluent-bit can derive a `service`
# field per line for OpenSearch. See containers/fluent-bit/service_tag.lua.
x-logging: &container-log-tag
  options:
    labels: "com.docker.compose.service"

services:
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: always
    # Host-level metrics require reading the host's own /proc, /sys, and
    # root filesystem — mounted read-only and pointed at via --path.* flags
    # rather than running with --pid host/--net host.
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    logging: *container-log-tag

  cadvisor:
    # Pinned to the linux/amd64 manifest digest rather than the `0.56.0` tag.
    # The tag's manifest list also carries BuildKit provenance/SBOM entries
    # tagged platform unknown/unknown (no filesystem layers); some Docker/
    # containerd versions mis-resolve those instead of the real per-arch
    # manifest, producing a container with no /usr/bin/entrypoint.sh at all.
    # Pinning by digest skips that resolution step.
    image: ghcr.io/google/cadvisor@sha256:4fc8189f80011fbbbdfdc3933741a84a34d4ac382d49deb2fbc59d815a69cfef
    restart: always
    network_mode: host
    # Only per-container stats are needed here — node-exporter above already
    # covers host-level CPU/RAM/disk/network — so this skips the classic
    # /rootfs and full /sys bind mounts and only grants the three paths
    # cAdvisor needs for container-level cgroup/storage stats.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
    logging: *container-log-tag
