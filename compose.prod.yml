services:
  db:
    build:
      context: ./containers/aerie-db
      dockerfile: Dockerfile.db
    networks:
      - local
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Aerie.Api/Dockerfile.api
    networks:
      - local
    ports:
      - "8080:8080"
    environment:
      - DOTNET_ENVIRONMENT=Docker
    depends_on:
      db:
        condition: service_healthy

networks:
  local:
    driver: bridge

volumes:
  pgdata:
