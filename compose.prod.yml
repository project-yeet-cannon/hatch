# Attaches each container's Compose service name to its own log lines (via
# the json-file driver's `attrs`), so fluent-bit can derive a `service`
# field per line for OpenSearch. See containers/fluent-bit/service_tag.lua.
x-logging: &container-log-tag
  options:
    labels: "com.docker.compose.service"

services:
  db:
    image: ghcr.io/eouw0o83hf/aerie-db:latest
    networks:
      - local
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *container-log-tag

  api:
    image: ghcr.io/eouw0o83hf/aerie-api:${IMAGE_TAG:-latest}
    networks:
      - local
      - edge
    environment:
      - DOTNET_ENVIRONMENT=Docker
      - DOMAIN=${DOMAIN}
      # In-container mount point of the music share, not a UNC path: the API
      # runs in a Linux container even though the host is Windows. See
      # docs/media-library.md and MediaLibraryOptions.
      - MediaLibrary__RootPath=/media-library
    volumes:
      - media:/media-library:ro
    depends_on:
      db:
        condition: service_healthy
    labels:
      caddy: home.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy_1: kiosk.${DOMAIN}
      caddy_1.@root.path: /
      caddy_1.rewrite: "@root /apps/dashboard/"
      caddy_1.reverse_proxy: "{{upstreams 8080}}"
    logging: *container-log-tag

  files:
    image: ghcr.io/eouw0o83hf/aerie-kiosk-files:latest
    networks:
      - edge
    labels:
      caddy: files.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
    logging: *container-log-tag

  caddy:
    image: ghcr.io/eouw0o83hf/aerie-caddy:latest
    restart: always
    networks:
      - edge
    ports:
      - "80:80"
      - "443:443"
    # Local network DNS doesn't resolve public zones (e.g. Route53 NS/SOA),
    # which breaks certmagic's DNS-01 zone lookup for ACME challenges.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    labels:
      caddy.email: ${ACME_EMAIL}
      caddy.acme_dns: route53
    logging: *container-log-tag

networks:
  local:
    driver: bridge
  edge:
    external: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  # The music library SMB share, mounted read-only for the api container to
  # serve over HTTP (Sonos speakers fetch tracks themselves - see
  # docs/media-library.md). MEDIA_LIBRARY_SHARE is the //server/share the CIFS
  # driver mounts, kept out of source as a repo variable; `:?` because an empty
  # device fails at mount time with a far less obvious error than this message.
  media:
    driver: local
    driver_opts:
      type: cifs
      # Guest access, matching the share's public read permissions. A share
      # that needs credentials wants username=/password= here, sourced from
      # repo *secrets* rather than variables.
      o: "guest,ro,vers=3.0"
      device: "${MEDIA_LIBRARY_SHARE:?set the MEDIA_LIBRARY_SHARE repo variable to the music share, e.g. //NAS/Music}"
