services:
  db:
    image: ghcr.io/eouw0o83hf/aerie-db:${IMAGE_TAG:-latest}
    networks:
      - local
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/eouw0o83hf/aerie-api:${IMAGE_TAG:-latest}
    networks:
      - local
    ports:
      - "8080:8080"
    environment:
      - DOTNET_ENVIRONMENT=Docker
    depends_on:
      db:
        condition: service_healthy

networks:
  local:
    driver: bridge

volumes:
  pgdata:
